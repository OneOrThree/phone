name: Backoffice CI
on:
  pull_request:
    paths: ['backoffice/**', '.github/workflows/backoffice-*.yml', '.github/scripts/backoffice-*.py', '.github/scripts/test_backoffice*.py']
  push:
    branches: [main]
    paths: ['backoffice/**', '.github/workflows/backoffice-*.yml', '.github/scripts/backoffice-*.py', '.github/scripts/test_backoffice*.py']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backoffice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backoffice/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python3 -m unittest discover -s .github/scripts -p 'test_backoffice*.py' -v
        working-directory: .
