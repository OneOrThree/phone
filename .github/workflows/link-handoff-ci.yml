name: Link 독립 서비스 인도 검증
on:
  pull_request:
    paths: ['link/**', '.github/workflows/link-handoff-ci.yml']
  push:
    branches: [main]
    paths: ['link/**', '.github/workflows/link-handoff-ci.yml']
permissions:
  contents: read
concurrency:
  group: link-handoff-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: link
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: link/package-lock.json
      - run: npm ci
      - run: npm run verify
