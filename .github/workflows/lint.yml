name: Lint

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
  pull_request:
    branches: [main] # main 대상 PR만 — 릴리즈 PR(main→release)은 이미 검사된 코드라 제외 (ci.yml과 동일 패턴)
    paths:
      - 'app/**'

jobs:
  lint:
    runs-on: [self-hosted, ci, spot]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: Run ESLint
        run: npm run lint
        working-directory: app

      - name: Check Prettier formatting
        run: npm run format:check
        working-directory: app

      - name: Typecheck
        run: npm run typecheck
        working-directory: app

      # 유닛 테스트 (GROMO-945) — jest-expo, stats/format 등 순수 함수 테스트
      - name: Run tests
        run: npm test
        working-directory: app

      # 팔레트 코드젠 동기화 검증 (GROMO-641) — theme.ts 변경 후 재생성 누락 시 실패
      - name: Check palette codegen sync
        run: npm run gen:palette:check
        working-directory: app
