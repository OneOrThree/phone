name: Lint

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
  pull_request:
    paths:
      - 'app/**'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: Run ESLint
        run: npm run lint
        working-directory: app

      - name: Check Prettier formatting
        run: npm run format:check
        working-directory: app

      - name: Typecheck
        run: npm run typecheck
        working-directory: app

      # 팔레트 코드젠 동기화 검증 (GROMO-641) — theme.ts 변경 후 재생성 누락 시 실패
      - name: Check palette codegen sync
        run: npm run gen:palette:check
        working-directory: app
