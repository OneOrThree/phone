name: Satellite CI (dev)-v2
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/business-api/**'
      - 'server/notification/**'
      - 'server/data-api/**'
      - 'server/realtime/src/main/resources/**'
      - 'server/scripts/**'
      - '.github/scripts/**'
      - '.github/actions/ci-jar/**'
      - '.github/actions/gar-login/**'
      - '.github/workflows/be-gradle.yml'
      - '.github/workflows/satellite-check.yml'
      - '.github/workflows/satellite-ci.dev-v2.yml'
      - '.dockerignore'
  push:
    branches: [main]
    paths:
      - 'server/business-api/**'
      - 'server/notification/**'
      - 'server/data-api/**'
      - 'server/realtime/src/main/resources/**'
      - 'server/scripts/**'
      - '.github/scripts/**'
      - '.github/actions/ci-jar/**'
      - '.github/actions/gar-login/**'
      - '.github/workflows/be-gradle.yml'
      - '.github/workflows/satellite-check.yml'
      - '.github/workflows/satellite-ci.dev-v2.yml'
      - '.dockerignore'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  checks:
    uses: ./.github/workflows/satellite-check.yml
    permissions:
      contents: read
      actions: read
    with:
      build-services: false
  build:
    needs: [checks]
    strategy:
      fail-fast: false
      matrix:
        service: [business-api, notification]
    uses: ./.github/workflows/be-gradle.yml
    permissions:
      contents: read
      actions: read
    with:
      service: ${{ matrix.service }}
      enabled: ${{ github.event_name != 'pull_request' || fromJSON(needs.checks.outputs.services)[matrix.service] }}
      business-pdf: ${{ matrix.service == 'business-api' }}
      publish-jar: true
      artifact-name: ${{ matrix.service }}-v2-test-results
      artifact-path: build/reports/
  images:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [checks, build]
    runs-on: ${{ fromJSON('["self-hosted", "ci", "spot"]') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [business-api, notification]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-jar
        with:
          service: ${{ matrix.service }}
          operation: verify
      - uses: docker/setup-buildx-action@v3
      - uses: ./.github/actions/gar-login
        with:
          registry: asia-northeast3-docker.pkg.dev
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: server/${{ matrix.service }}
          build-args: JAR_SOURCE=prebuilt
          platforms: linux/amd64
          push: true
          tags: asia-northeast3-docker.pkg.dev/oneorthree2/${{ matrix.service }}/${{ matrix.service }}:dev-v2-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: 이미지 정보 기록
        env:
          SERVICE: ${{ matrix.service }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json,os,re
          s=os.environ['SERVICE']; d=os.environ['DIGEST']
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', d): raise SystemExit('이미지 digest 오류')
          image=f'asia-northeast3-docker.pkg.dev/oneorthree2/{s}/{s}@{d}'
          open(f'{s}-dev-v2-image.json','w').write(json.dumps({'service':s,'image':image,'revision':os.environ['GITHUB_SHA']}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-dev-v2-image
          path: ${{ matrix.service }}-dev-v2-image.json
          if-no-files-found: error
  auto-cd:
    # Auto CD가 실행한 CI는 토큰 실행이라 workflow_run이 안 깨움. 직접 재평가.
    needs: images
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cd-auto.dev-v2.yml --repo OneOrThree/phone --ref main
