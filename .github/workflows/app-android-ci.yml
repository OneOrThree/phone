name: Android CI

# Android release AAB 빌드 (GROMO-2223). CD 짝: app-android-cd.yml.
#
# 흐름 (dev-ci → dev-cd 와 같은 모양):
# - PR: AAB 끝까지 빌드(JS 번들·Hermes·리소스·서명). 키 안 씀. 일회용 키 서명, 결과 버림.
# - main push: 업로드 키로 서명 → 아티팩트 → CD 가 Play 내부 테스트에 올림. CD 는 재빌드 안 함.
# 네이티브 컴파일·XML 검사는 app-android-build.yml 담당.
#
# 빌드 대상:
# - 앱 com.oneorthree.gromo, 서버 dev(https://oneorthree.dev.mooo.com). 운영 아님.
# - GROMO_ANDROID_AUDIENCE=dev 로 build.gradle 의 dev 가드 탐. 수동 운영 빌드는 이 값 없음 → 기존 가드 그대로.
# - OTA·PostHog 켠 채 빌드 (팀 결정 2026-10-07).
#   ⚠️ OTA 채널은 production. 운영 OTA 내보내면 이 빌드도 받음.

on:
  pull_request:
    branches: [main]
    paths: &android_release_paths
      - 'app/app-dev/**'
      - '!app/app-dev/**/*.md'
      - '!app/app-dev/ios/**'
      # iOS 폴더 제외. 단 약관 버전·Datadog 공개 설정 정본은 여기 → 다시 포함
      - 'app/app-dev/ios/release-config.sh'
      - '.github/workflows/app-android-ci.yml'
      - '.github/workflows/app-android-cd.yml'
      # Android CI 전용 스크립트. .github/scripts/ 에 두면 satellite-ci 까지 돎
      - '.github/ci/**'
  push:
    branches: [main]
    paths: *android_release_paths
  # 수동 실행: main 만 키 쓰고 Play 업로드. 다른 브랜치는 일회용 키로 빌드만.
  workflow_dispatch:

# PR: 같은 PR 앞 실행 버림.
# main: 한 줄로 섬. versionCode = Play 최대값 + 1 이라 겹치면 같은 값 두 번 씀. 대기는 최신 하나만 남음.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('android-ci-pr-{0}', github.ref) || 'android-ci-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PACKAGE_NAME: com.oneorthree.gromo
  AWS_REGION: ap-northeast-2
  AWS_ROLE_ARN: arn:aws:iam::808715036056:role/gromo-prod-android-github-actions
  RELEASE_SECRET_ID: gromo/prod/android
  # Play Console 앱 서명 → 업로드 키 인증서 SHA-1 (공개값). 키 바꾸면 같이 바꿈
  ANDROID_UPLOAD_CERT_SHA1: 85:DF:F5:E4:96:1A:A2:32:88:E0:CF:B7:48:47:F0:55:9A:77:02:37

jobs:
  build:
    name: release AAB 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # id-token: AWS OIDC 용. PR 잡도 권한 받지만 AWS 인증 스텝은 IS_RELEASE 만.
    # 포크 PR 은 OIDC 토큰 못 받음. 역할 신뢰도 main·play-internal 만.
    permissions:
      contents: read
      id-token: write
    outputs:
      version-code: ${{ steps.version.outputs.code }}
      artifact-name: ${{ steps.artifact.outputs.name }}
    env:
      # 키·Play 업로드는 main 의 push·수동 실행만
      IS_RELEASE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
      # 빌드에 박히는 값. 고정 (레포 변수로 못 바꾸게)
      GROMO_ANDROID_AUDIENCE: dev
      EXPO_PUBLIC_API_URL: https://oneorthree.dev.mooo.com
      EXPO_PUBLIC_ENV: dev
    steps:
      - uses: actions/checkout@v4

      - name: AWS 인증 (OIDC)
        if: env.IS_RELEASE == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Secrets Manager 에서 서명 키·Play 키 받기
        if: env.IS_RELEASE == 'true'
        # 값 출력 금지. 러너 임시 폴더에 파일로만. 비밀번호 마스킹.
        run: |
          set -euo pipefail
          umask 077
          dir="$RUNNER_TEMP/android-release"; mkdir -p "$dir"
          aws secretsmanager get-secret-value --secret-id "$RELEASE_SECRET_ID" \
            --query SecretString --output text > "$dir/secret.json"
          fail=0
          for k in ANDROID_UPLOAD_KEYSTORE_B64 ANDROID_UPLOAD_STORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON; do
            v="$(jq -r --arg k "$k" '.[$k] // empty' "$dir/secret.json")"
            if [ -z "$v" ]; then echo "::error::$RELEASE_SECRET_ID 에 $k 가 없다"; fail=1; fi
          done
          [ "$fail" = 0 ]
          for k in ANDROID_UPLOAD_STORE_PASSWORD ANDROID_UPLOAD_KEY_PASSWORD; do echo "::add-mask::$(jq -r ".$k" "$dir/secret.json")"; done
          jq -r .ANDROID_UPLOAD_KEYSTORE_B64 "$dir/secret.json" | base64 --decode > "$dir/release.keystore"
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$(jq -r .ANDROID_UPLOAD_STORE_PASSWORD "$dir/secret.json")"
            echo "keyAlias=$(jq -r .ANDROID_UPLOAD_KEY_ALIAS "$dir/secret.json")"
            echo "keyPassword=$(jq -r .ANDROID_UPLOAD_KEY_PASSWORD "$dir/secret.json")"
          } > "$dir/keystore.properties"
          jq -r .PLAY_SERVICE_ACCOUNT_JSON "$dir/secret.json" > "$dir/play-sa.json"
          jq -e '.type == "service_account"' "$dir/play-sa.json" > /dev/null \
            || { echo "::error::PLAY_SERVICE_ACCOUNT_JSON 이 서비스 계정 키 JSON 이 아니다"; exit 1; }
          rm -f "$dir/secret.json"

      - name: 공개 릴리스 설정 읽기
        # 약관 버전·Datadog 공개 설정 정본은 iOS 와 같은 파일. 두 벌 두면 갈라짐.
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source app/app-dev/ios/release-config.sh
          for v in EXPO_PUBLIC_TERMS_VERSION EXPO_PUBLIC_DATADOG_APPLICATION_ID EXPO_PUBLIC_DATADOG_CLIENT_TOKEN; do
            [ -n "${!v:-}" ] || { echo "::error::release-config.sh 에 $v 가 없다"; exit 1; }
            echo "$v=${!v}" >> "$GITHUB_ENV"
          done

      - uses: actions/setup-python@v5
        if: env.IS_RELEASE == 'true'
        with:
          python-version: '3.12'

      - name: versionCode 정하기
        id: version
        env:
          PLAY_SERVICE_ACCOUNT_FILE: ${{ runner.temp }}/android-release/play-sa.json
          PLAY_PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
        run: |
          set -euo pipefail
          if [ "$IS_RELEASE" != true ]; then
            # PR 은 안 올림. 값 무관
            echo "code=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          pip install --quiet 'google-auth==2.*' 'requests==2.*'
          # Play 최대값 + 1. build.gradle versionCode(수동 운영 빌드 값)가 하한
          MIN_VERSION_CODE="$(sed -n 's/^ *versionCode \([0-9][0-9]*\).*/\1/p' app/app-dev/android/app/build.gradle)"
          [ -n "$MIN_VERSION_CODE" ] || { echo "::error::build.gradle 에서 versionCode 를 읽지 못했다"; exit 1; }
          export MIN_VERSION_CODE
          code="$(python3 .github/ci/play-next-version-code.py)"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "versionCode=$code"

      # 빌드 도구 (app-android-build.yml 과 같음)
      - name: NDK 캐시
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/27.1.12297006
          key: android-ndk-27.1.12297006

      - name: NDK 설치
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          NDK="$ANDROID_HOME/ndk/27.1.12297006"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" > /dev/null || true
          if [ ! -f "$NDK/source.properties" ]; then
            rm -rf "$NDK"
            echo "::error::NDK 27.1.12297006 설치가 완결되지 않았습니다(source.properties 없음)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/app-dev/package-lock.json

      - name: npm ci
        working-directory: app/app-dev
        run: npm ci

      - name: 서명 키 배치
        # build.gradle 이 읽는 android/credentials/prod 에 둠. 러너는 매번 새 VM.
        # PR 은 일회용 키 서명. Play 가 안 받으니 올릴 수도 없음.
        working-directory: app/app-dev/android
        run: |
          set -euo pipefail
          umask 077
          mkdir -p credentials/prod
          if [ "$IS_RELEASE" = true ]; then
            cp "$RUNNER_TEMP/android-release/release.keystore" "$RUNNER_TEMP/android-release/keystore.properties" credentials/prod/
          else
            pass="ci-$(openssl rand -hex 12)"
            keytool -genkeypair -keystore credentials/prod/release.keystore -storepass "$pass" \
              -keypass "$pass" -alias ci-throwaway -keyalg RSA -keysize 2048 -validity 1 \
              -dname "CN=CI throwaway" > /dev/null 2>&1
            printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=ci-throwaway\nkeyPassword=%s\n' "$pass" "$pass" \
              > credentials/prod/keystore.properties
          fi

      - name: AAB 빌드
        working-directory: app/app-dev/android
        env:
          GROMO_VERSION_CODE: ${{ steps.version.outputs.code }}
          # JS 번들 production. 잡 전체에 걸면 npm ci 가 devDependencies(patch-package) 빼서 깨짐
          NODE_ENV: production
        run: ./gradlew -I "$GITHUB_WORKSPACE/.github/ci/android-version-code.gradle" :app:bundleRelease

      - name: 서명 키 지우기
        if: always()
        run: rm -rf app/app-dev/android/credentials/prod "$RUNNER_TEMP/android-release"

      - name: AAB 확인
        run: |
          set -euo pipefail
          aab=app/app-dev/android/app/build/outputs/bundle/release/app-release.aab
          [ -f "$aab" ] || { echo "::error::AAB 가 없다: $aab"; exit 1; }
          # jarsigner 는 서명 없어도 종료 코드 0. 출력 "jar verified." 로 판정
          verify="$(jarsigner -verify "$aab" 2>&1 || true)"
          grep -q '^jar verified\.' <<<"$verify" || { echo "::error::AAB 서명 검증 실패: $(head -1 <<<"$verify")"; exit 1; }
          if [ "$IS_RELEASE" = true ]; then
            # Play 는 등록 업로드 키 서명만 받음. 업로드 전 지문 대조
            sha1="$(keytool -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA1: //p' | head -1)"
            [ "$sha1" = "$ANDROID_UPLOAD_CERT_SHA1" ] \
              || { echo "::error::업로드 키 지문이 Play 등록 값과 다르다: $sha1"; exit 1; }
          fi
          ls -lh "$aab"

      - name: 아티팩트 이름
        id: artifact
        if: env.IS_RELEASE == 'true'
        run: echo "name=android-aab-${{ steps.version.outputs.code }}-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: AAB 아티팩트 업로드
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: app/app-dev/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: 결과 요약
        if: always()
        run: |
          {
            echo "## Android CI"
            echo "- 이벤트: ${{ github.event_name }} · 서버: ${EXPO_PUBLIC_API_URL}"
            echo "- versionCode: ${{ steps.version.outputs.code || '(정하기 전에 실패)' }}"
            echo "- 서명: $([ "$IS_RELEASE" = true ] && echo '업로드 키' || echo '일회용 키(올리지 않음)')"
            echo "- 결과: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Play 내부 테스트 배포
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # CD 가 OIDC·PR 표시 씀 → 호출하는 쪽이 권한 넘겨야 함
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/app-android-cd.yml
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      version-code: ${{ needs.build.outputs.version-code }}
      revision: ${{ github.sha }}
