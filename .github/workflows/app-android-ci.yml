name: Android CI

# Android release AAB 빌드 (GROMO-2223). CD 짝: app-android-cd.yml.
#
# 검사·AAB 생성은 CI, 서명·Play 게시는 독립 CD 실행이 담당한다.
# - PR: build 잡만. AAB 끝까지 빌드(JS 번들·Hermes·리소스·서명). 키 안 씀. 일회용 키 서명, 결과 버림.
# - main: settings → build → AAB+메타데이터. 앱 배포 입력이 바뀐 경우에만 CD가 자동 게시한다.
#
# 잡 분리 이유: 키(Play·업로드)를 다루는 잡엔 의존성 코드(npm·pip·Gradle)가 안 돎.
# GitHub-hosted 는 잡마다 새 VM → 악성 의존성이 남긴 프로세스·env 변조가 키 잡에 못 닿음.
# - settings: SDK 공개 설정만 전달하고 CI run_number로 versionCode를 고정한다.
# - build: AWS·Play·서명 키 없음. npm ci + Gradle, 일회용 키 서명. main만 PostHog 분석 업로드 키 사용.
# - 업로드 키·Play 키는 별도 Android CD에서만 사용한다.
# 네이티브 컴파일·XML 검사는 app-android-build.yml 담당.
#
# 빌드 대상:
# - 앱 com.oneorthree.gromo, 서버 dev(https://oneorthree.dev.mooo.com). 운영 아님.
# - GROMO_ANDROID_AUDIENCE=dev 로 build.gradle 의 dev 가드 탐. 수동 운영 빌드는 이 값 없음 → 기존 가드 그대로.
# - OTA 끈 채 빌드. build.gradle 이 GROMO_ANDROID_AUDIENCE=dev 를 보고 매니페스트에서 끔. OTA 채널이 production 이라
#   켜 두면 운영 OTA 받아 운영 API JS 로 바뀜 (2026-10-07 팀 결정을 GROMO-2368 에서 바꿈). PostHog 는 켠 채.

on:
  pull_request:
    branches: [main]
    paths: &android_release_paths
      - "app/app-dev/**"
      - "!app/app-dev/**/*.md"
      - "!app/app-dev/ios/**"
      # iOS 폴더 제외. 단 약관 버전·Datadog 공개 설정 정본은 여기 → 다시 포함
      - "app/app-dev/ios/release-config.sh"
      - ".github/workflows/app-android-ci.yml"
      - ".github/workflows/app-android-cd.yml"
      # Android CI 전용 스크립트. .github/scripts/ 에 두면 satellite-ci 까지 돎
      - ".github/ci/**"
      - ".github/scripts/wait-app-checks.py"
      - ".github/workflows/app-lint.yml"
      - ".github/workflows/app-android-build.yml"
  push:
    branches: [main]
    paths: *android_release_paths
  # 수동 실행은 검증용 빌드까지다. 실제 게시 시험은 성공한 main CI ID로 CD를 수동 실행한다.
  workflow_dispatch:

# PR: 같은 PR 앞 실행 버림.
# main: 실행 중 검사는 유지하고 대기는 최신 하나만 남긴다.
concurrency:
  # main push·main 수동 실행만 한 줄로 섬. CD는 별도 직렬화 그룹을 쓴다.
  # PR·다른 브랜치 수동 실행은 브랜치별 그룹. main 대기열을 밀어내지 않게.
  group: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && 'android-ci-main' || format('android-ci-{0}', github.ref) }}
  cancel-in-progress: ${{ !(github.event_name != 'pull_request' && github.ref == 'refs/heads/main') }}

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE_ARN: arn:aws:iam::808715036056:role/gromo-prod-android-github-actions
  RELEASE_SECRET_ID: gromo/prod/android

jobs:
  change-plan:
    name: 앱 빌드·자동 게시 범위 판정
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 실제 변경 입력 판정
        id: plan
        run: python3 .github/ci/app-change-plan.py --platform android

  quality-gate:
    name: 동일 SHA 앱 필수 검사 확인
    needs: change-plan
    if: github.event_name == 'push' && needs.change-plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m pip install 'PyYAML==6.0.2'
      - name: 앱 검사 완료 대기
        env:
          GH_TOKEN: ${{ github.token }}
          APP_PLATFORM: android
        run: python3 .github/scripts/wait-app-checks.py

  manual-quality:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/app-lint.yml

  manual-native:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/app-android-build.yml

  settings:
    name: 빌드 버전·SDK 공개 설정
    needs: [quality-gate, manual-quality, manual-native]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && needs.quality-gate.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && needs.manual-quality.result == 'success' && needs.manual-native.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      code: ${{ steps.version.outputs.code }}
      posthog-project-token: ${{ steps.posthog.outputs.posthog-project-token }}
      posthog-host: ${{ steps.posthog.outputs.posthog-host }}
      posthog-cli-host: ${{ steps.posthog.outputs.posthog-cli-host }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            .github/ci
            app/app-dev/android/app/build.gradle
          sparse-checkout-cone-mode: false

      - name: AWS 인증
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CI 실행별 versionCode 고정
        id: version
        env:
          ANDROID_VERSION_CODE_BASE: ${{ vars.ANDROID_VERSION_CODE_BASE }}
        run: |
          set -euo pipefail
          MIN_VERSION_CODE=$(sed -n 's/^ *versionCode \([0-9][0-9]*\).*/\1/p' app/app-dev/android/app/build.gradle)
          export MIN_VERSION_CODE
          code=$(python3 .github/ci/android-artifact.py version)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "versionCode=$code (기준값 + CI run_number)"

      - name: PostHog SDK 공개 설정 읽기
        id: posthog
        # 기존 main 전용 AWS 작업에서 공개값만 전달한다. 빌드 작업에는 AWS 권한을 주지 않는다.
        run: |
          set -euo pipefail
          aws secretsmanager get-secret-value --secret-id "$RELEASE_SECRET_ID" --query SecretString --output text \
            | python3 .github/ci/posthog-sdk-config.py >> "$GITHUB_OUTPUT"

      - name: AWS 자격 증명 비우기
        # configure-aws-credentials 가 이후 스텝 env 로 내보낸 값 지움. 뒤 액션이 시크릿 다시 못 읽게
        run: for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN; do echo "$v=" >> "$GITHUB_ENV"; done

  build:
    name: release AAB 빌드
    needs: [settings, manual-quality, manual-native, change-plan]
    # PR은 settings를 생략하고 빌드만 한다. main은 settings 성공이 필요하다.
    if: >-
      !cancelled() && needs.change-plan.outputs.build == 'true' && (github.event_name == 'pull_request' || needs.settings.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' &&
       needs.manual-quality.result == 'success' && needs.manual-native.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # AWS OIDC 권한 없음. Play·서명 키를 받지 않는다.
    permissions:
      contents: read
    env:
      IS_RELEASE: ${{ needs.settings.result == 'success' }}
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
      # 빌드에 박히는 값. 고정 (레포 변수로 못 바꾸게)
      GROMO_ANDROID_AUDIENCE: dev
      EXPO_PUBLIC_API_URL: https://oneorthree.dev.mooo.com
      EXPO_PUBLIC_ENV: dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: SDK 설정·CI/CD 산출물 계약 검사
        run: python3 -m unittest discover -s .github/ci -p 'test_*.py' -v

      - name: PostHog SDK 설정 적용
        if: env.IS_RELEASE == 'true'
        env:
          PROJECT_TOKEN: ${{ needs.settings.outputs.posthog-project-token }}
          SDK_HOST: ${{ needs.settings.outputs.posthog-host }}
          CLI_HOST: ${{ needs.settings.outputs.posthog-cli-host }}
        run: |
          set -euo pipefail
          [ -n "$PROJECT_TOKEN" ] && [ -n "$SDK_HOST" ] && [ -n "$CLI_HOST" ] \
            || { echo "::error::PostHog SDK 공개 설정을 전달받지 못했습니다"; exit 1; }
          {
            echo "EXPO_PUBLIC_POSTHOG_PROJECT_TOKEN=$PROJECT_TOKEN"
            echo "EXPO_PUBLIC_POSTHOG_HOST=$SDK_HOST"
            echo "POSTHOG_CLI_HOST=$CLI_HOST"
          } >> "$GITHUB_ENV"

      - name: 공개 릴리스 설정 읽기
        # 약관 버전·Datadog 공개 설정 정본은 iOS 와 같은 파일. 두 벌 두면 갈라짐.
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source app/app-dev/ios/release-config.sh
          for v in EXPO_PUBLIC_TERMS_VERSION EXPO_PUBLIC_DATADOG_APPLICATION_ID EXPO_PUBLIC_DATADOG_CLIENT_TOKEN; do
            [ -n "${!v:-}" ] || { echo "::error::release-config.sh 에 $v 가 없다"; exit 1; }
            echo "$v=${!v}" >> "$GITHUB_ENV"
          done

      # 빌드 도구 (app-android-build.yml 과 같음)
      - name: NDK 캐시
        id: ndk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /usr/local/lib/android/sdk/ndk/27.1.12297006
          key: android-ndk-27.1.12297006

      - name: NDK 설치
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          NDK="$ANDROID_HOME/ndk/27.1.12297006"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" > /dev/null || true
          if [ ! -f "$NDK/source.properties" ]; then
            rm -rf "$NDK"
            echo "::error::NDK 27.1.12297006 설치가 완결되지 않았습니다(source.properties 없음)."
            exit 1
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: app/app-dev/package-lock.json

      - name: npm ci
        working-directory: app/app-dev
        run: npm ci

      - name: PostHog CLI 경로 등록
        # npm ci가 설치한 고정 버전을 Gradle 네이티브 업로드 작업에서도 찾도록 한다.
        run: echo "$GITHUB_WORKSPACE/app/app-dev/node_modules/.bin" >> "$GITHUB_PATH"

      - name: PostHog CLI 실행 확인
        run: posthog-cli --version

      - name: 일회용 서명 키
        # build.gradle 가드가 android/credentials/prod 서명 파일을 요구. 업로드 키는 sign 잡에서만
        working-directory: app/app-dev/android
        run: |
          set -euo pipefail
          umask 077
          mkdir -p credentials/prod
          pass="ci-$(openssl rand -hex 12)"
          keytool -genkeypair -keystore credentials/prod/release.keystore -storepass "$pass" \
            -keypass "$pass" -alias ci-throwaway -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=CI throwaway" > /dev/null 2>&1
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=ci-throwaway\nkeyPassword=%s\n' "$pass" "$pass" \
            > credentials/prod/keystore.properties

      - name: AAB 빌드
        working-directory: app/app-dev/android
        env:
          # PR 은 안 올림. 값 무관
          GROMO_VERSION_CODE: ${{ needs.settings.outputs.code || '1' }}
          # JS 번들 production. 잡 전체에 걸면 npm ci 가 devDependencies(patch-package) 빼서 깨짐
          NODE_ENV: production
          # PR/다른 브랜치에는 업로드 키를 주지 않는다. main 빌드만 심볼을 올린다.
          POSTHOG_CLI_API_KEY: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.POSTHOG_CLI_API_KEY || '' }}
          POSTHOG_CLI_PROJECT_ID: "669473"
        run: ./gradlew -I "$GITHUB_WORKSPACE/.github/ci/android-version-code.gradle" :app:bundleRelease

      - name: AAB 확인 (일회용 서명)
        run: |
          set -euo pipefail
          aab=app/app-dev/android/app/build/outputs/bundle/release/app-release.aab
          [ -f "$aab" ] || { echo "::error::AAB 가 없다: $aab"; exit 1; }
          # jarsigner 는 서명 없어도 종료 코드 0. 출력 "jar verified." 로 판정
          verify="$(jarsigner -verify "$aab" 2>&1 || true)"
          grep -q '^jar verified\.' <<<"$verify" || { echo "::error::AAB 서명 검증 실패: $(head -1 <<<"$verify")"; exit 1; }
          ls -lh "$aab"

      - name: AAB 원본 CI·SHA·checksum 메타데이터 기록
        if: env.IS_RELEASE == 'true'
        env:
          SOURCE_REVISION: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_ATTEMPT: ${{ github.run_attempt }}
          VERSION_CODE: ${{ needs.settings.outputs.code }}
          PUBLISH_ALLOWED: ${{ needs.change-plan.outputs.publish }}
        run: python3 .github/ci/android-artifact.py pack --aab app/app-dev/android/app/build/outputs/bundle/release/app-release.aab
      - name: 독립 CD용 AAB·메타데이터 게시
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: android-ci-artifact/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: 결과 요약
        if: always()
        run: |
          {
            echo "## Android CI — build"
            echo "- 이벤트: ${{ github.event_name }} · 서버: ${EXPO_PUBLIC_API_URL}"
            echo "- versionCode: ${{ needs.settings.outputs.code || '1 (PR, 안 올림)' }}"
            echo "- 결과: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
