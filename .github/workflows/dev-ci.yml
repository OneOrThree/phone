name: CI

on:
  pull_request:
    # release 대상 PR(통합→release)만 뺀다 — 그쪽은 prod-ci 가 test 를 직접 호출한다.
    #
    # 예전엔 `branches: [main]` 이었는데, 그러면 **base 가 다른 브랜치인 스택 PR 에서 백엔드
    # 테스트가 한 번도 돌지 않는다**. 검사 없이 쌓이다가 base 를 통합 브랜치로 바꾸는 순간
    # 그동안의 실패가 한꺼번에 드러난다 — PR #747 이 정확히 그렇게 터졌다(GROMO-1791).
    # 막으려던 건 release 였지 스택 PR 이 아니었으므로 의도대로 좁힌다.
    branches-ignore: [release]
    paths:
      - "server/data-api/**"
      - "server/scripts/docker-compose.dev.yml"
      - "server/scripts/docker-compose.datadog.yml"
      # dev-cd 가 조건부로 물리는 오버레이 (GROMO-1658) — 바뀌면 다음 배포에 반영돼야 한다.
      - "server/scripts/docker-compose.kafka.yml"
      - "server/scripts/docker-compose.satellites.data.yml"
      # CI 자신과 CI 가 호출하는 워크플로도 트리거에 넣는다. 안 넣으면 이 파일들만
      # 고치는 PR 에서 정작 CI 가 안 돌아 **머지해 봐야** 맞는지 안다 (GROMO-1515).
      - ".github/workflows/dev-ci.yml"
      - ".github/workflows/be-gradle.yml"
      - ".github/actions/ci-jar/**"
      - ".github/scripts/ci-jar.py"
      - ".github/workflows/dev-cd.yml"
  # squash merge 뒤에는 최종 main SHA를 다시 검사하고, 이 실행에서 배포 이미지를 만든다.
  # PR에서 채운 GAR 캐시를 사용하므로 CD에서 별도로 재빌드하지 않는다.
  push:
    branches: [main]
    paths:
      - "server/data-api/**"
      - "server/scripts/docker-compose.dev.yml"
      - "server/scripts/docker-compose.datadog.yml"
      - "server/scripts/docker-compose.kafka.yml"
      - "server/scripts/docker-compose.satellites.data.yml"
      - ".github/workflows/dev-ci.yml"
      - ".github/workflows/be-gradle.yml"
      - ".github/actions/ci-jar/**"
      - ".github/scripts/ci-jar.py"
      - ".github/workflows/dev-cd.yml"

concurrency:
  group: ci-${{ github.ref }}
  # PR의 이전 실행은 취소하되, main 이미지 build/deploy는 중간에 끊지 않는다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GAR_HOST: asia-northeast3-docker.pkg.dev
  APP_IMAGE_REPOSITORY: asia-northeast3-docker.pkg.dev/oneorthree2/ci-cache/back

jobs:
  # 셋 다 be-gradle.yml 하나를 부른다(GROMO-1790). 아티팩트 이름 `test-results`·`jar-size` 는
  # 아래 pr-comment 잡이 그 이름으로 내려받아 .github/scripts/generate-pr-comment.py 에 넘기므로
  # 바꾸면 PR 코멘트가 빈 값으로 나온다.
  #
  # ── 러너 배치 (GROMO-1793 → GROMO-1910 현행화, 2026-09-17) ───────────────────
  # CI 가 느린 건 «실행»이 아니라 «대기»다. `ci` 라벨 self-hosted 슬롯이 gromo-dev-build-1/2/3
  # 셋뿐인데 워크플로가 전부 그 라벨을 잡아서, 실행 6분짜리 잡이 대기 30분을 먹는다(실측:
  # notification 검증 대기 36.1분 / 실행 6.5분, business-api 검증 대기 27.1분 / 실행 6.3분).
  # 같은 시점에 GitHub-hosted 에서 돈 잡들은 대기 0.1분이었다.
  #
  # GROMO-1793 땐 checkstyle · spotbugs 둘만 옮겼다. 그땐 조직 플랜이 free + private 라
  # GitHub Actions 무료 한도가 월 2,000분이었고, self-hosted 가 하루 120분을 쓰고 있어서 전면
  # 이전은 16일이면 한도를 태웠다. test 는 실행만 23.7분이라 분 소비가 checkstyle·spotbugs 를
  # 합친 것의 네 배라 그때는 옮기지 못했다 — **막던 건 월 2,000분 한도지 기술 제약이 아니었다**
  # (`needs-db` 를 GROMO-1793 에서 이미 들어내 도커 의존이 없었으므로 `runs-on` 한 줄이면 됐다).
  #
  # GROMO-1910: 레포가 공개로 전환되며 그 분 한도 자체가 없어졌다(공개 레포는 GitHub-hosted
  # 표준 러너가 무제한). 동시에 공개 레포에서 self-hosted 러너를 계속 쓰는 건 포크 PR 이 그
  # 러너에서 코드를 실행할 수 있다는 보안 문제도 생긴다. 그래서 test 도 옮긴다 — 사라진 건
  # 한도라는 «이유»였지 기술적 가능 여부가 아니었으므로 바뀔 건 `runs-on` 한 줄뿐이다. 대신
  # 호스트 Gradle 캐시 효과가 사라지는 손실은 있다 — be-gradle.yml 의 `actions/cache` 가 그걸
  # 메운다(러너 종류별로 키를 분리해 self-hosted 캐시를 오염시키지 않는다).
  #
  # ⚠️ 아래 build·deploy 는 지금도 «기술적으로» 못 옮긴다 — GAR 인증이 GCE 메타데이터 토큰을
  #    쓰는데 GitHub-hosted 에는 그 메타데이터가 없다. 공개 전환은 이 제약과 무관하다.
  # ── 적용된 마이그레이션은 «바이트가» 계약이다 (GROMO-1911) ────────────────────
  # Flyway 는 적용한 파일의 체크섬을 DB 에 저장해 두고, 다음 부팅의 validate 에서 파일과
  # 대조한다. 주석 한 글자만 달라져도 「checksum mismatch」로 부팅 자체가 막힌다.
  #
  # 2026-09-16 문서 경로 일괄 치환(PR #773)이 이미 적용된 V38 의 주석 한 줄
  # (`docs/prd/challenge/…` → `docs/prd/gromo/challenge/…`)을 바꿨고, 그 뒤 main 의 Dev CD 가
  # 전부 실패했다 — run 35168718059: `Migration checksum mismatch for migration version 38`.
  #
  # 테스트로는 못 잡는다. CI 는 create-drop + Flyway off 라 마이그레이션을 아예 돌리지 않아
  # (GROMO-1515 계열 주석 참조) 이 부류의 결함은 dev·prod «부팅»에서만 드러난다. 그래서
  # 코드가 아니라 «파일이 변경되었는지»를 본다.
  #
  # 막혔을 때 올바른 대응은 이 검사를 끄는 게 아니라 ① 원문으로 되돌리고 새 V 파일을 더하거나
  # ② 정말 과거 파일을 바꿔야 한다면 dev DB 를 리셋하는 것이다(둘 다 의도적 행위여야 한다).
  #
  # ②를 위한 탈출구는 «커밋 메시지»에 둔다 — 라벨은 PR 규약상 유형 라벨 하나만 허용되고,
  # 워크플로 자체를 고치는 건 곧 검사를 끄는 길이기 때문이다. 커밋 본문에
  # `Flyway-Override: <이유>` 한 줄이 있으면 통과시키되 무엇을 봐줬는지 로그에 남긴다.
  # 되돌리기(복구)도 main 기준으로는 «수정»이라 이 탈출구를 탄다.
  migration-immutable:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 이미 main 에 있는 마이그레이션이 수정·삭제·개명되지 않았는지 확인
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # M 수정 · D 삭제 · R 개명 · T 타입변경. 추가(A)는 정상이라 뺀다.
          # 개명도 막는다 — Flyway 는 파일명에서 version 과 description 을 읽는다.
          changed=$(git diff --diff-filter=MDRT --name-only "$BASE_SHA...HEAD" \
            -- server/data-api/src/main/resources/db/migration/)
          if [ -z "$changed" ]; then
            echo "적용된 마이그레이션 변경 없음 (추가만 있거나 손대지 않음)."
            exit 0
          fi
          reason=$(git log --format=%B "$BASE_SHA..HEAD" \
            | sed -n 's/^Flyway-Override:[[:space:]]*//p' | head -1)
          if [ -n "$reason" ]; then
            echo "::warning::의도적 우회 — $reason"
            echo "$changed"
            exit 0
          fi
          echo "::error::이미 main 에 있는 마이그레이션을 고치면 Flyway 체크섬이 달라져 dev·prod 가 부팅하지 못합니다. 원문으로 되돌리고 새 V 파일을 추가하세요. 정말 의도한 변경이면 커밋 메시지에 'Flyway-Override: <이유>' 줄을 넣으세요."
          echo "$changed"
          exit 1

  checkstyle:
    uses: ./.github/workflows/be-gradle.yml
    with:
      service: data-api
      # DB·도커·GAR 인증이 필요 없는 순수 정적 분석이라 GitHub-hosted 로 뺄 수 있다.
      runs-on: '["ubuntu-latest"]'
      tasks: checkstyleMain checkstyleTest
      artifact-name: checkstyle-report
      artifact-path: build/reports/checkstyle/

  spotbugs:
    uses: ./.github/workflows/be-gradle.yml
    with:
      service: data-api
      runs-on: '["ubuntu-latest"]'
      tasks: spotbugsMain
      artifact-name: spotbugs-report
      artifact-path: build/reports/spotbugs/

  test:
    uses: ./.github/workflows/be-gradle.yml
    with:
      service: data-api
      # GROMO-1910: 공개 전환으로 GitHub-hosted 무료 분 한도가 없어져 self-hosted 대기시간을
      # 감수할 이유가 사라졌다. DB·GAR 인증 의존이 없으므로(GROMO-1793) 기술적으로도 그대로 옮긴다.
      runs-on: '["ubuntu-latest"]'
      tasks: test bootJar
      publish-jar: true
      artifact-name: test-results
      artifact-path: build/test-results/
      measure-jar: true

  # PR에서는 merge-ref의 build 가능 여부를 검증하고 GAR 캐시만 갱신한다.
  # main에서는 최종 main SHA를 같은 캐시로 build해 GAR에 push한다. 이 job이 반환한
  # digest를 아래 deploy job에 직접 넘기므로 CD는 태그를 다시 조회하거나 재빌드하지 않는다.
  build:
    name: Dev 이미지 build${{ github.event_name == 'push' && ' · GAR push' || ' · cache' }}
    needs: [checkstyle, spotbugs, test]
    runs-on: [self-hosted, ci, spot]
    timeout-minutes: 30
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-jar
        with:
          service: data-api
          operation: verify

      # GCE 러너의 SA 메타데이터 토큰으로 로그인 — gcloud도 키 파일도 필요 없다
      - name: GAR 인증
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H "Metadata-Flavor: Google" \
            "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token" \
          | jq -er .access_token \
          | docker login -u oauth2accesstoken --password-stdin "$GAR_HOST"

      - uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드 및 push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./server/data-api
          file: ./server/data-api/Dockerfile
          platforms: linux/amd64
          build-args: JAR_SOURCE=prebuilt
          # PR이 만든 mutable tag를 배포 신뢰점으로 사용하지 않는다.
          # main push 실행만 최종 이미지를 push한다.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          provenance: false
          tags: ${{ env.APP_IMAGE_REPOSITORY }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=registry,ref=asia-northeast3-docker.pkg.dev/oneorthree2/ci-cache/back:cache-amd64
          cache-to: type=registry,ref=asia-northeast3-docker.pkg.dev/oneorthree2/ci-cache/back:cache-amd64,mode=max

      - name: 결과 요약
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAG: ${{ env.APP_IMAGE_REPOSITORY }}:${{ github.sha }}
          PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if [ "$PUSH" = true ]; then
            [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            {
              echo "### Dev main 이미지 push 완료 :rocket:"
              echo "- 태그: \`$IMAGE_TAG\`"
              echo "- digest: \`$IMAGE_DIGEST\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### PR 이미지 build · cache 검증 완료 (push 없음)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # build-push-action의 digest는 같은 workflow 안의 reusable CD로 직접 전달한다.
  # registry tag는 사람이 main SHA로 이미지를 찾는 용도일 뿐, 배포 입력으로 사용하지 않는다.
  deploy:
    name: Dev CD
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/dev-cd.yml
    with:
      image_digest: ${{ needs.build.outputs.image-digest }}
      image_revision: ${{ github.sha }}
    secrets: inherit

  pr-report:
    needs: [checkstyle, spotbugs, test, build]
    if: false
    runs-on: [self-hosted, ci, spot]
    timeout-minutes: 5
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results/

      - uses: actions/download-artifact@v4
        with:
          name: jar-size
          path: jar-size/

      - name: Generate PR comment
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHECKSTYLE_RESULT: ${{ needs.checkstyle.result }}
          SPOTBUGS_RESULT: ${{ needs.spotbugs.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: python3 .github/scripts/generate-pr-comment.py

      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('pr-comment.md', 'utf8');
            const marker = '## CI Report';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.startsWith(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
