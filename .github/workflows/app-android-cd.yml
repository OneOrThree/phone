name: Android CD

# CI(app-android-ci.yml)가 main 에서 만든 AAB → Play 내부 테스트 (GROMO-2223).
# 트리거 없음. CI deploy 잡이 workflow_call 로 부름. 재빌드 안 함.
# 업로드 후 internal 트랙 재조회로 확인 → 머지 PR 에 deployed:play-internal 라벨·코멘트.
#
# 선택 변수 PLAY_INTERNAL_RELEASE_STATUS (기본 completed). "Only releases with status draft may be created
# on draft app" 나오면 draft 로 바꾸고 콘솔에서 출시. 앱이 검토 통과하면 지움.

on:
  workflow_call:
    inputs:
      artifact-name:
        description: CI 가 올린 AAB 아티팩트 이름
        required: true
        type: string
      version-code:
        description: AAB 의 versionCode (릴리스 이름·요약용)
        required: true
        type: string
      revision:
        description: AAB 를 만든 main commit SHA
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  pull-requests: write # PR 라벨·코멘트
  issues: write # 라벨은 이슈 API

env:
  AWS_REGION: ap-northeast-2
  # 키: Secrets Manager gromo/prod/android. 자세한 건 app-android-ci.yml 머리말
  AWS_ROLE_ARN: arn:aws:iam::808715036056:role/gromo-prod-android-github-actions
  RELEASE_SECRET_ID: gromo/prod/android

jobs:
  play-internal:
    name: Play 내부 테스트 업로드
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Deployments 에 play-internal 기록 남음. 배포 브랜치 main 만 (레포 설정)
    environment:
      name: play-internal
    steps:
      - name: AAB 받기
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: aab

      - name: 릴리스 이름용 짧은 커밋
        id: rev
        env:
          REVISION: ${{ inputs.revision }}
        run: echo "short=${REVISION:0:8}" >> "$GITHUB_OUTPUT"

      - name: AWS 인증 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Secrets Manager 에서 Play 키 받기
        run: |
          set -euo pipefail
          umask 077
          aws secretsmanager get-secret-value --secret-id "$RELEASE_SECRET_ID" --query SecretString --output text \
            | jq -r '.PLAY_SERVICE_ACCOUNT_JSON // empty' > "$RUNNER_TEMP/play-sa.json"
          jq -e '.type == "service_account"' "$RUNNER_TEMP/play-sa.json" > /dev/null \
            || { echo "::error::$RELEASE_SECRET_ID 의 PLAY_SERVICE_ACCOUNT_JSON 이 비었거나 서비스 계정 키가 아니다"; exit 1; }

      - name: Play 내부 테스트 트랙 업로드
        # 키 받는 서드파티 액션 → 커밋 SHA 고정 (v1.1.5)
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJson: ${{ runner.temp }}/play-sa.json
          packageName: com.oneorthree.gromo
          releaseFiles: aab/app-release.aab
          track: internal
          status: ${{ vars.PLAY_INTERNAL_RELEASE_STATUS || 'completed' }}
          # 릴리스 이름 50자 제한 → 커밋 8자
          releaseName: dev ${{ inputs.version-code }} (${{ steps.rev.outputs.short }})

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 업로드 확인 (internal 트랙 재조회)
        # 액션 성공 ≠ 트랙 반영. Play 재조회. 읽기만, edit 는 지움.
        env:
          VERSION_CODE: ${{ inputs.version-code }}
          EXPECTED_STATUS: ${{ vars.PLAY_INTERNAL_RELEASE_STATUS || 'completed' }}
        run: |
          set -euo pipefail
          pip install --quiet 'google-auth==2.*' 'requests==2.*'
          python3 - <<'PY'
          import json, os, sys
          from google.auth.transport.requests import AuthorizedSession
          from google.oauth2 import service_account
          api = "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.oneorthree.gromo"
          with open(os.path.join(os.environ["RUNNER_TEMP"], "play-sa.json"), encoding="utf-8") as f:
              creds = service_account.Credentials.from_service_account_info(
                  json.load(f), scopes=["https://www.googleapis.com/auth/androidpublisher"])
          s = AuthorizedSession(creds)
          edit = s.post(f"{api}/edits", json={}); edit.raise_for_status(); eid = edit.json()["id"]
          try:
              t = s.get(f"{api}/edits/{eid}/tracks/internal"); t.raise_for_status()
              releases = t.json().get("releases", [])
          finally:
              s.delete(f"{api}/edits/{eid}")
          want, status = os.environ["VERSION_CODE"], os.environ["EXPECTED_STATUS"]
          hit = [r for r in releases if want in r.get("versionCodes", [])]
          print(f"internal 트랙: {[(r.get('status'), r.get('versionCodes')) for r in releases]}")
          if not hit or hit[0].get("status") != status:
              print(f"::error::internal 트랙에 versionCode {want} 가 {status} 상태로 없다"); sys.exit(1)
          print(f"확인: versionCode {want} → internal ({status})")
          PY

      - name: Play 키 지우기
        if: always()
        run: rm -f "$RUNNER_TEMP/play-sa.json"

      - name: 배포된 PR 에 표시
        # 커밋의 머지 PR 찾아 라벨·코멘트. PR 없으면 건너뜀. 라벨 없으면 GitHub 가 첫 부착 때 만듦.
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ inputs.revision }}
          VERSION_CODE: ${{ inputs.version-code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REVISION/pulls" --jq '[.[] | select(.merged_at != null)][0].number // empty')"
          if [ -z "$pr" ]; then echo "커밋 $REVISION 에 연결된 머지 PR 이 없어 표시를 건너뛴다"; exit 0; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$pr/labels" -f "labels[]=deployed:play-internal" > /dev/null
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$pr/comments" -f body="Play 내부 테스트 배포 완료 — versionCode \`$VERSION_CODE\` · 커밋 \`${REVISION:0:8}\` · [실행 기록]($RUN_URL)" > /dev/null
          echo "PR #$pr 에 deployed:play-internal 표시"
          echo "- PR: #$pr 에 \`deployed:play-internal\` 표시" >> "$GITHUB_STEP_SUMMARY"

      - name: 결과 요약
        if: always()
        run: |
          {
            echo "## Android CD — Play 내부 테스트"
            echo "- 패키지: \`com.oneorthree.gromo\` · 트랙: internal"
            echo "- versionCode: ${{ inputs.version-code }} · 커밋: \`${{ inputs.revision }}\`"
            echo "- 결과: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
