name: Redis CI (dev)-v2
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/scripts/v2/dev/redis/**'
      - 'server/scripts/v2/dev/common/**'
      - '.github/scripts/v2/dev/test_dev_runtime_V2.py'
      - '.github/scripts/v2/dev/dev-publish-runtime-V2.py'
      - '.github/workflows/redis-ci.dev-v2.yml'
  push:
    branches: [main]
    paths:
      - 'server/scripts/v2/dev/redis/**'
      - 'server/scripts/v2/dev/common/**'
      - '.github/scripts/v2/dev/test_dev_runtime_V2.py'
      - '.github/scripts/v2/dev/dev-publish-runtime-V2.py'
      - '.github/workflows/redis-ci.dev-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Redis 구성 검사
        env:
          HOST_PRIVATE_IP: 10.30.0.9
          SHARED_ACL_FILE: /tmp/shared.acl
          BUSINESS_ACL_FILE: /tmp/business.acl
        run: |
          docker compose -f server/scripts/v2/dev/redis/shared.yml -f server/scripts/v2/dev/redis/business.yml config --quiet
          bash -n server/scripts/v2/dev/common/verify-data-mount.sh
          bash -n server/scripts/v2/dev/common/apply.sh
          python3 -m unittest discover -s .github/scripts/v2/dev -p test_dev_runtime_V2.py -v
  publish:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev-v2
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_DEV_V2_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEV_V2_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: dev V2 불변 구성 발행
        run: python3 .github/scripts/v2/dev/dev-publish-runtime-V2.py redis
  auto-cd:
    # Auto CD가 실행한 CI는 토큰 실행이라 workflow_run이 안 깨움. 직접 재평가.
    needs: publish
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cd-auto.dev-v2.yml --repo OneOrThree/phone --ref main
