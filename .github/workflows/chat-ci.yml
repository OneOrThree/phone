name: Chat CI

# 채팅 서비스 전용 게이트 (GROMO-292).
#
# be-check-style / be-test / be-spot-bugs 를 재사용하지 않는 이유: 그 세 워크플로는
# `working-directory: server/data-api` 를 «하드코딩»하고 있어서, 재사용하려면 입력을 받도록
# 세 파일을 모두 고쳐야 한다 — 그건 기존 백엔드 게이트를 건드리는 변경이라 이 PR 의 위험을 키운다.
# 서비스가 더 늘어날 때(A17 의 JVM 5종) 경로를 입력으로 빼는 리팩터링을 한 번에 하는 편이 낫다.
#
# 여기서는 잡을 하나로 합쳤다. `./gradlew build` 한 번이 checkstyle · spotbugs · test · bootJar 를
# 전부 돌리므로, 잡을 셋으로 쪼개면 러너 3개를 물고 Gradle 이 세 번 뜬다(러너는 VM 한 대를 공유한다).

on:
  pull_request:
    paths:
      - 'server/chat/**'
      - '.github/workflows/chat-ci.yml'
  push:
    branches: [main]
    paths:
      - 'server/chat/**'
      - '.github/workflows/chat-ci.yml'

jobs:
  build:
    runs-on: [self-hosted, ci, spot]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server/chat
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: |
            /home/runner/.gradle/caches
            /home/runner/.gradle/wrapper
          key: ${{ runner.os }}-gradle-chat-${{ hashFiles('server/chat/**/*.gradle*', 'server/chat/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-chat-

      - run: chmod +x gradlew

      # Postgres·Redis 를 services: 로 띄우지 않는다 — 테스트가 Testcontainers 로 직접 띄우고,
      # @ServiceConnection 이 주소를 빈으로 주입한다. services: 로 띄우면 포트 고정 문제
      # (러너 3개가 VM 한 대를 공유한다)를 다시 떠안는다.
      - name: Build (checkstyle + spotbugs + test + bootJar)
        env:
          SPRING_PROFILES_ACTIVE: ci
        run: ./gradlew build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-test-results
          path: server/chat/build/test-results/
          retention-days: 7

  # 이미지가 «빌드는 되는가»만 본다(푸시 없음). data-api 의 dev-ci 가 PR 에서 하는 것과 같은 규율 —
  # Dockerfile 이 깨진 채로 머지되면 그 사실은 배포 시점에야 드러난다.
  docker-build:
    runs-on: [self-hosted, ci, spot]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: server/chat
          push: false
          cache-from: type=gha,scope=chat
          cache-to: type=gha,mode=max,scope=chat
