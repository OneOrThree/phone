name: Generate OpenAPI Docs

on:
  push:
    branches: [ main, release, 'bfeat/**', 'bfix/**', 'brefactor/**' ]
    paths:
      # 도메인 기반 패키지 구조라 컨트롤러는 phone/<domain>/api/ 에 흩어져 있음.
      # DTO·enum 변경도 OpenAPI 스키마에 반영되므로 백엔드 소스 전체를 감시한다.
      - 'back/src/main/java/**'
      # openApi 블록(대기 시간·문서 URL·출력 경로)과 의존성이 여기 있다 (GROMO-1515).
      # 안 넣으면 이 설정을 고치는 PR 에서 정작 이 워크플로가 안 돌아 **머지해 봐야** 안다.
      - 'back/build.gradle'
      # 이 워크플로 자신도 트리거에 넣는다 — 위와 같은 이유다.
      - '.github/workflows/api-dog-generate.yml'
      # 전송·판정 로직이 스크립트로 빠졌으니 그 경로도 같은 이유로 넣는다 — 안 넣으면
      # 스크립트만 고치는 푸시에서 이 워크플로가 안 돌아 검증 로직 변경을 CI 에서 확인할 수 없다.
      - '.github/scripts/**'
  workflow_dispatch:

jobs:
  generate-docs:
    runs-on: [self-hosted, ci, spot]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tt_db
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          # 호스트 포트 고정 금지 — 러너 3개가 VM 한 대를 공유해 5432 가 겹친다.
          # 상세는 test-backend.yml 의 같은 위치 주석 참조 (GROMO-1515).
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check if back directory exists
        id: check
        run: echo "exists=$([ -d back ] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        if: steps.check.outputs.exists == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        if: steps.check.outputs.exists == 'true'
        working-directory: back
        run: chmod +x gradlew

      - name: Build with Gradle
        if: steps.check.outputs.exists == 'true'
        working-directory: back
        run: ./gradlew build -x test

      - name: Generate OpenAPI Docs
        if: steps.check.outputs.exists == 'true'
        working-directory: back
        env:
          SPRING_PROFILES_ACTIVE: ci
          # 위에서 호스트 포트를 도커에 맡겼으니 실제 매핑 포트를 넘긴다.
          # 이 env 는 플러그인이 fork 하는 bootRun JVM 까지 상속된다 — 바로 위
          # SPRING_PROFILES_ACTIVE 가 같은 경로로 이미 동작하고 있는 게 근거다.
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:${{ job.services.postgres.ports['5432'] }}/tt_db
        run: ./gradlew generateOpenApiDocs

      - name: Set deploy destination
        if: steps.check.outputs.exists == 'true'
        id: dest
        run: |
          BRANCH="${{ github.ref_name }}"
          SAFE_BRANCH="${BRANCH//\//-}"
          echo "safe_branch=$SAFE_BRANCH" >> $GITHUB_OUTPUT
          if [ "$BRANCH" = "release" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
            echo "url=https://oneorthree.github.io/phone/" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "main" ]; then
            echo "dir=staging" >> $GITHUB_OUTPUT
            echo "url=https://oneorthree.github.io/phone/staging/" >> $GITHUB_OUTPUT
          else
            echo "dir=$BRANCH" >> $GITHUB_OUTPUT
            echo "url=https://oneorthree.github.io/phone/$BRANCH/" >> $GITHUB_OUTPUT
          fi

      - name: Generate Swagger UI
        if: steps.check.outputs.exists == 'true'
        working-directory: back
        run: |
          mkdir -p build/docs/api
          cat > build/docs/api/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="ko">
            <head>
              <meta charset="UTF-8">
              <title>Phone API 문서</title>
              <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist/swagger-ui.css">
            </head>
            <body>
              <div id="swagger-ui"></div>
              <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>
              <script>
                SwaggerUIBundle({
                  url: "./openapi.json",
                  dom_id: '#swagger-ui',
                  presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIBundle.SwaggerUIStandalonePreset
                  ],
                  layout: "BaseLayout",
                  deepLinking: true,
                  displayRequestDuration: true,
                  operationsSorter: "alpha",
                  docExpansion: "none",
                })
              </script>
            </body>
          </html>
          EOF

      - name: Upload openapi.json as artifact
        if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec-${{ steps.dest.outputs.safe_branch }}
          path: back/build/docs/api/openapi.json
          retention-days: 30

      - name: Deploy to gh-pages
        if: steps.check.outputs.exists == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: back/build/docs/api/
          destination_dir: ${{ steps.dest.outputs.dir }}
          keep_files: true

      - name: Notify Slack
        if: |
          steps.check.outputs.exists == 'true' &&
          (github.ref_name == 'main' || github.ref_name == 'release')
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "✅ API 문서가 업데이트되었습니다.",
              "attachments": [
                {
                  "color": "good",
                  "fields": [
                    {
                      "title": "브랜치",
                      "value": "${{ github.ref_name }}",
                      "short": true
                    },
                    {
                      "title": "커밋",
                      "value": ${{ toJSON(github.event.head_commit.message) }},
                      "short": true
                    }
                  ],
                  "actions": [
                    {
                      "type": "button",
                      "text": "문서 확인하기",
                      "url": "${{ steps.dest.outputs.url }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Patch openapi.json version for Apidog
        if: steps.check.outputs.exists == 'true'
        working-directory: back/build/docs/api
        run: |
          BRANCH="${{ github.ref_name }}"
          BASE_VERSION=$(cat openapi.json | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])")
          python3 -c "
          import json
          with open('openapi.json', 'r') as f:
              spec = json.load(f)
          spec['info']['version'] = '${BASE_VERSION}-${BRANCH}'.replace('/', '-')
          with open('openapi.json', 'w') as f:
              json.dump(spec, f)
          "

      # ── Apidog 동기화 (GROMO-1623) ───────────────────────────────────────────
      # 스펙도 payload 도 셸 인자로 넘기지 않는다. 리눅스는 개별 인자 길이를
      # MAX_ARG_STRLEN(32 × 페이지크기 = 131,072 B)으로 제한하는데 openapi.json 은 약 251 KB,
      # jq 가 만든 payload 도 약 159 KB 라 둘 다 상한을 넘는다. 예전 코드는
      # `--argjson spec "$(cat openapi.json)"` 였고 jq 가 실행조차 못 돼(E2BIG) **빈 바디**가 나갔다.
      # Apidog 는 그 요청에 200 + 전 항목 count 0 을 돌려줬고 `--fail` 은 4xx 만 보므로
      # 스텝이 초록으로 통과했다 — 문서는 최소 2026-08-14 이후 한 번도 갱신되지 않았다.
      # macOS 는 인자 상한이 커서 로컬 재현이 안 된다는 점도 발견을 늦췄다.
      #
      # 그래서 ① jq 입력은 --slurpfile(파일) ② curl 바디는 --data @(파일) ③ 그리고 무엇보다
      # **조용한 실패를 막는 단언**을 둔다 — ①②만 고치면 다음 실패가 또 초록으로 지나간다.
      - name: Sync to Apidog
        if: steps.check.outputs.exists == 'true'
        working-directory: back/build/docs/api
        run: |
          set -euo pipefail
          jq -n --slurpfile spec openapi.json \
            '{input: ($spec[0] | tojson), options: {endpointOverwriteBehavior: "OVERWRITE_EXISTING", schemaOverwriteBehavior: "OVERWRITE_EXISTING", updateFolderOfChangedEndpoint: true, prependBasePath: false, deleteUnmatchedResources: true}}' \
            > apidog-payload.json
          bash "$GITHUB_WORKSPACE/.github/scripts/apidog-import.sh" \
            1283919 "${{ secrets.APIDOG_TOKEN }}" apidog-payload.json

      - name: Sync to Apidog (Soobin)
        if: steps.check.outputs.exists == 'true'
        working-directory: back/build/docs/api
        run: |
          set -euo pipefail
          jq -n --slurpfile spec openapi.json \
            '{input: ($spec[0] | tojson), options: {endpointOverwriteBehavior: "OVERWRITE_EXISTING", schemaOverwriteBehavior: "OVERWRITE_EXISTING", updateFolderOfChangedEndpoint: false, prependBasePath: false}}' \
            > apidog-payload-soobin.json
          bash "$GITHUB_WORKSPACE/.github/scripts/apidog-import.sh" \
            1305019 "${{ secrets.APIDOG_TOKEN_SOOBIN }}" apidog-payload-soobin.json

      - name: Sync to Apidog (kth)
        if: steps.check.outputs.exists == 'true'
        working-directory: back/build/docs/api
        run: |
          set -euo pipefail
          jq -n --slurpfile spec openapi.json \
            '{input: ($spec[0] | tojson), options: {endpointOverwriteBehavior: "OVERWRITE_EXISTING", schemaOverwriteBehavior: "OVERWRITE_EXISTING", updateFolderOfChangedEndpoint: false, prependBasePath: false}}' \
            > apidog-payload-kth.json
          bash "$GITHUB_WORKSPACE/.github/scripts/apidog-import.sh" \
            1328838 "${{ secrets.APIDOG_TOKEN_KTH }}" apidog-payload-kth.json
