name: Generate OpenAPI Docs

on:
  push:
    branches: [ main, release, 'bfeat/**', 'bfix/**', 'brefactor/**' ]
    paths:
      # 도메인 기반 패키지 구조라 컨트롤러는 phone/<domain>/api/ 에 흩어져 있음.
      # DTO·enum 변경도 OpenAPI 스키마에 반영되므로 백엔드 소스 전체를 감시한다.
      - 'server/data-api/src/main/java/**'
      # openApi 블록(대기 시간·문서 URL·출력 경로)과 의존성이 여기 있다 (GROMO-1515).
      # 안 넣으면 이 설정을 고치는 PR 에서 정작 이 워크플로가 안 돌아 **머지해 봐야** 안다.
      - 'server/data-api/build.gradle'
      # 이 워크플로 자신도 트리거에 넣는다 — 위와 같은 이유다.
      - '.github/workflows/api-dog-generate.yml'
      # 전송·판정 로직이 스크립트로 빠졌으니 그 경로도 같은 이유로 넣는다 — 안 넣으면
      # 스크립트만 고치는 푸시에서 이 워크플로가 안 돌아 검증 로직 변경을 CI 에서 확인할 수 없다.
      - '.github/scripts/**'
  workflow_dispatch:

# ⚠️ 이 워크플로는 «PR CI 로 검증되지 않는다». 트리거가 push 뿐이고 브랜치 목록이
# main·release·bfeat/**·bfix/**·brefactor/** 인데, 워크플로를 고치는 작업은 보통 `bchore/` 라서
# 여기에 걸리지 않는다(pull_request 트리거도 없다). 즉 이 파일을 고치면 «머지된 뒤 main push 에서
# 처음» 돈다. `bchore/**` 를 넣어 해결하지는 않는다 — 그러면 chore 브랜치마다 문서 디렉터리가
# 생기는데 api-docs-cleanup.yml 의 삭제 접두어 목록엔 `bchore/` 가 없어서 그대로 쌓인다.
# 그래서 이 파일을 고칠 때는 게시 스텝 로직을 «로컬 레포로 재현»해 확인하고 올린다 (GROMO-1790).

# 같은 브랜치의 «뒤처진» 실행은 끝까지 갈 필요가 없다. 새 커밋이 밀고 들어오면 이전 실행을
# 취소한다 — 그대로 두면 옛 산출물을 최신 tip 위에 올려 문서를 구버전으로 되돌린다(GROMO-1790).
# 그룹을 ref 로 «가르는» 게 핵심이다. 하나로 묶으면 서로 다른 브랜치의 문서 게시가 서로를 취소한다.
#
# 취소는 즉시가 아니라서 이것만으로는 부족하다 — 취소 신호가 오는 사이 push 가 나갈 수 있다.
# 그래서 게시 스텝이 push «직전»에 브랜치 tip 을 한 번 더 확인한다(아래 「뒤처짐 확인」).
concurrency:
  group: api-docs-${{ github.ref }}
  # ⚠️ 여기만 `${{ github.event_name == 'pull_request' }}` 규율(dev-ci·realtime-ci·business-ci·
  #    app-lint)을 따르지 «않는다». 이 워크플로엔 `pull_request` 트리거가 «없어서» 그 식은 언제나
  #    false 다 — 즉 아무것도 취소되지 않아 절감이 0 이 된다. 그 규율의 «의도»는 「이미지를 올리는
  #    실행을 중간에 끊지 마라」인데, 여기서 올리는 건 gh-pages 문서이고 중간 푸시분은 다음 푸시가
  #    덮어쓸 것이라 끊어도 잃는 게 없다.
  #    게다가 `true` 는 여기서 «정확성»에도 필요하다 — 뒤처진 실행을 살려 두면 최신 문서를 옛
  #    문서로 되돌린다(아래 게시 스텝의 「뒤처짐 확인」이 2차 방어다).
  #    하루 25회 × 7.8분이 이 취소로 줄어든다 (GROMO-1797).
  cancel-in-progress: true

permissions:
  # gh-pages 에 문서 커밋을 push 한다. 기본값에 기대지 않고 이 워크플로가 쓰는 것만 명시한다.
  contents: write
  # 게시 스텝이 「나보다 최신인 문서 실행이 있는가」를 Actions API 로 확인한다(아래 「뒤처짐 확인」).
  actions: read

jobs:
  generate-docs:
    runs-on: [self-hosted, ci, spot]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tt_db
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          # 호스트 포트 고정 금지 — 러너 3개가 VM 한 대를 공유해 5432 가 겹치면
          # `Bind for 0.0.0.0:5432 failed: port is already allocated` 로 즉사한다.
          # 도커가 빈 포트를 고르게 두고 아래에서 `job.services.postgres.ports` 로 실제 포트를 읽는다.
          #
          # 이 워크플로는 be-gradle.yml 과 «다르다» — 저쪽은 테스트만 돌아서 Testcontainers 로
          # 충분하지만(GROMO-1793 에서 호스트 DB 를 들어냈다), 여기는 `generateOpenApiDocs` 가
          # 앱을 실제로 부팅하므로 진짜 DB 가 필요하다 (GROMO-1515).
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check if backend directory exists
        id: check
        run: echo "exists=$([ -d server/data-api ] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        if: steps.check.outputs.exists == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        if: steps.check.outputs.exists == 'true'
        working-directory: server/data-api
        run: chmod +x gradlew

      - name: Build with Gradle
        if: steps.check.outputs.exists == 'true'
        working-directory: server/data-api
        run: ./gradlew build -x test

      - name: Generate OpenAPI Docs
        if: steps.check.outputs.exists == 'true'
        working-directory: server/data-api
        env:
          SPRING_PROFILES_ACTIVE: ci
          # 위에서 호스트 포트를 도커에 맡겼으니 실제 매핑 포트를 넘긴다.
          # 이 env 는 플러그인이 fork 하는 bootRun JVM 까지 상속된다 — 바로 위
          # SPRING_PROFILES_ACTIVE 가 같은 경로로 이미 동작하고 있는 게 근거다.
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:${{ job.services.postgres.ports['5432'] }}/tt_db
        run: ./gradlew generateOpenApiDocs

      - name: Set deploy destination
        if: steps.check.outputs.exists == 'true'
        id: dest
        run: |
          BRANCH="${{ github.ref_name }}"
          SAFE_BRANCH="${BRANCH//\//-}"
          echo "safe_branch=$SAFE_BRANCH" >> $GITHUB_OUTPUT
          if [ "$BRANCH" = "release" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
            echo "url=https://oneorthree.github.io/phone/" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "main" ]; then
            echo "dir=staging" >> $GITHUB_OUTPUT
            echo "url=https://oneorthree.github.io/phone/staging/" >> $GITHUB_OUTPUT
          else
            echo "dir=$BRANCH" >> $GITHUB_OUTPUT
            echo "url=https://oneorthree.github.io/phone/$BRANCH/" >> $GITHUB_OUTPUT
          fi

      - name: Generate Swagger UI
        if: steps.check.outputs.exists == 'true'
        working-directory: server/data-api
        run: |
          mkdir -p build/docs/api
          cat > build/docs/api/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="ko">
            <head>
              <meta charset="UTF-8">
              <title>Phone API 문서</title>
              <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist/swagger-ui.css">
            </head>
            <body>
              <div id="swagger-ui"></div>
              <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>
              <script>
                SwaggerUIBundle({
                  url: "./openapi.json",
                  dom_id: '#swagger-ui',
                  presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIBundle.SwaggerUIStandalonePreset
                  ],
                  layout: "BaseLayout",
                  deepLinking: true,
                  displayRequestDuration: true,
                  operationsSorter: "alpha",
                  docExpansion: "none",
                })
              </script>
            </body>
          </html>
          EOF

      - name: Upload openapi.json as artifact
        if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec-${{ steps.dest.outputs.safe_branch }}
          path: server/data-api/build/docs/api/openapi.json
          retention-days: 30

      # ── gh-pages 게시 (GROMO-1790) ──────────────────────────────────────────
      # gh-pages 에 쓰는 주체는 «둘»이다 — 여기와 api-docs-cleanup.yml.
      # 예전엔 peaceiris/actions-gh-pages@v4 를 썼는데, 그 액션의 push 는 재시도도 rebase 도 없는
      # 맨 `git push origin gh-pages` 다(v4 `src/git-utils.ts` L231-236). 그래서 문서 생성이
      # 브랜치 삭제 cleanup 과 겹치면 non-fast-forward 로 거절되고 **살아 있는 브랜치의 문서
      # 갱신이 누락**된다. cleanup 쪽에만 재시도를 넣으면 그쪽이 경쟁에서 이기는 만큼 이 손실이
      # 늘기만 하므로, 양쪽을 같은 규율로 맞춘다 — 최신 tip 을 받아 덮어쓰기를 다시 하고 push 를
      # 재시도한다. 덮어쓰기는 멱등이라 몇 번을 돌려도 결과가 같다(rebase 였다면 상대 잡이 같은
      # 디렉터리를 지운 경우 delete/modify 충돌로 멈춘다).
      #
      # 공통 concurrency group 으로 직렬화하지 «않는» 이유: 같은 그룹에 pending 이 쌓이면
      # GitHub 이 직전 pending 을 취소한다(`cancel-in-progress: false` 여도 그렇다). 브랜치 삭제와
      # 문서 게시가 셋 이상 몰리면 가운데 하나가 통째로 사라진다 — 조용한 유실을 막으려다 더
      # 조용한 유실을 새로 만드는 셈이다.
      #
      # peaceiris 의 `keep_files: true` 와 같은 의미를 유지한다: 덮어쓰되 «지우지 않는다».
      # 그래서 gh-pages 루트의 `.nojekyll` 과 다른 브랜치 문서 디렉터리는 그대로 남는다.
      - name: Checkout gh-pages
        if: steps.check.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .gh-pages

      - name: Deploy to gh-pages
        if: steps.check.outputs.exists == 'true'
        env:
          DEST_DIR: ${{ steps.dest.outputs.dir }}
          SRC_DIR: server/data-api/build/docs/api
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 산출물을 체크아웃 «밖»으로 뺀다 — 재시도의 `reset --hard` 가 덮치지 않게.
          STAGE="$RUNNER_TEMP/gh-pages-payload"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -a "$SRC_DIR/." "$STAGE/"

          cd .gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch --depth=1 origin gh-pages
            git reset --hard FETCH_HEAD
            git clean -fdq

            mkdir -p "$DEST_DIR"
            cp -a "$STAGE/." "$DEST_DIR/"
            git add -A -- "$DEST_DIR"
            if git diff --cached --quiet; then
              echo "gh-pages 에 반영할 변경이 없다 — 문서가 이미 최신이다."
              exit 0
            fi
            git commit -m "docs: update OpenAPI docs for $GITHUB_REF_NAME ($GITHUB_SHA)"

            # 뒤처짐 확인 — 재시도가 만든 «새» 위험이다.
            # 재시도 전에는 뒤처진 실행의 push 가 non-fast-forward 로 «막혀서» 무해했다. 그런데
            # 최신 tip 을 받아 다시 올리도록 고치면, 새 커밋의 실행이 먼저 게시한 뒤에도 옛 실행이
            # 자기 STAGE 를 같은 자리에 덮어써 성공한다 — 문서가 «구버전으로 되돌아간다».
            #
            # ⚠️ 판정 기준은 「브랜치 tip 이 내 SHA 인가」가 «아니다». 이 워크플로는 `push.paths` 로
            #    걸러지므로, README 처럼 경로 밖 커밋이 하나 얹히면 tip 은 움직이지만 «새 문서 실행은
            #    생기지 않는다». tip 으로 판정하면 그때 내가 물러나 버려서, 방금 만든 문서가 다음
            #    관련 커밋까지 영영 게시되지 않는다. 그래서 「나보다 최신인 이 워크플로의 실행이
            #    실제로 있는가」를 본다.
            if ! git ls-remote --exit-code --heads origin "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              echo "$GITHUB_REF_NAME 브랜치가 사라졌다 — 게시하지 않는다(지워진 브랜치 문서를 새로 만들지 않기 위해)."
              exit 0
            fi
            NEWER="$(curl --fail --silent --show-error \
                  -H "Authorization: Bearer $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/api-dog-generate.yml/runs?per_page=100" \
                | jq --arg br "$GITHUB_REF_NAME" --argjson me "$GITHUB_RUN_NUMBER" \
                    '[.workflow_runs[] | select(.head_branch == $br and .run_number > $me)] | length')" || NEWER=""
            if [ -z "$NEWER" ]; then
              # 조회 실패를 「물러남」으로 치면 문서가 조용히 안 올라간다. concurrency 취소가
              # 1차 방어로 남아 있으므로 게시를 진행하되, 시끄럽게 남긴다.
              echo "⚠️ 최신 실행 조회에 실패했다 — concurrency 취소에 기대고 게시를 진행한다." >&2
            elif [ "$NEWER" -gt 0 ]; then
              echo "나보다 최신인 문서 실행이 ${NEWER}개 있다(run_number > $GITHUB_RUN_NUMBER) — 그쪽에 맡기고 물러난다."
              exit 0
            fi

            if git push origin HEAD:gh-pages; then
              echo "gh-pages 갱신 완료(시도 $attempt) — $DEST_DIR"
              exit 0
            fi
            echo "gh-pages push 가 거절됐다(시도 $attempt) — 최신 tip 에서 다시 덮어쓴다." >&2
            sleep "$((attempt * 5))"
          done

          # 조용히 끝내지 않는다. Apidog 가 빈 바디로 200 을 받아 «초록인 채로» 문서가 두 달간
          # 안 갱신됐던 전례가 이 파일에 있다(아래 Sync to Apidog 주석).
          echo "gh-pages push 를 5회 재시도했지만 실패했다. $DEST_DIR 문서가 갱신되지 않았다." >&2
          exit 1

      - name: Notify Slack
        if: |
          steps.check.outputs.exists == 'true' &&
          (github.ref_name == 'main' || github.ref_name == 'release')
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "✅ API 문서가 업데이트되었습니다.",
              "attachments": [
                {
                  "color": "good",
                  "fields": [
                    {
                      "title": "브랜치",
                      "value": "${{ github.ref_name }}",
                      "short": true
                    },
                    {
                      "title": "커밋",
                      "value": ${{ toJSON(github.event.head_commit.message) }},
                      "short": true
                    }
                  ],
                  "actions": [
                    {
                      "type": "button",
                      "text": "문서 확인하기",
                      "url": "${{ steps.dest.outputs.url }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Patch openapi.json version for Apidog
        if: steps.check.outputs.exists == 'true'
        working-directory: server/data-api/build/docs/api
        run: |
          BRANCH="${{ github.ref_name }}"
          BASE_VERSION=$(cat openapi.json | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])")
          python3 -c "
          import json
          with open('openapi.json', 'r') as f:
              spec = json.load(f)
          spec['info']['version'] = '${BASE_VERSION}-${BRANCH}'.replace('/', '-')
          with open('openapi.json', 'w') as f:
              json.dump(spec, f)
          "

      # ── Apidog 동기화 (GROMO-1623) ───────────────────────────────────────────
      # 스펙도 payload 도 셸 인자로 넘기지 않는다. 리눅스는 개별 인자 길이를
      # MAX_ARG_STRLEN(32 × 페이지크기 = 131,072 B)으로 제한하는데 openapi.json 은 약 251 KB,
      # jq 가 만든 payload 도 약 159 KB 라 둘 다 상한을 넘는다. 예전 코드는
      # `--argjson spec "$(cat openapi.json)"` 였고 jq 가 실행조차 못 돼(E2BIG) **빈 바디**가 나갔다.
      # Apidog 는 그 요청에 200 + 전 항목 count 0 을 돌려줬고 `--fail` 은 4xx 만 보므로
      # 스텝이 초록으로 통과했다 — 문서는 최소 2026-08-14 이후 한 번도 갱신되지 않았다.
      # macOS 는 인자 상한이 커서 로컬 재현이 안 된다는 점도 발견을 늦췄다.
      #
      # 그래서 ① jq 입력은 --slurpfile(파일) ② curl 바디는 --data @(파일) ③ 그리고 무엇보다
      # **조용한 실패를 막는 단언**을 둔다 — ①②만 고치면 다음 실패가 또 초록으로 지나간다.
      - name: Sync to Apidog
        if: steps.check.outputs.exists == 'true'
        working-directory: server/data-api/build/docs/api
        run: |
          set -euo pipefail
          jq -n --slurpfile spec openapi.json \
            '{input: ($spec[0] | tojson), options: {endpointOverwriteBehavior: "OVERWRITE_EXISTING", schemaOverwriteBehavior: "OVERWRITE_EXISTING", updateFolderOfChangedEndpoint: true, prependBasePath: false, deleteUnmatchedResources: true}}' \
            > apidog-payload.json
          APIDOG_TOKEN="${{ secrets.APIDOG_TOKEN }}" \
            bash "$GITHUB_WORKSPACE/.github/scripts/apidog-import.sh" 1283919 apidog-payload.json

