name: Realtime CI

# 채팅 서비스 전용 게이트 (GROMO-292).
#
# 검사는 be-gradle.yml 에 위임한다(GROMO-1790). 예전엔 be-check-style / be-test / be-spot-bugs 가
# `working-directory: server/data-api` 를 하드코딩해 재사용할 수 없어서 이 파일이 잡을 직접 들고
# 있었는데, 그 셋을 입력 받는 be-gradle.yml 하나로 합치면서 호출부만 남겼다.
#
# 잡은 여전히 하나다. `./gradlew build` 한 번이 checkstyle · spotbugs · test · bootJar 를 전부
# 돌리므로, 잡을 셋으로 쪼개면 러너 3개를 물고 Gradle 이 세 번 뜬다(러너는 VM 한 대를 공유한다).

on:
  pull_request:
    paths:
      - 'server/realtime/**'
      - '!server/realtime/docs/**'
      - '!server/realtime/**/*.md'
      - '.github/workflows/realtime-ci.dev.yml'
      - '.github/workflows/realtime-cd.dev.yml'
      # CD 가 직접 실행하는 공용 배포 스크립트 — 바뀌면 이 서버도 다시 배포해 검증 (GROMO-2224)
      - '.github/scripts/dev-env.sh'
      - '.github/scripts/write-compose-env.py'
      - '.github/scripts/wait-healthy.sh'
      - '.github/scripts/mark-deploy.sh'
      # 호출하는 재사용 워크플로도 넣는다 — 안 넣으면 be-gradle.yml 만 고치는 PR 에서
      # realtime 게이트가 안 돌아 «머지해 봐야» 맞는지 안다 (GROMO-1515 와 같은 이유).
      - '.github/workflows/be-gradle.yml'
      - '.github/actions/ci-jar/**'
      - '.github/actions/gar-login/**'
      - '.github/scripts/ci-jar.py'
      - 'server/scripts/docker-compose.realtime.yml'
  push:
    branches: [main]
    paths:
      - 'server/realtime/**'
      - '!server/realtime/docs/**'
      - '!server/realtime/**/*.md'
      - '.github/workflows/realtime-ci.dev.yml'
      - '.github/workflows/realtime-cd.dev.yml'
      # CD 가 직접 실행하는 공용 배포 스크립트 — 바뀌면 이 서버도 다시 배포해 검증 (GROMO-2224)
      - '.github/scripts/dev-env.sh'
      - '.github/scripts/write-compose-env.py'
      - '.github/scripts/wait-healthy.sh'
      - '.github/scripts/mark-deploy.sh'
      # 호출하는 재사용 워크플로도 넣는다 — 안 넣으면 be-gradle.yml 만 고치는 PR 에서
      # realtime 게이트가 안 돌아 «머지해 봐야» 맞는지 안다 (GROMO-1515 와 같은 이유).
      - '.github/workflows/be-gradle.yml'
      - '.github/actions/ci-jar/**'
      - '.github/actions/gar-login/**'
      - '.github/scripts/ci-jar.py'
      - 'server/scripts/docker-compose.realtime.yml'

# 통합 브랜치 푸시가 «겹치지» 않게 한다. 겹치면 늦게 끝난 «옛» 빌드의 배포가 새 배포를 덮어
# 이전 코드로 되돌아간다. 그룹 이름은 data-api-ci 의 것과 달라야 한다
# (같으면 두 파이프라인이 서로를 막는다).
concurrency:
  group: realtime-ci-${{ github.ref }}
  # PR 의 이전 실행은 취소하되, 이미지를 올리는 실행은 중간에 끊지 않는다(data-api-ci 와 같은 규율).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GAR_HOST: asia-northeast3-docker.pkg.dev
  # realtime-cd.dev.yml 의 REALTIME_IMAGE_REPOSITORY 와 같은 경로여야 함 — 어긋나면 「올렸는데 안 뜬다」.
  REALTIME_IMAGE_REPOSITORY: asia-northeast3-docker.pkg.dev/oneorthree2/realtime/realtime

jobs:
  # 배포 전 SM 점검 (GROMO-2224). main push 에서만 SM 을 읽고 PR 에선 아무것도 안 함 — 공개 레포라 PR 에 AWS 자격 금지.
  # 필수 키가 빠졌으면 이미지 빌드 전에 멈춤. legacy + 전 서비스를 한 번에 봄.
  secrets-check:
    name: dev 시크릿 사전 점검
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: main push 아님 — 생략
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: echo "main push 아님 — SM 점검 생략" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: AWS 자격증명 (OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::808715036056:role/gromo-dev-github-actions
          aws-region: ap-northeast-2
          role-session-name: gromo-dev-secrets-check-${{ github.run_id }}
          mask-aws-account-id: true
      - name: 필수 키·금지 키·토큰 규칙 점검
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: .github/scripts/dev-env.sh check

  # `./gradlew build` 한 번이 checkstyle · spotbugs · test · bootJar 를 전부 돈다.
  #
  # Postgres·Redis 를 띄우지 않는다 — 테스트가 Testcontainers 로 직접 띄우고 주소를 빈으로 주입한다.
  # be-gradle.yml 은 이제 호스트 DB 를 아예 띄우지 않는다(GROMO-1793) — data-api 도 필요 없었다.
  build:
    uses: ./.github/workflows/be-gradle.yml
    with:
      service: realtime
      # GROMO-1910: GAR·GCE 메타데이터 의존이 없는 순수 Gradle 검사라 data-api-ci의 test 와 같은
      # 이유로 GitHub-hosted 로 옮긴다(레포 공개 전환으로 분 한도가 없어졌고, self-hosted 는
      # 포크 PR 실행 위험도 있다).
      runs-on: '["ubuntu-latest"]'
      tasks: build
      publish-jar: true
      artifact-name: realtime-test-results
      artifact-path: build/test-results/

  # PR 에서는 «빌드는 되는가»만 보고(푸시 없음), main push 에서는 GAR 에 올린다.
  #
  # 푸시가 필요한 이유: server/scripts/docker-compose.realtime.yml 이 이 이미지를 «받아서» 띄운다.
  # 아무도 올리지 않으면 새 호스트에서 `up` 이 이미지를 못 찾아 컨테이너가 아예 뜨지 않고, 코드가
  # 바뀌어도 배포될 길이 없다. 배포 호스트에는 레포 체크아웃이 없어 거기서 빌드할 수도 없다.
  docker-build:
    name: 채팅 이미지 build${{ github.event_name == 'push' && ' · GAR push' || ' · cache' }}
    # 검증이 끝난 뒤에만 올린다. 이게 없으면 두 잡이 나란히 돌아, 테스트·checkstyle·spotbugs 가
    # 깨진 리비전도 이미지 빌드(bootJar 는 -x test 다)만 성공해 GAR 에 올라간다.
    #
    # GROMO-1910 에서는 「GAR 인증이 GCE 메타데이터를 쓰니 못 옮긴다」고 판단해 남겼는데,
    # 다시 보니 그 인증이 PR 에서 필요한 이유는 «레지스트리 캐시» 하나뿐이었다. 이미지를
    # 올리는 것은 main push 뿐이다(아래 `push:`). 그래서 GROMO-1918 에서 PR 경로의 캐시를
    # type=gha 로 바꾸고 PR 은 GitHub-hosted 로 옮긴다 — push 만 self-hosted 에 남는다.
    needs: [build, secrets-check]
    runs-on: ${{ github.event_name == 'push' && fromJSON('["self-hosted", "ci", "spot"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      image-digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-jar
        with:
          service: realtime
          operation: verify

      # GCE 러너의 SA 메타데이터 토큰으로 로그인 — gcloud 도 키 파일도 필요 없다(data-api-ci 와 같은 방식).
      # push 에서만 돈다: PR 은 캐시를 type=gha 로 쓰므로 레지스트리 로그인이 필요 없고,
      # metadata.google.internal 은 GitHub-hosted 에서 응답하지 않는다 (GROMO-1918).
      - name: GAR 인증
        if: github.event_name == 'push'
        uses: ./.github/actions/gar-login
        with:
          registry: ${{ env.GAR_HOST }}

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: server/realtime
          platforms: linux/amd64
          build-args: JAR_SOURCE=prebuilt
          # PR 이 만든 태그를 배포 신뢰점으로 삼지 않는다 — main push 실행만 올린다(data-api-ci 와 같은 규율).
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          provenance: false
          # :<sha> 만 올림. 움직이는 :latest 는 안 씀 — 배포는 digest, 되돌리기는 REALTIME_IMAGE 로 sha 지정.
          tags: |
            ${{ env.REALTIME_IMAGE_REPOSITORY }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # push 는 GAR 레지스트리 캐시(교차 실행 공유), PR 은 GitHub Actions 캐시.
          cache-from: ${{ github.event_name == 'push' && format('type=registry,ref={0}:cache-amd64', env.REALTIME_IMAGE_REPOSITORY) || 'type=gha,scope=realtime-amd64' }}
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref={0}:cache-amd64,mode=max', env.REALTIME_IMAGE_REPOSITORY) || 'type=gha,scope=realtime-amd64,mode=max' }}

  deploy:
    name: Realtime Dev CD
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
      pull-requests: write # CD 가 배포 결과를 PR 에 표시
      issues: write
    uses: ./.github/workflows/realtime-cd.dev.yml
    with:
      image_digest: ${{ needs.docker-build.outputs.image-digest }}
      image_revision: ${{ github.sha }}
    secrets: inherit
