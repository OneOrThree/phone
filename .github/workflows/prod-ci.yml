# 1.x release 브랜치·Gromo IAM/ECR을 쓰지 않는 2.0 전용 발행 경로.
name: prod-ci
on:
  pull_request:
    branches: [main, release]
    paths:
      - 'server/**'
      - '.github/actions/ci-jar/**'
      - '.github/scripts/ci-jar.py'
      - '.dockerignore'
      - '.github/scripts/focuscat-*'
      - '.github/workflows/prod-ci.yml'
      - '.github/workflows/prod-cd.yml'
      - '.github/scripts/test_focuscat*'
      - '.github/scripts/deployment-badges.py'
      - '.github/workflows/ops-deployment-badges.yml'
      - '.claude/pr-gate.py'
  push:
    branches: [release]
    paths:
      - 'server/**'
      - '.github/actions/ci-jar/**'
      - '.dockerignore'
      - '.github/scripts/**'
      - '.github/workflows/prod-ci.yml'
      - '.github/workflows/prod-cd.yml'
      - '.github/scripts/test_focuscat*'
      - '.github/scripts/deployment-badges.py'
      - '.github/workflows/ops-deployment-badges.yml'
      - '.claude/pr-gate.py'
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: 전체 서비스 강제 재빌드
        type: boolean
        default: false
      version_bump:
        description: 수동 발행 버전 증가 (최초 발행은 2.0.0)
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: read
concurrency:
  group: focuscat-prod-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'PyYAML==6.0.2'
      - run: python3 -m unittest discover -s .github/scripts -p 'test_focuscat*.py' -v
      - run: python3 .claude/pr-gate.py --selftest
  plan:
    needs: contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      INFRA_REVISION: ${{ vars.FOCUSCAT_PROD_INFRA_REVISION }}
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      FORCE_REBUILD: ${{ inputs.rebuild_all || false }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      build_any: ${{ steps.plan.outputs.build_any }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/release'
        with:
          role-to-assume: arn:aws:iam::808715036056:role/focuscat-prod-publish
          aws-region: ap-northeast-2
      - id: plan
        env:
          READ_PROD: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/release' }}
        run: |
          set -euo pipefail
          args=(--output prod-plan.json)
          if [ "$READ_PROD" = true ]; then
            [[ "$INFRA_REVISION" =~ ^[0-9a-f]{40}$ ]]
            args+=(--previous-from-aws)
          fi
          if [ -n "$PR_BASE" ]; then args+=(--pr-base "$PR_BASE"); fi
          if [ "$FORCE_REBUILD" = true ]; then args+=(--force); fi
          python3 .github/scripts/focuscat-plan.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: focuscat-prod-plan
          path: prod-plan.json
          if-no-files-found: error
          overwrite: true

  images:
    needs: [contracts, plan]
    if: needs.plan.outputs.build_any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: 서비스 전용 Gradle 홈
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-${{ matrix.service }}" >> "$GITHUB_ENV"
      - name: Business PDF 도구 이미지
        if: matrix.service == 'business-api'
        run: docker build --target test -t focuscat-business-test server/business-api
      - name: Business 실제 검사
        if: matrix.service == 'business-api'
        run: |
          mkdir -p "$GRADLE_USER_HOME"
          docker run --rm --network host --user "$(id -u):$(id -g)" \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$GRADLE_USER_HOME:/gradle" \
            -e GRADLE_USER_HOME=/gradle -e SPRING_PROFILES_ACTIVE=ci \
            -e TESTCONTAINERS_HOST_OVERRIDE=127.0.0.1 \
            -w "$GITHUB_WORKSPACE/server/business-api" focuscat-business-test ./gradlew build --no-daemon
      - name: JVM 서비스 실제 검사
        if: matrix.service != 'business-api'
        env:
          SPRING_PROFILES_ACTIVE: ci
        working-directory: server/${{ matrix.service }}
        run: ./gradlew build --no-daemon
      - uses: ./.github/actions/ci-jar
        with:
          service: ${{ matrix.service }}
          operation: pack
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: FocusCat 발행 역할 (PR 제외)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/release'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::808715036056:role/focuscat-prod-publish
          aws-region: ap-northeast-2
      - uses: aws-actions/amazon-ecr-login@v2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/release'
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: server/${{ matrix.service }}
          build-args: JAR_SOURCE=prebuilt
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/release' }}
          provenance: false
          tags: 808715036056.dkr.ecr.ap-northeast-2.amazonaws.com/focuscat-prod/${{ matrix.service }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=focuscat-prod-${{ matrix.service }}
          cache-to: type=gha,scope=focuscat-prod-${{ matrix.service }},mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: 이미지 계약 기록
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/release'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SERVICE: ${{ matrix.service }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          service = os.environ['SERVICE']
          pathlib.Path(service + '.json').write_text(json.dumps({
              'revision': os.environ['GITHUB_SHA'], 'platform': 'linux/arm64',
              'image': f"808715036056.dkr.ecr.ap-northeast-2.amazonaws.com/focuscat-prod/{service}@{os.environ['IMAGE_DIGEST']}"}))
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/release'
        with:
          name: focuscat-${{ matrix.service }}-digest
          path: ${{ matrix.service }}.json
          if-no-files-found: error

  release:
    needs: [contracts, plan, images]
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/release' &&
      needs.contracts.result == 'success' && needs.plan.result == 'success' &&
      needs.plan.outputs.any == 'true' && (needs.images.result == 'success' || needs.images.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    env:
      INFRA_REVISION: ${{ vars.FOCUSCAT_PROD_INFRA_REVISION }}
    steps:
      - name: 고정 Infra 버전 확인
        run: '[[ "$INFRA_REVISION" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: focuscat-prod-plan
          path: plan-input
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.build_any == 'true'
        with:
          pattern: focuscat-*-digest
          merge-multiple: true
          path: image-descriptors
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::808715036056:role/focuscat-prod-publish
          aws-region: ap-northeast-2
      - name: 불변 릴리스 생성·업로드
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.version_bump || '' }}
        run: |
          set -euo pipefail
          release_id="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          version_args=(--revision "$GITHUB_SHA")
          if [ -n "$BUMP_OVERRIDE" ]; then version_args+=(--bump "$BUMP_OVERRIDE"); fi
          version=$(python3 .github/scripts/focuscat-version.py "${version_args[@]}")
          bucket=$(aws secretsmanager get-secret-value --secret-id focuscat/prod/cicd \
            --query SecretString --output text | jq -er '.DEPLOY_BUCKET')
          [[ "$bucket" == focuscat-prod-deploy-artifacts-* ]]
          mkdir -p infra-config
          for file in configuration.zip configuration.json; do
            aws s3api get-object --bucket "$bucket" --key "configurations/$INFRA_REVISION/$file" "infra-config/$file" >/dev/null
          done
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, re, zipfile
          root = pathlib.Path('infra-config')
          metadata = json.loads((root / 'configuration.json').read_text())
          assert metadata['product'] == 'focuscat' and metadata['infra_revision'] == os.environ['INFRA_REVISION']
          assert re.fullmatch('[0-9a-f]{64}', metadata['sha256'])
          assert hashlib.sha256((root / 'configuration.zip').read_bytes()).hexdigest() == metadata['sha256']
          with zipfile.ZipFile(root / 'configuration.zip') as archive:
              names = archive.namelist()
              assert len(names) == len(set(names)) and set(names) == set(metadata['files'])
              for name in names:
                  assert pathlib.PurePosixPath(name).name == name and name not in {'.', '..'}
                  content = archive.read(name)
                  assert hashlib.sha256(content).hexdigest() == metadata['files'][name]
                  (root / name).write_bytes(content)
          PYTHON
          mkdir -p image-descriptors
          python3 infra-config/release.py --source-root "$GITHUB_WORKSPACE" --descriptors image-descriptors \
            --output release-output --revision "$GITHUB_SHA" --release-id "$release_id" --infra-revision "$INFRA_REVISION" --version "$version" --plan-file plan-input/prod-plan.json
          for file in bundle.zip release.json; do
            aws s3api put-object --bucket "$bucket" --key "releases/$release_id/$file" \
              --body "release-output/$file" --if-none-match '*' >/dev/null
          done
          # 같은 버전의 부분 발행이 있으면 기존 릴리스로 마무리한다. 다른 소스/Infra는 거부한다.
          if aws s3api head-object --bucket "$bucket" --key "versions/$version.json" >/dev/null 2>&1; then
            aws s3api get-object --bucket "$bucket" --key "versions/$version.json" release-output/version.json >/dev/null
            jq -e --arg sha "$GITHUB_SHA" --arg infra "$INFRA_REVISION" --arg version "$version" \
              '.source_revision == $sha and .infra_revision == $infra and .version == $version' release-output/version.json >/dev/null
          else
            cp release-output/release.json release-output/version.json
            aws s3api put-object --bucket "$bucket" --key "versions/$version.json" \
              --body release-output/version.json --if-none-match '*' >/dev/null
          fi
          release_id=$(jq -er '.release_id' release-output/version.json)
          [[ "$release_id" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          aws s3api get-object --bucket "$bucket" --key "releases/$release_id/bundle.zip" release-output/selected.zip >/dev/null
          python3 - <<'PYTHON'
          import hashlib, json, pathlib, sys, zipfile
          sys.path.insert(0, 'infra-config')
          import release
          envelope = json.loads(pathlib.Path('release-output/version.json').read_text())
          if hashlib.sha256(pathlib.Path('release-output/selected.zip').read_bytes()).hexdigest() != envelope['bundle_sha256']:
              raise ValueError('릴리스 checksum 불일치')
          with zipfile.ZipFile('release-output/selected.zip') as archive:
              manifest = json.loads(archive.read('manifest.json'))
          release.validate(manifest)
          for key in ['release_id', 'version', 'source_revision', 'infra_revision']:
              if envelope[key] != manifest[key]:
                  raise ValueError('버전 참조와 릴리스 불일치')
          pathlib.Path('release-output/images.tsv').write_text(''.join(f'{service}\t{image}\n' for service, image in sorted(manifest['images'].items())))
          PYTHON
          while IFS=$'\t' read -r service image; do
            repository="focuscat-prod/$service"
            expected="${image##*@}"
            existing=$(aws ecr batch-get-image --repository-name "$repository" --image-ids "imageTag=$version" --query 'images[0].imageId.imageDigest' --output text)
            if [ "$existing" = None ]; then
              manifest=$(aws ecr batch-get-image --repository-name "$repository" --image-ids "imageDigest=$expected" --query 'images[0].imageManifest' --output text)
              test "$manifest" != None
              aws ecr put-image --repository-name "$repository" --image-tag "$version" --image-digest "$expected" --image-manifest "$manifest" >/dev/null
            else
              test "$existing" = "$expected"
            fi
          done < release-output/images.tsv
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$version" "$GITHUB_SHA" -m "FocusCat $version / $release_id / Infra $INFRA_REVISION"
          git push origin "refs/tags/$version"
          echo "- 버전: $version" >> "$GITHUB_STEP_SUMMARY"
          echo "Infra 구성: $INFRA_REVISION" >> "$GITHUB_STEP_SUMMARY"
          echo "FocusCat 릴리스: $release_id (배포는 별도 승인)" >> "$GITHUB_STEP_SUMMARY"
