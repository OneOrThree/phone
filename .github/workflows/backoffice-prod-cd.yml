name: Backoffice Production Deploy
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '배포 또는 롤백할 기존 backoffice-vX.Y.Z 릴리스'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: backoffice-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: backoffice-production
      url: https://backoffice.oneorthree.world
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_BUCKET: ${{ vars.BACKOFFICE_RELEASE_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate trusted release ref
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'backoffice-v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)', os.environ['RELEASE_TAG'])
          assert os.environ['RELEASE_BUCKET'] == 'catus-backoffice-prod-backups-808715036056'
          PY
          git fetch origin main
          git merge-base --is-ancestor "$RELEASE_TAG^{commit}" origin/main
          echo "SOURCE_SHA=$(git rev-parse "$RELEASE_TAG^{commit}")" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::808715036056:role/catus-backoffice-deploy
          aws-region: ap-northeast-2
      - name: Verify immutable manifest and tag
        run: |
          aws s3api get-object --bucket "$RELEASE_BUCKET" --key "releases/$RELEASE_TAG.json" backoffice-release.json
          python3 - <<'PY'
          import json, os
          assert json.load(open('backoffice-release.json'))['commit'] == os.environ['SOURCE_SHA'], '릴리스 태그 이동 또는 manifest 소스 불일치'
          PY
      - name: Deploy or resume pinned SSM command
        run: python3 .github/scripts/backoffice-release.py deploy --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backoffice-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: backoffice-release.json
          if-no-files-found: ignore
      - name: Deployment summary
        if: always()
        env:
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          echo "릴리스: $RELEASE_TAG / 실행 결과: $DEPLOY_STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo '롤백은 이전 릴리스 태그로 새 실행합니다. 응답 유실은 같은 실행을 재실행하여 기존 SSM 명령을 확인합니다. 실패 시 공개 nginx가 차단될 수 있으므로 복구 상태를 확인하세요.' >> "$GITHUB_STEP_SUMMARY"
