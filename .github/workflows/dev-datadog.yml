name: Dev Datadog (APM + Observability)

# Datadog Agent + APM 을 dev(self-hosted) 서버에 수동으로 올린다.
# 앱 배포(dev-cd.yml)와 분리한다. DB/app 시크릿은 checkout 밖의 동일 runtime env를 재사용하고,
# DD_API_KEY만 GitHub Actions 시크릿으로 필요한 compose step에 주입한다.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "동작 (up: 기동/갱신+APM 활성, restart: 재시작, down: Datadog 제거+app 평문 복원)"
        type: choice
        required: true
        default: up
        options: [up, restart, down]

# dev-cd.yml 과 동일 그룹 — 둘 다 같은 dev 호스트의 phone-app 을 (compose 입력만 다르게) 재생성하므로,
# 수동 Datadog 토글과 push 배포가 겹쳐 서로의 app 상태(APM 활성 여부)·헬스결과를 무효화하지 않도록 직렬화한다.
concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  datadog:
    runs-on: [self-hosted, dev]
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RUNTIME_ENV_FILE: ${{ github.workspace }}/../.gromo-runtime/dev.env
      GAR_HOST: asia-northeast3-docker.pkg.dev
      DD_SITE: us5.datadoghq.com
    steps:
      - uses: actions/checkout@v4

      - name: 배포된 앱 이미지 확인 및 GAR 인증
        if: ${{ inputs.action != 'down' }}
        env:
          # checkout에는 노출하지 않고 compose가 runtime env를 파싱하는 shell step에만 주입한다.
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: |
          set -euo pipefail
          test -s "$RUNTIME_ENV_FILE"
          test -n "$DD_API_KEY"
          APP_IMAGE_REF=$(docker compose --env-file "$RUNTIME_ENV_FILE" \
            -f server/scripts/docker-compose.dev.yml config --format json | jq -er '.services.app.image')
          curl --fail --silent --show-error -H "Metadata-Flavor: Google" \
            "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token" \
          | jq -er .access_token \
          | docker login -u oauth2accesstoken --password-stdin "$GAR_HOST"
          docker pull "$APP_IMAGE_REF"
          APP_IMAGE_DIGEST=$(docker image inspect "$APP_IMAGE_REF" --format '{{json .RepoDigests}}' \
            | jq -er --arg prefix "$GAR_HOST/" 'map(select(startswith($prefix))) | first')
          IMAGE_REVISION=$(docker image inspect "$APP_IMAGE_REF" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          test -n "$APP_IMAGE_DIGEST"
          test -n "$IMAGE_REVISION"
          test "$IMAGE_REVISION" != '<no value>'
          {
            echo "APP_IMAGE=$APP_IMAGE_DIGEST"
            echo "IMAGE_VERSION=$IMAGE_REVISION"
            echo "IMAGE_REVISION=$IMAGE_REVISION"
          } >> "$GITHUB_ENV"

      - name: Datadog 스택 ${{ inputs.action }}
        env:
          # checkout에는 노출하지 않고 compose를 실행하는 shell step에만 주입한다.
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: |
          set -euo pipefail
          compose=(docker compose --env-file "$RUNTIME_ENV_FILE" \
            -f server/scripts/docker-compose.dev.yml -f server/scripts/docker-compose.datadog.yml)
          case "${{ inputs.action }}" in
            up)
              # CD가 배포한 실제 digest를 pull한 뒤 같은 이미지에 APM overlay만 적용한다.
              "${compose[@]}" pull datadog-agent
              "${compose[@]}" up -d datadog-agent app
              ;;
            restart)
              "${compose[@]}" restart datadog-agent app
              ;;
            down)
              # Datadog Agent 제거 후, app 을 dev 파일 단독으로 재생성 → 평문(javaagent 없음) 복원
              docker rm -f gromo-datadog-agent 2>/dev/null || true
              docker compose --env-file "$RUNTIME_ENV_FILE" -f server/scripts/docker-compose.dev.yml up -d app
              ;;
          esac

      - name: 상태 확인
        if: ${{ inputs.action != 'down' }}
        env:
          # docker compose가 overlay를 파싱할 때 필요하므로 확인 step에도 같은 최소 범위로 주입한다.
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: |
          set -euo pipefail
          compose=(docker compose --env-file "$RUNTIME_ENV_FILE" \
            -f server/scripts/docker-compose.dev.yml -f server/scripts/docker-compose.datadog.yml)
          "${compose[@]}" ps
          echo "== app 헬스체크 (APM -javaagent 기동 실패 조기 탐지) =="
          # 60초(12회)로는 `up --build` + -javaagent 콜드스타트를 못 기다려, 정상 기동한 7/16·7/24 실행이
          # 둘 다 failure 로 표시됐다(트레이서는 붙었는데 워크플로만 빨간불 → "Datadog 안 켜졌다" 오독).
          # dev-cd.yml 과 같은 운영 계약으로 -javaagent 콜드스타트를 최대 300초 기다린다. (GROMO-1233)
          ok=0
          for i in $(seq 1 60); do
            sleep 5
            if curl -sf http://localhost:8080/health >/dev/null; then ok=1; echo "app OK"; break; fi
            echo "대기... ($((i*5))s)"
          done
          if [ "$ok" != 1 ]; then
            echo "app 헬스체크 실패 — APM(-javaagent) 기동 확인 필요"
            "${compose[@]}" logs --tail=50 app
            exit 1
          fi
          echo "== agent status (요약) =="
          docker exec gromo-datadog-agent agent status 2>/dev/null | grep -iE "API Keys|Logs Agent|APM Agent|openmetrics" -A1 || true

      # 수집이 실제로 되고 있는지 어서션 (GROMO-1489).
      # 이전 버전은 위 grep 을 `|| true` 로 흘려보내기만 해서, Agent 가 살아 있고 배선도 맞는데 컨테이너
      # 로그가 2일간 0건인 상태를 아무도 몰랐다(워크플로는 계속 초록불). 배선이 붙었다 ≠ 수집이 된다.
      # 실패가 아니라 경고로 두는 항목이 있는 이유: 방금 재기동한 직후라 표본이 아직 안 쌓였을 수 있다.
      - name: 수집 검증 (로그·컨테이너·OpenMetrics)
        if: ${{ inputs.action != 'down' }}
        run: |
          set -uo pipefail

          # `agent status` 사람용 출력을 grep 하지 않고 -j(JSON)를 파싱한다. 사람용 출력은 Agent 버전에
          # 따라 문구가 바뀌는데, "패턴이 매치되면 실패" 방식은 문구가 바뀌면 아무것도 매치되지 않아
          # 조용히 초록불이 된다 — 이 스텝이 막으려는 실패 양상이 그대로 재발하는 구조다.
          #
          # 이 스텝의 설계 원칙: **부재를 통과로 해석하지 않는다.**
          # "에러가 있으면 실패"만 검사하면, 대상이 아예 없을 때(체크 미등록·인스턴스 부재) 필터가 빈
          # 결과를 내고 조용히 통과한다. 그래서 아래는 에러 검사와 **존재 검사**를 항상 짝으로 둔다.
          snapshot() {
            docker exec gromo-datadog-agent agent status -j 2>/dev/null > "$1" || true
            jq -e . "$1" >/dev/null 2>&1
          }

          if ! snapshot /tmp/dd-before.json; then
            echo "::error::agent status -j 가 유효한 JSON 을 주지 않음 — Agent 기동/버전 확인"
            exit 1
          fi

          # 대기 구간에 **반드시 로그가 나오도록** 프로브 컨테이너를 띄운다.
          # 이게 없으면 dev 저트래픽 구간(앱이 idle 이고 /health 는 로그를 안 남긴다)에 아무 컨테이너도
          # stdout 을 내지 않아, tailer 가 멀쩡해도 증가량 0 → false failure 가 된다.
          # 프로브가 있으면 "로그가 났는데 안 잡힘"만 실패로 남아 판정이 tailer 상태만 반영한다.
          # container_collect_all 대상이 되도록 DD_CONTAINER_EXCLUDE 에 없는 이름을 쓴다.
          # 프로브가 못 뜨면 증가량 판정의 전제가 깨진다 — 그대로 진행하면 정상 tailer 를 "증가 없음"으로
          # 실패시키는 false failure 가 된다. 경고 후 계속 가지 않고 여기서 멈춘다:
          # 검증 전제를 세우지 못했으면 통과도 실패도 아니라 '검증 불가'이고, 그걸 통과로 흘리면
          # 이 스텝 전체가 의미를 잃는다.
          docker rm -f dd-collection-probe >/dev/null 2>&1 || true
          if ! docker run -d --rm --name dd-collection-probe alpine:3.20 \
                 sh -c 'i=0; while [ $i -lt 14 ]; do echo "GROMO-1489 collection probe $i"; i=$((i+1)); sleep 5; done' >/dev/null 2>&1; then
            echo "::error::프로브 컨테이너를 띄우지 못했습니다(alpine:3.20 pull 실패·자원 부족 등) — 로그 수집 검증의 전제를 세울 수 없어 중단합니다"
            exit 1
          fi

          echo "수집 표본이 쌓이도록 60초 대기..."
          sleep 60

          if ! snapshot /tmp/dd-after.json; then
            docker rm -f dd-collection-probe >/dev/null 2>&1 || true
            echo "::error::대기 후 agent status -j 실패 — Agent 가 죽었을 수 있음"
            exit 1
          fi
          docker rm -f dd-collection-probe >/dev/null 2>&1 || true

          fail=0

          # 0) 스키마 가드 — 아래 검증이 참조하는 경로가 사라졌으면 통과시키지 말고 멈춘다.
          #    before/after 둘 다 검사한다. after 만 보면, before 쪽 값이 `null` 일 때 `jq -r` 이 에러 없이
          #    문자열 "null" 을 돌려주고 `${before:-0}` 는 (unset/빈 문자열이 아니므로) 발동하지 않아
          #    `[ 5 -le null ]` 같은 잘못된 비교가 된다. `-e` 가 없으니 스크립트는 죽지 않고 `[` 의 비정상
          #    종료가 if 문맥에서 그냥 "거짓"이 되어 조용히 통과한다 — 이 스텝이 막으려는 바로 그 패턴이다.
          # 존재만 보지 않고 **타입까지** 본다. `jq -e '.a.b'` 는 값이 있기만 하면 참이라, Agent 갱신으로
          # LogsProcessed 가 객체 같은 다른 타입이 되면 가드를 통과한 뒤 `[ 5 -le {...} ]` 가 되어 비교가
          # 에러로 죽고, if 문맥에서 그냥 "거짓"이 되어 로그 판정을 통째로 건너뛴 채 통과한다.
          # tonumber 는 현재 값(문자열 "173")은 그대로 통과시키고 숫자로 못 바꾸는 타입만 걸러낸다.
          for f in /tmp/dd-before.json /tmp/dd-after.json; do
            for expr in '.logsStats.metrics.LogsProcessed | tonumber' \
                        '.agent_start_nano | tonumber' \
                        '.runnerStats.Checks | type == "object"'; do
              if ! jq -e "$expr" "$f" >/dev/null 2>&1; then
                echo "::error::agent status JSON 스키마 변경 — $f 에서 [$expr] 실패. 이 스텝의 파싱을 갱신해야 한다"
                fail=1
              fi
            done
          done
          [ "$fail" -eq 0 ] || exit 1

          # 1) 컨테이너 로그 — **누적값이 아니라 대기 구간의 증가량**을 본다.
          #    `up` 은 설정이 그대로면 기존 datadog-agent 를 재시작하지 않으므로, LogsProcessed 는 과거
          #    누적이 남아 양수일 수 있다. 그러면 지금 tailer 가 끊겨 있어도 "0 아님"으로 통과해 버린다.
          #    위 가드를 통과해도 필터에 `// 0` 을 둔다 — 가드와 판정이 각자 안전하도록(이중 방어).
          before=$(jq -r '.logsStats.metrics.LogsProcessed // 0' /tmp/dd-before.json)
          after=$(jq -r '.logsStats.metrics.LogsProcessed // 0' /tmp/dd-after.json)
          s_before=$(jq -r '.agent_start_nano // 0' /tmp/dd-before.json)
          s_after=$(jq -r '.agent_start_nano // 0' /tmp/dd-after.json)
          echo "LogsProcessed: ${before} -> ${after} (agent_start ${s_before} -> ${s_after})"

          if [ "$s_before" != "$s_after" ]; then
            # 대기 중 Agent 가 재시작돼 카운터가 리셋됐다 — 증가량 대신 현재 값으로 판정한다.
            echo "  (대기 중 Agent 재시작 감지 — 누적값 리셋되었으므로 현재값으로 판정)"
            [ "${after:-0}" -gt 0 ] 2>/dev/null || { echo "::error::재시작 후 로그 수집 0건"; fail=1; }
          elif [ "${after:-0}" -le "${before:-0}" ] 2>/dev/null; then
            echo "::error::60초 동안 처리된 로그가 늘지 않음 — tailer 가 끊겼습니다. DD_LOGS_CONFIG_DOCKER_CONTAINER_USE_FILE 와 /var/lib/docker/containers 마운트를 확인하세요"
            fail=1
          fi

          # 활성 로그 소스 자체가 하나도 없으면 위 판정과 별개로 실패 (부재 = 통과 방지)
          src_count=$(jq -r '[.logsStats.integrations[]?.sources[]?] | length' /tmp/dd-after.json)
          echo "활성 로그 소스: ${src_count}개"
          if [ "${src_count:-0}" -eq 0 ] 2>/dev/null; then
            echo "::error::로그 소스가 하나도 등록되지 않음 — container_collect_all 자동탐지 실패"
            fail=1
          else
            jq -r '.logsStats.integrations[]?.sources[]? | "  source=\(.type) status=\(.status) \(.messages // [] | join(" / "))"' /tmp/dd-after.json || true
          fi

          # 2) 컨테이너별 메트릭 — 체크가 **등록되어 있고** 에러가 없어야 한다.
          #    docker.sock 권한 문제나 Autodiscovery 초기화 실패면 체크가 아예 안 잡히는데,
          #    에러만 검사하면 그 경우가 빈 결과 → 통과로 새어나간다.
          cnt=$(jq -r '[.runnerStats.Checks.container // {}, .runnerStats.Checks.docker // {}]
                       | map(to_entries | length) | add' /tmp/dd-after.json)
          echo "container/docker 체크 인스턴스: ${cnt}개"
          if [ "${cnt:-0}" -eq 0 ] 2>/dev/null; then
            echo "::error::container/docker 체크가 하나도 등록되지 않음 — docker.sock 마운트·권한 또는 Autodiscovery 초기화 실패"
            fail=1
          fi

          # 등록·무에러만으로는 부족하다 — **이 PR 이 고치려는 원래 장애가 정확히 이 상태였다.**
          # 실측 당시 dev 의 container 체크는 [OK] 이면서 Metric Samples: Last Run 0, Total 0 이었다
          # (workloadmeta 가 비어 스크레이프할 컨테이너를 못 찾음). 그래서 샘플이 실제로 늘어나는지 본다.
          # ⚠️ 합산하면 안 된다(codex 리뷰). container 와 docker 를 더하면 docker 만 샘플을 내고
          #    container 가 0 인 상태에서도 합계가 늘어 통과한다 — **복구 대상이 바로 container** 라
          #    그 0 건이 docker 샘플에 가려진다. 그래서 체크별로 따로 본다.
          samples() {   # $1=json  $2=체크 이름
            jq -r --arg k "$2" '[.runnerStats.Checks[$k] // {} | to_entries[]
                                 | .value.TotalMetricSamples // 0] | add // 0' "$1"
          }
          for chk in container docker; do
            b=$(samples /tmp/dd-before.json "$chk")
            a=$(samples /tmp/dd-after.json "$chk")
            n=$(jq -r --arg k "$chk" '.runnerStats.Checks[$k] // {} | to_entries | length' /tmp/dd-after.json)
            echo "${chk} 체크: 인스턴스 ${n}개, 메트릭 샘플 ${b} -> ${a}"

            if [ "${n:-0}" -eq 0 ] 2>/dev/null; then
              # container 는 복구 대상이라 부재 자체가 실패다. docker 는 보조 지표라 경고만 남긴다.
              if [ "$chk" = container ]; then
                echo "::error::container 체크가 등록되지 않음 — workloadmeta/Autodiscovery 초기화 실패"
                fail=1
              else
                echo "  (docker 체크 미등록 — container 가 살아 있으면 치명적이지 않다)"
              fi
              continue
            fi

            if [ "$s_before" = "$s_after" ] && [ "${a:-0}" -le "${b:-0}" ] 2>/dev/null; then
              echo "::error::60초 동안 ${chk} 메트릭 샘플이 늘지 않음 — 체크는 등록됐지만 수집이 비어 있습니다(원래 장애와 같은 상태). workloadmeta/docker API 응답을 확인하세요"
              fail=1
            elif [ "${a:-0}" -eq 0 ] 2>/dev/null; then
              echo "::error::${chk} 메트릭 샘플 0건"
              fail=1
            fi
          done
          errs=$(jq -r '.runnerStats.Checks | to_entries[]
                        | select(.key == "container" or .key == "docker")
                        | .value | to_entries[]
                        | select((.value.LastError // "") != "")
                        | "  \(.value.CheckName): \(.value.LastError)"' /tmp/dd-after.json)
          if [ -n "$errs" ]; then
            echo "::error::container/docker 체크 에러 — docker API 응답 지연(호스트 부하) 가능. DD_DOCKER_QUERY_TIMEOUT 확인"
            echo "$errs"
            fail=1
          fi

          # 3) OpenMetrics 브리지 — app 이미지 AD 라벨(server/data-api/Dockerfile)에만 의존하므로, 라벨이 인식되지
          #    않으면 인스턴스 자체가 나타나지 않는다. 정적 마운트를 없앤 대가라 **에러가 아니라 부재가
          #    기본 실패 양상**이다. 그래서 "에러 없는 인스턴스가 1개 이상 존재"를 직접 요구한다.
          #    app 헬스체크를 통과한 뒤라 이 시점엔 스크레이프가 붙어 있어야 정상이다.
          om_ok=$(jq -r '[.runnerStats.Checks.openmetrics // {} | to_entries[]
                          | select((.value.LastError // "") == "")] | length' /tmp/dd-after.json)
          om_err=$(jq -r '.runnerStats.Checks.openmetrics // {} | to_entries[]
                          | select((.value.LastError // "") != "")
                          | "  \(.value.CheckName): \(.value.LastError)"' /tmp/dd-after.json)
          om_samples() {
            jq -r '[.runnerStats.Checks.openmetrics // {} | to_entries[]
                    | .value.TotalMetricSamples // 0] | add // 0' "$1"
          }
          om_smp_before=$(om_samples /tmp/dd-before.json)
          om_smp_after=$(om_samples /tmp/dd-after.json)
          echo "OpenMetrics 정상 인스턴스: ${om_ok}개 · 샘플 ${om_smp_before} -> ${om_smp_after}"
          if [ "${om_ok:-0}" -eq 0 ] 2>/dev/null; then
            echo "::error::OpenMetrics 정상 인스턴스 없음 — 커스텀 메트릭(RED·HikariCP·JVM)이 수집되지 않습니다."
            echo "  확인: app 이미지에 com.datadoghq.ad.checks 라벨이 있는지(구 이미지 롤백 여부), app:9091/actuator/prometheus 도달 여부"
            [ -z "$om_err" ] || echo "$om_err"
            fail=1
          elif [ -n "$om_err" ]; then
            echo "::warning::일부 OpenMetrics 인스턴스가 실패 중"
            echo "$om_err"
          fi

          # 인스턴스가 에러 없이 등록돼도 샘플이 0일 수 있다 — 엔드포인트는 200 인데 server/data-api/Dockerfile 의
          # metrics 허용 목록이 실제 메트릭 이름과 안 맞는 경우다(Micrometer 이름 변경, 패턴 오타).
          # 이 PR 이 그 목록을 conf.yaml 에서 이미지 라벨로 옮겼으므로 오타 시 정확히 이 상태가 된다.
          if [ "${om_ok:-0}" -gt 0 ] 2>/dev/null; then
            if [ "$s_before" = "$s_after" ] && [ "${om_smp_after:-0}" -le "${om_smp_before:-0}" ] 2>/dev/null; then
              echo "::error::OpenMetrics 샘플이 늘지 않음 — 스크레이프는 되는데 수집된 메트릭이 없습니다. server/data-api/Dockerfile 의 metrics 허용 목록이 실제 메트릭 이름과 맞는지 확인하세요(카운터는 _total 접미사를 뗀 이름으로 매칭)"
              fail=1
            elif [ "${om_smp_after:-0}" -eq 0 ] 2>/dev/null; then
              echo "::error::OpenMetrics 샘플 0건 — metrics 허용 목록과 실제 메트릭 이름 불일치 가능"
              fail=1
            fi
          fi

          [ "$fail" -eq 0 ] || { echo "수집 검증 실패 — 위 오류 참고"; exit 1; }
          echo "수집 검증 통과"
