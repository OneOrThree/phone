name: Dev Datadog (APM + Observability)

# Datadog Agent + APM 을 dev(self-hosted) 서버에 수동으로 올린다.
# dev-monitor.yml 과 동일한 self-hosted 러너·OIDC·Secrets Manager 재사용. 앱 배포(cd.yml)와 분리.
# DD_API_KEY 만 GitHub Actions 시크릿, DB/app 시크릿은 신 AWS 계정의 gromo/dev/env 에서 로드(compose 보간용).
on:
  workflow_dispatch:
    inputs:
      action:
        description: '동작 (up: 기동/갱신+APM 활성, restart: 재시작, down: Datadog 제거+app 평문 복원)'
        type: choice
        required: true
        default: up
        options: [up, restart, down]

# cd.yml 과 동일 그룹 — 둘 다 같은 dev 호스트의 phone-app 을 (compose 입력만 다르게) 재생성하므로,
# 수동 Datadog 토글과 push 배포가 겹쳐 서로의 app 상태(APM 활성 여부)·헬스결과를 무효화하지 않도록 직렬화한다.
concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  datadog:
    runs-on: [self-hosted, dev]
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    env:
      COMPOSE_FILES: -f docker-compose.dev.yml -f docker-compose.datadog.yml
      DD_SITE: us5.datadoghq.com
      IMAGE_TAG: ${{ github.sha }}            # DD_VERSION 으로 전달 — up --build 가 빌드한 커밋과 APM 버전 일치
    steps:
      - uses: actions/checkout@v4

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::808715036056:role/gromo-dev-github-actions
          aws-region: ap-northeast-2

      - name: AWS Secrets Manager에서 시크릿 로드
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id gromo/dev/env \
            --region ap-northeast-2 \
            --query SecretString --output text)
          # compose 보간용 DB/app 시크릿 (app·db 서비스가 참조)
          echo "POSTGRES_DB=$(echo $SECRET | jq -r '.POSTGRES_DB')" >> $GITHUB_ENV
          echo "POSTGRES_USER=$(echo $SECRET | jq -r '.POSTGRES_USER')" >> $GITHUB_ENV
          echo "POSTGRES_PASSWORD=$(echo $SECRET | jq -r '.POSTGRES_PASSWORD')" >> $GITHUB_ENV
          echo "JWT_SECRET=$(echo $SECRET | jq -r '.JWT_SECRET')" >> $GITHUB_ENV
          echo "GOOGLE_CLIENT_ID=$(echo $SECRET | jq -r '.GOOGLE_CLIENT_ID')" >> $GITHUB_ENV
          echo "APPLE_CLIENT_ID=$(echo $SECRET | jq -r '.APPLE_CLIENT_ID')" >> $GITHUB_ENV
          echo "FCM_PROJECT_ID=$(echo $SECRET | jq -r '.FCM_PROJECT_ID')" >> $GITHUB_ENV
          echo "FCM_SERVICE_ACCOUNT_JSON=$(echo $SECRET | jq -r '.FCM_SERVICE_ACCOUNT_JSON')" >> $GITHUB_ENV
          # 누끼 유해 이미지 모더레이션 (GROMO-1048) — 이 워크플로도 app 을 재기동하므로 키가 비지 않게 함께 로드
          echo "OPENAI_API_KEY=$(echo $SECRET | jq -r '.OPENAI_API_KEY')" >> $GITHUB_ENV
          # DD_API_KEY는 아래 compose step env, DD_SITE는 job env에서 주입 — 여기서 로드하지 않음.

      - name: Datadog 스택 ${{ inputs.action }}
        env:
          # checkout·AWS OIDC action에는 노출하지 않고 compose를 실행하는 shell step에만 주입한다.
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: |
          set -euo pipefail
          case "${{ inputs.action }}" in
            up)
              # datadog-agent 기동 + app 을 APM overlay 로 재생성(-javaagent 활성)
              # --build: 브랜치 Dockerfile 로 app 재빌드 → dd-java-agent.jar 포함 보장(구 이미지엔 jar 없어 -javaagent 기동 실패)
              docker compose $COMPOSE_FILES up -d --build datadog-agent app
              ;;
            restart)
              docker compose $COMPOSE_FILES restart datadog-agent app
              ;;
            down)
              # Datadog Agent 제거 후, app 을 dev 파일 단독으로 재생성 → 평문(javaagent 없음) 복원
              docker compose $COMPOSE_FILES rm -sf datadog-agent
              docker compose -f docker-compose.dev.yml up -d app
              ;;
          esac

      - name: 상태 확인
        if: ${{ inputs.action != 'down' }}
        env:
          # docker compose가 overlay를 파싱할 때 필요하므로 확인 step에도 같은 최소 범위로 주입한다.
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: |
          docker compose $COMPOSE_FILES ps
          echo "== app 헬스체크 (APM -javaagent 기동 실패 조기 탐지) =="
          # 60초(12회)로는 `up --build` + -javaagent 콜드스타트를 못 기다려, 정상 기동한 7/16·7/24 실행이
          # 둘 다 failure 로 표시됐다(트레이서는 붙었는데 워크플로만 빨간불 → "Datadog 안 켜졌다" 오독).
          # cd.yml 이 같은 이유로 150초까지 늘린 선례가 있고(GROMO-1068), 여기는 빌드까지 겸하므로 180초. (GROMO-1233)
          ok=0
          for i in $(seq 1 36); do
            sleep 5
            if curl -sf http://localhost:8080/health >/dev/null; then ok=1; echo "app OK"; break; fi
            echo "대기... ($((i*5))s)"
          done
          if [ "$ok" != 1 ]; then
            echo "app 헬스체크 실패 — APM(-javaagent) 기동 확인 필요"
            docker compose $COMPOSE_FILES logs --tail=50 app
            exit 1
          fi
          echo "== agent status (요약) =="
          docker exec gromo-datadog-agent agent status 2>/dev/null | grep -iE "API Keys|Logs Agent|APM Agent|openmetrics" -A1 || true
