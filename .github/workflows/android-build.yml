name: Android Checks

# 안드로이드 네이티브 검사 (GROMO-1602)
#
# lint.yml 은 ESLint·Prettier·tsc·jest 만 돈다 — **Kotlin·Gradle·매니페스트·리소스가 깨져도
# PR 은 전부 초록이고, 로컬에서 빌드해 본 사람만 안다.** 2026-08-18 집중 실드 작업에서
# Kotlin 컴파일 에러와 XML 주석 오류(`--` 를 주석 안에 넣어 리소스 파싱 실패)가 둘 다
# 앱 CI 를 그대로 통과했다.
#
# ## 두 단으로 나눈 이유 — Gradle 검사는 NDK 4.8 GB 를 요구한다
#
# React Native 루트 플러그인이 **구성 단계에서** NDK 를 요구한다. 태스크가 C++ 를 한 줄도
# 컴파일하지 않아도(태스크 그래프 220개에 cmake/externalNative 가 하나도 없다) 프로젝트
# 구성 자체가 실패한다:
#
#     > Failed to apply plugin 'com.facebook.react.rootproject'.
#        > NDK not configured. Preferred NDK version is '27.0.12077973'.
#
# `-Pandroid.builder.sdkDownload=false` 로 자동 설치를 끄면 위 에러로 죽고, 켜두면 NDK 두
# 버전(27.0.12077973 · 27.1.12297006)을 **4.8 GB** 받는다. 실측 결과:
#
#   | 구성 | 크기 |
#   | --- | --- |
#   | platforms/android-36 | 134 MB |
#   | build-tools/36.0.0 | 188 MB |
#   | **NDK ×2** | **4.8 GB** |
#
# 그래서 러너에 SDK 가 없으면 **Gradle 단은 건너뛰고 XML 단만** 돌린다. SDK 가 깔리는 순간
# 이 파일을 고치지 않아도 전체 검사가 자동으로 켜진다.
#
# ⚠️ 건너뛸 때는 **경고를 남긴다.** 조용히 통과하면 검사가 돈 것처럼 보여서, 안 돈다는 사실이
#    아무에게도 안 보인다.
#
# ⚠️ 트리거를 좁게 잡은 이유: Gradle 은 구성만으로도 RN 모듈 전체를 훑어 lint 보다 무겁다.
#    러너가 e2-medium(2 vCPU / 4 GB) 한 대뿐이라(ticket 1513), 안드로이드 네이티브가 실제로
#    바뀐 PR 에서만 돌게 한다. TS 만 고친 PR 은 lint.yml 이 이미 잡는다.

on:
  push:
    branches: [main]
    paths:
      - 'app/android/**'
      - 'app/modules/**/android/**'
      - 'app/package.json'
      - 'app/app.config.js'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main] # main 대상 PR만 — 릴리즈 PR(main→release)은 이미 검사된 코드다 (lint.yml 과 같은 패턴)
    paths:
      - 'app/android/**'
      - 'app/modules/**/android/**'
      # 네이티브 의존성·플러그인 구성이 바뀌면 Gradle 구성이 깨질 수 있다.
      - 'app/package.json'
      - 'app/app.config.js'
      # 이 워크플로 자신도 트리거에 넣는다 (lint.yml 이 GROMO-1513 에서 배운 것) — 안 넣으면
      # 이 파일만 고치는 PR 에서 검사가 아예 안 돌아, **머지해 봐야** 맞는지 알 수 있다.
      - '.github/workflows/android-build.yml'

# 같은 PR 에 연속 푸시가 나면 앞 실행을 버린다 — 러너가 한 대뿐이라 큐가 밀리면
# 뒤따르는 다른 PR 까지 통째로 기다리게 된다.
concurrency:
  group: android-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: [self-hosted, ci, spot]
    timeout-minutes: 30

    env:
      # 자격 파일 없이 도는 CI 전용 환경 — 아래 'CI 자격 생성' 단계가 만든다.
      APP_ENV: ci
      # Gradle 데몬은 러너 메모리(4 GB)를 오래 물고 있는다. 잡이 끝나면 버릴 것이므로 끈다.
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 1단: XML 정합 (SDK 불필요) ─────────────────────────────────────────────
      # 안드로이드 리소스·매니페스트가 XML 로서 성립하는지만 본다. 가볍지만 실제로 겪은 사고를
      # 잡는다 — XML 주석 안에는 하이픈 두 개를 못 쓰는데, 표를 그리려고 `---` 를 넣어
      # 리소스 파싱이 통째로 실패했다.
      #
      # 이 단은 SDK 가 없어도 항상 돈다.
      - name: XML 정합 검사
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            echo "::error::python3 가 없어 XML 검사를 못 했습니다 — 러너에 python3 를 설치하세요."
            exit 1
          fi
          python3 - <<'PY'
          import sys, glob, xml.etree.ElementTree as ET

          patterns = [
              'app/android/**/src/**/*.xml',
              'app/modules/*/android/src/**/*.xml',
          ]
          files = sorted({f for p in patterns for f in glob.glob(p, recursive=True)})
          if not files:
              print('검사 대상 XML 없음')
              sys.exit(0)

          bad = []
          for f in files:
              try:
                  ET.parse(f)
              except ET.ParseError as e:
                  bad.append((f, e))

          for f, e in bad:
              # 주석 안 `--` 가 가장 흔한 원인이라 힌트를 함께 남긴다.
              print(f'::error file={f}::XML 파싱 실패: {e} (주석 안에 하이픈 두 개 `--` 가 있는지 확인하세요)')
          print(f'{len(files)}개 검사, {len(bad)}개 실패')
          sys.exit(1 if bad else 0)
          PY

      # ── 2단: Gradle 검사 (SDK 필요) ────────────────────────────────────────────
      - name: 안드로이드 SDK 확인
        id: sdk
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -n "$SDK" ] && [ -d "$SDK/platforms" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "ANDROID_HOME=$SDK"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::러너에 안드로이드 SDK가 없어 Gradle 검사(Kotlin 컴파일·리소스·매니페스트 병합)를 건너뜁니다. XML 정합만 검사했습니다. 켜려면 러너에 platforms/android-36 + build-tools/36.0.0 + NDK(약 5 GB — RN 루트 플러그인이 구성 단계에서 요구)를 설치하세요."
          fi

      - name: Setup Java
        if: steps.sdk.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        if: steps.sdk.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      # Expo 자동링크가 node_modules 를 읽어 Gradle 프로젝트를 구성하므로 설치가 선행이다.
      - name: Install dependencies
        if: steps.sdk.outputs.present == 'true'
        run: npm ci
        working-directory: app

      # build.gradle 은 credentials/<APP_ENV>/keystore.properties 가 없으면 **throw** 한다.
      # 실제 자격을 CI 에 둘 이유가 없으므로(서명된 산출물을 만들지 않는다) 일회용 디버그 키와
      # 최소 google-services.json 을 그때그때 만든다. 저장하지 않고 잡이 끝나면 사라진다.
      - name: CI 자격 생성 (일회용)
        if: steps.sdk.outputs.present == 'true'
        working-directory: app/android
        run: |
          mkdir -p credentials/ci
          keytool -genkeypair -v \
            -keystore credentials/ci/debug.keystore \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 365 \
            -dname "CN=gromo-ci, OU=ci, O=oneorthree, L=Seoul, C=KR"
          cat > credentials/ci/keystore.properties <<'EOF'
          storeFile=debug.keystore
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF
          # google-services 플러그인은 package_name 이 맞는 항목만 찾으면 통과한다.
          # 값은 전부 더미다 — CI 는 앱을 실행하지 않으므로 Firebase 에 붙을 일이 없다.
          cat > credentials/ci/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "gromo-ci",
              "storage_bucket": "gromo-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.oneorthree.gromo" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyCI0000000000000000000000000000000" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      # 로컬 모듈이 앱보다 먼저 깨진다 — 여기서 Kotlin 컴파일과 안드로이드 리소스 처리가
      # 함께 돈다(단순 XML 정합을 넘어 참조·속성까지 본다).
      - name: screen-time 모듈 컴파일
        if: steps.sdk.outputs.present == 'true'
        run: ./gradlew :screen-time:compileDebugKotlin --no-daemon
        working-directory: app/android

      # 앱 매니페스트 병합 — 모듈이 선언한 권한·서비스가 앱 매니페스트와 충돌하지 않는지 본다.
      # 집중 실드가 추가한 foregroundServiceType·specialUse 서브타입이 여기서 검증된다.
      #
      # ⚠️ 전체 assembleDebug 를 돌리지 않는 이유: RN + Hermes 번들까지 포함되어 2 vCPU 러너에서
      #    수십 분이 걸리고, 러너가 한 대뿐이라 다른 PR 의 CI 를 통째로 막는다. 컴파일·리소스·
      #    매니페스트가 실패의 대부분이라 그 셋만 잡는다.
      - name: 앱 매니페스트 병합 검증
        if: steps.sdk.outputs.present == 'true'
        run: ./gradlew :app:processDebugMainManifest --no-daemon
        working-directory: app/android
