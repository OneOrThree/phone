name: 서버 스모크 스냅샷

on:
  push:
    branches: [main]
  workflow_dispatch:

# main 병합당 한 번. 배포 대기는 배포 잠금을 잡지 않아 CD와 교착되지 않는다.
concurrency:
  group: dev-server-smoke
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  BASE_URL: https://oneorthree.dev.mooo.com

jobs:
  wait-deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 기존 CI와 같은 YAML 읽기 도구 준비
        run: python3 -m pip install --quiet 'pyyaml==6.0.2'
      - name: 해당 main 커밋의 CI·dev 배포 완료 대기
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_BEFORE_SHA: ${{ github.event.before }}
        run: python3 .github/scripts/wait-smoke-deploy.py

  execute:
    needs: wait-deploy
    if: always() && (needs.wait-deploy.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, dev]
    timeout-minutes: 10
    # 같은 잠금으로 보호된 dev CD가 끝난 뒤 전체 15개를 한 러너에서 검사한다.
    concurrency:
      group: dev-vm-deploy
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 공개 API·실시간·핵심 게스트 흐름·인프라 15개 검사
        env:
          SMOKE_CORE_ENABLED: '1'
          SMOKE_BASIC_ONLY: '0'
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/smoke-results"
          db=$(docker ps -q --filter label=com.docker.compose.project=phone --filter label=com.docker.compose.service=db)
          test -n "$db" && test "$(printf '%s\n' "$db" | wc -l)" -eq 1 || exit 1
          export SMOKE_DB_CONTAINER="$db"
          SMOKE_DB_USER=$(docker exec "$db" sh -c 'printf "%s" "$POSTGRES_USER"') || exit 1
          SMOKE_DB_NAME=$(docker exec "$db" sh -c 'printf "%s" "$POSTGRES_DB"') || exit 1
          export SMOKE_DB_USER SMOKE_DB_NAME
          RESULTS_FILE="$RUNNER_TEMP/smoke-results/internal/results.tsv" smoke/server/internal.sh
          internal_rc=$?
          RESULTS_FILE="$RUNNER_TEMP/smoke-results/api/results.tsv" smoke/server/run.sh
          api_rc=$?
          exit $((internal_rc || api_rc))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: ${{ runner.temp }}/smoke-results/**/results.tsv
          retention-days: 7
          overwrite: true

  report:
    if: always()
    needs: [wait-deploy, execute]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: smoke-results
          path: smoke-results
      - name: TC별 결과 요약·배지 판정
        env:
          SMOKE_RUN_RESULT: ${{ needs.execute.result }}
          DEPLOY_WAIT_RESULT: ${{ needs.wait-deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/report-smoke.py smoke-results
