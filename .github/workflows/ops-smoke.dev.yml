name: Dev 서버 스모크

on:
  schedule:
    - cron: '0 20 * * *' # 05:00 KST
  workflow_dispatch:
    inputs:
      run_core_flow:
        description: 전용 테스트 DB 초기 준비와 핵심 사용자 흐름(014) 실행
        type: boolean
        default: false
  workflow_call:
    inputs:
      deploy_revision:
        type: string
        default: ''
      deploy_service:
        type: string
        default: ''
      run_core_flow:
        type: boolean
        default: false

# CD 호출자는 이미 dev-vm-deploy를 보유한다. 같은 그룹을 중첩하면 교착된다.
# 단독 실행만 배포 그룹을 얻고, CD 호출은 부모가 가진 잠금을 유지한다.
concurrency:
  group: ${{ inputs.deploy_service != '' && format('dev-smoke-{0}-{1}', github.run_id, inputs.deploy_service) || 'dev-vm-deploy' }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  BASE_URL: https://oneorthree.dev.mooo.com
  SMOKE_DEVICE_ID: ${{ vars.SMOKE_DEVICE_ID }}

jobs:
  external:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          # 배포 이미지 SHA는 보고용이다. 검사 코드는 호출한 워크플로 커밋을 사용한다.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 공개 API·실시간 기본 검사
        env:
          SMOKE_BASIC_ONLY: '1'
          RESULTS_FILE: ${{ runner.temp }}/smoke-external/results.tsv
        run: smoke/server/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-external-${{ inputs.deploy_service || 'standalone' }}
          path: ${{ runner.temp }}/smoke-external/results.tsv
          retention-days: 7

  internal:
    runs-on: [self-hosted, dev]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # 배포 이미지 SHA는 보고용이다. 검사 코드는 호출한 워크플로 커밋을 사용한다.
          ref: ${{ github.sha }}
      - name: 컨테이너·공유 Redis·business Redis 검사
        env:
          RESULTS_FILE: ${{ runner.temp }}/smoke-internal/results.tsv
        run: smoke/server/internal.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-internal-${{ inputs.deploy_service || 'standalone' }}
          path: ${{ runner.temp }}/smoke-internal/results.tsv
          retention-days: 7

  core-flow:
    if: inputs.run_core_flow == true || (github.event_name == 'schedule' && vars.SMOKE_CORE_ENABLED == 'true')
    needs: [external, internal]
    runs-on: [self-hosted, dev]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          # 배포 이미지 SHA는 보고용이다. 검사 코드는 호출한 워크플로 커밋을 사용한다.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 로그인·검증·DB 초기 준비·API 시나리오를 한 러너에서 실행한다.
      # 인증 토큰은 job output이나 artifact로 전달하지 않는다.
      - name: 전용 섬 초기 준비·집중 적립·건설·게스트 구매 거절
        env:
          SMOKE_DEVICE_ID: ''
          SMOKE_CORE_ENABLED: '1'
          RESULTS_FILE: ${{ runner.temp }}/smoke-core/results.tsv
        run: |
          set -euo pipefail
          db=$(docker ps -q --filter label=com.docker.compose.project=phone --filter label=com.docker.compose.service=db)
          test -n "$db"
          test "$(printf '%s\n' "$db" | wc -l)" -eq 1
          export SMOKE_DB_CONTAINER="$db"
          SMOKE_DB_USER=$(docker exec "$db" sh -c 'printf "%s" "$POSTGRES_USER"')
          SMOKE_DB_NAME=$(docker exec "$db" sh -c 'printf "%s" "$POSTGRES_DB"')
          export SMOKE_DB_USER SMOKE_DB_NAME
          smoke/server/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-core-${{ inputs.deploy_service || 'standalone' }}
          path: ${{ runner.temp }}/smoke-core/results.tsv
          retention-days: 7

  report:
    if: always()
    needs: [external, internal, core-flow]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 배포 이미지 SHA는 보고용이다. 검사 코드는 호출한 워크플로 커밋을 사용한다.
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: smoke-*-${{ inputs.deploy_service || 'standalone' }}
          path: smoke-results
      - name: 결과 요약·실패 알림
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_EVENT: ${{ github.event_name }}
          DEPLOY_REVISION: ${{ inputs.deploy_revision }}
          EXTERNAL_RESULT: ${{ needs.external.result }}
          INTERNAL_RESULT: ${{ needs.internal.result }}
          CORE_RESULT: ${{ needs.core-flow.result }}
          CORE_REQUESTED: ${{ inputs.run_core_flow == true || (github.event_name == 'schedule' && vars.SMOKE_CORE_ENABLED == 'true') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/report-smoke.py smoke-results
