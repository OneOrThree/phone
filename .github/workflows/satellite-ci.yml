name: Business · Notification CI

on:
  pull_request:
    paths:
      - 'server/business-api/**'
      - 'server/notification/**'
      - 'server/data-api/src/main/java/com/oneorthree/phone/notification/**'
      - 'server/data-api/src/main/java/com/oneorthree/phone/outbox/**'
      - 'server/data-api/src/main/resources/application-satellites.yml'
      - 'docs/architecture/**'
      - 'server/scripts/docker-compose.satellites*.yml'
      - 'server/scripts/docker-compose.business.yml'
      - 'server/scripts/docker-compose.kafka.yml'
      - 'server/scripts/prepare-satellite-deploy.py'
      - 'server/scripts/nginx-satellites*.example'
      - 'server/scripts/provision-notification-db.*'
      - '.github/scripts/**'
      - '.github/workflows/satellite-ci.yml'
      - 'docs/contracts/**'
  push:
    branches: [main, release]
    paths:
      - 'server/business-api/**'
      - 'server/notification/**'
      - 'server/data-api/src/main/java/com/oneorthree/phone/notification/**'
      - 'server/data-api/src/main/java/com/oneorthree/phone/outbox/**'
      - 'server/data-api/src/main/resources/application-satellites.yml'
      - 'docs/architecture/**'
      - 'server/scripts/docker-compose.satellites*.yml'
      - 'server/scripts/docker-compose.business.yml'
      - 'server/scripts/docker-compose.kafka.yml'
      - 'server/scripts/prepare-satellite-deploy.py'
      - 'server/scripts/nginx-satellites*.example'
      - 'server/scripts/provision-notification-db.*'
      - '.github/scripts/**'
      - '.github/workflows/satellite-ci.yml'
      - 'docs/contracts/**'

concurrency:
  group: satellite-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  runtime-contracts:
    name: 서비스별 시크릿 · DB 격리
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 합성 SecretString의 compose 전달과 실제 Postgres 권한 확인
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: A22 위성 경계 · producer와 template 계약 검사
        run: python3 .github/scripts/check-satellite-contracts.py

  build:
    name: ${{ matrix.service }} 검증
    runs-on: [self-hosted, ci, spot]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [business-api, notification]
    defaults:
      run:
        working-directory: server/${{ matrix.service }}
    env:
      SPRING_PROFILES_ACTIVE: ci
      GRADLE_OPTS: '-Dorg.gradle.daemon=false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: 동시 러너와 Gradle 홈 분리
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-${{ matrix.service }}" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches
            ${{ env.GRADLE_USER_HOME }}/wrapper
          key: ${{ runner.os }}-${{ matrix.service }}-gradle-v1-${{ hashFiles(format('server/{0}/**/*.gradle*', matrix.service), format('server/{0}/**/gradle-wrapper.properties', matrix.service)) }}
          restore-keys: ${{ runner.os }}-${{ matrix.service }}-gradle-v1-
      - name: Business PDF 테스트 도구 이미지
        if: matrix.service == 'business-api'
        run: docker build --target test -t "business-api-test:${GITHUB_RUN_ID}" .
      - name: Business 실제 테스트 · 정적 검사 · bootJar
        if: matrix.service == 'business-api'
        run: |
          mkdir -p "$GRADLE_USER_HOME"
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$GRADLE_USER_HOME:/gradle" \
            -e GRADLE_USER_HOME=/gradle -e SPRING_PROFILES_ACTIVE=ci \
            -e TESTCONTAINERS_HOST_OVERRIDE=127.0.0.1 \
            -w "$GITHUB_WORKSPACE/server/business-api" \
            "business-api-test:${GITHUB_RUN_ID}" ./gradlew build --no-daemon --stacktrace
      - name: Business 테스트 도구 이미지 정리
        if: always() && matrix.service == 'business-api'
        run: docker image rm "business-api-test:${GITHUB_RUN_ID}" || true
      - name: Notification 실제 테스트 · 정적 검사 · bootJar
        if: matrix.service == 'notification'
        run: ./gradlew build --stacktrace
      - name: Data export와 실제 Noti Jackson 체크섬 대조
        if: matrix.service == 'notification'
        run: python3 ../../.github/scripts/check-migration-checksum.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.service }}-test-results
          path: |
            server/${{ matrix.service }}/build/test-results/
            server/${{ matrix.service }}/build/reports/
          retention-days: 7

  images:
    name: ${{ matrix.service }} 이미지
    needs: [runtime-contracts, build]
    runs-on: [self-hosted, ci, spot]
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [business-api, notification]
    env:
      GAR_HOST: asia-northeast3-docker.pkg.dev
      IMAGE_REPOSITORY: asia-northeast3-docker.pkg.dev/oneorthree2/ci-cache/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: github.ref == 'refs/heads/release' || github.base_ref == 'release'
      - uses: docker/setup-buildx-action@v3
      - name: main 이미지 발행용 GAR 인증
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H 'Metadata-Flavor: Google' \
            'http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token' \
            | jq -er .access_token \
            | docker login -u oauth2accesstoken --password-stdin "$GAR_HOST"
      - name: release 발행용 AWS 자격증명
        if: github.event_name == 'push' && github.ref == 'refs/heads/release'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::808715036056:role/gromo-prod-github-actions
          aws-region: ap-northeast-2
      - name: 서비스별 ECR 저장소 확인
        if: github.event_name == 'push' && github.ref == 'refs/heads/release'
        env:
          SERVICE_NAME: ${{ matrix.service }}
        run: |
          set -euo pipefail
          case "$SERVICE_NAME" in
            business-api) repository_key=BUSINESS_API_ECR_REPO ;;
            notification) repository_key=NOTIFICATION_ECR_REPO ;;
            *) exit 1 ;;
          esac
          repository=$(aws secretsmanager get-secret-value --secret-id gromo/prod/cicd \
            --query SecretString --output text | jq -er --arg key "$repository_key" '.[$key]')
          if [[ ! "$repository" =~ ^[0-9]{12}\.dkr\.ecr\.ap-northeast-2\.amazonaws\.com/[a-z0-9][a-z0-9._/-]*$ ]]; then
            echo '서비스 ECR 저장소 설정이 없거나 형식이 잘못됐습니다' >&2
            exit 1
          fi
          echo "IMAGE_REPOSITORY=$repository" >> "$GITHUB_ENV"
      - name: ECR 로그인
        if: github.event_name == 'push' && github.ref == 'refs/heads/release'
        uses: aws-actions/amazon-ecr-login@v2
      - name: 이미지 검증 · 환경별 digest 발행
        id: image
        uses: docker/build-push-action@v6
        with:
          context: server/${{ matrix.service }}
          platforms: ${{ (github.ref == 'refs/heads/release' || github.base_ref == 'release') && 'linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release') }}
          provenance: false
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      # 이 CI는 이미지까지 발행한다. 호스트의 gate·데이터 이관을 건너뛰어 서비스를 활성화하지 않는다.
      - name: 릴리즈 입력 digest 기록
        if: github.event_name == 'push'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf '%s@%s\n' "$IMAGE_REPOSITORY" "$IMAGE_DIGEST" > '${{ matrix.service }}-image.txt'
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: ${{ matrix.service }}-image
          path: ${{ matrix.service }}-image.txt
          retention-days: 30
