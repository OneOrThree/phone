name: Business · Notification CI

on:
  pull_request:
    paths:
      - 'server/business-api/**'
      - 'server/notification/**'
      # 위성 계약은 auth·user·group·internal 등 Data 경계 전반과 테스트에 의존한다.
      - 'server/data-api/**'
      - 'docs/architecture/**'
      - 'server/scripts/docker-compose.satellites*.yml'
      - 'server/scripts/docker-compose.business.yml'
      - 'server/scripts/docker-compose.kafka.yml'
      - 'server/scripts/prepare-satellite-deploy.py'
      - 'server/scripts/nginx-satellites*.example'
      - 'server/scripts/provision-notification-db.*'
      - '.github/scripts/**'
      - '.github/actions/ci-jar/**'
      - '.github/workflows/satellite-ci.yml'
      - 'docs/contracts/**'
  push:
    branches: [main, release]
    paths:
      - 'server/business-api/**'
      - 'server/notification/**'
      # PR과 main/release push에서 같은 Data 계약 검사를 실행한다.
      - 'server/data-api/**'
      - 'docs/architecture/**'
      - 'server/scripts/docker-compose.satellites*.yml'
      - 'server/scripts/docker-compose.business.yml'
      - 'server/scripts/docker-compose.kafka.yml'
      - 'server/scripts/prepare-satellite-deploy.py'
      - 'server/scripts/nginx-satellites*.example'
      - 'server/scripts/provision-notification-db.*'
      - '.github/scripts/**'
      - '.github/actions/ci-jar/**'
      - '.github/workflows/satellite-ci.yml'
      - 'docs/contracts/**'

concurrency:
  group: satellite-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: 위성 변경 입력 판정
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.plan.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        run: python3 .github/scripts/satellite-ci-plan.py

  runtime-contracts:
    name: 서비스별 시크릿 · DB 격리
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 합성 SecretString의 compose 전달과 실제 Postgres 권한 확인
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: A22 위성 경계 · producer와 template 계약 검사
        run: python3 .github/scripts/check-satellite-contracts.py

  public-command-contracts:
    name: 공개 명령 원자성 · 계약
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server/data-api
    env:
      SPRING_PROFILES_ACTIVE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: 실제 Postgres 멱등 · rollback · 재생 · 계층 검증
        run: >-
          ./gradlew --no-daemon test
          --tests '*PublicCommandIntegrationTest'
          --tests '*PublicCommandFingerprintTest'
          --tests '*OutboxCommandIntegrationTest'
          --tests '*NotificationSettingsCommandIntegrationTest'
          --tests '*UserServiceTest'
          --tests '*SatelliteCommandConcurrencyTest'
          --tests '*NotificationSettingsSerializationConcurrencyTest'
          --tests '*InternalSurfaceIntegrationTest'
          --tests '*SatelliteCoreContractIntegrationTest'
          --tests '*ErrorContractTest'
          --tests '*DomainLayerRulesTest'
          checkstyleMain spotbugsMain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-command-contract-results
          path: |
            server/data-api/build/test-results/
            server/data-api/build/reports/
          retention-days: 7

  # 이 잡만 be-gradle.yml 을 쓰지 않는다(GROMO-1790). business-api 의 PDF 미리보기 테스트가
  # poppler-utils·util-linux 에 의존하는데 그건 Dockerfile 의 `test` 스테이지가 깐다 — 일반 러너에서
  # gradle 을 돌리는 be-gradle.yml 로는 대체할 수 없다. notification 은 같은 매트릭스에 묶여 있어서
  # 같이 여기서 돈다. 그 의존을 걷어내면 그때 호출부로 바꾼다.
  build:
    name: ${{ matrix.service }} 검증
    needs: changes
    runs-on: ${{ fromJSON(needs.changes.outputs.services)[matrix.service] && fromJSON('["self-hosted", "ci", "spot"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [business-api, notification]
    defaults:
      run:
        working-directory: server/${{ matrix.service }}
    env:
      SPRING_PROFILES_ACTIVE: ci
      GRADLE_OPTS: '-Dorg.gradle.daemon=false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.service == 'notification' || fromJSON(needs.changes.outputs.services)[matrix.service]
        with:
          java-version: '17'
          distribution: temurin
      - name: 동시 러너와 Gradle 홈 분리
        if: matrix.service == 'notification' || fromJSON(needs.changes.outputs.services)[matrix.service]
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-${{ matrix.service }}" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        if: matrix.service == 'notification' || fromJSON(needs.changes.outputs.services)[matrix.service]
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches
            ${{ env.GRADLE_USER_HOME }}/wrapper
          key: ${{ runner.os }}-${{ runner.environment }}-${{ matrix.service }}-gradle-v1-${{ hashFiles(format('server/{0}/**/*.gradle*', matrix.service), format('server/{0}/**/gradle-wrapper.properties', matrix.service)) }}
          restore-keys: ${{ runner.os }}-${{ runner.environment }}-${{ matrix.service }}-gradle-v1-
      - name: Business PDF 테스트 도구 이미지
        if: matrix.service == 'business-api' && fromJSON(needs.changes.outputs.services)[matrix.service]
        run: docker build --target test -t "business-api-test:${GITHUB_RUN_ID}" .
      - name: Business 실제 테스트 · 정적 검사 · bootJar
        if: matrix.service == 'business-api' && fromJSON(needs.changes.outputs.services)[matrix.service]
        run: |
          mkdir -p "$GRADLE_USER_HOME"
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$GRADLE_USER_HOME:/gradle" \
            -e GRADLE_USER_HOME=/gradle -e SPRING_PROFILES_ACTIVE=ci \
            -e TESTCONTAINERS_HOST_OVERRIDE=127.0.0.1 \
            -w "$GITHUB_WORKSPACE/server/business-api" \
            "business-api-test:${GITHUB_RUN_ID}" ./gradlew build --no-daemon --stacktrace
      - name: Business 테스트 도구 이미지 정리
        if: always() && matrix.service == 'business-api' && fromJSON(needs.changes.outputs.services)[matrix.service]
        run: docker image rm "business-api-test:${GITHUB_RUN_ID}" || true
      - name: 변경 없는 Notification은 체크섬 검사에 필요한 JAR만 생성
        if: matrix.service == 'notification' && !fromJSON(needs.changes.outputs.services)[matrix.service]
        run: ./gradlew bootJar --no-daemon --stacktrace
      - name: Notification 실제 테스트 · 정적 검사 · bootJar
        if: matrix.service == 'notification' && fromJSON(needs.changes.outputs.services)[matrix.service]
        run: ./gradlew build --stacktrace
      - name: Data export와 실제 Noti Jackson 체크섬 대조
        if: matrix.service == 'notification'
        run: python3 ../../.github/scripts/check-migration-checksum.py
      - uses: ./.github/actions/ci-jar
        if: fromJSON(needs.changes.outputs.services)[matrix.service]
        with:
          service: ${{ matrix.service }}
          operation: pack
      - uses: actions/upload-artifact@v4
        if: always() && fromJSON(needs.changes.outputs.services)[matrix.service]
        with:
          name: ${{ matrix.service }}-test-results
          path: |
            server/${{ matrix.service }}/build/test-results/
            server/${{ matrix.service }}/build/reports/
          retention-days: 7

      - name: 전체 검사 생략 기록
        if: ${{ !fromJSON(needs.changes.outputs.services)[matrix.service] }}
        run: echo '서비스 소스·빌드 입력 변경 없음. 전체 검사는 생략하고 관련 계약 검사는 유지한다.' >> "$GITHUB_STEP_SUMMARY"

  images:
    name: ${{ matrix.service }} 이미지
    needs: [changes, runtime-contracts, public-command-contracts, build]
    runs-on: ${{ fromJSON(needs.changes.outputs.services)[matrix.service] && fromJSON('["self-hosted", "ci", "spot"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [business-api, notification]
    env:
      GAR_HOST: asia-northeast3-docker.pkg.dev
      IMAGE_REPOSITORY: asia-northeast3-docker.pkg.dev/oneorthree2/ci-cache/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
        if: fromJSON(needs.changes.outputs.services)[matrix.service]
      - uses: docker/setup-qemu-action@v3
        if: fromJSON(needs.changes.outputs.services)[matrix.service] && (github.ref == 'refs/heads/release' || github.base_ref == 'release')
      - uses: ./.github/actions/ci-jar
        if: fromJSON(needs.changes.outputs.services)[matrix.service]
        with:
          service: ${{ matrix.service }}
          operation: verify
      - uses: docker/setup-buildx-action@v3
        if: fromJSON(needs.changes.outputs.services)[matrix.service]
      - name: 이미지 캐시용 GAR 인증
        if: fromJSON(needs.changes.outputs.services)[matrix.service]
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H 'Metadata-Flavor: Google' \
            'http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token' \
            | jq -er .access_token \
            | docker login -u oauth2accesstoken --password-stdin "$GAR_HOST"
      - name: release 발행용 AWS 자격증명
        if: fromJSON(needs.changes.outputs.services)[matrix.service] && (github.event_name == 'push' && github.ref == 'refs/heads/release')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::808715036056:role/gromo-prod-github-actions
          aws-region: ap-northeast-2
      - name: 서비스별 ECR 저장소 확인
        if: fromJSON(needs.changes.outputs.services)[matrix.service] && (github.event_name == 'push' && github.ref == 'refs/heads/release')
        env:
          SERVICE_NAME: ${{ matrix.service }}
        run: |
          set -euo pipefail
          case "$SERVICE_NAME" in
            business-api) repository_key=BUSINESS_API_ECR_REPO ;;
            notification) repository_key=NOTIFICATION_ECR_REPO ;;
            *) exit 1 ;;
          esac
          repository=$(aws secretsmanager get-secret-value --secret-id gromo/prod/cicd \
            --query SecretString --output text | jq -er --arg key "$repository_key" '.[$key]')
          if [[ ! "$repository" =~ ^[0-9]{12}\.dkr\.ecr\.ap-northeast-2\.amazonaws\.com/[a-z0-9][a-z0-9._/-]*$ ]]; then
            echo '서비스 ECR 저장소 설정이 없거나 형식이 잘못됐습니다' >&2
            exit 1
          fi
          echo "IMAGE_REPOSITORY=$repository" >> "$GITHUB_ENV"
      - name: ECR 로그인
        if: fromJSON(needs.changes.outputs.services)[matrix.service] && (github.event_name == 'push' && github.ref == 'refs/heads/release')
        uses: aws-actions/amazon-ecr-login@v2
      - name: 이미지 검증 · 환경별 digest 발행
        if: fromJSON(needs.changes.outputs.services)[matrix.service]
        id: image
        uses: docker/build-push-action@v6
        with:
          context: server/${{ matrix.service }}
          build-args: JAR_SOURCE=prebuilt
          cache-from: type=registry,ref=asia-northeast3-docker.pkg.dev/oneorthree2/ci-cache/${{ matrix.service }}:cache-${{ (github.ref == 'refs/heads/release' || github.base_ref == 'release') && 'arm64' || 'amd64' }}
          cache-to: type=registry,ref=asia-northeast3-docker.pkg.dev/oneorthree2/ci-cache/${{ matrix.service }}:cache-${{ (github.ref == 'refs/heads/release' || github.base_ref == 'release') && 'arm64' || 'amd64' }},mode=max
          platforms: ${{ (github.ref == 'refs/heads/release' || github.base_ref == 'release') && 'linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release') }}
          provenance: false
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      # 이 CI는 이미지까지 발행한다. 호스트의 gate·데이터 이관을 건너뛰어 서비스를 활성화하지 않는다.
      - name: 릴리즈 입력 digest 기록
        if: fromJSON(needs.changes.outputs.services)[matrix.service] && (github.event_name == 'push')
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf '%s@%s\n' "$IMAGE_REPOSITORY" "$IMAGE_DIGEST" > '${{ matrix.service }}-image.txt'
      - uses: actions/upload-artifact@v4
        if: fromJSON(needs.changes.outputs.services)[matrix.service] && (github.event_name == 'push')
        with:
          name: ${{ matrix.service }}-image
          path: ${{ matrix.service }}-image.txt
          retention-days: 30
      - name: 이미지 생략 기록
        if: ${{ !fromJSON(needs.changes.outputs.services)[matrix.service] }}
        run: echo '서비스 소스·빌드 입력 변경 없음. 이미지를 다시 만들지 않는다.' >> "$GITHUB_STEP_SUMMARY"
