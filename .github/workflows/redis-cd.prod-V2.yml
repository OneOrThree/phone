name: Catus redis CD V2
'on':
  workflow_dispatch:
    inputs:
      version:
        description: "redis \uC6B4\uC601 V2 \uD0DC\uADF8"
        required: true
        type: string
      rollback:
        description: "이전 V2 태그로 명시적 복구"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: catus-redis-deploy-V2
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: catus-production-V2
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::808715036056:role/catus-prod-deploy-V2
        aws-region: ap-northeast-2
    - name: "V2 SSM \uC801\uC6A9 \uBC0F \uACB0\uACFC \uD655\uC778"
      env:
        VERSION: ${{ inputs.version }}
        ROLLBACK: ${{ inputs.rollback }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        flags=()
        if [ "$ROLLBACK" = true ]; then flags+=(--rollback); fi
        python3 .github/scripts/catus-runtime-V2.py deploy --role redis --version "$VERSION" "${flags[@]}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: catus-redis-deployment-V2
        path: deployment-V2.json*
        if-no-files-found: warn
        overwrite: true
  record:
    needs: deploy
    if: always() && github.ref == 'refs/heads/release' && needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    concurrency:
      group: catus-V2-status-record
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: catus-redis-deployment-V2
    - name: "\uBC30\uC9C0 \uBC0F \uAD00\uB828 PR \uAE30\uB85D"
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 .github/scripts/catus-runtime-V2.py record --input deployment-V2.json
