name: Realtime CI

# 채팅 서비스 전용 게이트 (GROMO-292).
#
# 검사는 be-gradle.yml 에 위임한다(GROMO-1790). 예전엔 be-check-style / be-test / be-spot-bugs 가
# `working-directory: server/data-api` 를 하드코딩해 재사용할 수 없어서 이 파일이 잡을 직접 들고
# 있었는데, 그 셋을 입력 받는 be-gradle.yml 하나로 합치면서 호출부만 남겼다.
#
# 잡은 여전히 하나다. `./gradlew build` 한 번이 checkstyle · spotbugs · test · bootJar 를 전부
# 돌리므로, 잡을 셋으로 쪼개면 러너 3개를 물고 Gradle 이 세 번 뜬다(러너는 VM 한 대를 공유한다).

on:
  pull_request:
    paths:
      - 'server/realtime/**'
      - '.github/workflows/realtime-ci.yml'
      # 호출하는 재사용 워크플로도 넣는다 — 안 넣으면 be-gradle.yml 만 고치는 PR 에서
      # realtime 게이트가 안 돌아 «머지해 봐야» 맞는지 안다 (GROMO-1515 와 같은 이유).
      - '.github/workflows/be-gradle.yml'
      - '.github/actions/ci-jar/**'
      - '.github/scripts/ci-jar.py'
      - 'server/scripts/docker-compose.realtime.yml'
  push:
    branches: [main]
    paths:
      - 'server/realtime/**'
      - '.github/workflows/realtime-ci.yml'
      # 호출하는 재사용 워크플로도 넣는다 — 안 넣으면 be-gradle.yml 만 고치는 PR 에서
      # realtime 게이트가 안 돌아 «머지해 봐야» 맞는지 안다 (GROMO-1515 와 같은 이유).
      - '.github/workflows/be-gradle.yml'
      - '.github/actions/ci-jar/**'
      - '.github/scripts/ci-jar.py'
      - 'server/scripts/docker-compose.realtime.yml'

# 통합 브랜치 푸시가 «겹치지» 않게 한다. 겹치면 늦게 끝난 «옛» 빌드가 :latest 를 되가리켜,
# compose 의 기본 배포가 이전 코드로 되돌아간다. 그룹 이름은 dev-ci 의 것과 달라야 한다
# (같으면 두 파이프라인이 서로를 막는다).
concurrency:
  group: realtime-ci-${{ github.ref }}
  # PR 의 이전 실행은 취소하되, 이미지를 올리는 실행은 중간에 끊지 않는다(dev-ci 와 같은 규율).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GAR_HOST: asia-northeast3-docker.pkg.dev
  # docker-compose.realtime.yml 의 REALTIME_IMAGE 기본값과 «같은 경로»여야 한다 — 어긋나면 올리는 곳과
  # 받는 곳이 달라져 「올렸는데 안 뜬다」가 된다.
  REALTIME_IMAGE_REPOSITORY: asia-northeast3-docker.pkg.dev/oneorthree2/ci-cache/realtime

jobs:
  # `./gradlew build` 한 번이 checkstyle · spotbugs · test · bootJar 를 전부 돈다.
  #
  # Postgres·Redis 를 띄우지 않는다 — 테스트가 Testcontainers 로 직접 띄우고 주소를 빈으로 주입한다.
  # be-gradle.yml 은 이제 호스트 DB 를 아예 띄우지 않는다(GROMO-1793) — data-api 도 필요 없었다.
  build:
    uses: ./.github/workflows/be-gradle.yml
    with:
      service: realtime
      tasks: build
      publish-jar: true
      artifact-name: realtime-test-results
      artifact-path: build/test-results/

  # PR 에서는 «빌드는 되는가»만 보고(푸시 없음), main push 에서는 GAR 에 올린다.
  #
  # 푸시가 필요한 이유: server/scripts/docker-compose.realtime.yml 이 이 이미지를 «받아서» 띄운다.
  # 아무도 올리지 않으면 새 호스트에서 `up` 이 이미지를 못 찾아 컨테이너가 아예 뜨지 않고, 코드가
  # 바뀌어도 배포될 길이 없다. 배포 호스트에는 레포 체크아웃이 없어 거기서 빌드할 수도 없다.
  docker-build:
    name: 채팅 이미지 build${{ github.event_name == 'push' && ' · GAR push' || ' · cache' }}
    # 검증이 끝난 뒤에만 올린다. 이게 없으면 두 잡이 나란히 돌아, 테스트·checkstyle·spotbugs 가
    # 깨진 리비전도 이미지 빌드(bootJar 는 -x test 다)만 성공해 :latest 로 올라간다 — 그리고
    # compose 의 기본값이 바로 그 태그다.
    needs: [build]
    runs-on: [self-hosted, ci, spot]
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-jar
        with:
          service: realtime
          operation: verify

      # GCE 러너의 SA 메타데이터 토큰으로 로그인 — gcloud 도 키 파일도 필요 없다(dev-ci 와 같은 방식).
      # PR 에서도 로그인한다: cache-to 가 레지스트리를 쓰기 때문이다.
      - name: GAR 인증
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H "Metadata-Flavor: Google" \
            "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token" \
          | jq -er .access_token \
          | docker login -u oauth2accesstoken --password-stdin "$GAR_HOST"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: server/realtime
          platforms: linux/amd64
          build-args: JAR_SOURCE=prebuilt
          # PR 이 만든 태그를 배포 신뢰점으로 삼지 않는다 — main push 실행만 올린다(dev-ci 와 같은 규율).
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          provenance: false
          # :<sha> 가 «진짜» 신뢰점이다. :latest 는 compose 의 기본값이 그것이라 함께 올릴 뿐이고,
          # 배포를 되돌릴 때는 REALTIME_IMAGE 로 sha 를 못 박는 편이 낫다.
          tags: |
            ${{ env.REALTIME_IMAGE_REPOSITORY }}:${{ github.sha }}
            ${{ env.REALTIME_IMAGE_REPOSITORY }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.REALTIME_IMAGE_REPOSITORY }}:cache-amd64
          cache-to: type=registry,ref=${{ env.REALTIME_IMAGE_REPOSITORY }}:cache-amd64,mode=max
