# 위성(business-api · notification) 공용 검사. GROMO-2224 에서 dev·prod CI 로 나누며 분리.
# satellite-ci.dev.yml · satellite-ci.prod.yml 이 호출. 변경 판정 결과(services)를 이미지 잡에 넘김.
name: Satellite Checks

on:
  workflow_call:
    outputs:
      services:
        description: 서비스별 전체 검사·이미지 대상 여부 JSON
        value: ${{ jobs.changes.outputs.services }}

permissions:
  contents: read

jobs:
  changes:
    name: 위성 변경 입력 판정
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.plan.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        run: python3 .github/scripts/satellite-ci-plan.py
      - name: dev 배포 대상 기록
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SERVICES: ${{ steps.plan.outputs.services }}
        run: printf '%s\n' "$SERVICES" > satellite-deploy-plan.json
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: satellite-deploy-plan
          path: satellite-deploy-plan.json
          retention-days: 30

  runtime-contracts:
    name: 서비스별 시크릿 · DB 격리
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # test_config_contract 가 compose yml 을 읽음 (GROMO-2224)
      - name: 테스트 의존성
        run: python3 -m pip install --quiet 'pyyaml==6.0.2'
      - name: 합성 SecretString의 compose 전달과 실제 Postgres 권한 확인
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: A22 위성 경계 · producer와 template 계약 검사
        run: python3 .github/scripts/check-satellite-contracts.py

  public-command-contracts:
    name: 공개 명령 원자성 · 계약
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server/data-api
    env:
      SPRING_PROFILES_ACTIVE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: 실제 Postgres 멱등 · rollback · 재생 · 계층 검증
        run: >-
          ./gradlew --no-daemon test
          --tests '*PublicCommandIntegrationTest'
          --tests '*PublicCommandFingerprintTest'
          --tests '*OutboxCommandIntegrationTest'
          --tests '*NotificationSettingsCommandIntegrationTest'
          --tests '*UserServiceTest'
          --tests '*SatelliteCommandConcurrencyTest'
          --tests '*NotificationSettingsSerializationConcurrencyTest'
          --tests '*InternalSurfaceIntegrationTest'
          --tests '*SatelliteCoreContractIntegrationTest'
          --tests '*ErrorContractTest'
          --tests '*DomainLayerRulesTest'
          checkstyleMain spotbugsMain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-command-contract-results
          path: |
            server/data-api/build/test-results/
            server/data-api/build/reports/
          retention-days: 7

  # 이 잡만 be-gradle.yml 을 쓰지 않는다(GROMO-1790). business-api 의 PDF 미리보기 테스트가
  # poppler-utils·util-linux 에 의존하는데 그건 Dockerfile 의 `test` 스테이지가 깐다 — 일반 러너에서
  # gradle 을 돌리는 be-gradle.yml 로는 대체할 수 없다. notification 은 같은 매트릭스에 묶여 있어서
  # 같이 여기서 돈다. 그 의존을 걷어내면 그때 호출부로 바꾼다.
  build:
    name: ${{ matrix.service }} 검증
    needs: changes
    # GROMO-1918: GitHub-hosted 로 옮긴다. 이 잡은 GAR·GCE 메타데이터를 쓰지 않는다 —
    # 도커로 test 스테이지 이미지를 만들어 그 안에서 gradle 을 돌릴 뿐이고 도커는 양쪽 다 있다.
    # 변경이 없을 때는 원래도 ubuntu-latest 로 돌고 있었다(아래 조건부 스텝들이 건너뛰는 경로).
    # 잃는 것은 호스트 도커 레이어 캐시뿐이고, 얻는 것은 self-hosted 러너가 죽어도 PR 검증이
    # 돈다는 것이다 — 실제로 러너 3대가 동시에 offline 이 되어 PR CI 가 통째로 막힌 적이 있다.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [business-api, notification]
    defaults:
      run:
        working-directory: server/${{ matrix.service }}
    env:
      SPRING_PROFILES_ACTIVE: ci
      GRADLE_OPTS: '-Dorg.gradle.daemon=false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.service == 'notification' || fromJSON(needs.changes.outputs.services)[matrix.service]
        with:
          java-version: '17'
          distribution: temurin
      - name: 동시 러너와 Gradle 홈 분리
        if: matrix.service == 'notification' || fromJSON(needs.changes.outputs.services)[matrix.service]
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-${{ matrix.service }}" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        if: matrix.service == 'notification' || fromJSON(needs.changes.outputs.services)[matrix.service]
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches
            ${{ env.GRADLE_USER_HOME }}/wrapper
          key: ${{ runner.os }}-${{ runner.environment }}-${{ matrix.service }}-gradle-v1-${{ hashFiles(format('server/{0}/**/*.gradle*', matrix.service), format('server/{0}/**/gradle-wrapper.properties', matrix.service)) }}
          restore-keys: ${{ runner.os }}-${{ runner.environment }}-${{ matrix.service }}-gradle-v1-
      - name: Business PDF 테스트 도구 이미지
        if: matrix.service == 'business-api' && fromJSON(needs.changes.outputs.services)[matrix.service]
        run: docker build --target test -t "business-api-test:${GITHUB_RUN_ID}" .
      - name: Business 실제 테스트 · 정적 검사 · bootJar
        if: matrix.service == 'business-api' && fromJSON(needs.changes.outputs.services)[matrix.service]
        run: |
          mkdir -p "$GRADLE_USER_HOME"
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$GRADLE_USER_HOME:/gradle" \
            -e GRADLE_USER_HOME=/gradle -e SPRING_PROFILES_ACTIVE=ci \
            -e TESTCONTAINERS_HOST_OVERRIDE=127.0.0.1 \
            -w "$GITHUB_WORKSPACE/server/business-api" \
            "business-api-test:${GITHUB_RUN_ID}" ./gradlew build --no-daemon --stacktrace
      - name: Business 테스트 도구 이미지 정리
        if: always() && matrix.service == 'business-api' && fromJSON(needs.changes.outputs.services)[matrix.service]
        run: docker image rm "business-api-test:${GITHUB_RUN_ID}" || true
      - name: 변경 없는 Notification은 체크섬 검사에 필요한 JAR만 생성
        if: matrix.service == 'notification' && !fromJSON(needs.changes.outputs.services)[matrix.service]
        run: ./gradlew bootJar --no-daemon --stacktrace
      - name: Notification 실제 테스트 · 정적 검사 · bootJar
        if: matrix.service == 'notification' && fromJSON(needs.changes.outputs.services)[matrix.service]
        run: ./gradlew build --stacktrace
      - name: Data export와 실제 Noti Jackson 체크섬 대조
        if: matrix.service == 'notification'
        run: python3 ../../.github/scripts/check-migration-checksum.py
      - uses: ./.github/actions/ci-jar
        if: fromJSON(needs.changes.outputs.services)[matrix.service]
        with:
          service: ${{ matrix.service }}
          operation: pack
      - uses: actions/upload-artifact@v4
        if: always() && fromJSON(needs.changes.outputs.services)[matrix.service]
        with:
          name: ${{ matrix.service }}-test-results
          path: |
            server/${{ matrix.service }}/build/test-results/
            server/${{ matrix.service }}/build/reports/
          retention-days: 7

      - name: 전체 검사 생략 기록
        if: ${{ !fromJSON(needs.changes.outputs.services)[matrix.service] }}
        run: echo '서비스 소스·빌드 입력 변경 없음. 전체 검사는 생략하고 관련 계약 검사는 유지한다.' >> "$GITHUB_STEP_SUMMARY"
