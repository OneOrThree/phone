name: Backend Gradle

# JVM 서버의 Gradle 검사를 한 곳에서 돈다.
#
# Data·Realtime·Satellite·prod가 같은 검사·JAR 전달 절차를 사용한다.
# 같은 실행 안의 service/revision/run_id가 일치하는 JAR만 환경별 이미지 조립에 넘긴다.
# 서로 다른 PR/main/release 실행 사이에서는 검사 성공을 추정해 재사용하지 않는다.
# Business는 business-pdf 입력으로 Docker test 이미지의 poppler 의존성을 유지한다.
#
# 호스트 Postgres 는 «띄우지 않는다»(GROMO-1793). 한동안 data-api 만 호스트 DB 가 필요하다고 보고
# `needs-db` 입력과 조건부 `docker run` 스텝을 뒀는데, 실측해 보니 그 DB 를 쓰는 테스트가 한 건도
# 없었다. 테스트는 전부 Testcontainers 로 직접 띄운다(`IntegrationTestBase`·`RepositoryTestBase` 를
# 상속하는 63개 포함). `SPRING_DATASOURCE_URL` 을 «죽은 포트»로 두고 전체 스위트를 돌려
# 2,152건 전부 통과하는 것을 확인하고 들어냈다.
#
# ⚠️ 그렇다고 `application-ci.yml` 의 `localhost:5432` 가 죽은 설정인 건 아니다 —
#    api-dog-generate.yml 의 `generateOpenApiDocs` 는 앱을 «실제로 부팅»하므로 거기선 진짜 DB 가
#    필요하고, 그쪽은 지금도 `services: postgres` 를 쓴다. 여기서 뺀 건 «테스트 경로»뿐이다.
#
# 부수 효과: 이 워크플로가 도커에 의존하지 않게 되어, 호출부가 `runs-on` 만 바꾸면 GitHub-hosted
# 러너로 그대로 옮겨진다.
#

on:
  workflow_call:
    inputs:
      enabled:
        description: 변경 대상 서비스만 실제 Gradle 검사를 수행한다
        type: boolean
        default: true
      business-pdf:
        description: Business PDF 테스트의 poppler 도구 이미지를 사용한다
        type: boolean
        default: false
      service:
        description: "server/ 아래 디렉터리 이름. data-api · realtime · business-api · notification"
        type: string
        required: true
      runs-on:
        description: >-
          잡을 돌릴 러너 라벨. 워크플로 입력은 «문자열만» 받으므로 JSON 배열 문자열로 넘기고
          아래에서 `fromJSON` 으로 푼다 — 예: '["ubuntu-latest"]'.
          기본값은 GitHub-hosted 다(GROMO-2121) — self-hosted `ci` 러너는 이미지 발행 전용 1대로
          줄었다(decisions.md A25). 검사 잡이 그 한 대를 물면 main 이미지 발행이 밀린다.
        type: string
        default: '["ubuntu-latest"]'
      tasks:
        description: "돌릴 Gradle 태스크. 기본 build 는 checkstyle·spotbugs·test·bootJar 를 전부 돈다"
        type: string
        default: "build"
      artifact-name:
        description: "업로드 아티팩트 이름. 호출부마다 달라야 한다 — 같으면 업로드가 충돌한다"
        type: string
        required: true
      artifact-path:
        description: "업로드할 경로(서비스 디렉터리 기준 상대). 비우면 업로드하지 않는다"
        type: string
        default: ""
      publish-jar:
        description: "검사 성공 후 같은 실행의 이미지 조립용 bootJar를 전달한다"
        type: boolean
        default: false
      measure-jar:
        description: >-
          bootJar 크기를 재서 `jar-size` 아티팩트로 올린다.
        type: boolean
        default: false

jobs:
  gradle:
    # `runs-on` 은 `inputs` 컨텍스트를 쓸 수 있는 자리다(GitHub 문서 「Contexts availability」의
    # `jobs.<job_id>.runs-on` 행: github · needs · strategy · matrix · vars · **inputs**).
    # 입력이 문자열이므로 `fromJSON` 으로 배열로 되돌린다.
    if: inputs.enabled
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    # 25 가 아니라 30 이다(옛 be-test.yml 에서 옮겨온 상한). 서비스 분리 회귀를 포함한 전체 테스트가
    # 공유 러너에서 20분을 넘을 수 있어서, 실행이 중간에 잘리지 않고 결과·JAR 측정까지 마치도록
    # 유한 상한을 30분으로 둔다.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server/${{ inputs.service }}
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - uses: actions/checkout@v4

      # 같은 VM 의 다른 러너가 공유 홈에 캐시를 복원하는 동안 JAR 을 덮어쓸 수 있다.
      # Gradle 실행과 캐시 복원을 이 잡의 임시 디렉터리로 격리한다(realtime-ci 에서 가져온 규율).
      - name: 서비스 전용 Gradle 홈 설정
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-${{ inputs.service }}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches
            ${{ env.GRADLE_USER_HOME }}/wrapper
          # 키에 «러너 종류»가 들어가야 한다. self-hosted 와 GitHub-hosted 는 `runner.os` 가 둘 다
          # `Linux` 라 이것만으로는 구분되지 않는데, GRADLE_USER_HOME 절대경로도 머신 구성도 달라서
          # 같은 키를 공유하면 한쪽이 먼저 올린 캐시가 다른 쪽에 그대로 박힌다(캐시 항목은 키당
          # 불변이라 «먼저 올린 쪽이 이긴다»). `runner.environment` 는 `self-hosted` / `github-hosted`
          # 둘 중 하나라 이 구분에 정확히 맞는다. 러너가 낡아 이 값이 비더라도 한쪽만 비므로
          # 구분은 유지된다.
          key: ${{ runner.os }}-${{ runner.environment }}-${{ inputs.service }}-gradle-${{ hashFiles(format('server/{0}/**/*.gradle*', inputs.service), format('server/{0}/**/gradle-wrapper.properties', inputs.service)) }}
          restore-keys: ${{ runner.os }}-${{ runner.environment }}-${{ inputs.service }}-gradle-

      - run: chmod +x gradlew

      - name: Business PDF 도구 이미지
        if: inputs.business-pdf
        run: docker build --target test -t "business-api-test:${GITHUB_RUN_ID}" .
      - name: Business 실제 검사·bootJar
        if: inputs.business-pdf
        run: |
          mkdir -p "$GRADLE_USER_HOME"
          docker run --rm --network host --user "$(id -u):$(id -g)" \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$GRADLE_USER_HOME:/gradle" \
            -e GRADLE_USER_HOME=/gradle -e SPRING_PROFILES_ACTIVE=ci \
            -e TESTCONTAINERS_HOST_OVERRIDE=127.0.0.1 \
            -w "$GITHUB_WORKSPACE/server/business-api" \
            "business-api-test:${GITHUB_RUN_ID}" ./gradlew ${{ inputs.tasks }} --no-daemon --stacktrace
      - name: Business 도구 이미지 정리
        if: always() && inputs.business-pdf
        run: docker image rm "business-api-test:${GITHUB_RUN_ID}" || true
      - name: Gradle ${{ inputs.tasks }}
        if: ${{ !inputs.business-pdf }}
        env:
          SPRING_PROFILES_ACTIVE: ci
        run: ./gradlew ${{ inputs.tasks }} --stacktrace

      - uses: ./.github/actions/ci-jar
        if: inputs.publish-jar
        with:
          service: ${{ inputs.service }}
          operation: pack

      - name: JAR 크기 측정
        if: inputs.measure-jar
        run: |
          set -euo pipefail
          if [ "${{ inputs.publish-jar }}" != "true" ]; then ./gradlew bootJar -x test; fi
          du -sb build/libs/*.jar | awk '{print $1}' > jar-size.txt

      - uses: actions/upload-artifact@v4
        if: always() && inputs.measure-jar
        with:
          name: jar-size
          path: server/${{ inputs.service }}/jar-size.txt
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always() && inputs.artifact-path != ''
        with:
          name: ${{ inputs.artifact-name }}
          path: server/${{ inputs.service }}/${{ inputs.artifact-path }}
          retention-days: 7
