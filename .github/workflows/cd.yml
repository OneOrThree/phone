name: CD

on:
  push:
    branches: [main]
    paths:
      - 'back/**'
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, dev]
    environment: production
    timeout-minutes: 40
    permissions:
      id-token: write
      contents: read
    env:
      # Datadog 오버레이를 보존해 배포할 때만 쓰인다 (아래 감지 스텝 참고) — OFF 상태면 미사용.
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_SITE: us5.datadoghq.com
    steps:
      - uses: actions/checkout@v4

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-phone
          aws-region: ap-northeast-2

      - name: AWS Secrets Manager에서 시크릿 로드
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id oneorthree/phone \
            --region ap-northeast-2 \
            --query SecretString --output text)
          echo "POSTGRES_DB=$(echo $SECRET | jq -r '.POSTGRES_DB')" >> $GITHUB_ENV
          echo "POSTGRES_USER=$(echo $SECRET | jq -r '.POSTGRES_USER')" >> $GITHUB_ENV
          echo "POSTGRES_PASSWORD=$(echo $SECRET | jq -r '.POSTGRES_PASSWORD')" >> $GITHUB_ENV
          echo "JWT_SECRET=$(echo $SECRET | jq -r '.JWT_SECRET')" >> $GITHUB_ENV
          echo "GOOGLE_CLIENT_ID=$(echo $SECRET | jq -r '.GOOGLE_CLIENT_ID')" >> $GITHUB_ENV
          echo "APPLE_CLIENT_ID=$(echo $SECRET | jq -r '.APPLE_CLIENT_ID')" >> $GITHUB_ENV
          # FCM 발송 (GROMO-528) — 서비스 계정 JSON 은 base64 인코딩 문자열로 저장돼 있음 (시크릿 선등록 완료)
          echo "FCM_PROJECT_ID=$(echo $SECRET | jq -r '.FCM_PROJECT_ID')" >> $GITHUB_ENV
          echo "FCM_SERVICE_ACCOUNT_JSON=$(echo $SECRET | jq -r '.FCM_SERVICE_ACCOUNT_JSON')" >> $GITHUB_ENV
          # 누끼 유해 이미지 모더레이션 (GROMO-1048) — OpenAI omni-moderation 서버 게이트(1044)용 키
          echo "OPENAI_API_KEY=$(echo $SECRET | jq -r '.OPENAI_API_KEY')" >> $GITHUB_ENV

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Docker 이미지 빌드
        uses: docker/build-push-action@v6
        with:
          context: ./back
          file: ./back/Dockerfile
          push: false
          load: true
          tags: |
            phone-app:${{ github.sha }}
            phone-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # dev-datadog.yml 로 Datadog 을 켜 둔 상태면 그 배선(-javaagent·DD_* env·통합 서비스 태그 라벨)을
      # 배포 후에도 유지한다 (GROMO-1233). dev 파일 단독으로 app 을 재생성하면 datadog 오버레이의 app
      # override 가 통째로 벗겨져, Agent 는 살아 있는데 트레이스만 끊기고 로그 service 태그가 컨테이너명
      # (phone-app)으로 폴백되는 상태가 됐다.
      # 배포가 Datadog 을 강제로 켜지는 않는다 — 켜져 있던 상태만 보존해 수동 토글(up/down) 의미를 지킨다.
      - name: Datadog 오버레이 감지
        run: |
          if [ -z "$(docker ps -q -f 'name=^gromo-datadog-agent$')" ]; then
            echo "COMPOSE_FILES=-f docker-compose.dev.yml" >> $GITHUB_ENV
            echo "Datadog OFF — dev 파일 단독으로 배포"
          elif [ -z "${DD_API_KEY}" ]; then
            # docker-compose.datadog.yml 은 DD_API_KEY 를 `:?` 로 fail-fast 한다. 키가 비면 compose 파싱
            # 단계에서 배포 전체가 죽으므로, 관측 배선이 배포를 막지 않도록 오버레이를 포기하고 경고만 남긴다.
            echo "COMPOSE_FILES=-f docker-compose.dev.yml" >> $GITHUB_ENV
            echo "::warning::Datadog Agent 는 기동 중이나 DD_API_KEY 미설정 — APM 오버레이 없이 배포한다(트레이스 끊김)"
          else
            echo "COMPOSE_FILES=-f docker-compose.dev.yml -f docker-compose.datadog.yml" >> $GITHUB_ENV
            echo "Datadog ON — APM 오버레이를 포함해 배포"
          fi

      - name: Docker Compose 배포
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker compose $COMPOSE_FILES up -d app
          docker compose $COMPOSE_FILES ps

      - name: 헬스체크
        run: |
          echo "앱 기동 대기 중..."
          # 60초(12회)는 7/24 성공 때도 55초 턱걸이였음 — 부팅이 늘며 초과, 150초로 확장 (GROMO-1068)
          for i in $(seq 1 30); do
            sleep 5
            if curl -sf http://localhost:8080/health; then
              echo "헬스체크 통과"
              exit 0
            fi
            echo "대기 중... ($((i*5))s)"
          done
          docker compose $COMPOSE_FILES logs app
          exit 1

      - name: 배포 실패 리포트
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            console.log('Deployment failed on', new Date().toISOString())
