# GROMO dev 서버 — CD (이미지 빌드 → GAR push → 앱 서버 배포)
#
# 구조는 prod(prod-ci → prod-cd)와 같다: CI가 이미지를 만들어 레지스트리에 올리고,
# CD가 그걸 받아 배포한다. 예전에는 dev 서버 한 대가 빌드와 실행을 겸해서
# 레지스트리를 거치지 않았는데, 러너를 빌드 서버로 분리하면서 통로가 필요해졌다.
#
# prod와 다른 점 — dev는 프로덕션이 아니라 롤백하지 않는다:
#   - 태그가 latest 하나뿐이다. SHA·SemVer 태그를 남기지 않는다.
#   - 따라서 이전 이미지로 되돌릴 수 없고, 복구는 재빌드가 유일한 경로다.
#   - 레지스트리도 ECR이 아니라 GAR을 쓴다(러너와 같은 리전이라 왕복이 없다).

name: CD

on:
  push:
    branches: [main]
    paths:
      - "back/**"
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ENV_SECRET_ID: oneorthree/phone
  GAR_HOST: asia-northeast3-docker.pkg.dev
  APP_IMAGE: asia-northeast3-docker.pkg.dev/oneorthree2/ci-cache/back:latest

jobs:
  build:
    name: 빌드 · GAR push
    runs-on: [self-hosted, ci, spot]
    timeout-minutes: 30 # self-hosted 기본 360분 — 러너 장기 점유 방지
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # GCE 러너의 SA 메타데이터 토큰으로 로그인 — gcloud도 키 파일도 필요 없다
      - name: GAR 인증
        run: |
          curl -s -H "Metadata-Flavor: Google" \
            "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token" \
          | jq -r .access_token \
          | docker login -u oauth2accesstoken --password-stdin "$GAR_HOST"

      - uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드 및 push
        uses: docker/build-push-action@v6
        with:
          context: ./back
          file: ./back/Dockerfile
          push: true
          # platforms 미지정 = 러너 네이티브(amd64). prod는 t4g라 arm64를 명시하지만
          # dev 앱 서버도 같은 amd64라 맞출 필요가 없다.
          provenance: false # attestation 매니페스트(태그 없는 이미지) 생성 방지
          tags: ${{ env.APP_IMAGE }}
          # 캐시는 러너와 같은 리전의 GAR(ci-cache) — prod-ci와 같은 저장소를 쓴다.
          # gha 캐시는 GCP 러너 ↔ GitHub 캐시 서비스 크로스클라우드 왕복이라
          # 히트조차 ~50s로 GAR 히트(~5s)의 10배가 걸렸다.
          # 태그를 arm64(prod)와 나눠 서로의 캐시를 덮어쓰지 않게 한다.
          cache-from: type=registry,ref=asia-northeast3-docker.pkg.dev/oneorthree2/ci-cache/back:cache-amd64
          cache-to: type=registry,ref=asia-northeast3-docker.pkg.dev/oneorthree2/ci-cache/back:cache-amd64,mode=max

      - name: 결과 요약
        run: |
          echo "### dev 이미지 push 완료 :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.APP_IMAGE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 태그는 latest 단일 — 롤백 불가(재빌드로만 복구)" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: 앱 서버 배포
    needs: build
    runs-on: [self-hosted, dev]
    environment: production
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: AWS 자격증명 (OIDC, keyless)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-phone
          aws-region: ${{ env.AWS_REGION }}

      # 값을 GITHUB_ENV가 아니라 .env 파일로 떨어뜨린다.
      # compose가 같은 디렉터리의 .env를 자동으로 읽으므로 별도 옵션이 필요 없고,
      # 배포 뒤에도 파일이 남아 수동으로 compose를 돌릴 때 같은 값이 쓰인다.
      - name: 런타임 값 로드 (Secrets Manager → .env)
        run: |
          umask 077
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "$ENV_SECRET_ID" \
            --query SecretString --output text)
          {
            echo "APP_IMAGE=$APP_IMAGE"
            echo "$SECRET" | jq -r '
              {POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD, JWT_SECRET,
               GOOGLE_CLIENT_ID, APPLE_CLIENT_ID,
               FCM_PROJECT_ID, FCM_SERVICE_ACCOUNT_JSON, OPENAI_API_KEY}
              | to_entries[] | "\(.key)=\(.value)"'
          } > .env

      - name: GAR 인증
        run: |
          curl -s -H "Metadata-Flavor: Google" \
            "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token" \
          | jq -r .access_token \
          | docker login -u oauth2accesstoken --password-stdin "$GAR_HOST"

      - name: 배포
        run: |
          docker compose -f docker-compose.dev.yml pull app
          docker compose -f docker-compose.dev.yml up -d app
          docker compose -f docker-compose.dev.yml ps

      - name: 헬스체크
        run: |
          echo "앱 기동 대기 중..."
          # 60초(12회)는 7/24 성공 때도 55초 턱걸이였음 — 부팅이 늘며 초과, 150초로 확장 (GROMO-1068)
          for i in $(seq 1 30); do
            sleep 5
            if curl -sf http://localhost:8080/health; then
              echo "헬스체크 통과"
              exit 0
            fi
            echo "대기 중... ($((i*5))s)"
          done
          docker compose -f docker-compose.dev.yml logs app
          exit 1

      - name: 배포 실패 리포트
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            console.log('Deployment failed on', new Date().toISOString())
