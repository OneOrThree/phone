name: Dev Monitoring (Observability)

# 관측 스택(Prometheus·Grafana·Loki·exporters)을 dev(self-hosted) 서버에 수동으로 올린다.
# 앱 배포(dev-cd.yml)와 분리 — app/db 는 건드리지 않고 관측 서비스만 관리한다.
# dev-cd.yml이 checkout 밖에 만든 runtime env를 재사용하므로 checkout 정리 뒤에도 DB 설정이 유지된다.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "동작 선택 (up: 기동/갱신, restart: 재시작, down: 관측만 제거)"
        type: choice
        required: true
        default: up
        options:
          - up
          - restart
          - down

concurrency:
  group: dev-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: [self-hosted, dev]
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # 관측 overlay — app-network 를 공유해 Prometheus 가 app:9091 을 스크레이프한다.
      # app/db 는 아래 OBS_SERVICES 에서 제외해 CD 로 배포된 컨테이너를 건드리지 않는다.
      # /var/lib/gromo/runtime 은 VM 시작 스크립트가 만드는 고정 경로(GROMO-2134) — 러너 디렉터리와 달리
      # 재부팅에도 살아남는다.
      RUNTIME_ENV_FILE: /var/lib/gromo/runtime/dev.env
      OBS_SERVICES: prometheus grafana loki promtail postgres-exporter redis-exporter kafka-exporter kafka-jmx-exporter node-exporter cadvisor
    steps:
      - uses: actions/checkout@v4

      - name: checkout 외부 runtime env 확인
        run: |
          set -euo pipefail
          test -s "$RUNTIME_ENV_FILE"
          test "$(stat -c '%a' "$RUNTIME_ENV_FILE")" = 600

      - name: 관측 스택 ${{ inputs.action }}
        run: |
          set -euo pipefail
          compose=(docker compose --env-file "$RUNTIME_ENV_FILE" \
            -f server/scripts/docker-compose.dev.yml -f server/scripts/docker-compose.observability.yml)
          read -r -a services <<< "$OBS_SERVICES"
          case "${{ inputs.action }}" in
            up)
              # 관측 서비스만 기동/갱신 — app/db 는 named 대상이 아니라 그대로 유지된다.
              "${compose[@]}" up -d "${services[@]}"
              # bind mount된 prometheus.yml만 바뀌면 Compose는 기존 컨테이너를 재생성하지 않는다.
              # 명시적으로 재시작해 신규 scrape target을 즉시 반영한다.
              "${compose[@]}" restart prometheus
              ;;
            restart)
              "${compose[@]}" restart "${services[@]}"
              ;;
            down)
              # 관측 서비스만 중지·제거. (compose down 은 프로젝트 전체를 내려 app/db 까지 지우므로 쓰지 않는다)
              "${compose[@]}" rm -sf "${services[@]}"
              ;;
          esac

      - name: 상태 확인
        if: ${{ inputs.action != 'down' }}
        run: |
          docker compose --env-file "$RUNTIME_ENV_FILE" \
            -f server/scripts/docker-compose.dev.yml -f server/scripts/docker-compose.observability.yml ps
          {
            echo "### Dev 관측"
            echo "- Grafana: http://$(hostname -I | awk '{print $1}'):3000"
            echo "- Prometheus targets: http://127.0.0.1:9090/targets"
            echo "- Redis target: redis-exporter:9121"
            echo "- Kafka target: kafka-exporter:9308 (브로커가 꺼져 있으면 no data)"
            echo "- Kafka JMX target: kafka-jmx-exporter:9404 (브로커 request rate)"
            echo "- Redis·Kafka dashboard: http://$(hostname -I | awk '{print $1}'):3000/d/redis-kafka-ops"
          } >> "$GITHUB_STEP_SUMMARY"
