name: Business API CI
on:
  pull_request:
    paths:
      - 'server/business-api/**'
      - 'server/scripts/docker-compose.business.yml'
      - '.github/workflows/business-ci.yml'
  push:
    branches: [main]
    paths:
      - 'server/business-api/**'
      - 'server/scripts/docker-compose.business.yml'
      - '.github/workflows/business-ci.yml'
concurrency:
  group: business-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  # 이 잡만 be-gradle.yml 을 쓰지 않는다(GROMO-1790). PDF 미리보기 테스트가 poppler-utils·util-linux
  # 에 의존하는데 그건 Dockerfile 의 `test` 스테이지가 깐다 — 일반 러너에서 gradle 을 돌리는
  # be-gradle.yml 로는 대체할 수 없다. 그 의존을 걷어내면 그때 호출부로 바꾼다.
  build:
    runs-on: [self-hosted, ci, spot]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server/business-api
    steps:
      - uses: actions/checkout@v4
      - name: 전용 Gradle 홈 설정
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-business" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches
            ${{ env.GRADLE_USER_HOME }}/wrapper
          key: ${{ runner.os }}-business-gradle-v1-${{ hashFiles('server/business-api/**/*.gradle*', 'server/business-api/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-business-gradle-v1-
      - name: 테스트 도구 이미지 빌드
        run: docker build --target test -t "business-api-test:${GITHUB_RUN_ID}" .
      - name: 빌드·정적 분석·테스트
        # 호스트 네트워크로 Testcontainers가 띄운 Redis의 동적 포트에 접근한다.
        # 산출물과 캐시 소유자는 러너 사용자로 유지한다.
        run: |
          mkdir -p "$GRADLE_USER_HOME"
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$GRADLE_USER_HOME:/gradle" \
            -e GRADLE_USER_HOME=/gradle \
            -e TESTCONTAINERS_HOST_OVERRIDE=127.0.0.1 \
            -w "$GITHUB_WORKSPACE/server/business-api" \
            "business-api-test:${GITHUB_RUN_ID}" \
            ./gradlew build --no-daemon --stacktrace
      - name: 테스트 도구 이미지 정리
        if: always()
        run: docker image rm "business-api-test:${GITHUB_RUN_ID}" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: business-api-test-results
          path: |
            server/business-api/build/test-results/
            server/business-api/build/reports/
          retention-days: 7
  docker-build:
    needs: [build]
    runs-on: [self-hosted, ci, spot]
    timeout-minutes: 25
    env:
      IMAGE: asia-northeast3-docker.pkg.dev/oneorthree2/ci-cache/business-api
    steps:
      - uses: actions/checkout@v4
      - name: GAR 인증
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H "Metadata-Flavor: Google" \
            "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token" \
          | jq -er .access_token \
          | docker login -u oauth2accesstoken --password-stdin asia-northeast3-docker.pkg.dev
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server/business-api
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
