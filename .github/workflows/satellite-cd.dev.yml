name: Satellite Dev CD

on:
  workflow_run:
    workflows: ["Satellite CI (dev)"]
    branches: [main]
    types: [completed]

concurrency:
  group: dev-vm-deploy
  cancel-in-progress: false
  # 기본(queue: single)은 대기 실행을 하나만 남기고 취소 → 머지 한 번에 CD 3개가 겹치면 하나가 사라짐
  queue: max

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE_ARN: arn:aws:iam::808715036056:role/gromo-dev-github-actions
  GAR_HOST: asia-northeast3-docker.pkg.dev
  # 공유 Redis ACL은 bootstrap 때 고정 경로에 반영한다. 일반 CD에서는 읽기 검증만 한다.
  # 나머지 env 는 job 마다 임시로 만들고 지움 (GROMO-2224)

jobs:
  # 배포 대상 판정을 따로 둠 → deploy 의 환경 이름을 dev-server/<배포한 서버> 로 정할 수 있음
  plan:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      business: ${{ steps.plan.outputs.business }}
      notification: ${{ steps.plan.outputs.notification }}
      any: ${{ steps.plan.outputs.any }}
      label: ${{ steps.plan.outputs.label }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: satellite-deploy-plan
          path: image-inputs/plan
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: 배포 대상 판정
        id: plan
        run: |
          set -euo pipefail
          plan=$(cat image-inputs/plan/satellite-deploy-plan.json)
          # jq 프로그램은 작은따옴표 안이므로 JSON 키의 큰따옴표를 escape 하지 않는다.
          # `.\"business-api\"`는 일부 jq 버전에서 backslash가 그대로 전달되어 출력만 비고,
          # command substitution의 실패가 echo에 가려져 Notification만 선택되는 문제가 있었다.
          # false도 유효한 무배포 판정이다. jq -e의 false 종료 코드를 값 추출에 사용하지 않는다.
          jq -e '(.["business-api"] | type) == "boolean" and (.notification | type) == "boolean"' <<< "$plan" > /dev/null
          business=$(jq -r '.["business-api"]' <<< "$plan")
          notification=$(jq -r '.notification' <<< "$plan")
          printf 'business=%s\nnotification=%s\n' "$business" "$notification" >> "$GITHUB_OUTPUT"
          # 위성 코드 변경 없는 실행(.github/scripts·docs 만 바뀜)은 배포할 게 없음 → 이후 단계 건너뜀
          if [ "$business" = true ] || [ "$notification" = true ]; then any=true; else any=false; fi
          echo "any=$any" >> "$GITHUB_OUTPUT"
          [ "$any" = true ] || echo "배포 대상 없음 — 건너뜀" >> "$GITHUB_STEP_SUMMARY"
          # Deployments 에 실제 배포한 서버 이름이 보이도록 환경 이름에 씀
          label=$(jq -r '[("business-api", "notification") as $k | select(.[$k] == true) | $k] | join("+")' <<< "$plan")
          echo "label=$label" >> "$GITHUB_OUTPUT"
          # ops-redeploy 가 이 실행이 무엇을 배포했는지 알 수 있게 기록. workflow_run 실행의 headSha 는
          # 배포한 커밋이 아니라 이벤트 시점 main 최신이라 그걸로는 CI 를 못 찾음
          jq -c --arg sha "${{ github.event.workflow_run.head_sha }}" '. + {head_sha: $sha}' <<< "$plan" > satellite-deploy-record.json
      - uses: actions/upload-artifact@v4
        with:
          name: satellite-deploy-record
          path: satellite-deploy-record.json
          retention-days: 30
          # ops-redeploy 의 재실행은 plan 도 다시 돌림 — 같은 실행에 같은 이름이 이미 있어 덮어써야 함
          overwrite: true

  deploy:
    needs: plan
    # 위성 코드 변경 없는 실행(.github/scripts·docs 만 바뀜)은 배포할 게 없음 → 건너뜀
    if: needs.plan.outputs.any == 'true'
    runs-on: [self-hosted, dev]
    environment:
      name: dev-server/${{ needs.plan.outputs.label }}
      url: https://oneorthree.dev.mooo.com
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write # 배포 결과 PR 표시
      issues: write # 라벨은 이슈 API
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.business == 'true'
        with:
          name: business-api-image
          path: image-inputs/business-api
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.notification == 'true'
        with:
          name: notification-image
          path: image-inputs/notification
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: AWS 자격증명
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gromo-satellite-dev-${{ github.run_id }}
          unset-current-credentials: true

      - name: 임시 dev.env 생성
        run: .github/scripts/dev-env.sh > /dev/null

      - name: 배포 입력 준비
        env:
          IMAGE_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # 이번에 안 바뀐 서비스는 떠 있는 컨테이너 이미지 유지 (상태 파일 대신 컨테이너에서 읽음)
          running_image() {
            local id
            id=$(docker ps -q --filter label=com.docker.compose.project=phone \
              --filter "label=com.docker.compose.service=$1" | head -n 1)
            if [ -z "$id" ]; then
              echo "::error::떠 있는 $1 컨테이너가 없어 유지할 이미지를 모름 — 이 서비스도 바뀐 커밋으로 배포하거나 수동으로 띄울 것" >&2
              return 1
            fi
            docker inspect -f '{{.Config.Image}}' "$id"
          }
          if [ "${{ needs.plan.outputs.business }}" = true ]; then
            business_image=$(cat image-inputs/business-api/business-api-image.txt)
          else
            business_image=$(running_image business-api)
          fi
          if [ "${{ needs.plan.outputs.notification }}" = true ]; then
            notification_image=$(cat image-inputs/notification/notification-image.txt)
          else
            notification_image=$(running_image notification)
          fi
          test -n "$business_image"
          test -n "$notification_image"
          dir=$(dirname "$RUNTIME_ENV_FILE")/satellites
          .github/scripts/dev-env.sh secrets \
          | python3 server/scripts/prepare-satellite-deploy.py \
              --environment dev \
              --output-dir "$dir" \
              --base-compose server/scripts/docker-compose.dev.yml \
              --shared-env-file "$RUNTIME_ENV_FILE" \
              --business-image "$business_image" \
              --notification-image "$notification_image"
          # 공유 Redis는 dev-env.sh에서 기존 ACL/실행 설정을 검증했다. 앱 CD는 재생성하지 않는다.
          {
            echo "SATELLITE_RUNTIME_DIR=$dir"
            echo "IMAGE_REVISION=$IMAGE_REVISION"
          } >> "$GITHUB_ENV"

      - name: GAR 인증
        uses: ./.github/actions/gar-login
        with:
          registry: ${{ env.GAR_HOST }}

      - name: Business·Notification 배포
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_SITE: us5.datadoghq.com
          IMAGE_VERSION: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # 이 시각 이후 시작한 컨테이너만 «이번에 재생성됨» 으로 보고 기동 시간을 잼 (wait-healthy.sh)
          echo "DEPLOY_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          compose=(docker compose --env-file "$RUNTIME_ENV_FILE" --env-file "$SATELLITE_RUNTIME_DIR/compose.env" \
            -f server/scripts/docker-compose.dev.yml -f server/scripts/docker-compose.satellites.yml \
            -f server/scripts/docker-compose.satellites.dev.yml)
          if docker ps --format '{{.Names}}' | grep -Fxq gromo-datadog-agent; then
            test -n "$DD_API_KEY"
            compose+=(-f server/scripts/docker-compose.datadog.yml)
          fi
          services=()
          if [ "${{ needs.plan.outputs.business }}" = true ]; then services+=(business-api); fi
          if [ "${{ needs.plan.outputs.notification }}" = true ]; then services+=(notification); fi
          test "${#services[@]}" -gt 0
          "${compose[@]}" config --quiet
          # 이미지부터 받음 — 못 받으면 Redis 를 건드리기 전에 멈춰 기존 Business·Redis 비밀번호가 그대로 맞음
          "${compose[@]}" pull "${services[@]}"
          if [ "${{ needs.plan.outputs.business }}" = true ]; then
            image=$("${compose[@]}" config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["business-api"]["image"])')
            test "$(docker image inspect "$image" --format '{{ index .Config.Labels "com.oneorthree.redis-layout" }}')" = shared-v1
          fi
          "${compose[@]}" up -d --no-deps "${services[@]}"
          "${compose[@]}" ps "${services[@]}"

      - name: 서비스 health check
        id: health
        env:
          IMAGE_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          compose=(docker compose --env-file "$RUNTIME_ENV_FILE" --env-file "$SATELLITE_RUNTIME_DIR/compose.env" \
            -f server/scripts/docker-compose.dev.yml -f server/scripts/docker-compose.satellites.yml \
            -f server/scripts/docker-compose.satellites.dev.yml)
          services=()
          if [ "${{ needs.plan.outputs.business }}" = true ]; then services+=(business-api); fi
          if [ "${{ needs.plan.outputs.notification }}" = true ]; then services+=(notification); fi
          # 서비스마다 결과를 따로 남김 → 한쪽만 실패해도 다른 쪽 PR 라벨은 성공으로 (GROMO-2224)
          results="$RUNNER_TEMP/satellite-health.txt"
          : > "$results"
          # 서비스를 동시에 검사 — 차례로 하면 뒤 서비스는 앞을 기다리는 동안 이미 healthy 라 기동 시간이 틀어짐
          check() {
            local service=$1 container
            container=$("${compose[@]}" ps -q "$service" || true)
            # 컨테이너 상태로 판정. 종료·재시작·unhealthy 는 즉시 실패
            if [ -n "$container" ] && .github/scripts/wait-healthy.sh "$(docker inspect -f '{{.Name}}' "$container" | sed 's#^/##')" 900; then
              echo "$service success" >> "$results"
            else
              echo "$service failure" >> "$results"
            fi
          }
          pids=()
          for service in "${services[@]}"; do check "$service" & pids+=($!); done
          for pid in "${pids[@]}"; do wait "$pid" || true; done
          # 성공 줄 수 == 서비스 수 — 결과를 쓰기 전에 죽은 검사(OOM 등)도 실패로 잡음
          [ "$(grep -c ' success$' "$results" || true)" = "${#services[@]}" ]

      - name: README 배포 상태 기록
        if: always() && (steps.health.outcome == 'success' || failure())
        env:
          BADGE_REVISION: ${{ github.event.workflow_run.head_sha }}
          BADGE_RESULT: ${{ steps.health.outcome == 'success' && 'success' || 'failure' }}
          BUSINESS_SELECTED: ${{ needs.plan.outputs.business }}
          NOTIFICATION_SELECTED: ${{ needs.plan.outputs.notification }}
        run: |
          mkdir -p "$RUNNER_TEMP/deployment-status"
          python3 - <<'PYTHON'
          import datetime, json, os, pathlib
          records = []
          results = pathlib.Path(os.environ['RUNNER_TEMP'], 'satellite-health.txt')
          outcomes = dict(line.split() for line in results.read_text().splitlines()) if results.exists() else {}
          for service, selected in [('business-api', os.environ['BUSINESS_SELECTED']), ('notification', os.environ['NOTIFICATION_SELECTED'])]:
              if selected == 'true':
                  records.append({'service': service, 'result': outcomes.get(service, 'failure')})
          now = datetime.datetime.now(datetime.timezone.utc).isoformat()
          for record in records:
              record.update(environment='dev', revision=os.environ['BADGE_REVISION'], finished_at=now)
          pathlib.Path(os.environ['RUNNER_TEMP'], 'deployment-status', 'dev.json').write_text(json.dumps(records))
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always() && (steps.health.outcome == 'success' || failure())
        with:
          name: deployment-status-dev-${{ github.run_attempt }}
          overwrite: true
          path: ${{ runner.temp }}/deployment-status/dev.json
          if-no-files-found: warn
          retention-days: 30

      - name: 배포 결과 PR 표시
        if: always() && (steps.health.outcome == 'success' || failure())
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          services=()
          if [ "${{ needs.plan.outputs.business }}" = true ]; then services+=(business-api); fi
          if [ "${{ needs.plan.outputs.notification }}" = true ]; then services+=(notification); fi
          results="$RUNNER_TEMP/satellite-health.txt"
          for service in "${services[@]}"; do
            # 헬스체크 결과가 없으면(앞 단계에서 실패) 실패로 표시
            result=$(awk -v s="$service" '$1 == s {print $2}' "$results" 2>/dev/null || true)
            .github/scripts/mark-deploy.sh "${result:-failure}" "$service" "${{ github.event.workflow_run.head_sha }}"
          done

      - name: 실패 로그
        if: failure()
        run: |
          services=()
          if [ "${{ needs.plan.outputs.business }}" = true ]; then services+=(business-api); fi
          if [ "${{ needs.plan.outputs.notification }}" = true ]; then services+=(notification); fi
          for service in "${services[@]}"; do
            container=$(docker ps -aq \
              --filter label=com.docker.compose.project=phone \
              --filter label=com.docker.compose.service="$service" | head -n 1)
            if [ -n "$container" ]; then docker logs --tail=100 "$container" 2>&1 || true; fi
          done

      - name: 임시 env 삭제
        if: always()
        run: rm -rf "$(dirname "${RUNTIME_ENV_FILE:-/nonexistent/x}")" 2>/dev/null || true

  snapshot:
    name: 원본 커밋에 위성 배포 완료 기록
    if: >-
      always() && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id &&
      github.event.workflow_run.head_branch == 'main'
    needs: [plan, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@v7
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          HAS_DEPLOY: ${{ needs.plan.outputs.any }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        with:
          script: |
            const source = context.payload.workflow_run;
            const ok = process.env.PLAN_RESULT === 'success' &&
              (process.env.HAS_DEPLOY === 'false' || process.env.DEPLOY_RESULT === 'success');
            const state = ok ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: source.head_sha, state,
              context: 'dev-deploy/satellites',
              description: `Satellite CI ${source.id}/${source.run_attempt || 1}: ${state}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
