name: OCI Image CI (dev)-v2
on:
  workflow_dispatch:
    inputs:
      slot:
        description: "덮어쓸 dev 이미지 슬롯. 현재 배포에 사용 중인 슬롯은 피한다."
        type: choice
        options: [a, b]
        default: a
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: cattus-oci-dev-image-publish
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        service: [data-api, realtime, business-api, notification]
    uses: ./.github/workflows/be-gradle.yml
    with:
      service: ${{ matrix.service }}
      artifact-name: ${{ matrix.service }}-oci-dev-v2-test-results
      publish-jar: true
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: cattus-oci-dev
    strategy:
      fail-fast: false
      matrix:
        service: [data-api, realtime, business-api, notification]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-jar
        with:
          service: ${{ matrix.service }}
          operation: verify
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server/${{ matrix.service }}
          build-args: JAR_SOURCE=prebuilt
          platforms: linux/arm64
          tags: cattus-dev/${{ matrix.service }}:dev-v2-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/oci-dev-image.tar
      - name: 비공개 Object Storage에 올리고 다시 로드해 검증
        env:
          SERVICE: ${{ matrix.service }}
          SLOT: ${{ inputs.slot }}
          IMAGE: cattus-dev/${{ matrix.service }}:dev-v2-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          OCI_DEV_IMAGE_WRITE_URL: ${{ secrets.OCI_DEV_IMAGE_WRITE_URL }}
          OCI_DEV_IMAGE_READ_URL: ${{ secrets.OCI_DEV_IMAGE_READ_URL }}
        run: |
          gzip -1 "$RUNNER_TEMP/oci-dev-image.tar"
          python3 .github/scripts/v2/dev/oci-image-archive.py publish \
            --service "$SERVICE" --slot "$SLOT" --revision "$GITHUB_SHA" \
            --image "$IMAGE" --archive "$RUNNER_TEMP/oci-dev-image.tar.gz" \
            --manifest "$SERVICE-oci-dev-v2-image.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-oci-dev-v2-image
          path: ${{ matrix.service }}-oci-dev-v2-image.json
          if-no-files-found: error
