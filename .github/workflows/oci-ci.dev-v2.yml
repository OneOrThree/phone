name: OCI Image CI (dev)-v2
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cattus-oci-dev-image-publish
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        service: [data-api, realtime, business-api, notification]
    uses: ./.github/workflows/be-gradle.yml
    with:
      service: ${{ matrix.service }}
      artifact-name: ${{ matrix.service }}-oci-dev-v2-test-results
      publish-jar: true
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: cattus-oci-dev
    strategy:
      fail-fast: false
      matrix:
        service: [data-api, realtime, business-api, notification]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-jar
        with:
          service: ${{ matrix.service }}
          operation: verify
      - name: OCIR 이미지 주소 확인
        id: target
        env:
          NAMESPACE: ${{ vars.OCIR_NAMESPACE }}
          SERVICE: ${{ matrix.service }}
        run: |
          if [[ ! "$NAMESPACE" =~ ^[a-z0-9]+$ ]]; then
            echo 'cattus-oci-dev 환경에 OCIR_NAMESPACE를 설정하세요.' >&2
            exit 1
          fi
          printf 'repository=nrt.ocir.io/%s/cattus-dev/%s\n' "$NAMESPACE" "$SERVICE" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: nrt.ocir.io
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: server/${{ matrix.service }}
          build-args: JAR_SOURCE=prebuilt
          platforms: linux/arm64
          push: true
          tags: ${{ steps.target.outputs.repository }}:dev-v2-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: 발행된 ARM64 이미지 확인 및 digest 기록
        env:
          SERVICE: ${{ matrix.service }}
          REPOSITORY: ${{ steps.target.outputs.repository }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          export IMAGE="$REPOSITORY@$DIGEST"
          docker pull --platform linux/arm64 "$IMAGE"
          [[ "$(docker image inspect "$IMAGE" --format '{{.Os}}/{{.Architecture}}')" == linux/arm64 ]]
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          service = os.environ["SERVICE"]
          manifest = {"service": service, "image": os.environ["IMAGE"], "revision": os.environ["GITHUB_SHA"]}
          Path(f"{service}-oci-dev-v2-image.json").write_text(json.dumps(manifest) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-oci-dev-v2-image
          path: ${{ matrix.service }}-oci-dev-v2-image.json
          if-no-files-found: error
