# GROMO prod 서버 — CD (latest 배포)
#
# prod-ci가 prod 브랜치에서 성공하면(=머지 후 빌드 완료) 자동으로 latest를 배포.
# 수동 실행도 가능. 배포 로직은 SSM Document(gromo-prod-deploy)에 박제.
# 특정 SHA로 되돌리는 건 prod-rollback.yml.

name: prod-cd

on:
  workflow_run:
    workflows: ["prod-ci"]
    types: [completed]
    branches: [prod]
  workflow_dispatch: # 수동으로 현재 latest 재배포

concurrency:
  group: prod-cd # rollback과 공유 → 동시 배포 방지
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  INSTANCE_ID: i-08b8c75419f42a551
  DEPLOY_BUCKET: gromo-prod-deploy-808715036056
  SSM_DOC: gromo-prod-deploy
  ROLE_ARN: arn:aws:iam::808715036056:role/gromo-prod-github-actions

jobs:
  deploy:
    # prod-ci 성공 시에만 (수동 실행은 항상)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'prod' }}

      - name: AWS 자격증명 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # compose(앱 소유)만 S3로. nginx.conf/인증서는 인프라(terraform/certbot) 관리.
      - name: compose S3 업로드
        run: aws s3 cp docker-compose.prod.yml s3://$DEPLOY_BUCKET/deploy/docker-compose.prod.yml

      - name: SSM 문서로 latest 배포
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "$SSM_DOC" \
            --parameters ImageTag=latest \
            --query "Command.CommandId" --output text)
          echo "CommandId=$CMD_ID (deploy latest)"
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
          echo "Status=$STATUS"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          [ "$STATUS" = "Success" ] || { aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text; exit 1; }
