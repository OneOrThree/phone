name: prod-cd
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: 릴리스 ID 또는 catus-vX.Y.Z (rollback에도 같은 형식 사용)
        required: true
        type: string
      operation:
        description: 최초 인프라 준비 bootstrap / 일반 deploy / 호환 릴리스 rollback
        required: true
        default: deploy
        type: choice
        options: [deploy, bootstrap, rollback]
permissions:
  contents: read
concurrency:
  group: catus-prod-deploy
  cancel-in-progress: false
  queue: max
jobs:
  deploy:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: catus-production
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::808715036056:role/catus-prod-deploy
          aws-region: ap-northeast-2
      - name: 기존 SSM 전송 의도 확인
        id: intent
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId, per_page: 100
            });
            const matches = artifacts.filter(item => item.name === 'catus-ssm-send-intent');
            if (matches.length > 1 || matches.some(item => item.expired)) {
              throw new Error('SSM 전송 의도 산출물 확인 필요');
            }
            core.setOutput('exists', matches.length === 1);
      - uses: actions/download-artifact@v4
        if: steps.intent.outputs.exists == 'true'
        with:
          name: catus-ssm-send-intent
          path: previous-intent
      - name: SSM 배포 요청 검증
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          OPERATION: ${{ inputs.operation }}
          HAS_INTENT: ${{ steps.intent.outputs.exists }}
          AWS_MAX_ATTEMPTS: '1'
        run: |
          set -euo pipefail
          args=(prepare --release-id "$RELEASE_ID" --operation "$OPERATION" --output ssm-request.json)
          if [ "$HAS_INTENT" = true ]; then args+=(--recover); fi
          python3 .github/scripts/catus-deploy.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: steps.intent.outputs.exists != 'true'
        with:
          name: catus-ssm-send-intent
          path: ssm-request.json
          if-no-files-found: error
          retention-days: 90
      - name: Catus 전용 SSM 배포·결과 대기
        env:
          HAS_INTENT: ${{ steps.intent.outputs.exists }}
          AWS_MAX_ATTEMPTS: '1'
        run: |
          set -euo pipefail
          args=(execute --request ssm-request.json)
          if [ "$HAS_INTENT" = true ]; then args+=(--previous-intent previous-intent/ssm-request.json); fi
          python3 .github/scripts/catus-deploy.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-status-prod-${{ github.run_attempt }}
          overwrite: true
          path: deployment-status-prod.json
          if-no-files-found: error
          retention-days: 30
