# GROMO prod 서버 — CD (수동, commit SHA 지정 배포)
#
# prod-ci가 ECR에 push해 둔 이미지 중 배포할 commit SHA를 직접 입력해 실행한다.
# latest 태그는 사용하지 않음 — CI는 SHA 태그만 push, 배포 시점/버전은 사람이 결정.
# 배포 로직은 SSM Document(gromo-prod-deploy)에 박제.
# 이전 SHA로 되돌리는 건 prod-rollback.yml (compose 갱신 없이 이미지만 교체).

name: prod-cd

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: '배포할 이미지 commit SHA (prod-ci가 ECR에 push한 태그)'
        required: true

concurrency:
  group: prod-cd # rollback과 공유 → 동시 배포 방지
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

# OIDC 인증 이전에 필요한 부트스트랩 값만 여기 유지.
# 리소스 식별자(INSTANCE_ID 등)는 Secrets Manager(gromo-prod/cicd)에서 주입 — terraform이 관리.
env:
  AWS_REGION: ap-northeast-2
  ROLE_ARN: arn:aws:iam::808715036056:role/gromo-prod-github-actions
  CICD_SECRET_ID: gromo-prod/cicd

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # compose를 이미지와 같은 커밋에서 가져와 이미지-설정 버전을 일치시킨다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.image_sha }}

      - name: AWS 자격증명 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CI/CD 설정 주입 (Secrets Manager → env)
        run: |
          aws secretsmanager get-secret-value --secret-id "$CICD_SECRET_ID" \
            --query SecretString --output text \
          | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"

      - name: 대상 이미지 존재 확인 (없으면 중단)
        run: |
          SHA="${{ github.event.inputs.image_sha }}"
          REPO_NAME="${ECR_REPO#*/}" # 레지스트리 호스트 제거 → 리포지토리명
          if ! aws ecr describe-images --repository-name "$REPO_NAME" \
                 --image-ids imageTag="$SHA" >/dev/null 2>&1; then
            echo "::error::ECR에 이미지 태그 '$SHA' 가 없습니다. prod-ci가 push한 SHA인지 확인하세요."
            exit 1
          fi
          echo "이미지 확인됨: $REPO_NAME:$SHA"

      # compose(앱 소유)만 S3로. nginx.conf/인증서는 인프라(terraform/certbot) 관리.
      - name: compose S3 업로드
        run: aws s3 cp docker-compose.prod.yml s3://$DEPLOY_BUCKET/deploy/docker-compose.prod.yml

      - name: SSM 문서로 SHA 배포
        run: |
          SHA="${{ github.event.inputs.image_sha }}"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "$SSM_DOC" \
            --parameters ImageTag="$SHA" \
            --query "Command.CommandId" --output text)
          echo "CommandId=$CMD_ID (deploy $SHA)"
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
          echo "Status=$STATUS"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          [ "$STATUS" = "Success" ] || { aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text; exit 1; }
