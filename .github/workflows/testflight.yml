name: TestFlight 배포

on:
  push:
    branches:
      - main
    # app/ 디렉터리 하위의 파일이 변경되었을 때만 자동 실행
    paths:
      - 'app/**'
  
  # 수동 실행 기능 유지
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, spot]
    permissions:
      id-token: write # AWS OIDC 역할 assume용
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Expo 패키지 설치
        run: npm install -g eas-cli

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-phone
          aws-region: ap-northeast-2

      - name: GoogleService-Info.plist 주입 (AWS Secrets Manager)
        working-directory: app
        run: |
          # oneorthree/phone 시크릿의 GoogleService-Info.plist 키 → ios/ 에 기록
          aws secretsmanager get-secret-value \
            --secret-id oneorthree/phone \
            --region ap-northeast-2 \
            --query SecretString --output text \
            | jq -r '."GoogleService-Info.plist"' > ios/GoogleService-Info.plist
          # 비어있지 않고 유효한 plist인지 검증(키 존재 확인)
          test -s ios/GoogleService-Info.plist
          grep -q "GOOGLE_APP_ID" ios/GoogleService-Info.plist
          # EAS는 .gitignore된 파일을 빌드 업로드에서 제외한다(staged여도 제외).
          # 따라서 CI 워크스페이스에서 임시 커밋으로 포함시킨다 (원격에 push하지 않음).
          git add -f ios/GoogleService-Info.plist
          git -c user.email=ci@oneorthree.local -c user.name=ci \
            commit -q -m "ci: inject GoogleService-Info.plist (ephemeral, not pushed)"

      - name: 의존성 설치
        working-directory: app
        run: npm install

      - name: EAS 빌드 & TestFlight 제출
        working-directory: app
        run: eas build --platform ios --profile production --auto-submit --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
