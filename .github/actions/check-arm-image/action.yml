name: PR 운영 아키텍처 이미지 검증
description: 서비스 CI가 검증한 동일 실행 JAR로 arm64 이미지를 발행 없이 조립한다
inputs:
  service:
    description: server 아래 서비스 이름
    required: true
runs:
  using: composite
  steps:
    - uses: docker/build-push-action@v6
      with:
        context: server/${{ inputs.service }}
        build-args: JAR_SOURCE=prebuilt
        platforms: linux/arm64
        push: false
        provenance: false
        cache-from: type=gha,scope=catus-prod-${{ inputs.service }}
        cache-to: type=gha,scope=catus-prod-${{ inputs.service }},mode=max
