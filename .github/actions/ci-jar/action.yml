name: 검증 JAR 전달
description: 같은 실행·리비전의 bootJar를 보관하거나 다운로드 후 검증한다
inputs:
  service:
    description: server 아래 서비스 이름
    required: true
  operation:
    description: pack 또는 verify
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      if: inputs.operation == 'verify'
      with:
        name: ${{ inputs.service }}-boot-jar
        path: server/${{ inputs.service }}/ci-artifact
    - name: JAR 실행·리비전·SHA-256 검증
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        OPERATION: ${{ inputs.operation }}
      run: |
        python3 "$GITHUB_ACTION_PATH/../../scripts/ci-jar.py" "$OPERATION" \
          --service "$SERVICE" --revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
    - uses: actions/upload-artifact@v4
      if: inputs.operation == 'pack'
      with:
        name: ${{ inputs.service }}-boot-jar
        path: server/${{ inputs.service }}/ci-artifact/
        if-no-files-found: error
        compression-level: 0
        retention-days: 7
        # 전체 재실행은 교체, 실패한 이미지 잡만 재실행하면 같은 run의 기존 JAR를 사용한다.
        overwrite: true
