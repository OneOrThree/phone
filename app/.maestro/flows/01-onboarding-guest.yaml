# GROMO-947 E2E ① — 온보딩 + 게스트 로그인 (QA ONB-01 축약)
# 앱 데이터를 초기화하고 신규 게스트로 온보딩을 완주해 홈에 진입한다.
# 시뮬레이터는 스크린타임 권한 API가 미동작 → '거부 경로'로 진행 (QA 문서 명시).
# 이후 플로(02·03)가 이 플로가 만든 계정·상태를 이어받는다 — 반드시 첫 번째로 실행.
appId: com.oneorthree.gromo
name: 01-onboarding-guest
---
- launchApp:
    clearState: true # AsyncStorage 초기화 → 온보딩부터 시작

# 스플래시 → W1 문제공감
- extendedWaitUntil:
    visible:
      id: 'onboarding.step.problem'
    timeout: 20000

# W1 → W2 → W3 (설득 화면 3장, 공통 CTA)
- tapOn:
    id: 'onboarding.cta'
- assertVisible:
    id: 'onboarding.step.together'
- tapOn:
    id: 'onboarding.cta'
- assertVisible:
    id: 'onboarding.step.subjectCompare'
- tapOn:
    id: 'onboarding.cta'

# 중간 로그인 — 게스트로 시작
- extendedWaitUntil:
    visible:
      id: 'login.guest'
    timeout: 10000
- tapOn:
    id: 'login.guest'

# W4 준비 시험(직군) 선택 — 첫 항목 선택 후 진행 (GET /occupations 응답 대기)
- extendedWaitUntil:
    visible:
      id: 'onboarding.step.category'
    timeout: 15000
- tapOn:
    id: 'onboarding.category.item.0'
- tapOn:
    id: 'onboarding.cta'

# W4-1 과목 확인 — 추천 과목이 있을 때만 나타나는 조건부 스텝.
# 조건 평가가 스텝 등장(추천 과목 API 응답)보다 먼저 돌면 스텝을 건너뛴 셈이 돼 플로가
# 갇히므로(코드리뷰 P2), 스텝이 뜰 시간을 먼저 준 뒤(안 뜨면 통과) 조건부로 진행한다.
- extendedWaitUntil:
    optional: true
    visible:
      id: 'onboarding.step.subjectEdit'
    timeout: 10000
- runFlow:
    when:
      visible:
        id: 'onboarding.step.subjectEdit'
    commands:
      - tapOn:
          id: 'onboarding.cta'

# W10 스크린타임 권한 — iOS 26 시뮬레이터는 시스템 권한 알럿을 실제로 띄운다.
# 시스템 UI라 testID 불가 → 여기만 문구 매칭 예외. '허용 안 함'으로 거부 경로(W10A) 확정.
- extendedWaitUntil:
    visible:
      id: 'onboarding.step.screentime'
    timeout: 15000
- tapOn:
    id: 'onboarding.screentime.allow'
# GROMO-934 리허설 오버레이 — 복제창의 '계속'이 실제 권한 요청을 트리거한다.
- tapOn:
    id: 'onboarding.screentime.guide.continue'
- tapOn:
    text: '허용 안 함|Don.t Allow'
- extendedWaitUntil:
    visible:
      id: 'onboarding.step.screentimeDenied'
    timeout: 10000
# 거부 스텝의 메인 CTA는 '설정에서 허용하기'(설정 앱 이동) — 진행은 보조 버튼('이대로 계속하기')
- tapOn:
    id: 'onboarding.secondary'

# W12 목표 설정 — 드럼 휠 스와이프는 자동화가 어려워 E2E 빌드에선 기본 목표가 채워진 채로
# 시작한다(CTA 활성, EXPO_PUBLIC_E2E). 일반 빌드는 두 목표를 다 정해야 CTA가 열린다.
- assertVisible:
    id: 'onboarding.step.goal'
- tapOn:
    id: 'onboarding.cta'

# W13 캐릭터 소개 — 기본 그로몬 소개, 그냥 진행
- assertVisible:
    id: 'onboarding.step.character_intro'
- tapOn:
    id: 'onboarding.cta'

# W13.5 누끼 체험 — 사진 선택은 자동화 불가라 E2E 빌드에선 CTA가 활성(스킵 허용, EXPO_PUBLIC_E2E).
- assertVisible:
    id: 'onboarding.step.cutout_experience'
- tapOn:
    id: 'onboarding.cta'

# W15 닉네임 — 중복(409) 회피를 위해 랜덤 숫자 접미사
- assertVisible:
    id: 'onboarding.step.nickname'
- tapOn:
    id: 'onboarding.nickname.input'
- inputText: 'e2e'
- inputRandomNumber:
    length: 6
- hideKeyboard
- tapOn:
    id: 'onboarding.cta'

# 푸시 권한 알럿은 안 뜬다 — E2E 빌드는 요청 자체를 스킵(services/push.ts, EXPO_PUBLIC_E2E)

# 가입 확정(POST /users/me) → 첫 홈 진입 코치마크(그로모 안내)가 홈을 덮는다.
# 페이지 수만큼 탭해서 닫은 뒤 홈 도착을 확인한다.
- extendedWaitUntil:
    visible:
      id: 'guide.overlay'
    timeout: 20000
- repeat:
    times: 8 # 안전 상한 — while 조건이 먼저 끝나면 그 시점에 종료
    while:
      visible:
        id: 'guide.overlay'
    commands:
      - tapOn:
          id: 'guide.overlay'
- extendedWaitUntil:
    visible:
      id: 'home.screen'
    timeout: 10000
