// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://devrepo.kakao.com/nexus/content/groups/public/' }
    maven { url 'https://www.jitpack.io' }
  }
}

// @react-native-kakao 2.4.8 pins compileSdk 33 in its package metadata.
// Keep native dependencies on the app SDK so CI does not need an obsolete SDK installation.
subprojects { subproject ->
  afterEvaluate {
    if (subproject.name in ['react-native-kakao_core', 'react-native-kakao_user'] &&
        subproject.extensions.findByName('android') != null) {
      subproject.android.compileSdkVersion rootProject.ext.compileSdkVersion
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
