// 안드로이드 홈 위젯 로컬 Expo 모듈 — 1.x(app/legacy)의 '오늘의 공부시간' 위젯을 2.0으로 이식한다.
// 2.0 APK는 같은 패키지(com.oneorthree.gromo)로 1.x를 제자리 업데이트하므로, 사용자가 이미
// 홈 화면에 둔 위젯이 살아남으려면 리시버 컴포넌트 이름(com.oneorthree.gromo.widget.StudyWidgetProvider)이
// 그대로 있어야 한다. settings.gradle의 expo autolinking이 app/modules/ 를 스캔해 자동 포함하므로
// android/ 를 prebuild로 다시 만들어도 이 모듈(매니페스트 리시버 포함)은 유지된다.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

android {
  namespace "com.oneorthree.gromo.widget"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}
