// 안드로이드 스크린타임 로컬 Expo 모듈(GROMO-994) — settings.gradle의 expo autolinking이
// app/modules/ 를 기본 검색 경로(nativeModulesDir)로 스캔해 자동 포함한다.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

android {
  namespace "com.oneorthree.gromo.screentime"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // WorkManager — 목표 초과 주기 체크(GROMO-997, GoalExceededCheckWorker). 15분 최소 주기
  // 제약의 표준 백그라운드 스케줄러로, 재부팅 후에도 등록을 스스로 복원한다.
  implementation "androidx.work:work-runtime:2.10.2"
}
