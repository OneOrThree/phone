appId: com.oneorthree.gromo
name: 2.3.4 카메라 초기화 오류 예외 처리 비교
---
- assertVisible: "카메라를 사용할 수 없어요."
- assertVisible: "휴식하기"
- tapOn: "카메라 인증"
- assertVisible: "카메라를 사용할 수 없어요."
- takeScreenshot: camera-unavailable-alive
- repeat:
    times: 3
    commands:
      - tapOn: "카메라 다시 시도"
      - assertVisible: "카메라를 사용할 수 없어요."
      - pressKey: HOME
      - launchApp:
          stopApp: false
      - assertVisible: "카메라를 사용할 수 없어요."
      - setOrientation: LANDSCAPE_LEFT
      - assertVisible: "카메라를 사용할 수 없어요."
      - setOrientation: PORTRAIT
      - assertVisible: "휴식하기"
- tapOn: "휴식하기"
- takeScreenshot: rest-after-camera-error
