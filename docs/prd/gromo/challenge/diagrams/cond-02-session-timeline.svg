<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="600" viewBox="0 0 1110 600" font-family="-apple-system, 'Helvetica Neue', Arial, 'Apple SD Gothic Neo', sans-serif">
  <rect width="1110" height="600" fill="#ffffff"/>

  <text x="30" y="35" font-size="14" font-weight="bold" fill="#111111">시작·종료·정산 조건 — 회차의 네 시각을 4조합에 겹쳐 본 것</text>
  <text x="30" y="56" font-size="11" fill="#666666">열 = 회차 행의 네 시각 필드 · 행 = 카테고리 × 방식</text>

  <!-- column headers -->
  <rect x="255" y="70" width="190" height="38" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="350" y="87" font-size="11" font-weight="bold" text-anchor="middle" fill="#111111">starts_at</text>
  <text x="350" y="102" font-size="11" font-weight="bold" text-anchor="middle" fill="#111111">회차 시작</text>
  <rect x="465" y="70" width="190" height="38" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="560" y="87" font-size="11" font-weight="bold" text-anchor="middle" fill="#111111">join_closes_at</text>
  <text x="560" y="102" font-size="11" font-weight="bold" text-anchor="middle" fill="#111111">참가 마감</text>
  <rect x="675" y="70" width="190" height="38" rx="4" fill="#f5f5f5" stroke="#666666"/>
  <text x="770" y="87" font-size="11" font-weight="bold" text-anchor="middle" fill="#111111">closes_at</text>
  <text x="770" y="102" font-size="11" font-weight="bold" text-anchor="middle" fill="#111111">회차 종료</text>
  <rect x="885" y="70" width="190" height="38" rx="4" fill="#d5e8d4" stroke="#82b366"/>
  <text x="980" y="87" font-size="11" font-weight="bold" text-anchor="middle" fill="#111111">settle_after</text>
  <text x="980" y="102" font-size="11" font-weight="bold" text-anchor="middle" fill="#111111">정산 시점</text>

  <!-- lane 1 : FOCUS x DURATION -->
  <rect x="30" y="120" width="1050" height="84" fill="#fafafa" stroke="#e0e0e0"/>
  <text x="40" y="147" font-size="12" font-weight="bold" fill="#1f5c99">FOCUS × DURATION</text>
  <text x="40" y="166" font-size="11" fill="#111111">평일 하루 60분 집중</text>
  <text x="40" y="184" font-size="10" fill="#777777">회차 = KST 자정~자정</text>
  <line x1="285" y1="170" x2="1070" y2="170" stroke="#bbbbbb"/>
  <circle cx="350" cy="170" r="6" fill="#6c8ebf" stroke="#ffffff"/>
  <circle cx="560" cy="170" r="6" fill="#d79b00" stroke="#ffffff"/>
  <circle cx="770" cy="170" r="6" fill="#666666" stroke="#ffffff"/>
  <circle cx="980" cy="170" r="6" fill="#82b366" stroke="#ffffff"/>
  <text x="350" y="155" font-size="12" font-weight="bold" text-anchor="middle" fill="#111111">00:00</text>
  <text x="560" y="155" font-size="12" font-weight="bold" text-anchor="middle" fill="#111111">24:00</text>
  <text x="770" y="155" font-size="12" font-weight="bold" text-anchor="middle" fill="#111111">24:00</text>
  <text x="980" y="155" font-size="12" font-weight="bold" text-anchor="middle" fill="#2d6a2d">24:00 · 즉시</text>
  <text x="665" y="156" font-size="10" text-anchor="middle" fill="#999999">동시</text>
  <text x="560" y="190" font-size="10" text-anchor="middle" fill="#777777">종일 참가</text>
  <text x="980" y="190" font-size="10" text-anchor="middle" fill="#777777">그레이스 0분</text>

  <!-- lane 2 : FOCUS x TIME_WINDOW -->
  <rect x="30" y="210" width="1050" height="84" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="40" y="237" font-size="12" font-weight="bold" fill="#1f5c99">FOCUS × TIME_WINDOW</text>
  <text x="40" y="256" font-size="11" fill="#111111">월·수·금 09:00~12:00 에 90분</text>
  <text x="40" y="274" font-size="10" fill="#777777">회차 = 그날의 창</text>
  <line x1="285" y1="260" x2="1070" y2="260" stroke="#bbbbbb"/>
  <circle cx="350" cy="260" r="6" fill="#6c8ebf" stroke="#ffffff"/>
  <circle cx="560" cy="260" r="6" fill="#d79b00" stroke="#ffffff"/>
  <circle cx="770" cy="260" r="6" fill="#666666" stroke="#ffffff"/>
  <circle cx="980" cy="260" r="6" fill="#82b366" stroke="#ffffff"/>
  <text x="350" y="245" font-size="12" font-weight="bold" text-anchor="middle" fill="#111111">09:00</text>
  <text x="560" y="245" font-size="12" font-weight="bold" text-anchor="middle" fill="#111111">09:00</text>
  <text x="770" y="245" font-size="12" font-weight="bold" text-anchor="middle" fill="#111111">12:00</text>
  <text x="980" y="245" font-size="12" font-weight="bold" text-anchor="middle" fill="#2d6a2d">12:30</text>
  <text x="455" y="246" font-size="10" text-anchor="middle" fill="#999999">동시</text>
  <text x="875" y="246" font-size="11" font-weight="bold" text-anchor="middle" fill="#2d6a2d">+30분 그레이스</text>
  <text x="560" y="280" font-size="10" text-anchor="middle" fill="#777777">창 열리는 순간 잠김</text>

  <!-- lane 3 : SCREEN_TIME x DURATION -->
  <rect x="30" y="300" width="1050" height="84" fill="#fafafa" stroke="#e0e0e0"/>
  <text x="40" y="327" font-size="12" font-weight="bold" fill="#a35c00">SCREEN_TIME × DURATION</text>
  <text x="40" y="346" font-size="11" fill="#111111">매일 스크린타임 120분 이하</text>
  <text x="40" y="364" font-size="10" fill="#777777">회차 = KST 자정~자정</text>
  <line x1="285" y1="350" x2="1070" y2="350" stroke="#bbbbbb"/>
  <circle cx="350" cy="350" r="6" fill="#6c8ebf" stroke="#ffffff"/>
  <circle cx="560" cy="350" r="6" fill="#d79b00" stroke="#ffffff"/>
  <circle cx="770" cy="350" r="6" fill="#666666" stroke="#ffffff"/>
  <circle cx="980" cy="350" r="6" fill="#82b366" stroke="#ffffff"/>
  <text x="350" y="335" font-size="12" font-weight="bold" text-anchor="middle" fill="#111111">00:00</text>
  <text x="560" y="335" font-size="12" font-weight="bold" text-anchor="middle" fill="#111111">24:00</text>
  <text x="770" y="335" font-size="12" font-weight="bold" text-anchor="middle" fill="#111111">24:00</text>
  <text x="980" y="335" font-size="12" font-weight="bold" text-anchor="middle" fill="#2d6a2d">익일 12:00</text>
  <text x="665" y="336" font-size="10" text-anchor="middle" fill="#999999">동시</text>
  <text x="875" y="336" font-size="11" font-weight="bold" text-anchor="middle" fill="#a35c00">보고 대기 12시간</text>
  <text x="560" y="370" font-size="10" text-anchor="middle" fill="#777777">종일 참가</text>

  <!-- lane 4 : SCREEN_TIME x TIME_WINDOW -->
  <rect x="30" y="390" width="1050" height="84" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="40" y="417" font-size="12" font-weight="bold" fill="#a35c00">SCREEN_TIME × TIME_WINDOW</text>
  <text x="40" y="436" font-size="11" fill="#111111">22:00~23:45 에 30분 이하</text>
  <text x="40" y="454" font-size="10" fill="#777777">회차 = 그날의 창 · iOS만 가능</text>
  <line x1="285" y1="440" x2="1070" y2="440" stroke="#bbbbbb"/>
  <circle cx="350" cy="440" r="6" fill="#6c8ebf" stroke="#ffffff"/>
  <circle cx="560" cy="440" r="6" fill="#d79b00" stroke="#ffffff"/>
  <circle cx="770" cy="440" r="6" fill="#666666" stroke="#ffffff"/>
  <circle cx="980" cy="440" r="6" fill="#82b366" stroke="#ffffff"/>
  <text x="350" y="425" font-size="12" font-weight="bold" text-anchor="middle" fill="#111111">22:00</text>
  <text x="560" y="425" font-size="12" font-weight="bold" text-anchor="middle" fill="#111111">22:00</text>
  <text x="770" y="425" font-size="12" font-weight="bold" text-anchor="middle" fill="#111111">23:45</text>
  <text x="980" y="425" font-size="12" font-weight="bold" text-anchor="middle" fill="#2d6a2d">익일 00:15</text>
  <text x="455" y="426" font-size="10" text-anchor="middle" fill="#999999">동시</text>
  <text x="875" y="426" font-size="11" font-weight="bold" text-anchor="middle" fill="#2d6a2d">+30분 그레이스</text>
  <text x="560" y="460" font-size="10" text-anchor="middle" fill="#777777">창 열리는 순간 잠김</text>

  <!-- note -->
  <rect x="30" y="488" width="1050" height="111" fill="#fff2cc" stroke="#d6b656"/>
  <text x="38" y="506" font-size="11" fill="#111111">· 회차 행은 KST 00:05 크론 + 「이번 주 남은 날 전부」 예약 시 lazy 생성 — 개설 API가 없다 (설계)</text>
  <text x="38" y="523" font-size="11" fill="#111111">· 창은 자정을 걸칠 수 없다 (시작 &lt; 종료) — 심야 목표는 자정 앞에서 끊는다</text>
  <text x="38" y="540" font-size="11" fill="#111111">· 그레이스 30분 = 창을 걸친 세션은 끝나야 서버가 안다 (진행 중 세션은 서버에 없다)</text>
  <text x="38" y="557" font-size="11" fill="#111111">· SCREEN_TIME 하루형만 익일 12:00 — 자정에 마감하면 기기가 자고 있어 보고가 못 온다</text>
  <text x="38" y="574" font-size="11" fill="#111111">· 정산이 24시간을 넘기면 회차를 무효화하고 전원 환불한다 (FR-45)</text>
  <text x="38" y="591" font-size="11" fill="#111111">· 가로축은 도식이며 시간 비율이 아니다</text>
</svg>
