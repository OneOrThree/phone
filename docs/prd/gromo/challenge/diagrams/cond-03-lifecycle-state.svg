<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" font-family="-apple-system, 'Helvetica Neue', Arial, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="a-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#666666"/></marker>
    <marker id="a-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6c8ebf"/></marker>
    <marker id="a-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
    <marker id="a-s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#888888"/></marker>
  </defs>
  <rect width="1000" height="570" fill="#ffffff"/>

  <text x="30" y="35" font-size="14" font-weight="bold" fill="#111111">종료·삭제 조건 — 챌린지와 회차는 다른 것이 끝난다</text>
  <text x="30" y="56" font-size="11" fill="#666666">왼쪽 = 그룹장이 누르는 것 · 오른쪽 = 서버가 확정하는 것</text>

  <!-- left container -->
  <rect x="30" y="70" width="440" height="400" fill="none" stroke="#cccccc" stroke-dasharray="5 4"/>
  <text x="40" y="92" font-size="12" font-weight="bold" fill="#555555">챌린지 &#160;group_challenges</text>

  <rect x="180" y="110" width="140" height="34" rx="4" fill="#f5f5f5" stroke="#666666"/>
  <text x="250" y="131" font-size="11" text-anchor="middle" fill="#111111">생성 (그룹장만)</text>
  <rect x="180" y="175" width="140" height="44" rx="4" fill="#d5e8d4" stroke="#82b366"/>
  <text x="250" y="202" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111">ACTIVE</text>
  <rect x="70" y="300" width="140" height="44" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="140" y="327" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111">ENDED</text>
  <rect x="300" y="300" width="150" height="44" rx="4" fill="#f8cecc" stroke="#b85450"/>
  <text x="375" y="327" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111">DELETED</text>

  <path d="M250,144 L250,170" fill="none" stroke="#666666" marker-end="url(#a-g)"/>
  <path d="M180,197 L140,197 L140,295" fill="none" stroke="#6c8ebf" marker-end="url(#a-b)"/>
  <path d="M320,197 L375,197 L375,295" fill="none" stroke="#b85450" marker-end="url(#a-r)"/>
  <path d="M210,322 L295,322" fill="none" stroke="#b85450" marker-end="url(#a-r)"/>

  <text x="160" y="190" font-size="10" text-anchor="middle" fill="#1f5c99">종료</text>
  <text x="348" y="190" font-size="10" text-anchor="middle" fill="#b85450">삭제</text>
  <text x="252" y="316" font-size="10" text-anchor="middle" fill="#b85450">삭제</text>

  <text x="140" y="360" font-size="10" text-anchor="middle" fill="#1f5c99">OPEN 회차가 하나도</text>
  <text x="140" y="374" font-size="10" text-anchor="middle" fill="#1f5c99">없을 때만 (FR-11)</text>
  <text x="375" y="360" font-size="10" text-anchor="middle" fill="#b85450">언제든 — OPEN 회차는</text>
  <text x="375" y="374" font-size="10" text-anchor="middle" fill="#b85450">무효화 + 전원 환불 (FR-12)</text>
  <text x="375" y="388" font-size="10" text-anchor="middle" fill="#b85450">진행 중이면 경고 확인 1단계 추가</text>

  <rect x="60" y="396" width="380" height="54" fill="#f9f9f9" stroke="#dddddd"/>
  <text x="250" y="411" font-size="10" text-anchor="middle" fill="#333333">만들면 통째로 불변 (FR-10)</text>
  <text x="250" y="425" font-size="10" text-anchor="middle" fill="#333333">카테고리 · 방식 · 요일 · 시간대 · 목표분 · 내기 켤지 여부 · 참가비</text>
  <text x="250" y="439" font-size="10" text-anchor="middle" fill="#333333">바꾸려면 삭제하고 새로 만든다</text>

  <!-- right container -->
  <rect x="520" y="70" width="440" height="400" fill="none" stroke="#cccccc" stroke-dasharray="5 4"/>
  <text x="530" y="92" font-size="12" font-weight="bold" fill="#555555">회차 &#160;bet_sessions</text>

  <rect x="540" y="270" width="120" height="50" rx="4" fill="#fff2cc" stroke="#d6b656"/>
  <text x="600" y="300" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111">OPEN</text>

  <rect x="720" y="150" width="230" height="56" rx="4" fill="#d5e8d4" stroke="#82b366"/>
  <text x="835" y="173" font-size="12" font-weight="bold" text-anchor="middle" fill="#111111">SETTLED</text>
  <text x="835" y="189" font-size="11" text-anchor="middle" fill="#333333">달성자 ≥ 1명 · 팟 분배</text>

  <rect x="720" y="215" width="230" height="56" rx="4" fill="#f5f5f5" stroke="#666666"/>
  <text x="835" y="238" font-size="12" font-weight="bold" text-anchor="middle" fill="#111111">FORFEITED</text>
  <text x="835" y="254" font-size="11" text-anchor="middle" fill="#333333">달성자 0명 · 팟 소멸 (이월 없음)</text>

  <rect x="720" y="280" width="230" height="56" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="835" y="303" font-size="12" font-weight="bold" text-anchor="middle" fill="#111111">VOIDED</text>
  <text x="835" y="319" font-size="11" text-anchor="middle" fill="#333333">참가 마감 시 참가자 &lt; 2명 · 전액 환불</text>

  <rect x="720" y="345" width="230" height="56" rx="4" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="835" y="368" font-size="12" font-weight="bold" text-anchor="middle" fill="#111111">REFUNDED</text>
  <text x="835" y="384" font-size="11" text-anchor="middle" fill="#333333">정산 24h 초과 · 전원 환불 (FR-45)</text>

  <path d="M660,295 L690,295 L690,178 L715,178" fill="none" stroke="#888888" marker-end="url(#a-s)"/>
  <path d="M660,295 L690,295 L690,243 L715,243" fill="none" stroke="#888888" marker-end="url(#a-s)"/>
  <path d="M660,295 L690,295 L690,308 L715,308" fill="none" stroke="#888888" marker-end="url(#a-s)"/>
  <path d="M660,295 L690,295 L690,373 L715,373" fill="none" stroke="#888888" marker-end="url(#a-s)"/>

  <path d="M450,322 L490,322 L490,448 L700,448 L700,322 L715,322" fill="none" stroke="#b85450" stroke-dasharray="5 4" marker-end="url(#a-r)"/>
  <rect x="595" y="440" width="200" height="16" fill="#ffffff"/>
  <text x="695" y="452" font-size="10" text-anchor="middle" fill="#b85450">삭제 시 OPEN 회차 → 전원 환불</text>
  <rect x="560" y="414" width="370" height="16" fill="#ffffff"/>
  <text x="745" y="426" font-size="10" text-anchor="middle" fill="#777777">네 상태 모두 종단 — 역전이가 없다. 정산은 되돌리지 않는다 (FR-27)</text>

  <!-- note -->
  <rect x="30" y="486" width="930" height="62" fill="#fff2cc" stroke="#d6b656"/>
  <text x="38" y="504" font-size="11" fill="#111111">· 정산이 끝난 회차(SETTLED · FORFEITED)는 삭제해도 되돌리지 않는다 — 환불 대상은 OPEN 회차의 에스크로뿐 (FR-13)</text>
  <text x="38" y="521" font-size="11" fill="#111111">· 종료든 삭제든 회차 이력은 「그룹 챌린지 내역」에 남는다 — 이력의 소유자가 챌린지가 아니라 그룹이기 때문이다 (FR-14)</text>
  <text x="38" y="538" font-size="11" fill="#111111">· 그래서 회차 행에 미션 스냅샷(카테고리·방식·목표분·창 시각)을 박제한다 — 챌린지가 사라져도 한 줄을 읽을 수 있어야 한다</text>
</svg>
