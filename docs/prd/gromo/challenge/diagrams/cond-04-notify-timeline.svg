<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" font-family="-apple-system, 'Helvetica Neue', Arial, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="n-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#666666"/></marker>
    <marker id="n-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#999999"/></marker>
    <marker id="n-p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9673a6"/></marker>
  </defs>
  <rect width="1120" height="650" fill="#ffffff"/>

  <text x="30" y="33" font-size="14" font-weight="bold" fill="#111111">푸시 알림 조건 — 언제 · 누구에게 · 승패를 싣는가</text>

  <line x1="60" y1="150" x2="1074" y2="150" stroke="#999999" marker-end="url(#n-a)"/>
  <text x="60" y="271" font-size="10" fill="#888888">회차 하나가 도는 동안 (챌린지 생성은 상시 이벤트)</text>

  <!-- card 1 (above) -->
  <rect x="50" y="54" width="160" height="76" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="130" y="74" font-size="10" font-weight="bold" text-anchor="middle" fill="#111111">챌린지 생성 (커밋 후)</text>
  <text x="130" y="91" font-size="10" font-weight="bold" text-anchor="middle" fill="#1f5c99">CHALLENGE_CREATED</text>
  <text x="130" y="108" font-size="10" text-anchor="middle" fill="#666666">그룹원 — 생성자 제외</text>
  <text x="130" y="125" font-size="10" text-anchor="middle" fill="#333333">승패 —</text>
  <line x1="130" y1="130" x2="130" y2="144" stroke="#bbbbbb"/>
  <circle cx="130" cy="150" r="6" fill="#6c8ebf" stroke="#ffffff"/>

  <!-- card 2 (below) -->
  <rect x="220" y="170" width="160" height="76" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="300" y="190" font-size="10" font-weight="bold" text-anchor="middle" fill="#111111">회차 시작 − 30분 (설계)</text>
  <text x="300" y="207" font-size="10" font-weight="bold" text-anchor="middle" fill="#1f5c99">CHALLENGE_SESSION_OPEN</text>
  <text x="300" y="224" font-size="10" text-anchor="middle" fill="#666666">그룹원</text>
  <text x="300" y="241" font-size="10" text-anchor="middle" fill="#333333">승패 —</text>
  <line x1="300" y1="156" x2="300" y2="170" stroke="#bbbbbb"/>
  <circle cx="300" cy="150" r="6" fill="#6c8ebf" stroke="#ffffff"/>

  <!-- card 3 (above) -->
  <rect x="390" y="54" width="160" height="76" rx="4" fill="#d5e8d4" stroke="#82b366"/>
  <text x="470" y="74" font-size="10" font-weight="bold" text-anchor="middle" fill="#111111">목표를 채운 순간</text>
  <text x="470" y="91" font-size="10" font-weight="bold" text-anchor="middle" fill="#2d6a2d">BET_WON</text>
  <text x="470" y="108" font-size="10" text-anchor="middle" fill="#666666">본인</text>
  <text x="470" y="125" font-size="10" text-anchor="middle" fill="#333333">승패 ✅ · 불가역</text>
  <line x1="470" y1="130" x2="470" y2="144" stroke="#bbbbbb"/>
  <circle cx="470" cy="150" r="6" fill="#82b366" stroke="#ffffff"/>

  <!-- card 4 (below) -->
  <rect x="560" y="170" width="160" height="76" rx="4" fill="#f5f5f5" stroke="#666666"/>
  <text x="640" y="190" font-size="10" font-weight="bold" text-anchor="middle" fill="#111111">회차 종료 (설계)</text>
  <text x="640" y="207" font-size="10" font-weight="bold" text-anchor="middle" fill="#444444">CHALLENGE_SESSION_END</text>
  <text x="640" y="224" font-size="10" text-anchor="middle" fill="#666666">그룹원</text>
  <text x="640" y="241" font-size="10" text-anchor="middle" fill="#333333">승패 ❌ · 미확정</text>
  <line x1="640" y1="156" x2="640" y2="170" stroke="#bbbbbb"/>
  <circle cx="640" cy="150" r="6" fill="#666666" stroke="#ffffff"/>

  <!-- card 5 (above) -->
  <rect x="730" y="54" width="160" height="76" rx="4" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="810" y="74" font-size="10" font-weight="bold" text-anchor="middle" fill="#111111">정산 직전 (설계)</text>
  <text x="810" y="91" font-size="10" font-weight="bold" text-anchor="middle" fill="#6b4a80">사일런트 · type 없음</text>
  <text x="810" y="108" font-size="10" text-anchor="middle" fill="#666666">해당 회차 참가자만</text>
  <text x="810" y="125" font-size="10" text-anchor="middle" fill="#333333">무음 · 큐 flush 전용</text>
  <line x1="810" y1="130" x2="810" y2="144" stroke="#bbbbbb"/>
  <circle cx="810" cy="150" r="6" fill="#9673a6" stroke="#ffffff"/>

  <!-- card 6 (below) -->
  <rect x="900" y="170" width="160" height="76" rx="4" fill="#d5e8d4" stroke="#82b366"/>
  <text x="980" y="190" font-size="10" font-weight="bold" text-anchor="middle" fill="#111111">정산 완료</text>
  <text x="980" y="207" font-size="10" font-weight="bold" text-anchor="middle" fill="#2d6a2d">BET_RESULT</text>
  <text x="980" y="224" font-size="10" text-anchor="middle" fill="#666666">참가자</text>
  <text x="980" y="241" font-size="10" text-anchor="middle" fill="#333333">승패 ✅</text>
  <line x1="980" y1="156" x2="980" y2="170" stroke="#bbbbbb"/>
  <circle cx="980" cy="150" r="6" fill="#82b366" stroke="#ffffff"/>

  <!-- pipeline -->
  <text x="60" y="306" font-size="12" font-weight="bold" fill="#111111">발송 파이프라인</text>

  <rect x="60" y="330" width="170" height="60" rx="4" fill="#f5f5f5" stroke="#666666"/>
  <text x="145" y="354" font-size="10" font-weight="bold" text-anchor="middle" fill="#111111">감지기 4종</text>
  <text x="145" y="372" font-size="10" text-anchor="middle" fill="#444444">생성·회차개설·종료·정산</text>

  <rect x="260" y="330" width="170" height="60" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="345" y="354" font-size="10" font-weight="bold" text-anchor="middle" fill="#111111">묶음</text>
  <text x="345" y="372" font-size="10" text-anchor="middle" fill="#444444">유저 × 그룹 × 시간슬롯</text>

  <rect x="460" y="330" width="170" height="60" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="545" y="354" font-size="10" font-weight="bold" text-anchor="middle" fill="#111111">dedup</text>
  <text x="545" y="372" font-size="10" text-anchor="middle" fill="#444444">NotificationSentLog 기준</text>

  <rect x="660" y="330" width="170" height="60" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="745" y="354" font-size="10" font-weight="bold" text-anchor="middle" fill="#111111">조용한 시간 필터</text>
  <text x="745" y="372" font-size="10" text-anchor="middle" fill="#444444">야간 설정 구간만 차단</text>

  <rect x="860" y="330" width="170" height="60" rx="4" fill="#d5e8d4" stroke="#82b366"/>
  <text x="945" y="350" font-size="10" font-weight="bold" text-anchor="middle" fill="#111111">발송 (FCM)</text>
  <text x="945" y="366" font-size="10" text-anchor="middle" fill="#444444">실패하면 이력을 안 남긴다</text>
  <text x="945" y="382" font-size="10" text-anchor="middle" fill="#444444">→ 다음 틱이 다시 집는다</text>

  <path d="M230,360 L255,360" fill="none" stroke="#666666" marker-end="url(#n-g)"/>
  <path d="M430,360 L455,360" fill="none" stroke="#666666" marker-end="url(#n-g)"/>
  <path d="M630,360 L655,360" fill="none" stroke="#666666" marker-end="url(#n-g)"/>
  <path d="M830,360 L855,360" fill="none" stroke="#666666" marker-end="url(#n-g)"/>

  <rect x="60" y="440" width="170" height="60" rx="4" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="145" y="464" font-size="10" font-weight="bold" text-anchor="middle" fill="#111111">사일런트</text>
  <text x="145" y="482" font-size="10" text-anchor="middle" fill="#444444">content-available (무음)</text>

  <path d="M230,470 L945,470 L945,395" fill="none" stroke="#9673a6" stroke-dasharray="5 4" marker-end="url(#n-p)"/>
  <text x="590" y="465" font-size="10" text-anchor="middle" fill="#6b4a80">묶음 · dedup · 조용한 시간을 전부 우회 — 대상은 해당 회차 참가자만</text>

  <!-- note -->
  <rect x="60" y="520" width="1000" height="114" fill="#fff2cc" stroke="#d6b656"/>
  <text x="68" y="538" font-size="11" fill="#111111">· 같은 무렵에 떨어지는 알림은 그룹 단위로 한 건에 묶는다 — 하루 2~3건이 상한 (FR-43)</text>
  <text x="68" y="555" font-size="11" fill="#111111">· 사일런트는 settle_after − 15분 (FR-22) — 회차 종료와의 앞뒤가 조합마다 갈린다</text>
  <text x="68" y="572" font-size="11" fill="#111111">&#160;&#160;창형 둘 · SCREEN_TIME 하루형은 회차 종료 뒤 / FOCUS 하루형만 그레이스 0(종료 = 정산)이라 15분 앞선다</text>
  <text x="68" y="589" font-size="11" fill="#111111">· 회차 종료 푸시는 승패를 싣지 않는다 — 스크린타임은 보고 전이라 아직 확정이 아니다 (FR-44)</text>
  <text x="68" y="606" font-size="11" fill="#111111">· 묶여서 나간 푸시의 딥링크는 그룹방까지만 — 특정 챌린지로 스크롤하지 않는다 (설계)</text>
  <text x="68" y="623" font-size="11" fill="#111111">· 삭제 시점의 환불도 「푸시로 알린다」(FR-44-4)고 돼 있으나 해당 data.type이 아직 없다 → §4.0.7 K3</text>
</svg>
