<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440" font-family="-apple-system, 'Helvetica Neue', Arial, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#666666"/></marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6c8ebf"/></marker>
  </defs>
  <rect width="1040" height="440" fill="#ffffff"/>

  <text x="40" y="28" font-size="14" font-weight="bold" fill="#333">발송 체인 — 판정 통과 후에도 3개 필터, 그리고 기록이 다음 판정을 먹인다</text>

  <!-- input -->
  <rect x="40" y="80" width="160" height="70" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="120" y="110" font-weight="bold">판정 통과</text>
    <text x="120" y="130">문구·숫자 확정</text>
  </g>

  <!-- filter chain container -->
  <rect x="240" y="56" width="450" height="120" rx="8" fill="none" stroke="#666666"/>
  <text x="254" y="78" font-size="11" font-weight="bold" fill="#333">PushNotificationService.sendIfAllowed</text>

  <g font-size="10" fill="#333" text-anchor="middle">
    <rect x="258" y="94" width="126" height="60" rx="6" fill="#fff2cc" stroke="#d6b656"/>
    <text x="321" y="119">알림 설정 off?</text>
    <text x="321" y="136">→ 드랍</text>

    <rect x="400" y="94" width="126" height="60" rx="6" fill="#fff2cc" stroke="#d6b656"/>
    <text x="463" y="119">FCM 토큰 없음?</text>
    <text x="463" y="136">→ 드랍</text>

    <rect x="542" y="94" width="130" height="60" rx="6" fill="#f8cecc" stroke="#b85450"/>
    <text x="607" y="119">조용한 시간 23~07?</text>
    <text x="607" y="136" font-weight="bold">→ 드랍 (연기 아님!)</text>
  </g>
  <text x="465" y="200" font-size="10" fill="#b85450" text-anchor="middle">드랍 = 조용히 사라짐 — 재시도·아침 연기 없음</text>

  <!-- fcm / lockscreen -->
  <rect x="730" y="80" width="100" height="70" rx="6" fill="#f5f5f5" stroke="#666666"/>
  <text x="780" y="120" font-size="11" font-weight="bold" fill="#333" text-anchor="middle">FCM</text>

  <rect x="870" y="80" width="130" height="70" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="935" y="110" font-weight="bold">APNs</text>
    <text x="935" y="130">→ 잠금화면</text>
  </g>

  <!-- 21:00 note -->
  <path d="M40,270 h316 l14,14 v86 h-330 z" fill="#fff2cc" stroke="#d6b656"/>
  <path d="M356,270 v14 h14 z" fill="#ffe599" stroke="#d6b656"/>
  <g font-size="10" fill="#333">
    <text x="54" y="292" font-weight="bold" font-size="11">21:00엔 선객이 둘 있다</text>
    <text x="54" y="312">평일: 오늘 미집중 · 일요일: 스트릭 위기</text>
    <text x="54" y="328">(스트릭은 22시 겹침을 피해 일요일만 이동)</text>
    <text x="54" y="346" font-weight="bold">→ 겹침은 게이트 ⑨가 흡수 — 단 선객들이</text>
    <text x="54" y="362" font-weight="bold">미로깅 타입이라 기록 추가가 선행</text>
  </g>

  <!-- logs cylinder -->
  <g>
    <path d="M460,280 a130,12 0 0,0 260,0 v78 a130,12 0 0,1 -260,0 z" fill="#fff2cc" stroke="#d6b656"/>
    <ellipse cx="590" cy="280" rx="130" ry="12" fill="#fff2cc" stroke="#d6b656"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="590" y="312" font-weight="bold">notification_sent_logs</text>
    <text x="590" y="330">발송 기록 (타입 · 시각)</text>
    <text x="590" y="348">기존 쿨다운 인프라 그대로</text>
  </g>

  <!-- arrows -->
  <g stroke="#666666" fill="none" marker-end="url(#ag)">
    <path d="M200,115 L238,115"/>
    <path d="M384,124 L398,124"/>
    <path d="M526,124 L540,124"/>
    <path d="M690,115 L728,115"/>
    <path d="M830,115 L868,115"/>
    <path d="M780,150 L780,240 L710,240 L710,272"/>
  </g>
  <text x="796" y="238" font-size="10" fill="#666">성공 시 기록</text>

  <!-- feedback loop -->
  <path d="M540,370 L540,404 L20,404 L20,115 L36,115" stroke="#6c8ebf" stroke-dasharray="6,4" fill="none" marker-end="url(#ab)"/>
  <text x="140" y="398" font-size="10" fill="#6c8ebf">다음 판정의 게이트 ⑦⑧⑨ 입력 (피드백 루프)</text>
</svg>
