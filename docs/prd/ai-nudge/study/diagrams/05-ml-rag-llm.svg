<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="660" viewBox="0 0 1040 660" font-family="-apple-system, 'Helvetica Neue', Arial, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#666666"/></marker>
    <marker id="ap" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9673a6"/></marker>
    <marker id="an" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#82b366"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
  </defs>
  <rect width="1040" height="660" fill="#ffffff"/>

  <text x="30" y="26" font-size="14" font-weight="bold" fill="#333">모델 · LLM · RAG — 세 부품이 각각 하는 일</text>

  <!-- ① model zone -->
  <rect x="30" y="44" width="980" height="180" rx="8" fill="none" stroke="#9673a6"/>
  <text x="44" y="66" font-size="12" font-weight="bold" fill="#9673a6">① 모델 학습 — 판단하는 함수를 데이터로 만든다</text>

  <g font-size="10" fill="#333" text-anchor="middle">
    <rect x="60" y="84" width="190" height="64" rx="6" fill="#f5f5f5" stroke="#666666"/>
    <text x="155" y="103" font-weight="bold" font-size="11">과거 데이터</text>
    <text x="155" y="121">특징 X + 정답 y</text>
    <text x="155" y="137">(focus_sessions 30건+)</text>

    <rect x="410" y="84" width="220" height="64" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
    <text x="520" y="103" font-weight="bold" font-size="11">모델 f</text>
    <text x="520" y="121">「이 상황이면 완주 확률 몇?」</text>
    <text x="520" y="137">(로지스틱 회귀면 충분)</text>

    <rect x="790" y="84" width="190" height="64" rx="6" fill="#d5e8d4" stroke="#82b366"/>
    <text x="885" y="103" font-weight="bold" font-size="11">예측</text>
    <text x="885" y="121">완주 확률 0.73</text>
    <text x="885" y="137">(결정은 여전히 우리 몫)</text>

    <rect x="410" y="168" width="220" height="42" rx="6" fill="#f5f5f5" stroke="#666666"/>
    <text x="520" y="186" font-weight="bold" font-size="11">오늘의 입력</text>
    <text x="520" y="202">화 10시 · 90분 세션 · 완주율 60%</text>
  </g>
  <g fill="none">
    <path d="M250,116 L408,116" stroke="#9673a6" marker-end="url(#ap)"/>
    <path d="M630,116 L788,116" stroke="#9673a6" marker-end="url(#ap)"/>
    <path d="M520,168 L520,150" stroke="#666666" marker-end="url(#ag)"/>
  </g>
  <text x="329" y="108" font-size="10" fill="#9673a6" text-anchor="middle">학습 (배치 · 하루 1번)</text>
  <text x="709" y="108" font-size="10" fill="#9673a6" text-anchor="middle">추론 (즉시)</text>

  <!-- ② LLM zone -->
  <rect x="30" y="244" width="980" height="180" rx="8" fill="none" stroke="#6c8ebf"/>
  <text x="44" y="266" font-size="12" font-weight="bold" fill="#6c8ebf">② LLM — 사실 목록 → 문장. 숫자는 절대 맡기지 않는다</text>

  <g font-size="10" fill="#333" text-anchor="middle">
    <rect x="60" y="288" width="190" height="64" rx="6" fill="#f5f5f5" stroke="#666666"/>
    <text x="155" y="307" font-weight="bold" font-size="11">프롬프트</text>
    <text x="155" y="325">사실 목록 + 어투 지시</text>
    <text x="155" y="341">숫자는 코드가 계산해 넣음</text>

    <rect x="300" y="288" width="180" height="64" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
    <text x="390" y="313" font-weight="bold" font-size="11">LLM 생성</text>
    <text x="390" y="333">(환각 위험 — 특히 숫자)</text>

    <rect x="530" y="288" width="200" height="64" rx="6" fill="#fff2cc" stroke="#d6b656"/>
    <text x="630" y="307" font-weight="bold" font-size="11">숫자 검증 게이트</text>
    <text x="630" y="325">원본 숫자가 그대로 있는가?</text>
    <text x="630" y="341">(코드가 검사)</text>

    <rect x="790" y="288" width="190" height="64" rx="6" fill="#d5e8d4" stroke="#82b366"/>
    <text x="885" y="313" font-weight="bold" font-size="11">발송</text>
    <text x="885" y="333">「지난주보다 47분 늘었어요…」</text>

    <rect x="530" y="376" width="200" height="36" rx="6" fill="#f8cecc" stroke="#b85450"/>
    <text x="630" y="392">검증 실패 → 1차 템플릿으로 폴백</text>
    <text x="630" y="406">(기능은 계속 동작)</text>
  </g>
  <g fill="none">
    <path d="M250,320 L298,320" stroke="#666666" marker-end="url(#ag)"/>
    <path d="M480,320 L528,320" stroke="#666666" marker-end="url(#ag)"/>
    <path d="M730,320 L788,320" stroke="#82b366" marker-end="url(#an)"/>
    <path d="M630,352 L630,374" stroke="#b85450" marker-end="url(#ar)"/>
  </g>
  <text x="759" y="312" font-size="10" fill="#3d7a37" text-anchor="middle">통과</text>

  <!-- ③ RAG zone -->
  <rect x="30" y="444" width="980" height="160" rx="8" fill="none" stroke="#82b366"/>
  <text x="44" y="466" font-size="12" font-weight="bold" fill="#3d7a37">③ RAG — 생성 전에 내 기록을 검색해 프롬프트에 끼운다 (gromo에선 R = SQL, 벡터DB 불필요)</text>

  <g font-size="10" fill="#333" text-anchor="middle">
    <rect x="60" y="492" width="170" height="60" rx="6" fill="#f5f5f5" stroke="#666666"/>
    <text x="145" y="515" font-weight="bold" font-size="11">상황</text>
    <text x="145" y="535">「아침 루틴을 제안할 시점」</text>

    <rect x="270" y="492" width="200" height="60" rx="6" fill="#d5e8d4" stroke="#82b366"/>
    <text x="370" y="509" font-weight="bold" font-size="11">내 기록 검색</text>
    <text x="370" y="527">focus_sessions SQL 조회</text>
    <text x="370" y="543">(벡터 검색은 비정형 텍스트용)</text>

    <rect x="510" y="492" width="190" height="60" rx="6" fill="#f5f5f5" stroke="#666666"/>
    <text x="605" y="515" font-weight="bold" font-size="11">근거를 프롬프트에 끼움</text>
    <text x="605" y="535">「화요일 오전 완주율 82%」</text>

    <rect x="740" y="492" width="80" height="60" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
    <text x="780" y="527" font-weight="bold" font-size="11">LLM</text>

    <rect x="850" y="486" width="150" height="72" rx="6" fill="#d5e8d4" stroke="#82b366"/>
    <text x="925" y="506" font-weight="bold" font-size="11">근거 있는 문장</text>
    <text x="925" y="524">「잘되던 화요일 오전으로</text>
    <text x="925" y="540">돌아가 볼까요?」</text>
  </g>
  <g stroke="#666666" fill="none" marker-end="url(#ag)">
    <path d="M230,522 L268,522"/>
    <path d="M470,522 L508,522"/>
    <path d="M700,522 L738,522"/>
    <path d="M820,522 L848,522"/>
  </g>

  <text x="30" y="636" font-size="11" font-weight="bold" fill="#333">1차에 셋 다 없는 이유: 판단=빼기 산수 · 근거=자기 테이블 조회 · 말=템플릿 4벌 — 쓸 자리가 없다. 자리가 생기는 순간이 2차다.</text>
</svg>
