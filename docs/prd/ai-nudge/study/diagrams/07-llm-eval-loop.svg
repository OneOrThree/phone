<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470" font-family="-apple-system, 'Helvetica Neue', Arial, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#666666"/></marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6c8ebf"/></marker>
    <marker id="an" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#82b366"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
    <marker id="ay" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d6b656"/></marker>
  </defs>
  <rect width="1040" height="470" fill="#ffffff"/>

  <text x="30" y="26" font-size="14" font-weight="bold" fill="#333">평가 기반 LLM 개발 루프 — 채점지가 API 호출 코드보다 먼저다</text>

  <!-- design zone -->
  <rect x="30" y="44" width="980" height="112" rx="8" fill="none" stroke="#666666"/>
  <text x="44" y="66" font-size="12" font-weight="bold" fill="#333">설계 — API 호출 코드보다 먼저 (①~⑤)</text>

  <g font-size="10" fill="#333" text-anchor="middle">
    <rect x="50" y="78" width="290" height="60" rx="6" fill="#f5f5f5" stroke="#666666"/>
    <text x="195" y="97" font-weight="bold" font-size="11">① 목표 정의</text>
    <text x="195" y="114">운영부담·효과를 수치로</text>
    <text x="195" y="129">(폴백률 &lt;5% · 검수 0건)</text>

    <rect x="370" y="78" width="300" height="60" rx="6" fill="#fff2cc" stroke="#d6b656"/>
    <text x="520" y="100" font-weight="bold" font-size="11">②③ 검수 기준 + In→Out 시험지</text>
    <text x="520" y="120">대표 입력 30케이스와 기대 출력을 미리</text>

    <rect x="700" y="78" width="292" height="60" rx="6" fill="#fff2cc" stroke="#d6b656"/>
    <text x="846" y="100" font-weight="bold" font-size="11">④⑤ 채점지 + 벤치마크 시트(엑셀)</text>
    <text x="846" y="120">행=케이스 · 열=프롬프트 버전별 점수</text>
  </g>

  <!-- pipeline zone -->
  <rect x="30" y="190" width="920" height="110" rx="8" fill="none" stroke="#6c8ebf"/>
  <text x="44" y="212" font-size="12" font-weight="bold" fill="#6c8ebf">⑥⑦⑧ 실행 파이프라인</text>

  <g font-size="10" fill="#333" text-anchor="middle">
    <rect x="55" y="224" width="160" height="58" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
    <text x="135" y="248" font-weight="bold" font-size="11">전처리</text>
    <text x="135" y="266">(이미지면 OpenCV 등)</text>

    <rect x="235" y="224" width="160" height="58" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
    <text x="315" y="248" font-weight="bold" font-size="11">프롬프트 조립</text>
    <text x="315" y="266">숫자는 코드가 계산해 넣음</text>

    <rect x="415" y="224" width="160" height="58" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
    <text x="495" y="257" font-weight="bold" font-size="11">LLM API 호출</text>

    <rect x="595" y="224" width="160" height="58" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
    <text x="675" y="248" font-weight="bold" font-size="11">JSON 구조화 출력</text>
    <text x="675" y="266">{title, body}</text>

    <rect x="775" y="224" width="160" height="58" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
    <text x="855" y="248" font-weight="bold" font-size="11">후처리·파싱</text>
    <text x="855" y="266">긴 응답에서 조각 추출</text>
  </g>

  <!-- row 3 -->
  <g font-size="10" fill="#333" text-anchor="middle">
    <rect x="640" y="340" width="360" height="60" rx="6" fill="#fff2cc" stroke="#d6b656"/>
    <text x="820" y="362" font-weight="bold" font-size="11">⑨ 자동 채점 — 시험지 전 케이스 재시험</text>
    <text x="820" y="382">숫자 보존·스키마·금칙어·길이 (채점기는 if문이다)</text>

    <rect x="440" y="340" width="160" height="60" rx="6" fill="#d5e8d4" stroke="#82b366"/>
    <text x="520" y="364" font-weight="bold" font-size="11">합격 → 출시</text>
    <text x="520" y="382">(폴백 게이트 유지)</text>

    <rect x="60" y="340" width="340" height="60" rx="6" fill="#d5e8d4" stroke="#82b366"/>
    <text x="230" y="358" font-weight="bold" font-size="11">⑩ 임팩트 측정</text>
    <text x="230" y="374">목표 대비 실측 — 폴백률·열람률·검수 시간</text>
    <text x="230" y="390">수치로 답 못 하면 비용만 넣은 것</text>
  </g>

  <!-- arrows: design row -->
  <g stroke="#666666" fill="none" marker-end="url(#ag)">
    <path d="M340,108 L368,108"/>
    <path d="M670,108 L698,108"/>
    <path d="M520,138 L520,188"/>
  </g>
  <text x="528" y="170" font-size="10" fill="#666">케이스 투입</text>

  <!-- 채점 기준 (right margin channel) -->
  <path d="M985,138 L985,336" stroke="#d6b656" stroke-dasharray="5,3" fill="none" marker-end="url(#ay)"/>
  <text x="994" y="240" font-size="10" fill="#8a6d1a" writing-mode="tb">채점 기준</text>

  <!-- pipeline arrows -->
  <g stroke="#6c8ebf" fill="none" marker-end="url(#ab)">
    <path d="M215,253 L233,253"/>
    <path d="M395,253 L413,253"/>
    <path d="M575,253 L593,253"/>
    <path d="M755,253 L773,253"/>
  </g>
  <path d="M855,282 L855,336" stroke="#666666" fill="none" marker-end="url(#ag)"/>

  <!-- row3 flow (right to left) -->
  <g stroke="#82b366" fill="none" marker-end="url(#an)">
    <path d="M638,370 L604,370"/>
    <path d="M438,370 L404,370"/>
  </g>
  <text x="621" y="362" font-size="10" fill="#3d7a37" text-anchor="middle">합격</text>

  <!-- fail loop -->
  <path d="M820,400 L820,432 L20,432 L20,253 L51,253" stroke="#b85450" stroke-dasharray="6,4" fill="none" marker-end="url(#ar)"/>
  <text x="330" y="448" font-size="10" fill="#b85450">불합격 — 프롬프트·전처리 수정 후 전체 재시험 (회귀 벤치마크 ⑨)</text>
</svg>
