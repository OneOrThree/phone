<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400" font-family="-apple-system, 'Helvetica Neue', Arial, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#666666"/></marker>
    <marker id="ap" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9673a6"/></marker>
  </defs>
  <rect width="1040" height="400" fill="#ffffff"/>

  <text x="40" y="32" font-size="14" font-weight="bold" fill="#333">AI 넛지 파이프라인 — 새로 만드는 건 ④ 하나</text>

  <!-- note above stage 4 -->
  <path d="M620,10 h196 l12,12 v20 h-208 z" fill="#fff2cc" stroke="#d6b656"/>
  <path d="M816,10 v12 h12 z" fill="#ffe599" stroke="#d6b656"/>
  <text x="724" y="31" font-size="11" fill="#333" text-anchor="middle">1차에서 새로 만드는 유일한 칸</text>
  <path d="M724,42 L724,68" stroke="#d6b656" stroke-dasharray="4,3" fill="none" marker-end="url(#ag)"/>

  <!-- stage boxes -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <rect x="40" y="70" width="168" height="72" rx="6" fill="#f5f5f5" stroke="#666666"/>
    <text x="124" y="90" font-weight="bold">① 측정</text>
    <text x="124" y="107">아이폰 익스텐션</text>
    <text x="124" y="124">GromoScreenTimeMonitor</text>

    <rect x="240" y="70" width="168" height="72" rx="6" fill="#f5f5f5" stroke="#666666"/>
    <text x="324" y="90" font-weight="bold">② 업로드</text>
    <text x="324" y="107">RN 앱</text>
    <text x="324" y="124">ScreenTimeSyncer</text>

    <rect x="440" y="70" width="168" height="72" rx="6" fill="#f5f5f5" stroke="#666666"/>
    <text x="524" y="90" font-weight="bold">③ 저장</text>
    <text x="524" y="107">서버 DB</text>
    <text x="524" y="124">daily_screen_time_stats</text>

    <rect x="640" y="70" width="168" height="72" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.6"/>
    <text x="724" y="90" font-weight="bold">④ 판정</text>
    <text x="724" y="107" font-weight="bold">매일 21:00 크론</text>
    <text x="724" y="124">「보낼 말이 있는가」</text>

    <rect x="840" y="70" width="168" height="72" rx="6" fill="#f5f5f5" stroke="#666666"/>
    <text x="924" y="90" font-weight="bold">⑤ 발송</text>
    <text x="924" y="107">FCM 푸시</text>
    <text x="924" y="124">PushNotificationService</text>
  </g>

  <!-- captions -->
  <g font-size="10" text-anchor="middle">
    <text x="124" y="160" fill="#3d7a37">✅ 이미 있음</text>
    <text x="324" y="160" fill="#3d7a37">✅ 이미 있음</text>
    <text x="524" y="160" fill="#3d7a37">✅ 이미 있음</text>
    <text x="724" y="160" fill="#b85450" font-weight="bold">❌ 이걸 만든다</text>
    <text x="924" y="160" fill="#3d7a37">✅ 이미 있음</text>
  </g>

  <!-- arrows between stages -->
  <g stroke="#666666" fill="none" marker-end="url(#ag)">
    <path d="M208,106 L238,106"/>
    <path d="M408,106 L438,106"/>
    <path d="M608,106 L638,106"/>
    <path d="M808,106 L838,106"/>
  </g>

  <!-- phase-2 layer -->
  <rect x="40" y="212" width="968" height="150" rx="6" fill="none" stroke="#9673a6" stroke-dasharray="6,4"/>
  <text x="54" y="232" font-size="11" fill="#9673a6">2차 — AI 층 · 파이프라인 모양은 그대로, ④의 속만 교체된다 (규칙 → 모델, 템플릿 → LLM)</text>

  <g font-size="11" fill="#333" text-anchor="middle">
    <rect x="70" y="256" width="270" height="60" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-dasharray="5,3"/>
    <text x="205" y="281" font-weight="bold">패턴 예측 모델</text>
    <text x="205" y="299">완주 확률 · 이탈 예측</text>

    <rect x="380" y="256" width="270" height="60" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-dasharray="5,3"/>
    <text x="515" y="281" font-weight="bold">RAG</text>
    <text x="515" y="299">내 기록을 찾아 프롬프트에 끼운다</text>

    <rect x="690" y="256" width="270" height="60" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-dasharray="5,3"/>
    <text x="825" y="281" font-weight="bold">LLM</text>
    <text x="825" y="299">사실 목록 → 자연어 문구</text>
  </g>

  <!-- dashed arrows from AI boxes up to stage 4 -->
  <g stroke="#9673a6" stroke-dasharray="5,3" fill="none" marker-end="url(#ap)">
    <path d="M205,256 C205,190 640,170 668,146"/>
    <path d="M515,256 C515,210 690,180 706,146"/>
    <path d="M825,256 C825,220 770,180 748,146"/>
  </g>
</svg>
