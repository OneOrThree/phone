<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans KR, Apple SD Gothic Neo, sans-serif" viewBox="0 0 1000 440" role="img" aria-label="oneorthree/server 레포에서 바뀐 서비스 이미지만 빌드되어 EC2 compose 의 해당 컨테이너만 교체된다">
