<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans KR, Apple SD Gothic Neo, sans-serif" viewBox="0 0 1000 620" role="img" aria-label="Target-1 서비스 구도 — 앱은 Business API 만 부르고, 데이터는 Data API 만 만지며, 알림은 코어를 부르지 않는다. 링크·MMP 는 A23 으로 Business·Data 안이다">
  <!-- A23(2026-09-13): 링크 서버(Vercel·MMP + 알림 콘솔)·Neon 상자와 그 화살표(앱→링크 · Business→링크 발급 · Data→링크 relay · 링크→Neon · 콘솔→알림 admin) 제거 -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1B2430"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6F8B"/></marker>
  </defs>
  <g stroke="#1B2430" stroke-width="1.75" fill="none" stroke-linejoin="miter" stroke-linecap="square">
    <!-- 앱 → Edge → Business (세로) -->
    <path d="M130,90 V150" marker-end="url(#a)"/>
    <path d="M130,210 V260" marker-end="url(#a)"/>
    <!-- Business → Data -->
    <path d="M220,290 H320" marker-end="url(#a)"/>
    <!-- Data → RDS -->
    <path d="M500,290 H600" marker-end="url(#a)"/>
    <!-- 알림 → RDS (gromo_notification) -->
    <path d="M750,400 V320" marker-end="url(#a)"/>
    <!-- 알림 → FCM -->
    <path d="M690,460 V540" marker-end="url(#a)"/>
    <!-- Business → 알림 동기 명령·조회 (기기 토큰 · 알림 설정 · 콘솔→admin 은 나중, L16) -->
    <path d="M220,310 H260 V500 H740 V460" marker-end="url(#a)"/>
  </g>
  <g stroke="#1F6F8B" stroke-width="1.75" fill="none" stroke-dasharray="7 5" stroke-linejoin="miter" stroke-linecap="square">
    <!-- Business → Kafka -->
    <path d="M130,320 V430 H320" marker-end="url(#ad)"/>
    <!-- Data → Kafka -->
    <path d="M410,320 V400" marker-end="url(#ad)"/>
    <!-- Kafka → 알림 -->
    <path d="M500,430 H600" marker-end="url(#ad)"/>
  </g>
  <g stroke="#1B2430" stroke-width="1.5" fill="none" stroke-dasharray="2 4" stroke-linejoin="miter">
    <!-- 알림 → Data 리컨실 -->
    <path d="M620,400 V360 H470 V320" marker-end="url(#a)"/>
  </g>

  <!-- boxes -->
  <g stroke="#1B2430" stroke-width="1.75" fill="#FFFFFF">
    <rect x="40" y="30" width="180" height="60"/>
    <rect x="40" y="150" width="180" height="60"/>
    <rect x="40" y="260" width="180" height="60" fill="#E3EFF3" stroke="#1F6F8B"/>
    <rect x="320" y="260" width="180" height="60" fill="#E3EFF3" stroke="#1F6F8B"/>
    <rect x="600" y="260" width="180" height="60"/>
    <rect x="320" y="400" width="180" height="60" stroke="#1F6F8B"/>
    <rect x="600" y="400" width="180" height="60" fill="#E3EFF3" stroke="#1F6F8B"/>
    <rect x="600" y="540" width="180" height="60"/>
  </g>
  <!-- A23 메모 (컴포넌트 아님) -->
  <g stroke="#5E6670" stroke-width="1.25" fill="#FFFFFF" stroke-dasharray="4 3">
    <rect x="780" y="30" width="200" height="72"/>
  </g>
  <g font-size="15" font-weight="600" text-anchor="middle" fill="#1B2430">
    <text x="130" y="55">gromo 앱</text><text x="130" y="76" font-size="12" font-weight="400" fill="#5E6670">React Native</text>
    <text x="130" y="175">Cloudflare · nginx</text><text x="130" y="196" font-size="12" font-weight="400" fill="#5E6670">/api /auth 전량</text>
    <text x="130" y="285">Business API</text><text x="130" y="306" font-size="12" font-weight="400" fill="#5E6670">인증 · BFF · 패스스루 · DB 없음</text>
    <text x="410" y="285">Data API</text><text x="410" y="306" font-size="12" font-weight="400" fill="#5E6670">DB 유일 소유 · TX · 정산 크론</text>
    <text x="690" y="285">RDS PostgreSQL</text><text x="690" y="306" font-size="12" font-weight="400" fill="#5E6670">gromo · gromo_notification</text>
    <text x="410" y="425">Kafka</text><text x="410" y="446" font-size="12" font-weight="400" fill="#5E6670">단일 노드 · notification-events</text>
    <text x="690" y="425">알림 서버</text><text x="690" y="446" font-size="12" font-weight="400" fill="#5E6670">등록부 크론 · 템플릿 · 워커</text>
    <text x="690" y="575">FCM</text>
    <text x="880" y="52" font-size="13" fill="#5E6670">링크·MMP — A23 (2026-09-13)</text><text x="880" y="70" font-size="12" font-weight="400" fill="#5E6670">별도 서버 · DB 없음</text><text x="880" y="88" font-size="12" font-weight="400" fill="#5E6670">공개 표면 Business · 원장 Data(gromo)</text>
  </g>
  <!-- line labels -->
  <g font-size="12" fill="#5E6670">
    <text x="240" y="282">조회 · 명령</text>
    <text x="520" y="282">gromo</text>
    <text x="140" y="125">/api /auth · /l/* · /.well-known/* · /console/* (A23)</text>
    <text x="758" y="365" text-anchor="end">gromo_notification</text>
    <text x="140" y="420" fill="#1F6F8B">이벤트 (요청형)</text>
    <text x="418" y="395" fill="#1F6F8B">이벤트 (정산형)</text>
    <text x="510" y="420" fill="#1F6F8B">consume</text>
    <text x="300" y="516">기기 토큰 · 알림 설정 (동기 명령·조회) · 콘솔 → admin API (나중, L16)</text>
    <text x="480" y="376">조회 3종 (리컨실 · ack · 적격)</text>
  </g>
</svg>
