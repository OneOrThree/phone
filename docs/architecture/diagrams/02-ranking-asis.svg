<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans KR, Apple SD Gothic Neo, sans-serif" viewBox="0 0 1000 520" role="img" aria-label="AS-IS: 세션 종료가 daily_focus_stats 에 초를 쌓고, 조회는 매번 SUM 정렬, 월요일 배치가 티어를 확정한다">
  <defs>
    <marker id="ra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1B2430"/></marker>
    <marker id="ram" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B5542F"/></marker>
  </defs>
  <g stroke="#1B2430" stroke-width="1.75" fill="none" stroke-linejoin="miter" stroke-linecap="square">
    <path d="M220,80 H340" marker-end="url(#ra)"/>
    <path d="M450,250 V110" marker-end="url(#ra)"/>
    <path d="M220,450 H300 V300 H340" marker-end="url(#ra)"/>
    <path d="M680,445 H660 V300 H640" marker-end="url(#ra)"/>
    <path d="M790,400 V230" marker-end="url(#ra)"/>
    <path d="M900,430 H940 V80 H900" marker-end="url(#ra)"/>
  </g>
  <g stroke="#B5542F" stroke-width="3" fill="none" stroke-linejoin="miter" stroke-linecap="square">
    <path d="M200,420 V140 H400 V110" marker-end="url(#ram)"/>
  </g>
  <g stroke="#1B2430" stroke-width="1.75" fill="#FFFFFF">
    <rect x="40" y="50" width="180" height="60"/>
    <rect x="340" y="50" width="220" height="60"/>
    <rect x="680" y="50" width="220" height="60"/>
    <rect x="680" y="170" width="220" height="60"/>
    <rect x="340" y="250" width="300" height="100" fill="#EEF0EA"/>
    <rect x="40" y="420" width="180" height="60"/>
    <rect x="680" y="400" width="220" height="90"/>
  </g>
  <g font-size="15" font-weight="600" text-anchor="middle" fill="#1B2430">
    <text x="130" y="75">세션 종료</text><text x="130" y="96" font-size="12" font-weight="400" fill="#5E6670">FocusService · 한 TX</text>
    <text x="450" y="75">daily_focus_stats</text><text x="450" y="96" font-size="12" font-weight="400" fill="#5E6670">유저 × 날짜 × 초 — 점수의 유일한 원천</text>
    <text x="790" y="75">users.tier_level</text><text x="790" y="96" font-size="12" font-weight="400" fill="#5E6670">티어의 정본 · O(1)</text>
    <text x="790" y="195">league_weekly_results</text><text x="790" y="216" font-size="12" font-weight="400" fill="#5E6670">정산 로그 · 승격/강등/유지</text>
    <text x="490" y="276">Data API · read model 쿼리 6종</text>
    <text x="130" y="445">gromo 앱 · 리그 화면</text><text x="130" y="466" font-size="12" font-weight="400" fill="#5E6670">9콜 + 50페이지</text>
    <text x="790" y="428">주간 정산 배치</text><text x="790" y="449" font-size="12" font-weight="400" fill="#5E6670">월 00:00 · keyset 루프 · 멱등 앵커</text><text x="790" y="469" font-size="12" font-weight="400" fill="#5E6670">임계값 절대평가 → 승강</text>
  </g>
  <g font-family="IBM Plex Mono, monospace" font-size="12" fill="#1B2430">
    <text x="356" y="302">SUM(초) GROUP BY user ORDER BY DESC</text>
    <text x="356" y="320">findTop · findRankOf(CTE×2) · keyset · 정산</text>
    <text x="356" y="338" fill="#5E6670">조회할 때마다 전 유저 집계 — 옳지만 비싸다</text>
  </g>
  <g font-size="12" fill="#5E6670">
    <text x="232" y="72">INSERT 초</text>
    <text x="458" y="185">SUM</text>
    <text x="40" y="408">GET ranking · me/rank · me/tier · schedule</text>
    <text x="654" y="380" text-anchor="end">같은 쿼리로 정산</text>
    <text x="798" y="320">정산 로그</text>
    <text x="946" y="260">tier 쓰기</text>
    <text x="210" y="160" fill="#B5542F" font-weight="700">/focus-session 최대 50페이지 × 100건</text>
    <text x="210" y="177" fill="#B5542F">→ 앱이 내 주간 집중초를 직접 합산</text>
  </g>
</svg>
