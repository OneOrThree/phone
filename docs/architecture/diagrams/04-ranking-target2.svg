<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans KR, Apple SD Gothic Neo, sans-serif" viewBox="0 0 1000 500" role="img" aria-label="Target-2: 세션 종료가 score-events 를 Kafka 에 발행, 컨슈머가 Redis ZSET 을 ZINCRBY, Business API 는 ZREVRANGE·ZREVRANK 로 O(log N) 조회, 진실원천은 DB, 장애 시 replay">
  <defs>
