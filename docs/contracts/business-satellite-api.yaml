openapi: 3.1.0

# ─────────────────────────────────────────────────────────────────────────────
# Business API ↔ Data / 알림 / 링크 내부 계약 (GROMO-1659 · 1660 최소 Business)
#
# 이 파일이 정의하는 것은 «Business 가 소비자로서 필요한 표면»뿐이다. 1661 의 전체 BFF/IdP 이전
# (인증 발급·refresh·logout·그 밖의 패스스루)은 여기 없다 — 최소 Business 의 범위를 문서로도 좁혀 둔다.
#
# ⚠️ 구현 현황 (2026-09-11, main = 69d05f873)
#   - Data:  `/internal/*` 컨트롤러가 **0건**이다(`grep -rn "/internal" server/data-api/src/main/java`).
#            아래 Data 섹션은 전부 «아직 없는» 제공자다.
#   - 알림:  N 담당이 구현 중. 아래 경로는 제안이다.
#   - 링크:  coordinator 가 직접 구현 중. 확정 OpenAPI 와 맞춰 최종 검증해야 한다.
#   소비자(Business)가 완성됐다는 사실로 «연결됐다»고 보고하지 않는다.
#
# 규약
#   - 인증: 모든 경로는 `Authorization: Bearer <caller 별 서비스 토큰>`. caller 별로 토큰이 **분리**되고
#     (A22 ㊀) 수신 측은 audience + 경로 허용목록으로 강제한다(㉱). 토큰만 있는 «서비스 전용» 호출과
#     `X-User-Id` 를 함께 싣는 «사용자 위임» 호출이 구분된다.
#   - `X-User-Id`: **Business 가 검증한 AT subject** 다. 외부에서 온 동명 헤더는 Business 가 폐기한다
#     (A22 ㉸). 수신 측은 서비스 토큰이 없는 요청의 이 헤더를 **절대 신뢰하지 않는다**.
#   - 변경 방향: 내부 HTTP 는 additive-only · **제공자 선배포 · 소비자 후배포** · 제거는 다음 릴리즈(㉹).
#     (이벤트와 방향이 반대다.)
#   - 멱등: `Idempotency-Key` 는 **앱이 소유**하고 Business 가 단계별 접미(`:<step>`)를 붙여 파생한다(㉼).
#     수신 측은 UNIQUE 저장 후 **응답을 재생**한다. 요청 본문 해시를 영구 멱등키로 쓰지 않는다(㊞).
#   - 오류 봉투: `{code, message}`(재시도 가능하면 `retryAfterMs` 추가). **`code` 가 실린 4xx 는 도메인
#     판정**이라 Business 가 재해석하지 않고 앱에 그대로 중계한다. `code` 없는 401/403 은 Business 의
#     서비스 자격 문제(502), `code` 없는 그 밖의 4xx 는 계약 어긋남(502), 5xx 는 판정 불가(503)다.
# ─────────────────────────────────────────────────────────────────────────────

info:
  title: Business ↔ Data / Notification / Link 내부 계약
  version: 0.1.0-draft
  description: |
    최소 Business 서비스(`server/business-api`)가 조합하는 내부 표면. 소비자 구현은
    `com.oneorthree.business.upstream.{data,notification,link}` 에 있고, 경로 상수는 각 클라이언트
    클래스에만 존재한다(임의 URL 프록시를 구조적으로 막기 위해서다).

servers:
  - url: '{dataApiBaseUrl}'
    description: Data API — env `DATA_API_BASE_URL`, 토큰 `SVC_TOKEN_BIZ_TO_DATA`
    variables:
      dataApiBaseUrl: { default: 'http://data-api:8080' }
  - url: '{notificationBaseUrl}'
    description: 알림 서버 — env `NOTIFICATION_BASE_URL`, 토큰 `SVC_TOKEN_BIZ_TO_NOTI`
    variables:
      notificationBaseUrl: { default: 'http://notification:8080' }
  - url: '{linkBaseUrl}'
    description: 링크 서버 — env `LINK_BASE_URL`, 토큰 `SVC_TOKEN_BIZ_TO_LINK`
    variables:
      linkBaseUrl: { default: 'https://link.example' }

tags:
  - name: data-활성검사
  - name: data-세션
  - name: data-내구명령
  - name: data-초대
  - name: data-결과ack
  - name: data-이관
  - name: noti-기기
  - name: noti-설정
  - name: noti-결과ack
  - name: link-발급
  - name: link-claim
  - name: link-매치

paths:

  # ════════════════════════════ Data API ════════════════════════════

  /internal/users/{userId}/activation:
    get:
      tags: [data-활성검사]
      operationId: checkActivation
      summary: 위성 쓰기 전 활성 검사 (A22 ⓖ)
      description: |
        위성(알림·링크)으로 **직행**하는 쓰기는 Data 의 `X-User-Id` 활성 검사를 거치지 않는다 —
        기기 토큰 등록·알림 설정·초대 claim 이 그렇다. 그래서 탈퇴 직전 발급된 AT 로 최대 AT
        수명(3600초) 동안 토큰을 재등록하거나 초대를 귀속시킬 수 있고, 이 검사가 그 창을 닫는다.

        **읽기에는 호출하지 않는다** — §5 는 「읽기 전용 경로는 AT 3600s 창 수용」이라고 못 박았다.

        ⚠️ **`authGeneration` 을 응답에 담지 말라.** 담으면 「AT 에 `gen` 이 없으니 여기서 받은 현재
        세대로 채우자」는 유혹이 생기는데, 그건 로그아웃 전에 발급된 옛 AT 를 최신 세대로 태깅해
        **기기 토큰 tombstone 을 우회**한다(A22 ㊍). 세대는 AT claim 에서만 온다.
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          description: 판정 완료
          content:
            application/json:
              schema:
                type: object
                required: [active]
                properties:
                  active:
                    type: boolean
                    description: 쓰기를 허용해도 되는 상태인가. 탈퇴·비활성은 false
        '404':
          description: |
            존재하지 않는 유저. Business 는 이것도 「비활성」과 같게 다뤄야 하므로 **`code` 를 실어라** —
            코드 없는 404 는 계약 어긋남(502)으로 올라간다.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
      x-idempotent: true
      x-retryable: true

  /internal/auth/device-sessions/verify:
    post:
      tags: [data-세션]
      operationId: verifyDeviceSession
      summary: deviceBootstrap 세션 활성 동기 확인 + sessionEpoch fencing (A22 ㋤ · ㋨)
      description: |
        개별 기기 로그아웃은 유저 세대를 올리지 않는다(㊼: 유저 축은 탈퇴·전 기기 로그아웃만).
        그래서 비동기 폐기 relay 만 두면 그 지연 사이에 도착한 A 의 지연 등록이 **아직 미사용인
        1회용 nonce** 로 통과해 B 기기의 토큰 소유권을 되찾아간다.

        **확인만으로도 부족하다** — 확인을 통과한 직후 로그아웃이 커밋되면 TOCTOU 가 남는다. 그래서
        그 세션의 단조 `sessionEpoch` 를 함께 돌려주고, **알림 서버가 자기 세션 tombstone 과 원자
        대조한 뒤에만** 소유권을 바꾼다. 확인과 mutation 이 같은 순서 경계에 들어간다.

        GET 이 아닌 이유: 자격 문자열을 쿼리에 실으면 접근 로그·프록시 캐시에 남는다. 상태를 바꾸지
        않으므로 재시도는 안전하다.
      parameters:
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceBootstrap]
              properties:
                deviceBootstrap:
                  type: string
                  maxLength: 512
                  description: 그 로그인 세션에서 발급된 1회용 자격
      responses:
        '200':
          description: 확인 완료
          content:
            application/json:
              schema:
                type: object
                required: [active, sessionEpoch]
                properties:
                  active:
                    type: boolean
                  sessionEpoch:
                    type: integer
                    format: int64
                    description: |
                      그 세션의 단조 fencing 값. 알림 서버가 이보다 오래된 소유권 변경을 거부한다.
                      `active=false` 일 때도 마지막 값을 채워라 — 그 값이 tombstone 비교의 기준이다.
      x-idempotent: true
      x-retryable: true

  /internal/auth/sessions/verify:
    post:
      tags: [data-세션]
      operationId: verifySession
      summary: 구 앱 요청의 서명된 AT sessionId로 현재 세션 확인
      description: |
        bootstrap을 보내지 않는 구 앱도 새 AT의 sid로 현재 세션을 확인한다.
        Business가 서명 검증한 AT에서 userId·sessionId를 추출한다. 외부 헤더나 본문의 값을 대신 쓰지 않는다.
        비활성·다른 사용자·없는 세션은 active=false다. bootstrap 원문이나 소유권 이전 자격은 반환하지 않는다.
        이 조회는 기기 소유권 CAS를 대체하지 않는다. sid가 없는 구 AT는 제한된 호환 창의 판정을 따른다.
      parameters:
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: string, format: uuid }
      responses:
        '200':
          description: 현재 세션 확인 결과
          content:
            application/json:
              schema:
                type: object
                required: [active, sessionEpoch]
                properties:
                  active: { type: boolean }
                  sessionEpoch: { type: integer, format: int64 }
      x-idempotent: true
      x-retryable: true

  /internal/users/{userId}/device-token-deletions:
    post:
      tags: [data-내구명령]
      operationId: recordDeviceTokenDeletion
      summary: 기기 토큰 삭제 outbox 기록 (A22 ㊲ · ㊿ · ㊨ · ㊪)
      description: |
        **Business 는 직접 삭제를 시도하기 「전에」 이 호출을 한다.** 순서를 뒤집으면(실패 후에야 기록)
        그 사이 프로세스가 죽을 때 직접 삭제도 outbox 도 남지 않고, 앱은 이 DELETE 실패를 삼키고
        로컬 인증을 지우므로(`App.tsx:528` 의 `.catch(() => {})`) **아무도 재시도하지 않고 이전 계정
        푸시가 그 기기로 계속 간다**.

        **outbox 를 「로그아웃 처리 자리」가 아니라 「DELETE 처리 자리」에서 만드는 이유**: 앱은 토큰
        DELETE 와 `/auth/logout` 을 별개 요청으로 보내고(`App.tsx:293-305`) 후자는 `{refreshToken}`
        만 싣는데(`auth.ts:384-387`), **Business 는 DB 가 없어 앞 요청의 값을 기억했다가 뒤 요청에
        전달할 수 없다**.

        `deviceToken` 이 없으면(구 앱은 본문이 없다) outbox 를 계약대로 만들 수 없다 — 그 사실을
        응답이나 로그로 드러내되 요청을 거절하지는 말라. 거절하면 구 앱의 로그아웃이 전부 실패한다.
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceToken:
                  type: [string, 'null']
                  maxLength: 512
                  description: 대상 FCM 토큰(`X-Device-Token`, ㊪). 구 앱은 못 보내므로 null 가능
                ownershipToken:
                  type: [string, 'null']
                  maxLength: 512
                  format: uuid
                  description: CAS 값(`X-Device-Ownership`, ㊚). null 또는 정규 UUID 표기이며, 잘못된 값은 내구 기록 전에 400으로 거절한다.
                authGeneration:
                  type: [integer, 'null']
                  format: int64
                  description: |
                    AT 의 `gen` claim. **없으면 null 이고, 현재 세대로 채우면 안 된다**(A22 ㊍) —
                    로그아웃 전에 발급된 옛 AT 가 최신 세대로 태깅돼 tombstone 을 우회한다.
      responses:
        '200':
          description: 내구 기록 완료 — 완성된 봉투를 돌려준다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DurableCommandAck' }
      x-idempotent: true
      x-retryable: true

  /internal/users/{userId}/notification-settings-snapshot:
    post:
      tags:
      - data-내구명령
      operationId: getSettingsCommandSnapshot
      summary: 활성 사용자·현재 세션을 검증한 설정 초기화 근거
      parameters:
      - $ref: '#/components/parameters/UserIdPath'
      - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsSessionProof'
      responses:
        '200':
          description: 검증된 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsSnapshot'
      x-idempotent: true
      x-retryable: true
      description: 실제 mirror5값과 사용자 aggregate version을 같은 잠금 경계에서 읽는다. sid/gen은 검증한 AT에서만 얻으며 누락을 현재값으로 보충하지 않는다.

  /internal/users/{userId}/notification-settings-commands:
    patch:
      tags:
      - data-내구명령
      operationId: recordPublicSettingsPatch
      summary: 신규 알림 설정 부분 명령·동일 TX 세션 검증과 원 결과 재생
      parameters:
      - $ref: '#/components/parameters/UserIdPath'
      - $ref: '#/components/parameters/XUserId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPatchCommandRequest'
      responses:
        '200':
          description: 검증된 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsPatchCommandResult'
      x-idempotent: true
      x-retryable: true
      description: user → session → aggregate 잠금 아래 mirror/receipt/outbox를 함께 저장한다. baseline은 수정 후 같은 version의5값이다.
        SESSION_NOT_ACTIVE403은 신규 Business에서만401로 매핑한다. Notification 적용 확인 전 공개200을 반환하지 않는다.
    put:
      tags: [data-내구명령]
      operationId: recordNotificationSettings
      summary: 알림 설정 변경을 Data 에 먼저 내구 저장 (A22 ㊷ · ㋕)
      description: |
        동기 호출만으로 끝내면 알림 서버 장애가 공통 HTTP 재시도보다 길 때 변경이 **영구 유실**된다 —
        현 `NotificationSettingsScreen.tsx:142-148` 은 로컬 캐시와 화면을 먼저 바꾼 뒤 서버 오류를
        **삼키고 「다음 변경 때」까지 재시도하지 않는다**(주석에 그렇게 적혀 있다). 그러면 사용자는
        `notificationEnabled=false` 로 보는데 서버 정본은 계속 true 라 **푸시가 무기한** 간다.

        응답의 `version` 은 **필드별 적용 순서를 판정하는 값**이다: 「끔」이 알림 서버엔 성공했는데 완료
        표시만 실패하고 뒤이은 「켬」이 끝까지 성공하면, relay 가 남은 「끔」을 나중에 적용해 **사용자가
        켠 설정을 도로 끈다**(반대 순서면 끈 뒤에도 푸시가 계속 간다).

        `version` 은 **aggregate 행 잠금 아래** 발급한다(㊸) — DB sequence 는 «할당 순서»만 보장하고
        커밋 순서를 보장하지 않아, 먼저 번호를 받고 늦게 커밋한 최신 상태가 폐기된다(`User` 엔
        `@Version` 도 없다). 또는 outbox 를 **사용자별 최신 상태로 합친다**.

        전체 교체 PUT 이라 §4 의 재시도 대상이다.
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationSettings' }
      responses:
        '200':
          description: 내구 기록 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DurableCommandAck' }
      x-idempotent: true
      x-retryable: true

  /internal/outbox-commands/{commandId}/delivered:
    post:
      tags: [data-내구명령]
      operationId: markCommandDelivered
      summary: 직접 전달이 성공했으니 그 outbox 행을 완료 표시 (A22 ㊿ 의 「빠른 경로」)
      description: |
        **이 호출의 실패는 사용자 요청을 실패시키지 않는다** — relay 가 한 번 더 보낼 뿐이고 위성의
        멱등·version 규칙이 중복 적용을 흡수한다. Business 는 실패를 로그로만 남긴다.

        이미 완료 표시된 행에 다시 와도 **200** 으로 답하라(멱등). 409 로 답하면 Business 가 정상
        중복을 오류로 남긴다.
      parameters:
        - name: commandId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200': { description: 완료 표시됨(또는 이미 완료) }
      x-idempotent: true
      x-retryable: true

  /internal/groups/{groupId}/invite-issue-context:
    get:
      tags: [data-초대]
      operationId: fetchInviteIssueContext
      summary: 링크 발급에 실을 코어 사실 — Data 가 판정한다
      description: |
        링크 서버는 코어를 부를 수 없다(§3 단방향). 그래서 「그룹이 삭제·종료되지 않았는가 · 이 사람이
        그 그룹의 **활성 멤버**인가 · 랜딩에 표시할 이름 · 순서 판정용 값들」을 여기서 받아 발급 요청에
        동봉한다. 기존 `InviteLinkService.issue` 의 `findActiveGroup` + 멤버십 확인을 그대로 옮긴 것이다.

        **`X-User-Id` 가 발급자다.** `inviterId` 를 쿼리로 받지 않는다 — 받으면 Business 가 남을
        발급자로 지정할 수 있는 표면이 생긴다.

        판정 실패는 **`code` 를 실어** 돌려라: `GROUP_NOT_FOUND`(404) · `NOT_MEMBER`(403). 그 문자열이
        그대로 앱에 중계된다(기존 `InviteLinkErrorCode` 계약).
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          description: 발급 컨텍스트
          content:
            application/json:
              schema:
                type: object
                required:
                  [groupActive, inviterActiveMember, membershipEpoch, linkVersion,
                   transitionSeq, snapshotVersion, groupId, inviterId]
                properties:
                  groupActive: { type: boolean }
                  inviterActiveMember:
                    type: boolean
                    description: 그룹 HLD `01-acquisition/high-level-design.md:70` 이 요구하는 조건
                  membershipEpoch:
                    type: integer
                    format: int64
                    description: |
                      **현재** epoch. 링크 서버가 「최대값보다 오래된 명령」을 발급·폐기 가릴 것 없이
                      거부하는 기준이다. epoch 는 **탈퇴·강퇴·재가입에만** 오르고 일반 낙관락
                      `version` 과 **분리**된다(ⓚ) — 낙관락을 쓰면 첫 수신자의 가입이 초대자 행의
                      version 을 올려 재사용 링크의 이후 수신자가 전부 실패한다.
                  linkVersion:
                    type: integer
                    format: int64
                    description: |
                      **발급 당시** epoch. 폐기가 「정확히 일치하는 링크만」 지우는 기준이다(ⓑ″ · ㋑).

                      ⚠️ **발급 경로에서는 `membershipEpoch` 와 같은 값이어야 한다.** 링크 서버가
                      `epoch !== linkVersion` 이면 `ISSUE_EPOCH_MISMATCH` 400 으로 거절한다
                      (`link/src/lib/links.ts:34`). 두 값이 갈리는 것은 **폐기(revoke)** 뿐이다 —
                      그때 폐기 대상 `linkVersion=N` 과 전이 후 `membershipEpoch=N+1` 을 함께 싣는다(㋑).
                      Business 는 두 값이 다르면 링크를 부르지 않고 502(계약 불일치)로 올린다 —
                      그 400 을 앱에 중계하면 사용자에게 엉뚱한 문구가 뜬다.
                  transitionSeq:
                    type: integer
                    format: int64
                    description: |
                      그 멤버십 전이 커밋의 순서. 같은 epoch 안에서도 HTTP 적용 순서는 보장되지
                      않는다(㋥: relay 직렬화는 같은 `userId` 단위인데 claim 사용자와 발급자는 다르다)
                      → 링크 서버가 `(groupId, inviterId)` 별 전이 seq 로 역순을 거른다.
                  snapshotVersion:
                    type: integer
                    format: int64
                    description: |
                      표시정보 스냅샷의 버전. 스냅샷은 발급 시점 고정이 아니라
                      `group.renamed`·`user.displayNameChanged` relay 로 갱신되므로(㋡) 늦게 온 갱신이
                      최신 이름을 덮지 않도록 version 대조가 필요하다.
                  groupName:
                    type: [string, 'null']
                    description: 랜딩 표시용 현재 그룹명
                  inviterDisplayName:
                    type: [string, 'null']
                  groupId: { type: string, format: uuid }
                  inviterId: { type: string, format: uuid }
        '403':
          description: '`NOT_MEMBER` — 그룹원만 초대 링크를 만들 수 있다'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: '`GROUP_NOT_FOUND`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
      x-idempotent: true
      x-retryable: true

  /internal/invite-links/claim-intents:
    get:
      tags: [data-초대]
      operationId: fetchPendingClaimIntents
      summary: 미완료 claim 의도 조회 — 서비스 전용, 재개 CLI 의 입력
      description: |
        **이 경로가 없으면 `202` 를 준 claim 을 비울 주체가 존재하지 않는다.** 주체가 될 수 있는 것이
        셋 다 막혀 있다:
        - Business 에 `@Scheduled` 를 넣으면 §6 의 「Business 크론 없음」이 깨진다.
        - Data 는 링크를 relay 허용목록 밖으로 부를 수 없다(§3) — claim 의 **잠정 기록**은 그 목록에
          없다(목록은 withdraw · revoke · joined · claimConfirmed · 스냅샷 갱신 · group.closed).
        - 링크는 코어를 부를 수 없다(§3 단방향).

        남는 답은 **Business 의 조합 코드를 운영자가 일회성으로 실행하는 것**이다
        (`business.claim-replay.enabled=true` 로 같은 이미지를 job 으로 띄운다 — 스케줄이 코드가 아니라
        런북에 있으므로 서빙 프로세스에는 크론이 없다).

        ⚠️ **`idempotencyKey` 를 반드시 저장해 돌려줘야 한다**(A22 ㉼). CLI 가 새 키를 만들면 링크
        서버의 멱등 저장이 그 claim 을 «새 명령»으로 보아 **클릭을 하나 더 소진**한다. 키가 비어 오면
        CLI 는 재생하지 않고 실패로 센다.

        ⚠️ **커서는 시각이 아니라 commit 과 함께 증가하는 sequence** 여야 한다(A22 ㋖). 상태 변경 시각은
        커밋 순서를 보장하지 않아, T1 이 이른 시각을 쓰고 멈춘 사이 T2 가 늦은 시각으로 커밋돼 커서가
        전진하면 **뒤늦게 커밋된 T1 을 다음 증분이 영구히 건너뛴다**.

        ⚠️ **`pendingTotal` 을 반드시 주라 — 「빈 페이지 = 전부 완료」가 아니다.** `items` 에는 *지금
        집을 수 있는* 것만 담기므로, 다른 작업자가 lease 를 쥔 행·재시도 예정 행·커서가 지난 뒤 새로
        적재된 행은 빠진다. 그걸 완료로 접으면 **미완료를 남긴 채 §7.2 절차가 다음 단계로 넘어간다**.
        `pendingTotal` 은 **인플라이트를 포함한 전체 미완료**이고, CLI 의 gate 는 그 값이 0 일 때만
        통과한다. CLI 는 커서 끝에 닿으면 **처음부터 다시 조회**한다(lease 만료로 풀린 행과 새로 적재된
        행은 같은 순회에서 안 보인다).
      parameters:
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: 이전 페이지의 `nextCursor`. 없으면 처음부터
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: 미완료 의도 한 페이지
          content:
            application/json:
              schema:
                type: object
                required: [items, pendingTotal]
                properties:
                  pendingTotal:
                    type: integer
                    format: int64
                    description: |
                      **인플라이트를 포함한 전체 미완료 건수**(다른 작업자의 lease · 재시도 예정 포함).
                      「미완료 0」 gate 는 이 값으로만 판정한다.
                  items:
                    type: array
                    items:
                      type: object
                      required: [commandId, userId, slug, idempotencyKey]
                      properties:
                        commandId: { type: string, format: uuid }
                        userId: { type: string, format: uuid }
                        slug: { type: string, maxLength: 12 }
                        idempotencyKey:
                          type: [string, 'null']
                          description: '**원래 요청이 쓴 키.** null 이면 CLI 가 재생하지 않는다'
                        attempts:
                          type: integer
                          description: 지금까지의 시도 횟수 — 반복 실패 관측과 gate 판단의 입력
                        leaseExpiresAt: { type: [string, 'null'], format: date-time }
                  nextCursor:
                    type: [string, 'null']
                    description: null 이면 끝이다
        '409':
          description: '`IMPORT_CLOSED` 등 — **`code` 를 실어라**'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
      x-idempotent: true
      x-retryable: true

    post:
      tags: [data-초대]
      operationId: enqueueClaimIntent
      summary: claim 의도를 내구 적재 — 202 의 유일한 근거 (A22 ㊄ · ㊺)
      description: |
        정지 창의 claim 은 **거절이 아니라 대기**다: 앱은 전역 15초(`api.ts:215-218`) 뒤
        `claimStoredInviteAttribution:148-164` 대로 **다음 로그인까지 재시도하지 않는다**. 그래서
        동기 확정이 예산 안에 끝나지 않으면 Business 가 `202` 로 받는데, **이 커밋 전에는 202 를
        응답하지 않는다**(계약 §4).

        사용자와 요청 키가 의도를 식별한다. 같은 키는 같은 의도를 재생하고 다른 slug면 409다.
        같은 사용자·slug의 새 요청 키는 별도 PENDING 의도가 되어 과거 ABANDONED에 묶이지 않는다.
        응답 completed=true는 같은 요청이 이미 종결됐다는 뜻이며 Business는 하위 호출 없이 200을 재생한다.
        completed=false인 내구 의도만 실패 시 202의 근거로 쓴다.
        재개는 Business CLI가 링크 잠정 기록과 Data 확정을 호출하고 Data가 `link.claimConfirmed` outbox를 기록한다.
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug]
              properties:
                slug:
                  type: string
                  maxLength: 12
                  description: 기존 계약과 같은 제약(`ClaimInviteRequest`)
      responses:
        '200':
          description: 내구 적재 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimIntentAck' }
      x-idempotent: true
      x-retryable: true

  /internal/invite-links/claim-intents/{commandId}/lease:
    post:
      tags: [data-초대]
      operationId: leaseClaimIntent
      summary: 재개 lease 획득 — 서비스 전용, 재개 CLI 만 쓴다
      description: |
        lease 가 필요한 이유: CLI 를 두 번 실행하거나 이전 실행이 중간에 죽었을 때 같은 의도를 두
        프로세스가 동시에 재생하면, 링크 claim 은 멱등 키로 막히더라도 **Data confirm 이 두 번 들어가
        시도 횟수와 감사 기록이 갈린다**.

        ⚠️ **만료되는 lease** 여야 한다 — 죽은 소유자의 것을 회수할 길이 없으면 그 한 건이
        「미완료 0」 gate 를 영구히 막는다.

        ⚠️ **`leaseToken` 을 반드시 발급하라 — `leased`/`expiresAt` 만으로는 안 닫힌다.**
        임대가 만료된 뒤 깨어난 옛 작업자가 **「새 임대 소유자의 작업」을 완료 표시**할 수 있다:
        A 의 lease 가 만료되고 B 가 새로 잡아 재생 중인데 느려진 A 가 `completed` 를 부르면, B 의
        진행과 무관하게 큐에서 빠져 **확정되지 않은 claim 이 「완료」로 기록되고 귀속이 조용히 유실**된다.
        그래서 임대에 묶인 opaque 토큰을 발급하고 `completed` 가 그것으로 **CAS** 한다 — 기기 토큰
        소유권의 `ownershipToken`(A22 ㊚)과 같은 패턴이다(서버 상태만 보면 「지연된 옛 요청」과
        「정상적인 새 요청」을 구별할 수 없으므로 값을 요청에도 실어야 순서를 가른다).

        `leased: false` 는 실패가 아니다 — 다른 소유자가 쥐고 있다는 뜻이고 CLI 는 건너뛴다.
      parameters:
        - $ref: '#/components/parameters/CommandIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leaseSeconds]
              properties:
                leaseSeconds: { type: integer, format: int64 }
      responses:
        '200':
          description: lease 판정
          content:
            application/json:
              schema:
                type: object
                required: [leased, leaseToken]
                properties:
                  leased: { type: boolean }
                  leaseToken:
                    type: [string, 'null']
                    format: uuid
                    description: |
                      이 임대에 묶인 CAS 값. `completed` 에 그대로 실어 보낸다.
                      `leased=false` 면 null. **null 이면 CLI 는 완료 표시하지 않는다** —
                      CAS 없이 빼면 확정되지 않은 claim 이 사라진다.
                  leaseExpiresAt: { type: [string, 'null'], format: date-time }
      x-idempotent: true
      x-retryable: true

  /internal/invite-links/claim-intents/{commandId}/completed:
    post:
      tags: [data-초대]
      operationId: completeClaimIntent
      summary: 재개 완료 표시 — 서비스 전용
      description: |
        ⚠️ **이미 완료된 것에 다시 와도 200** 이어야 한다(멱등). 409 로 답하면 CLI 가 정상 중복을
        오류로 세고, 그 오류가 「미완료 0」 gate 를 거짓으로 막는다.

        CLI 는 **상류가 도메인 판정을 내린 경우에도 완료 표시**한다(예: `SLUG_NOT_FOUND`) — 재시도해도
        답이 같으므로, 완료로 빼지 않으면 그 한 건이 gate 를 영구히 막는다. 판정 내용은 로그에 남는다.
      parameters:
        - $ref: '#/components/parameters/CommandIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leaseToken]
              properties:
                leaseToken:
                  type: string
                  format: uuid
                  description: |
                    lease 응답으로 받은 CAS 값. **현재 임대의 토큰과 다르면 거부하라** — 만료 뒤
                    깨어난 옛 작업자가 새 임대 소유자의 작업을 완료로 빼는 것을 막는 유일한 장치다.
      responses:
        '200': { description: 완료 표시됨(또는 같은 토큰으로 이미 완료 — 멱등) }
        '409':
          description: |
            `leaseToken` 이 현재 임대와 다르다 — 거부. **`code` 를 실어라.** CLI 는 이것을 실패로 세고
            그 의도를 완료 표시하지 않는다(lease 만료 후 다음 순회가 집는다).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
      x-idempotent: true
      x-retryable: true

  /internal/invite-links/claim-intents/{commandId}/abandoned:
    post:
      tags: [data-초대]
      operationId: abandonClaimIntent
      summary: 확정할 것이 없던 의도를 요청자 자신이 종결 — 사용자 위임
      description: |
        **`claimId=null` 의 의도를 닫는 유일한 손이다.** 링크 서버가 셀프 초대·붙일 클릭 없음에
        `claimId: null` 을 «정상»으로 주면(`link/src/lib/links.ts:145·149`) 확정 호출이 없고, 확정이
        없으면 `claim-confirmations` 가 의도를 닫아 주지도 못한다. 그 한 건이 `PENDING` 으로 남으면
        `pendingTotal` 이 0 이 되지 않아 **정상 처리된 claim 이 「미완료 0」 gate 를 영구히 막는다**.

        ⚠️ **`/completed` 를 요청 경로가 빌려 쓰게 하지 말 것.** 그것은 lease 를 쥔 **서비스 전용**
        재개 표면이고, 요청 경로에 그 권한을 주면 임의 의도를 선점·완료할 수 있게 된다. 이 경로는
        **소유자 검사를 조회 조건에 박은** 최소 권한 표면이다 — 남의 `commandId` 로는 아무것도 닫지 못한다.

        ⚠️ **`outbox-commands/{id}/delivered` 로 닫을 수 없다.** 그쪽은 봉투의 `eventId` 로 **알림 대상
        전달**을 닫는 경로이고, claim 의도는 outbox 행이 아니다(아무 데도 안 가는 봉투는 유실과 구분되지
        않으므로 의도는 Data 소유 상태로 남는다) — 의도 id 를 그 경로에 보내면 **항상 404** 다.

        종결 상태는 `ABANDONED` 다(확정이 없었으므로 「확정까지 끝났다」로 적으면 원장이 거짓이 된다).
        이미 종결된 의도에 다시 와도 **200**(멱등) — 요청 경로는 이 호출의 실패를 삼키므로, 409 로
        답하면 정상 재시도가 오류 로그로만 쌓인다.
      parameters:
        - $ref: '#/components/parameters/CommandIdPath'
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200': { description: 종결됨(또는 이미 종결 — 멱등) }
        '404':
          description: |
            없거나 **요청자의 것이 아니다** — 둘을 한 코드로 접는다(`CLAIM_INTENT_NOT_FOUND`).
            존재 여부가 응답으로 갈리면 그 자체가 남의 의도 id 를 탐색하는 수단이다.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
      x-idempotent: true
      x-retryable: true

  /internal/invite-links/claim-confirmations:
    post:
      tags: [data-초대]
      operationId: confirmClaim
      summary: 링크의 잠정 claim 을 멤버십 락 아래 확정 (A22 ㋟ · ⓚ)
      description: |
        **claim 의 유효 판정 순서는 Data 가 갖는다.** `claimSeq` 는 「Data 가 판정한 순서」일 뿐
        「링크가 기록한 순서」가 아니다 — 판정 seq 10 을 받은 claim 이 지연되는 사이 폐기가 seq 11 로
        커밋되면, 그 claim 은 **폐기 뒤에 기록됐는데도** `10 > 11` 이 아니라 살아남는다(비교 방향만
        뒤집으면 이번엔 정상 완료된 claim 까지 지운다).

        그래서 링크는 **잠정(pending)** 으로 기록하고, Data 가 **멤버십 락 아래에서 「폐기되지 않음」을
        확인하며 남긴 확정 레코드**가 전달돼야 유효로 승격한다.

        **전달은 Data 가 락 아래 `link.claimConfirmed` outbox 를 기록하고 relay 가 한다.**
        락을 잡은 채 직접 호출은 §3 의 「Data → 링크 relay 외 금지」 위반이고, 락이 풀린 뒤 Business 가
        보내면 그 사이 revoke 가 커밋될 수 있다. **Business 는 링크에 confirm 을 보내지 않는다** —
        그래서 `LinkApiClient` 에 그 메서드가 없다.

        `capability` 는 링크 서버가 서명한 자격(slug · groupId · inviterId · membershipEpoch · 만료)이고,
        Data 가 **커밋 안에서** 현재 그룹 상태·멤버십 epoch 와 **공유 락으로** 대조한다 — `GroupMember`
        에 `@Version` 이 없고 조회가 무락이라 대조만으로는 판독 직후 커밋된 동시 탈퇴를 못 본다.
        서명 검증 키(`LINK_CAPABILITY_KEY`)는 링크·Data 양쪽이 보유한다.
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claimId, slug, capability]
              properties:
                claimId:
                  type: string
                  format: uuid
                  description: 링크가 기록한 잠정 claim 의 id
                slug: { type: string, maxLength: 12 }
                capability:
                  type: string
                  description: 링크 서버가 서명한 자격 토큰
      responses:
        '200':
          description: |
            확정 + `link.claimConfirmed` outbox 기록 완료. `version` 은 락 아래 발급된 값이라
            링크 서버가 역순 confirm 을 거부하는 기준이 된다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DurableCommandAck' }
        '409':
          description: |
            폐기·탈퇴로 자격이 무효다. **`code` 를 실어라** — Business 가 앱에 그대로 중계한다.
            ⚠️ 폐기는 「그 사이 수락된 claim」까지 되돌린다(㋙): relay 지연 중 링크는 active 로 보여
            claim 을 기록하는데, 그룹 HLD `01-acquisition:88-89` 는 폐기 후 claim 을 no-op 으로 두므로
            그 귀속은 **유효하지 않은 초대인데도 가입 귀속·캠페인 전환에 영구 집계**된다.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
      x-idempotent: true
      x-retryable: true

  /internal/users/{userId}/challenge-results/{sessionId}/claim:
    post:
      tags: [data-결과ack]
      operationId: claimResultDisplay
      summary: 결과 표시 선점 — 알림 서버가 끼지 않는다
      description: |
        기존 `ChallengeResultAckService.claimDisplay` 를 그대로 옮긴다. 바디에 `claimToken` 이 있으면
        「최초 획득」이 아니라 **「렌더 직전 재검증 + 리스 연장」**이고, 한 번의 쓰기가 검증과 연장을
        함께 한다.

        ⚠️ **재시도 대상이 아니다.** `acknowledged_at IS NULL` + 리스 조건부 원자 UPDATE 라 두 번째
        시도가 남의 리스를 가져올 수 있고, 실패 응답 자체가 계약이다.

        실패 코드는 전부 기존 `GroupErrorCode` 이름 그대로 나가야 한다(앱이 분기한다):
        `RESULT_CLAIM_HELD`(409 + `retryAfterMs`) · `RESULT_ALREADY_ACKED`(409) ·
        `RESULT_CLAIM_STALE`(409) · `RESULT_NOT_SETTLED`(409).
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
        - $ref: '#/components/parameters/SessionIdPath'
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                claimToken:
                  type: [string, 'null']
                  format: uuid
                  description: null·빈 문자열이면 최초 획득
      responses:
        '200':
          description: |
            선점 성공. 응답은 **모양을 늘릴 수 있다**(additive) — Business 는 본문을 그대로 통과시키고
            필드를 해석하지 않는다(㉹ 제공자 선배포를 지키기 위해서다). 현재는 `{claimToken}`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  claimToken: { type: string, format: uuid }
        '409':
          description: 위 네 도메인 코드 중 하나. `RESULT_CLAIM_HELD` 는 `retryAfterMs` 를 함께 싣는다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetryAfterError' }
      x-idempotent: false
      x-retryable: false

  /internal/users/{userId}/challenge-results/{sessionId}/ack:
    post:
      tags: [data-결과ack]
      operationId: acknowledgeResult
      summary: 결과 확인 표시 — 2단계의 «가운데» (A22 ⓓ)
      description: |
        **앞에 알림 `prepare`, 뒤에 알림 `commit` 이 온다.** 현행은 확인 트랜잭션 안에서
        `BetResultAckSuppressionListener` 가 대기 중인 알림 클레임·tombstone 을 함께 갱신해 5분 flush
        가 이미 본 결과를 뒤늦게 보내지 못하게 막는데, 알림 DB 분리 후엔 그 갱신 대상이
        `gromo_notification` 으로 넘어가 **같은 트랜잭션에 담을 수 없다**.

        ⚠️ **재시도 대상이 아니다.** `acknowledged_at IS NULL` 조건부 UPDATE 라 두 번째 시도는 0행이
        되고, 그 0행을 실패로 읽으면 이미 성공한 ack 가 실패로 보고된다.

        ⚠️ **이 트랜잭션에서 알림 DB 를 건드리지 말라** — §3 의 「Data → 알림 쓰기 금지」다. 억제는
        알림 서버의 prepare/commit 이 담당한다.
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
        - $ref: '#/components/parameters/SessionIdPath'
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claimToken]
              properties:
                claimToken: { type: string, format: uuid }
      responses:
        '200': { description: 확인 처리됨 }
        '409':
          description: '`RESULT_CLAIM_STALE` 등 — 그대로 중계된다'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
      x-idempotent: false
      x-retryable: false

  /internal/users/{userId}/result-ack:
    get:
      tags: [data-결과ack]
      operationId: readResultAck
      summary: '정본 ack 조회 — 알림 → Data 조회 3종의 두 번째 (A22 ⓓ)'
      description: |
        ⚠️ **이 경로의 호출자는 Business 가 아니라 알림 서버다.** 여기 적는 이유는 «없으면 영구 억제가
        실재하기 때문»이다: `HELD` 리스 만료는 `NEEDS_CONFIRM` 으로 넘어가 flush 가 계속 건너뛰는데,
        해제는 `commit` · `abort` · **이 정본 조회로 자기 수렴** 세 길뿐이다. 「롤백 직후 프로세스가
        죽는 구간」에서는 abort 행이 안 생기므로 **이 조회가 유일한 탈출구**다.

        토큰은 `SVC_TOKEN_NOTI_TO_DATA` 이고 caller 가 다르므로 허용목록도 별개다(A22 ㊀ · ㉱).
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
        - name: sessionId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 정본 ack 상태
          content:
            application/json:
              schema:
                type: object
                required: [acknowledged]
                properties:
                  acknowledged: { type: boolean }
                  acknowledgedAt: { type: [string, 'null'], format: date-time }
      x-idempotent: true
      x-retryable: true

  /internal/migrations/{migrationId}/invite-link-clicks/candidates:
    get:
      tags: [data-이관]
      operationId: exportFrozenCandidates
      summary: 구 invite_link_clicks 정지 스냅샷의 read-only export (서비스 §7.2)
      description: |
        **Business 는 이 후보를 소진하지 않는다.** 매치는 읽기가 아니라 **소진(쓰기)** 이고, 정지 창에도
        쓰기 원장은 Neon 하나다(A22 ㊥) — 양쪽에서 소진하면 잠금이 공유되지 않아 **같은 클릭이 두 기기에
        배정**된다. Business 는 후보를 받아 링크 서버에 넘기고, 링크가 §7.2 4단계 규칙(행 잠금 ·
        `(migrationId, clickId)` 의 `compat_applied` 표시 · 원본 체크섬 · 감사 레코드를 **같은 Neon
        트랜잭션**에)으로 반영·소진한다.

        `sourceChecksum` 은 4단계 검증의 기준이다 — 표시가 있는 행은 「원본 체크섬 + 불변 필드 일치 +
        소진 상태와 감사 레코드 일치」로 검증하므로 이 값이 빠지면 **검증을 닫을 수 없다**.

        ⚠️ `migrationId` 로 제한된 이관 경로이고 **일반 방문자 입력으로 받지 않는다**(§7.2 4단계).
        서비스 전용 호출이라 `X-User-Id` 가 없다.

        ⚠️ 3단계(구 쓰기 정지 · drain) 이후에만 의미가 있다. 그 전에 부르면 아직 변하는 행을 보게 되고,
        시각 기반 커서로는 늦게 커밋된 전이를 **영구히 건너뛴다**(㋖).
      parameters:
        - name: migrationId
          in: path
          required: true
          schema: { type: string }
        - name: ipHash
          in: query
          required: true
          schema: { type: string }
          description: '`SHA-256(UTF8(ip + 기존 salt))`. salt 를 새로 만들면 매치가 전멸한다(ⓕ)'
        - name: os
          in: query
          required: true
          schema: { type: string, enum: [ios, android, other] }
      responses:
        '200':
          description: 3시간 매치 창 안의 구 후보들
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FrozenClickCandidate' }
        '409':
          description: |
            `IMPORT_CLOSED` — 5단계로 넘어갔다. 늦은 백필·import 재시도를 거부한다(§7.2 5단계).
            **`code` 를 실어라.**
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
      x-idempotent: true
      x-retryable: true

  # ════════════════════════════ 알림 서버 ════════════════════════════

  /internal/devices:
    post:
      tags: [noti-기기]
      operationId: registerDevice
      summary: 기기 토큰 등록 — 세 축의 값을 모두 받는다 (A22 ㋞)
      description: |
        축이 셋인 이유 — 하나라도 빠지면 막을 수 없는 경합이 남는다:
        - **유저 축** `authGeneration`: 탈퇴·전 기기 로그아웃에만 오른다(㊼). 유저 간 전환을 막는다.
        - **기기 축** `ownershipToken`: 같은 유저의 **요청 순서**를 가른다. 세대는 유저별 값이라 A·B 를
          비교할 수 없다(㊌) — A 등록(gen N)이 지연된 사이 A 로그아웃(N+1)과 B 등록이 처리되면 늦게 온
          A 등록은 **A 기준으론 최신이라 수락**돼 B 행을 밀어낸다.
        - **세션 축** `deviceBootstrap` + `sessionEpoch`: 그 로그인 세션이 살아 있는가. 개별 기기
          로그아웃은 세대를 안 올리므로 이 축이 그 자리를 맡는다.

        **판정은 두 갈래다**(㋚): ⓐ 토큰을 실은 요청은 **최신일 때만** 허용(같은 유저의 지연 요청 차단).
        ⓑ 토큰이 **없는** 요청은 「소유권 이전」으로 보되 유효 AT 만으로는 부족하다 — `deviceBootstrap`
        을 함께 요구하고 통과하면 새 토큰을 발급한다. ⓑ 가 없으면 막다른 길이 생긴다: relay 가 나중에
        삭제를 적용하면 `ownershipVersion` 은 전진하는데 앱은 응답을 못 받아 새 토큰을 저장하지 못하고,
        그 상태에서 계정 전환한 B 는 **가진 토큰은 낡았고 현재 소유자도 아니라** 등록이 영구 거부된다.

        **삭제는 행을 지우지 말고 토큰별 tombstone + 마지막 `ownershipVersion` 을 보존하라**(㋓) —
        「행 없음」 부트스트랩 예외를 지연 등록이 통과해 토큰을 되살린다.

        **등록 시 같은 FCM 토큰을 쓰던 다른 `userId` 행을 제거하라**(§4 의 두 번째 방어선) — 전달이
        통째로 유실돼도 새 계정 로그인이 이전 계정 토큰을 자동 회수한다. 단 **같은 사용자의 재로그인에는
        무력**하므로 위의 세 축이 여전히 필요하다.

        ⚠️ **`Idempotency-Key` 재시도는 「성공으로 재생」이어야 한다**(㊱) — version 이 전진하므로 응답
        유실 뒤 재시도가 낡은 값으로 **거부**되면 앱은 영구히 토큰을 못 받는다.
        `sessionEpoch`는 등록 의도의 멱등 비교에서 제외한다. Business는 재시도마다 Data의 현재
        세션 확인 값을 전달하고, Notification은 저장 응답 재생 직전에도 현재 세션·세대 fence를 검사한다.
        나머지 등록 입력이 바뀐 같은 키는 `IDEMPOTENCY_KEY_CONFLICT`로 거부한다.
        구 앱의 무자격 등록 호환은 `NOTIFICATION_LEGACY_DEVICE_REGISTRATION`으로 별도 제어한다.
        AT의 gen 유무를 앱의 소유권 프로토콜 지원 여부로 간주하지 않는다.
        서명된 sid의 현재 활성 확인 결과를 `legacySessionId`·`sessionEpoch`로 전달한다.
        별도 legacy 세션 fence의 최초 사용만 bootstrap 미연결 구 행의 이전·재로그인을 허용한다.
        이후에는 같은 세션의 활성 연결에 한해 재등록·토큰 회전하고 이전 FCM 토큰은 비활성화한다.
        세션 폐기는 legacySessionId로 연결된 기기도 끊는다. 현대 bootstrap 행을 이 경로로 덮지 않는다.
        sid 없는 구 AT만 다른 사용자·비활성·세션 연결 행을 덮지 않는 제한된 호환 창을 따른다.

        ⚠️ **`authGeneration` 이 null 이면 「세대 검사 없이 수락」**하라(롤아웃 ②기간, ㊍). 현재 세대로
        채우지 말고, 거부하지도 말라. 창이 AT 최대 수명(3600초)으로 한정되므로 노출이 유한하다.
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceToken]
              properties:
                deviceToken: { type: string, maxLength: 512 }
                ownershipToken: { type: [string, 'null'], format: uuid, maxLength: 512 }
                deviceBootstrap: { type: [string, 'null'], maxLength: 512 }
                legacySessionId:
                  type: [string, 'null']
                  format: uuid
                  description: Business가 서명된 AT와 Data 활성 조회로 확인한 구 앱 세션. 외부 입력에서 받지 않는다.
                sessionEpoch:
                  type: [integer, 'null']
                  format: int64
                  description: |
                    Data 의 동기 확인이 준 fencing 값. **자기 세션 tombstone 과 원자 대조한 뒤에만**
                    소유권을 바꿔라(㋨) — 확인만으로는 TOCTOU 가 남는다.
                authGeneration: { type: [integer, 'null'], format: int64 }
      responses:
        '200':
          description: 등록 완료 — **매번 새 `ownershipToken`** 을 돌려준다(㊚)
          content:
            application/json:
              schema:
                type: object
                required: [ownershipToken]
                properties:
                  ownershipToken: { type: string }
        '409':
          description: |
            오래된 명령이라 거부했다(세대·소유권·세션 tombstone). **`code` 를 실어라.**
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
      x-idempotent: true
      x-retryable: true

    delete:
      tags: [noti-기기]
      operationId: deleteDevice
      summary: 기기 토큰 삭제 — §4 가 명시적으로 지정한 재시도 대상
      description: |
        **GET 만 재시도하면 안 되는 이유**(§4): 로그아웃의 기기 토큰 삭제가 일시 오류 한 번에 영구
        실패한다. 앱은 그 실패를 무시하고 로컬 토큰을 지워 **사용자가 재시도할 방법이 없고**, 알림 DB 에
        남은 이전 계정 토큰으로 푸시가 계속 간다. 그래서 멱등을 보장하고 재시도를 받는다.

        **본문이 없어 값을 헤더로 받는다**(㊪ · ㊟) — 현 요청에는 본문이 아예 없어서
        (`userApi.ts:91-94` 의 bare axios) 본문으로 요구하면 구 앱의 로그아웃이 전부 거부된다.

        `X-Auth-Generation` 은 **없으면 헤더 자체가 붙지 않는다.** 「세대 없음」과 「세대 0」을 구분해야
        롤아웃 ②기간의 「검사 없이 수락」이 성립한다.

        ⚠️ **현재 세대보다 오래된 삭제를 거부하라**(ⓡ · ㉴): relay 가 지연된 사이 같은 사용자가 다시
        로그인해 토큰을 등록하면, 뒤늦게 도착한 삭제가 **그 새 등록까지 지워** 다음 갱신·재등록까지
        푸시가 끊긴다. 「다른 `userId` 행 제거」 방어는 **같은 사용자의 재로그인에 무력**하다.
        거부는 **양방향**이다 — 오래된 등록도, 오래된 삭제도 막고, 삭제 시에도 최대 세대를 tombstone
        으로 보존한다.
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: X-Device-Token
          in: header
          required: false
          schema: { type: string, maxLength: 512 }
          description: |
            삭제 대상 FCM 토큰(㊪). 구 앱은 못 보낸다 — 없으면 유저 단위 삭제로 처리하고 그 기간의
            경합을 인정하되, **요청을 거절하지 말라**.
        - name: X-Device-Ownership
          in: header
          required: false
          schema: { type: string, format: uuid, maxLength: 512 }
          description: 정규 UUID 표기. 잘못된 값은 상류 호출 및 내구 기록 전에 400으로 거절한다.
        - name: X-Auth-Generation
          in: header
          required: false
          schema: { type: integer, format: int64 }
          description: 없으면 **헤더 자체가 없다**. 빈 값이나 0 이 오지 않는다
      responses:
        '204': { description: 삭제됨(또는 이미 없음 — 멱등) }
      x-idempotent: true
      x-retryable: true

  /internal/users/{userId}/notification-settings/initialized:
    post:
      tags:
      - noti-설정
      operationId: initializeAndReadNotificationSettings
      summary: 검증된 근거로 미존재 행만 생성하고 현재 정본 조회
      parameters:
      - $ref: '#/components/parameters/UserIdPath'
      - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsSnapshot'
      responses:
        '200':
          description: 검증된 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettings'
      x-idempotent: true
      x-retryable: true
      description: 키나 명령 응답 캐시를 만들지 않는다. ever_opened+사용자 fence 검증 후 INSERT ON CONFLICT DO NOTHING 및 strict read. 기존행을
        baseline으로 덮어쓰지 않는다.

  /internal/users/{userId}/notification-settings:
    patch:
      tags:
      - noti-설정
      operationId: applyNotificationSettingsPatch
      summary: 개방 후 필드별 단조 부분 적용
      parameters:
      - $ref: '#/components/parameters/UserIdPath'
      - $ref: '#/components/parameters/XUserId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: version
        in: query
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPatchDelivery'
      responses:
        '200':
          description: 검증된 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsApplied'
      x-idempotent: true
      x-retryable: true
      description: ever_opened 확인과 사용자 fence를 같은 TX에서 잠근다. 최초행은 baseline의5값으로 초기화, 기존행은 mask만 적용한다. field version별 비교로
        늦은 다른필드 요청을 보존한다. MIGRATION_NOT_READY409/STALE_AUTH_GENERATION409은 신규 Business에서503/401로 매핑한다. relay도 동일 병합을
        적용하며 폐기 세대는 수신 완료 no-op이다.
    get:
      tags: [noti-설정]
      operationId: getNotificationSettings
      summary: 알림 설정 «정본» 조회 — 소유자가 gromo_notification 이다 (§3)
      description: |
        **Data 패스스루로는 정본을 못 읽는다.** 설정의 소유자가 `gromo_notification` 이라 GET 도 여기서
        읽어야 하고, 그러지 않으면 「껐는데 계속 오는」 상태를 화면에서 정상으로 보이게 만든다.

        응답 5필드는 기존 앱 계약(`NotificationSettingsResponse`, GROMO-612)과 **글자 그대로 같다**.
        시각은 `"HH:mm"` 문자열이고 미설정이면 null, **시간대를 담지 않는다**(서버 날짜 축이 KST 고정).
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          description: 정본 설정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
      x-idempotent: true
      x-retryable: true

    put:
      tags: [noti-설정]
      operationId: applyNotificationSettings
      summary: 설정 적용 — Data 내구 명령이 먼저 저장된 뒤에 온다 (§3)
      description: |
        Business 는 Data 의 내구 명령을 먼저 저장하고 그 `version` 을 여기 실어 보낸다.

        ⚠️ 개방 후에는 선택한 **각 필드의 version**보다 낮은 값을 적용하지 않는다(㋕). 안 그러면 순서가 뒤집힌다: 「끔」이
        여기엔 성공했는데 Data 의 완료 표시만 실패하고 뒤이은 「켬」이 끝까지 성공하면, relay 가 남은
        「끔」을 나중에 적용해 **사용자가 켠 설정을 도로 끈다**(반대 순서면 끈 뒤에도 푸시가 간다).

        ⚠️ **발송 게이트와 무관하게 적용하라**(㋭). `dispatch_enabled=false` 여도 설정·기기 삭제·ack
        억제 같은 **상태 변경은 계속 반영**된다. 게이트가 막는 것은 FCM 발송뿐이다.

        전체 교체는 5필드를 모두 선택한다. 개방 뒤 각 필드의 더 최신 변경은 보존한다. 빠진 필드를 현재값으로 채우지 말라(전체 교체가 계약이고,
        그러면 앱이 빠뜨린 필드가 조용히 다른 값으로 남는다).
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: version
          in: query
          required: true
          schema: { type: integer, format: int64 }
          description: Data 가 aggregate 락 아래 발급한 단조 version(㊸)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationSettings' }
      responses:
        '204': { description: 적용됨 }
        '409':
          description: 더 높은 version 이 이미 적용돼 있다 — 거부. **`code` 를 실어라**
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
      x-idempotent: true
      x-retryable: true

  /internal/users/{userId}/result-ack/prepare:
    post:
      tags: [noti-결과ack]
      operationId: prepareResultAck
      summary: ack 2단계 ① — HELD 선점, 행이 없어도 tombstone 을 만든다 (A22 ⓓ · ㊅)
      description: |
        **「대기 클레임을 HELD 로 바꾼다」만으로는 부족하다**: 사용자의 ack 가 Kafka 소비·재훑기보다
        **먼저** 오면 잠글 행이 아직 없어 **no-op** 이 되고, 나중에 도착한 사건이 발송을 낸다. 그래서
        `(userId, BET_RESULT, sessionId)` 를 **insert-or-transition** 한다(현 구현의 「INSERT 먼저」와
        같은 이유).

        ⚠️ **리스 만료는 fail-closed 다** — `NEEDS_CONFIRM` 으로 넘겨 flush 가 계속 건너뛰게 하고,
        **자동 발송 재개가 아니다**. 해제는 `commit` · `abort` · **Data 정본 ack 조회로 자기 수렴**
        세 길뿐이다.

        `held=false` 를 실패로 쓰지 말라 — Business 는 그것을 「이미 확정돼 잠글 필요가 없다」로 읽고
        Data ack 를 계속 진행한다.
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: string, format: uuid }
      responses:
        '200':
          description: 선점 결과
          content:
            application/json:
              schema:
                type: object
                required: [held, state]
                properties:
                  held: { type: boolean }
                  state:
                    type: string
                    enum: [HELD, COMMITTED, NEEDS_CONFIRM, NONE]
      x-idempotent: true
      x-retryable: true

  /internal/users/{userId}/result-ack/commit:
    post:
      tags: [noti-결과ack]
      operationId: commitResultAck
      summary: ack 2단계 ③ — Data ack 커밋 뒤 억제를 확정
      description: |
        이 호출이 실패해도 Business 는 사용자 요청을 **성공**으로 응답한다 — Data 의 `acknowledged_at`
        은 이미 박혔다. 남은 `HELD` 는 `NEEDS_CONFIRM` 으로 넘어가 flush 가 건너뛰고, **알림 서버가
        Data 정본 ack 조회로 스스로 수렴**한다. 그 수렴 경로(`GET /internal/users/{id}/result-ack`)가
        없으면 「롤백 직후 프로세스가 죽는 구간」에서 **영구 억제가 실재**한다.
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: string, format: uuid }
      responses:
        '204': { description: 확정됨(또는 이미 확정 — 멱등) }
      x-idempotent: true
      x-retryable: true

  /internal/users/{userId}/result-ack/abort:
    post:
      tags: [noti-결과ack]
      operationId: abortResultAck
      summary: ack 2단계 롤백 — Data ack 가 실패했으니 선점을 되돌린다
      description: |
        **Business 는 이 호출의 실패를 덮지 않는다.** abort 행이 안 생기는 구간은 위 수렴 계약에
        맡기고, 사용자에게는 Data ack 의 실패를 그대로 올린다 — 「단순 전달」만 하고 성공을 꾸며내지
        않는다.
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: string, format: uuid }
      responses:
        '204': { description: 되돌림(또는 되돌릴 것이 없음 — 멱등) }
      x-idempotent: true
      x-retryable: true

  # ════════════════════════════ 링크 서버 ════════════════════════════

  /internal/links:
    post:
      tags: [link-발급]
      operationId: issueLink
      summary: 링크 발급 — 코어 사실을 동봉받아 발급한다
      description: |
        ⚠️ **같은 `Idempotency-Key` 의 재시도는 같은 slug 를 재생해야 한다.** 그룹 HLD 는 활성 링크를
        **반복 발급·재사용**하므로, 재시도가 새 slug 를 만들면 이미 공유된 링크가 갈라진다.

        ⚠️ **기존 slug 생성 규칙·길이(≤12)·공개 URL 형태 `{base}/l/{slug}?g={groupId}` 를 바꾸지 말라**
        (계약 §4 · §7 변경 금지). 이미 공유된 링크가 살아 있어야 한다.

        ⚠️ **`(groupId, inviterId)` 별 최대 버전보다 오래된 명령은 발급·폐기 가릴 것 없이 거부하라**
        (ⓑ″ · ㊊). 발급만 막으면 반대 방향이 남는다: 이탈로 만들어진 revoke(N)가 지연된 사이 재가입 후
        발급(N+1)이 먼저 처리되면, 뒤늦게 도착한 revoke 가 `(groupId, inviterId)` 로 찾은 **새 active
        slug 까지 폐기**한다. 그래서 ⓐ 오래된 revoke 거부 + ⓑ **폐기 대상은 요청 `linkVersion` 과
        정확히 일치하는 링크로 한정**(둘 다 적용).
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [groupId, inviterId, linkVersion, membershipEpoch, transitionSeq, snapshotVersion]
              properties:
                groupId: { type: string, format: uuid }
                inviterId: { type: string, format: uuid }
                linkVersion:
                  type: integer
                  format: int64
                  description: '**발급 당시** epoch — 폐기의 「정확히 일치」 기준'
                membershipEpoch:
                  type: integer
                  format: int64
                  description: '**현재** epoch — 「최대값보다 오래된 명령 거부」 기준'
                transitionSeq:
                  type: integer
                  format: int64
                  description: |
                    그 멤버십 전이 커밋의 순서. 같은 outbox 라도 HTTP 적용 순서는 보장되지 않고
                    (relay 직렬화는 같은 `userId` 단위인데 claim 사용자와 발급자는 다르다, ㋥)
                    `(groupId, inviterId)` 별 전이 seq 로 걸러야 역순을 검증할 수 있다.
                snapshotVersion:
                  type: integer
                  format: int64
                  description: |
                    표시정보 스냅샷 버전. 스냅샷은 발급 시점 고정이 아니라
                    `group.renamed`·`user.displayNameChanged` relay 로 갱신되므로(㋡) 늦게 온 갱신이
                    최신 이름을 덮지 않게 version 대조가 필요하다.
                groupName: { type: [string, 'null'] }
                inviterDisplayName: { type: [string, 'null'] }
      responses:
        '200':
          description: 발급됨 — 기존 앱 응답 두 필드를 그대로 채운다
          content:
            application/json:
              schema:
                type: object
                required: [slug, url]
                properties:
                  slug: { type: string, maxLength: 12 }
                  url: { type: string }
        '409':
          description: 오래된 명령이라 거부. **`code` 를 실어라**
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
      x-idempotent: true
      x-retryable: true

  /internal/links/{slug}/claim:
    post:
      tags: [link-claim]
      operationId: claimLink
      summary: 잠정(pending) claim 기록 + 서명 자격 발급 (A22 ㋟ · ⓚ)
      description: |
        `link_clicks` 에 유저를 붙이는 일이라 **링크 서버만** 할 수 있고, 이 경로가 없으면 설치 매치는
        성공해도 **최종 귀속이 기록되지 않는다**(§3).

        **확정이 아니라 잠정이다.** 유효 판정 순서는 Data 가 갖는다 — `claimSeq` 는 판정 순서일 뿐
        링크가 기록한 순서가 아니라, 판정 10 을 받은 claim 이 revoke 11 뒤에 기록되면 seq 비교만으로는
        살아남는다. Data 가 멤버십 락 아래 남긴 확정 레코드가 `link.claimConfirmed` outbox + relay 로
        와야 유효로 승격한다.

        ⚠️ **`(groupId, inviterId)` 별 전이 sequence/tombstone 보다 낮은 confirm 을 거부하라**(㋥) —
        confirm 전달이 실패한 뒤 후속 revoke 가 먼저 성공하고 confirm 이 재시도되면 **이미 폐기된
        claim 이 다시 유효로 승격**한다.

        ⚠️ 같은 키의 재시도는 **같은 `claimId`** 를 재생해야 한다. 아니면 확정 대상이 여러 개로 갈린다.

        기존 동작 보존: 링크 직행(Universal Link)으로 들어온 유저는 클릭 행이 없을 수 있고 셀프 초대도
        있다 — 붙일 곳이 없을 뿐 **오류가 아니다**(`InviteLinkMatchService:169-177`). 그때는 200 에
        **`claimId: null, capability: null`** 을 준다(`link/src/lib/links.ts:145·149`). Business 는
        그 경우 **확정을 건너뛰고 200** 을 응답한다(기존 컨트롤러도 boolean 을 무시하고 항상 200 이었다).
        없는 slug 만 `SLUG_NOT_FOUND`(404)다.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, maxLength: 12 }
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  format: uuid
                  description: |
                    `X-User-Id` 와 **같은 값**이다. 본문에 중복으로 두는 이유는 수신 측이 두 값의 불일치를
                    거부해 배선 사고를 드러낼 수 있게 하려는 것이다 — 다르면 거부하라.
      responses:
        '200':
          description: 잠정 기록됨
          content:
            application/json:
              schema:
                type: object
                required: [claimId, capability]
                properties:
                  claimId:
                    type: [string, 'null']
                    format: uuid
                    description: |
                      **null 일 수 있다** — 셀프 초대이거나 붙일 클릭이 없을 때다(정상). Business 는
                      그때 Data 확정을 건너뛴다: null claimId 로 부르면 Data 가 거절한다.
                  capability:
                    type: [string, 'null']
                    description: |
                      서명된 자격 — slug · groupId · inviterId · **membershipEpoch** · 만료. Data 가
                      **커밋 안에서** 현재 상태와 공유 락으로 대조한다. 키는 `LINK_CAPABILITY_KEY`.
                      `claimId` 가 null 이면 이것도 null 이다.
                  groupId: { type: [string, 'null'], format: uuid }
        '404':
          description: '`SLUG_NOT_FOUND` — 기존 계약 그대로 앱에 중계된다'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
      x-idempotent: true
      x-retryable: true

  /internal/links/match:
    post:
      tags: [link-매치]
      operationId: matchLink
      summary: 클릭 소진 — 쓰기 원장은 Neon 하나뿐이다 (A22 ㊥)
      description: |
        정지 창 동안 Business 의 한시 핸들러가 부른다. **구 DB 는 후보 조회만** 하고 소진은 여기서만
        일어난다 — 양쪽에서 소진하면 잠금이 공유되지 않아 같은 클릭이 두 기기에 배정된다.

        ⚠️ **같은 `deviceId` 의 재시도는 같은 결과**여야 한다(계약 §4). 구 앱은 실패 시 다음 실행에서
        같은 `deviceId` 로 다시 보내므로, 두 번째 호출이 다른 클릭을 소진하면 한 기기가 두 초대를 갖는다.

        ⚠️ **`frozenCandidates` 는 import 계약이 준비된 뒤에만 채워진다.** 준비 전(`false`)에는 빈 배열이
        오고 Neon 후보만 소진한다 — §7.2 4단계의 기록·병합·검증 규칙(행 잠금 · `(migrationId, clickId)`
        의 `compat_applied` 표시 · 원본 체크섬 · 소진 결과 · 감사 레코드를 **같은 Neon 트랜잭션**에)이
        서기 전에 구 행을 반영하는 것은 **임의 이중 소진**이다.

        ⚠️ **병합 규칙**: 표시가 없으면 구 정지 행 전체를 반영하고, 표시가 있으면 **구 값으로 상태를
        덮지 않는다**. `clickId` 유일성과 표시·상태의 원자 커밋으로 백필이 먼저든 소진이 먼저든 결과가
        같아야 한다.

        ⚠️ **`ipHash` 는 Business 가 신뢰한 프록시의 원본 IP(`X-Link-Client-IP` + `X-Link-Proxy-Secret`)
        로만 만든다.** 방문자 입력을 그대로 전달하지 않는다.

        ⚠️ 판정 불가를 `matched:false` 로 답하지 말라 — 앱은 「응답을 받았다」만으로 확인 완료 플래그를
        세우고 다음 실행에서 재시도하지 않으므로 **되돌릴 수 없는 미매치**가 된다. 5xx 로 답하라.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ipHash, os, deviceId]
              properties:
                ipHash:
                  type: string
                  description: '`SHA-256(UTF8(ip + 기존 salt))` — 기존 salt 그대로(ⓕ)'
                os: { type: string, enum: [ios, android, other] }
                deviceId: { type: string, maxLength: 64 }
                appInstanceId: { type: [string, 'null'], maxLength: 64 }
                migrationId:
                  type: [string, 'null']
                  description: |
                    ⚠️ **import 계약 준비 전에는 이 필드를 생략(null)한다.** 링크 서버는 이 필드가
                    «있으면» import 모드로 들어가 `openRun` 을 요구하고(`link/src/lib/links.ts:104-113`),
                    `IMPORT_CLOSED` 이후에는 **빈 배열을 보내도 503 `IMPORT_IN_PROGRESS`** 가 된다.
                    null 이어야 직접 매치 경로(`requireDirectWrites`)를 탄다.
                frozenCandidates:
                  type: [array, 'null']
                  maxItems: 500
                  description: |
                    `migrationId` 가 null 이면 이 값도 null 이다. 링크 서버는 500건을 넘으면
                    `INVALID_COMPAT_CANDIDATES` 400 을 준다.
                  items: { $ref: '#/components/schemas/FrozenClickCandidate' }
      responses:
        '200':
          description: |
            소진 결과. 3시간 매치 창 · deviceId 멱등 · bot/kakao/iPad 분류 · 기존 `SHA-256(ip+salt)` 를
            보존한다(계약 §4).
          content:
            application/json:
              schema:
                type: object
                required: [matched]
                properties:
                  matched: { type: boolean }
                  slug: { type: [string, 'null'] }
                  groupId: { type: [string, 'null'], format: uuid }
      x-idempotent: true
      x-retryable: true

components:

  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      description: |
        caller 별로 **분리된** 토큰(A22 ㊀ — 총 7종). 공유하면 수신 측이 호출자를 구분 못 해 허용목록이
        합쳐지고 한쪽 유출이 다른 쪽 명령을 연다. Business 가 쓰는 것은 셋이다:
        `SVC_TOKEN_BIZ_TO_DATA` · `SVC_TOKEN_BIZ_TO_NOTI` · `SVC_TOKEN_BIZ_TO_LINK`.
        수신 측은 **audience + 경로 허용목록**으로 강제한다(㉱) — 이름 분리만으로는 최소 권한이 안 선다.

  parameters:
    XUserId:
      name: X-User-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: |
        **Business 가 검증한 AT 의 subject.** 외부에서 온 동명 헤더는 Business 가 무조건 폐기하고 이
        값으로 정확히 한 번 다시 설정한다(A22 ㉸). 수신 측은 **서비스 토큰이 없는 요청의 이 헤더를 절대
        신뢰하지 않는다** — Data 가 `JwtFilter` 를 떼고 이 헤더를 신뢰하게 되므로, 앱 헤더가 새어
        들어가면 정상 AT 를 가진 사용자가 임의의 `X-User-Id` 로 **남의 데이터를 읽고 쓴다**.
    UserIdPath:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: '`X-User-Id` 와 같은 값이어야 한다 — 다르면 거부하라(배선 사고를 드러내는 방어선)'
    CommandIdPath:
      name: commandId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 200 }
      description: |
        **키 소유자는 앱**이다(A22 ㉼) — 호출자는 첫 응답 전엔 `eventId` 를 모르고 Business 는 무상태라
        앱 재시도마다 새 키가 생긴다. 공개 Business 입력은 150자 이내이며 초과는 400이다.
        이 내부 표면의 200자 한도는 단계 접미를 포함한다. Business 는 앱이 보낸 값에 단계별 접미(`:<step>`)를 붙여 파생한다
        (한 키를 여러 상류에 그대로 보내면 두 저장소의 멱등 테이블이 서로 다른 명령을 같은 키로 본다).

        수신 측은 UNIQUE 저장 후 **응답을 재생**한다. ⚠️ **요청 본문 해시를 영구 멱등키로 쓰지 말라**
        (㊞) — 종료된 챌린지를 같은 설정으로 다시 만드는 정상 명령이 접히고, 같은 설정으로 되돌리는
        정상 설정 변경도 접힌다.

        구 앱은 키를 보내지 않아 **매 호출 새 키**가 된다 — 그 기간엔 「Business 내부 재시도만 보호」로
        인정하고, 앱 보급 후 필수화한다.

  schemas:

    Error:
      type: object
      required: [code, message]
      description: |
        **`code` 가 실린 4xx 는 도메인 판정**이다 — Business 가 재해석하지 않고 status·code·message 를
        그대로 앱에 중계한다. 앱이 이 문자열로 분기하므로(`GROUP_NOT_FOUND` · `NOT_MEMBER` ·
        `SLUG_NOT_FOUND` · `RESULT_CLAIM_HELD` · `RESULT_CLAIM_STALE` · `RESULT_ALREADY_ACKED` ·
        `RESULT_NOT_SETTLED` …) **상수 이름은 계약**이다.

        **`code` 를 빼면 의미가 달라진다**: 코드 없는 401/403 은 Business 의 서비스 자격 문제(502 로
        올린다 — 사용자에게 401 을 주면 정상 세션이 전부 재로그인으로 튄다), 코드 없는 그 밖의 4xx 는
        계약 어긋남(502), 5xx 는 판정 불가(503)다.
      properties:
        code: { type: string }
        message: { type: string }

    RetryAfterError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [retryAfterMs]
          properties:
            retryAfterMs:
              type: integer
              format: int64
              description: |
                **상대 지연(밀리초)** 이지 만료 시각이 아니다. 절대 시각을 실으면 시계가 어긋난 기기가
                살아 있는 리스를 즉시 다시 요청하거나(1회 기회 소진) 만료 뒤에도 한참 기다린다.
                Business 는 이 값을 **다시 계산하지 않고 그대로 중계**한다 — 재계산하면 두 서버의 시계
                차이가 값에 섞인다.

    DurableCommandAck:
      type: object
      required: [commandId, eventId, version]
      description: |
        내구 명령의 **완성된 봉투**(A22 ㉵). Business 에는 DB 가 없어 outbox 시퀀스를 다시 읽을 수 없으므로
        Data 가 여기까지 채워서 준다.
      properties:
        commandId:
          type: string
          format: uuid
          description: 직접 전달 성공 시 완료 표시할 대상(㊿)
        eventId:
          type: string
          description: 불변 사건 식별자 — 위성의 dedup 기준
        version:
          type: integer
          format: int64
          description: |
            **aggregate 행 잠금 아래** 발급된 단조 version(㊸). DB sequence 는 «할당 순서»만 보장하고
            커밋 순서를 보장하지 않아, 먼저 번호를 받고 늦게 커밋한 최신 상태가 폐기된다.
            위성은 이 값으로 역순 적용을 막고, **컬렉션 투영은 aggregate 별 version** 을 쓴다(㊂ —
            유저 단위 최대 version 하나면 지연된 앞 회차가 「오래된 것」으로 거부돼 참가 행이 영구 누락).

    ClaimIntentAck:
      allOf:
        - $ref: '#/components/schemas/DurableCommandAck'
        - type: object
          required: [completed]
          properties:
            completed:
              type: boolean
              description: 같은 요청 키의 의도가 이미 CONSUMED 또는 ABANDONED면 true. Business는 200을 재생한다.

    SettingsSessionProof:
      type: object
      additionalProperties: false
      required:
      - sessionId
      - authGeneration
      properties:
        sessionId: &id001
          type: string
          format: uuid
        authGeneration: &id002
          type: integer
          format: int64
          minimum: 0
    SettingsPatchCommandRequest:
      type: object
      additionalProperties: false
      required:
      - notifications
      - sessionId
      - authGeneration
      properties:
        notifications:
          type: boolean
        sessionId: *id001
        authGeneration: *id002
    SettingsSnapshot:
      type: object
      additionalProperties: false
      required:
      - version
      - authGeneration
      - settings
      properties:
        version: *id002
        authGeneration: *id002
        settings:
          $ref: '#/components/schemas/CompleteNotificationSettings'
    SettingsPatchDelivery:
      type: object
      additionalProperties: false
      required:
      - mask
      - patch
      - baseline
      - authGeneration
      properties:
        mask: &id003
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - notificationEnabled
            - soundEnabled
            - nightModeEnabled
            - nightStartTime
            - nightEndTime
        patch: &id004
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            notificationEnabled:
              type: boolean
            soundEnabled:
              type: boolean
            nightModeEnabled:
              type: boolean
            nightStartTime:
              type:
              - string
              - 'null'
              pattern: ^([01]\d|2[0-3]):[0-5]\d$
            nightEndTime:
              type:
              - string
              - 'null'
              pattern: ^([01]\d|2[0-3]):[0-5]\d$
        baseline: &id005
          $ref: '#/components/schemas/CompleteNotificationSettings'
        authGeneration: *id002
    SettingsApplied:
      type: object
      additionalProperties: false
      required:
      - applied
      properties:
        applied:
          type: boolean
          const: true
    SettingsPatchCommandResult:
      type: object
      additionalProperties: false
      required:
      - commandId
      - eventId
      - version
      - mask
      - patch
      - baseline
      - authGeneration
      - result
      properties:
        commandId: *id001
        eventId:
          type: string
        version:
          type: integer
          format: int64
          minimum: 1
        mask: *id003
        patch: *id004
        baseline: *id005
        authGeneration: *id002
        result:
          type: object
          additionalProperties: false
          required:
          - notifications
          properties:
            notifications:
              type: boolean

    CompleteNotificationSettings:
      allOf:
        - $ref: '#/components/schemas/NotificationSettings'
      required: [notificationEnabled, soundEnabled, nightModeEnabled, nightStartTime, nightEndTime]
      description: Data mirror의 실제 5값. nullable 시간 키도 생략하지 않는다.

    NotificationSettings:
      type: object
      required: [notificationEnabled, soundEnabled, nightModeEnabled]
      description: |
        **전체 교체**다. 기존 앱 계약(`NotificationSettingsRequest`·`NotificationSettingsResponse`)과
        필드·제약이 글자 그대로 같다 — 세 플래그는 필수라 생략하면 400 이고, 시각은 미설정 시 null 이다.

        시각은 **시간대를 담지 않는다** — 서버 날짜 축이 KST 고정이라 해석도 그 축에서 이뤄진다.
        자정을 넘기는 구간(예: `22:00`~`07:00`)도 정상 입력이다. 조회 응답도 요청과 동일한 `HH:mm` 형식이며 초를 붙이지 않는다.
      properties:
        notificationEnabled: { type: boolean }
        soundEnabled: { type: boolean }
        nightModeEnabled: { type: boolean }
        nightStartTime:
          type: [string, 'null']
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        nightEndTime:
          type: [string, 'null']
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'

    FrozenClickCandidate:
      type: object
      required: [source, sourceChecksum]
      description: |
        구 `invite_link_clicks` 정지 스냅샷 행의 **래퍼**. Data 의 read-only export 로만 오고 Business 는
        소진하지 않는다.

        ⚠️ **`sourceChecksum` 은 `source` 객체 「전체」의 체크섬**이다
        (`link/src/lib/migration.ts:61` 의 `checksum(source) !== suppliedChecksum` →
        `SOURCE_CHECKSUM_MISMATCH`). 그래서 중간 서비스가 필드를 풀어 다시 조립하면 키 순서·타입·null
        표현 차이만으로 체크섬이 깨지고, 그 체크섬은 §7.2 4단계 검증의 기준이라 깨지면 **이관 검증을
        닫을 수 없다**. Business 는 원본 JSON 을 손대지 않고 통째로 전달한다.

        ⚠️ `invite_link_clicks` 에는 `updated_at` 이 없다(`V21`). 증분 커서를 **시각으로 잡으면 안 된다**
        (㋖) — 상태 변경 시각은 커밋 순서를 보장하지 않아 늦게 커밋된 전이를 영구히 건너뛴다. change
        sequence 또는 클릭 전용 outbox 를 쓰고, 최종 단계는 전체 스캔이다.
      properties:
        source:
          type: object
          description: |
            `link/src/lib/migration.ts` 의 `FrozenClick` **25필드 전량**. 축약하면 링크의 `frozen()` 이
            `INVALID_FROZEN_CLICK` 400 을 주거나 불변 필드 검증에서 떨어진다:

            `clickId` · `linkId` · `slug` · `groupId` · `inviterId` · `linkVersion` ·
            `membershipEpoch` · `transitionSeq` · `groupName` · `inviterName` · `groupClosed` ·
            `linkStatus`(ACTIVE|REVOKED) · `linkCreatedAt` · `revokedAt` · `ipHash`(64자 hex) ·
            `os`(ios|android|other) · `userAgent` · `clickedAt` · `matched` · `matchedAt` ·
            `matchedDeviceId` · `appInstanceId` · `claimedUserId` · `claimedAt`.

            링크 서버가 강제하는 불변식: `matched === (matchedAt !== null)` ·
            `(linkStatus === 'REVOKED') === (revokedAt !== null)` ·
            `claimedUserId !== null` 이면 `claimedAt` 도 non-null.

            ⚠️ `claimedUserId` 는 `InviteLinkClick:127` 이 **최초 1회만** 기록한다 — 되돌릴 길이 없으므로
            탈퇴 시 `withdraw` 가 같은 트랜잭션에서 익명화해야 한다(A22 ⓐ).
        sourceChecksum:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: '`source` 전체의 체크섬. 4단계 검증이 이 값을 대조한다'

security:
  - serviceToken: []

# ─────────────────────────────────────────────────────────────────────────────
# 이 파일에 «없는» 것 — 최소 Business 의 경계
#
#  · 인증 발급(AT 서명 · refresh 회전 · logout · 최초 로그인 RT 2단계 · 소셜 선택적 인증):
#    A7 · A22 ⓠ · ㉮ · ㊑ · ㊔ · ㊙ · ㊒ · ㋣ · ㋪ 가 정한 표면은 **1661 전체 BFF/IdP 이전**의 몫이다.
#    전환 기간에 Business 는 legacy issuer 가 서명한 AT 를 **검증만** 한다.
#  · `link.revoked` · `link.joined` · `link.claimConfirmed` · `group.closed` · `group.renamed` ·
#    `user.displayNameChanged` · `user.withdrawn`(링크 쪽) 전달: **Data 의 outbox relay** 가 한다
#    (§3 · A22 ㋟). Business 에 그 호출 경로를 두면 락이 풀린 뒤 보내는 창이 생긴다.
#    link.joined(A22 ㋻): 가입자 USER 축 version, subjectId=groupId,
#    eventId=link.joined:<groupId>:<joinedUserId>:<가입자 membershipEpoch>.
#    params={groupId, slug, joinMethod}. 직접 가입은 claim 선행 없이 기록하며 Link가
#    slug 원장으로 그룹·셀프 초대를 대조한다. 미존재/불일치는 applied:false로 완료한다.
#  · FCM 발송 트리거: 신 서버의 모든 발송은 공통 `dispatch_enabled` 게이트 뒤에서만 일어난다(㋭).
#    Business 에 발송 경로가 **없는 것이 그 게이트를 지키는 방법**이다.
#  · claim 의도 재개: Business 의 **일회성 CLI**(`business.claim-replay.enabled=true`)가 유일한 주체다.
#    서빙 프로세스에는 그 동작을 시작하는 장치가 없다(§6 크론 없음) — 스케줄은 §7.2 런북에 있다.
#    그래서 `business.compat.claim-queue-replay-enabled` 가 꺼진 평상시에는 `202` 를 주지 않고
#    실패를 올린다: 재개 주체가 없을 때의 202 는 「큐만 쌓이고 아무도 끝내지 않는」 영구 대기다.
#  · 알림 admin API · 콘솔 세션: N 과 L 의 몫이다.
#  · 그 밖의 기존 외부 경로(패스스루): 위성 조합이 필요하지 않아 1661 까지 Data 가 계속 받는다.
# ─────────────────────────────────────────────────────────────────────────────
