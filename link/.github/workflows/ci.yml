name: 링크 서버 검증
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: link-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # 실제 Postgres 16과 운영 migration runner를 테스트가 구동한다.
      - run: npm run verify
