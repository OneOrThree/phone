# dev 서버(gromo-dev-app)에서 도는 구성 — 앱 + postgres.
#
# app 이미지는 여기서 빌드하지 않는다. 빌드는 CI 러너(gromo-dev-build)가 하고
# GAR(ci-cache)로 올린 것을 cd.yml의 deploy job이 받아 띄운다(GROMO-953).
# APP_IMAGE는 그 job이 .env에 써준다. 기본값을 둔 이유는 오버레이 때문이다 —
# dev-monitor·dev-datadog는 이 파일을 -f로 함께 읽는데, 값이 비면 app 서비스를
# 건드리지 않는 실행에서도 compose 파싱이 깨진다.
services:
  app:
    image: ${APP_IMAGE:-asia-northeast3-docker.pkg.dev/oneorthree2/ci-cache/back:latest}
    container_name: phone-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      API_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      API_DB_USERNAME: ${POSTGRES_USER}
      API_DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
      # FCM 발송 (GROMO-528) — dev 프로파일 = FCM 구현 활성, 시크릿 미등록 시 fail-fast 기동 실패
      FCM_PROJECT_ID: ${FCM_PROJECT_ID}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON}
      # 누끼 유해 이미지 모더레이션 (GROMO-1048) — OpenAI omni-moderation 서버 게이트(1044)가 읽는 키.
      # 미주입 시 서버는 fail-closed(전체 차단)로 동작하므로 dev 컨테이너에 반드시 주입한다.
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: phone-db
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:

networks:
  app-network:
    driver: bridge
