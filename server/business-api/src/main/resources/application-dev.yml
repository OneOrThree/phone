# dev 배포용. 값은 전부 환경변수 주입이라 시크릿이 파일에 없다(그래서 커밋한다).
#
# ⚠️ 새 키를 저장소에 추가하는 것만으로는 컨테이너에 전달되지 않는다 — 현 dev 배포는
#    Secrets Manager(gromo/dev/env) → write-compose-env.py(고정 허용목록) → compose 순서이고,
#    그 생성기가 «허용목록에 있는 키만» 출력한다(A22 ㋯ · 시스템 §2.4). 아래 변수들을 그 목록에
#    추가하는 작업은 통합 담당자(C)의 몫이며, 빠지면 이 서비스가 부팅에서 fail-fast 한다.
jwt:
  # legacy issuer(Data API)와 «같은 값»이어야 한다. 전환 기간에 이 서비스는 검증만 한다.
  secret: ${JWT_SECRET}

auth:
  # data-api application-dev.yml 의 access-token 수명(2592000초 = 30일)과 같아야 한다.
  revoked-session:
    ttl: 2592000s
  # 로그인 시도의 자격 digest 전용 비밀 (GROMO-1908 · 계정 LLD §3).
  # ⚠️ jwt.secret 과 «다른 값»이어야 한다 — 한 키가 여러 용도를 겸하면 한쪽의 수명 정책
  #    (로그인 복구 창 5분)이 다른 쪽(발급 토큰의 최대 만료)을 끌어내려 멀쩡한 세션이 끊긴다.
  # ⚠️ 비거나 치환되지 않으면 «부팅이 실패»한다(CredentialDigest 의 RequiredConfig fail-fast).
  #    비밀 없는 digest 는 「원 자격을 들고 있다」는 증거이기를 그만두는데, 로그인은 «정상 동작하는
  #    것처럼» 보여서 그 상태가 사고 뒤에야 드러난다. 부팅 실패가 배포 게이트다.
  # ⚠️ 이 키도 write-compose-env.py 허용목록에 넣어야 컨테이너까지 전달된다(파일 머리 참조).
  login-attempt:
    digest-secret: ${LOGIN_ATTEMPT_DIGEST_SECRET}

business:
  upstream:
    data:
      base-url: ${DATA_API_BASE_URL}
      # caller 별로 «분리된» 토큰이다(A22 ㊀). 공유하면 수신 측이 호출자를 구분 못 해 허용목록이
      # 합쳐지고 한쪽 유출이 다른 쪽 명령을 연다.
      service-token: ${SVC_TOKEN_BIZ_TO_DATA}
    notification:
      base-url: ${NOTIFICATION_BASE_URL}
      service-token: ${SVC_TOKEN_BIZ_TO_NOTI}
    # GROMO-1775 우체통 — 실시간 서버. 두 값 모두 write-compose-env.py 의 business-api 필수 목록에 있어
    # 시크릿에 없으면 env 생성이 배포 «전에» 실패한다(위 ⚠️ 와 같은 절차).
    realtime:
      base-url: ${REALTIME_BASE_URL}
      service-token: ${SVC_TOKEN_BIZ_TO_REALTIME}

  # 목록 커서 서명(GROMO-1759) — 서명기는 항상 있다(2026-10-27, 티켓 2535 — enabled 스위치를 걷었다).
  # 자리표시자에 «기본값이 없어도» 리터럴 바인딩 함정(RequiredConfig 참고)에 걸리지 않는다:
  # BUSINESS_CURSOR_KEY_V1 은 write-compose-env.py 의 business-api 필수 목록에 있어, 시크릿에 없으면 env 생성이
  # 배포 «전에» 실패한다. 그래도 키가 비거나 치환되지 않았거나 짧으면 CursorConfig 가 부팅에서 막는다.
  # 키는 JWT 와 «독립»인 256비트 이상 base64. 회전은 keys 에 v2 를 더하고 active-key 를 옮기는
  # 순서다 — 이전 키는 커서 만료창(≤15분) 동안 검증용으로 남는다.
  # ⚠️ 회전 트랩: keys 블록에는 v1 «하나»만 있다. env 의 BUSINESS_CURSOR_ACTIVE_KEY 만 v2 로 바꾸면
  # keys 에 v2 가 없어 부팅이 떨어진다. 회전은 «keys.v2 를 더하는 코드 PR 이 먼저», 그 다음 env 의
  # active-key 를 옮기는 순서다 — env 값만으로는 회전할 수 없다. (prod 도 같다.)
  cursor:
    active-key: ${BUSINESS_CURSOR_ACTIVE_KEY:v1}
    keys:
      v1: ${BUSINESS_CURSOR_KEY_V1}

logging:
  level:
    com.oneorthree.business: INFO

# 게스트 로그인 IP 제한에 사용하는 신뢰 프록시 계약.
link:
  trusted-ip-headers: ${LINK_TRUSTED_IP_HEADERS:X-Link-Client-IP}
  proxy-secret: ${LINK_PROXY_SECRET:}
