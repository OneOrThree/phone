# Datadog dev overlay (docs/superpowers/specs/2026-07-16-datadog-dev-design.md)
#
# 실행:  docker compose -f docker-compose.dev.yml -f docker-compose.datadog.yml up -d datadog-agent app
# 중지:  docker compose -f docker-compose.dev.yml -f docker-compose.datadog.yml rm -sf datadog-agent
#        그 뒤 docker compose -f docker-compose.dev.yml up -d app  로 app 을 평문(javaagent 없음)으로 복원.
#
# 반드시 overlay(-f 두 개)로 실행 — dev 의 app-network·app·db 와 같은 프로젝트/네트워크를 공유해야
# app 이 datadog-agent:8126 으로 트레이스를 보내고, Agent 가 app:9091 을 OpenMetrics 로 스크레이프한다.
# cd.yml(main push 배포)은 이 overlay 와 간섭한다 — 같은 프로젝트의 같은 서비스(app)를 재생성하므로,
# dev 파일 단독으로 up 하면 아래 app override(-javaagent·DD_* env·라벨)가 통째로 벗겨진다.
# 그래서 cd.yml 은 gromo-datadog-agent 기동 여부를 감지해 켜져 있으면 이 파일을 함께 물린다 (GROMO-1233).
# 컨테이너 로그 보존(계정 정책 L09) — Docker json-file 은 «크기»로만 회전한다. 값의 근거는 README §로그 보존.
x-infra-logging: &infra-logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  datadog-agent:
    logging: *infra-logging
    image: gcr.io/datadoghq/agent:7
    container_name: gromo-datadog-agent
    mem_limit: 512m                            # prod 와 동일 — Agent 가 호스트 메모리를 잠식하지 않게 (GROMO-1489)
    environment:
      # 빈/미설정이면 즉시 실패(fail-fast) — 키 없이 up 이 green 처리되어 무텔레메트리로 남는 것 방지.
      DD_API_KEY: ${DD_API_KEY:?DD_API_KEY 미설정 — GitHub Actions 시크릿(DD_API_KEY) 등록 필요}
      DD_SITE: ${DD_SITE:-us5.datadoghq.com}
      DD_ENV: dev
      DD_HOSTNAME: gromo-dev
      # 전역 태그에 service 를 넣지 않는다 (GROMO-1489). DD_TAGS 는 Agent 가 내보내는 **모든** 시계열에
      # 붙으므로, 여기에 service:gromo-back-dev 를 두면 db 컨테이너 메트릭이 자기 라벨(gromo-db-dev)과
      # 전역 태그를 동시에 갖게 되어 컨테이너별 service 분리가 무의미해진다.
      # service 는 컨테이너 라벨(com.datadoghq.tags.service)과 app 의 DD_SERVICE 가 각각 책임진다.
      DD_TAGS: "env:dev"
      # 로그 수집 — 컨테이너 stdout tail
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      # 인벤토리·Live Containers는 전부 추적하되, OSS 관측 스택 stdout은 Datadog에 다시 보내지 않는다.
      # DD_CONTAINER_EXCLUDE와 분리해야 이미지/컨테이너 메타데이터 수집 범위를 줄이지 않고 로그 이중
      # 수집·과금만 막을 수 있다.
      DD_CONTAINER_EXCLUDE_LOGS: "name:gromo-prometheus name:gromo-grafana name:gromo-loki name:gromo-promtail name:gromo-postgres-exporter name:gromo-node-exporter name:gromo-cadvisor name:gromo-datadog-agent"
      # 로그를 docker API 스트림이 아니라 호스트 로그파일에서 tail 한다 (GROMO-1489).
      # dev 호스트는 컨테이너가 많아 docker API 가 6초까지 걸리고(기본 타임아웃 5초), 그러면 로그 소스
      # 자동탐지가 통째로 실패해 2일간 LogsProcessed=0 이 됐다. 파일 tail 은 docker API 응답성과 무관하다.
      # /var/lib/docker/containers 마운트는 아래에 이미 있고, 로그 드라이버도 json-file 이라 그대로 읽힌다.
      # ⚠️ FORCE_USE_FILE 은 일부러 켜지 않는다 — 파일 tailer 생성이 실패하면 Agent 는 소켓으로 폴백해
      #    수집을 이어가는데("The log file tailer could not be made, falling back to socket", status 는 OK
      #    유지), FORCE 는 그 폴백을 막아 수집을 0으로 만든다. 안전망을 없애면 지금 고치는 증상이 재발한다.
      DD_LOGS_CONFIG_DOCKER_CONTAINER_USE_FILE: "true"
      # 실행 중 이미지 메타데이터를 Container Images Explorer로 보낸다. 과거 5초 Docker API timeout이
      # docker/container 체크 전체를 떨어뜨렸으므로 query timeout을 60초로 넓히고 workflow에서
      # container_image 체크의 등록·오류 상태까지 검증한다. 이미지 인벤토리는 메트릭 체크가 아니므로
      # TotalMetricSamples 증가를 요구하지 않는다. SBOM은 별도 Cloud Security 과금·권한 범위다.
      DD_CONTAINER_IMAGE_ENABLED: "true"
      DD_SBOM_CONTAINER_IMAGE_ENABLED: "false"
      DD_DOCKER_QUERY_TIMEOUT: "60"            # 기본 5초 — 부하 걸린 호스트의 images/json 응답까지 기다린다
      # APM 수신 — 같은 네트워크의 app 컨테이너가 접속(non-local)
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true" # app 컨테이너 DogStatsD(JVM 런타임 메트릭) 수신 — 없으면 JVM 위젯 빈다
      # Live Processes와 컨테이너 lifecycle을 함께 보내 호스트/컨테이너 리소스에서 실제 프로세스까지
      # 한 번에 내려갈 수 있게 한다. /host/proc와 docker.sock은 아래 read-only mount를 재사용한다.
      DD_PROCESS_AGENT_ENABLED: "true"
      DD_PROCESS_CONFIG_PROCESS_COLLECTION_ENABLED: "true"
      DD_CONTAINER_LIFECYCLE_ENABLED: "true"
      # 이름 기반 제외를 두지 않는다. 앱·DB뿐 아니라 Redis/Kafka/exporter/관측 스택까지 dev의 모든
      # Docker workload를 Container Explorer와 Live Containers에서 추적한다.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro # 로그 tail
      - datadog_agent_run:/opt/datadog-agent/run:rw # 로그 오프셋(재시작 시 재수집 방지)
    # OpenMetrics 브리지는 이 파일의 마운트가 아니라 app 이미지의 AD 라벨(server/data-api/Dockerfile)이 담당한다 —
    # prod 호스트엔 레포가 없어 마운트할 수 없었고, 그래서 커스텀 메트릭이 dev 에만 있었다 (GROMO-1489).
    networks: [app-network]
    restart: unless-stopped

  # dev 의 app 서비스를 override — overlay 켤 때만 APM 활성. dev 파일 단독(dev-cd.yml) 실행 시엔 미적용(평문).
  app:
    environment:
      # JAVA_OPTS 는 override 로 대체되므로 dev 의 egd 옵션을 다시 명시하고 -javaagent 를 추가.
      JAVA_OPTS: "-Djava.security.egd=file:/dev/./urandom -javaagent:/opt/datadog/dd-java-agent.jar"
      DD_AGENT_HOST: datadog-agent
      DD_ENV: dev
      DD_SERVICE: gromo-back-dev
      DD_VERSION: ${IMAGE_VERSION:?실제 앱 이미지 revision 미설정}
      # dd-java-agent 가 dd.trace_id/dd.span_id 를 MDC 에 주입. 단 CONSOLE appender 는 텍스트 패턴이고
      # app 자체 trace_id 키를 찍으므로, 완전한 로그↔트레이스 상관은 아직 미완 — JSON 콘솔(별도 datadog
      # 프로파일) 또는 Datadog Grok 로그 파이프라인 필요(Phase 3). 지금은 MDC 주입만 준비해 둔다.
      DD_LOGS_INJECTION: "true"
      DD_TRACE_SAMPLE_RATE: "1.0" # dev 요청은 전량 보존 — 장애 재현 시 희소 트레이스가 생기지 않게 한다
      DD_RUNTIME_METRICS_ENABLED: "true" # JVM 런타임 메트릭 — prod와 통일
      DD_PROFILING_ENABLED: "true" # CPU·wall time·allocation·lock 프로파일
      DD_DATA_STREAMS_ENABLED: "true" # Kafka producer/consumer 경로와 처리 지연
      DD_TRACE_ANALYTICS_ENABLED: "true"
      DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED: "true" # inferred 서비스 안 쪼갬 — prod와 통일
      DD_GIT_REPOSITORY_URL: "github.com/OneOrThree/phone" # 트레이스↔소스코드 연결
      DD_GIT_COMMIT_SHA: ${IMAGE_REVISION:?실제 앱 이미지 revision 미설정}
    labels: # 통합 서비스 태그 — app 컨테이너 로그·메트릭을 트레이스 service 와 정렬
      com.datadoghq.tags.env: "dev"
      com.datadoghq.tags.service: "gromo-back-dev"
      com.datadoghq.tags.version: "${IMAGE_VERSION:?실제 앱 이미지 revision 미설정}"
    # base(dev)의 db healthy 의존을 유지하면서 datadog-agent 를 추가 — short-form(list)이 base 의 map 을
    # 덮어써 db 대기가 사라지는 것 방지(fresh 호스트/DB 재생성 중 app 조기기동 실패 회피).
    depends_on:
      db:
        condition: service_healthy
      datadog-agent:
        condition: service_started

  # db 의 통합 서비스 태그는 여기가 아니라 docker-compose.dev.yml 에 있다 (GROMO-1489).
  # 오버레이에만 두면 datadog 토글마다 db 설정이 달라져 compose 가 컨테이너를 재생성하고,
  # 그때마다 PostgreSQL 연결이 끊긴다(codex 리뷰). 기본 파일에 두면 토글 전후 설정이 같다.

volumes:
  datadog_agent_run:

# dev compose 의 app-network 와 overlay 시 병합됨(같은 프로젝트).
networks:
  app-network:
    driver: bridge
