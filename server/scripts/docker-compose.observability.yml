# GROMO-546 — dev 관측 스택 (docker-compose.dev.yml 위에 얹는 overlay)
#
# 실행:  docker compose -f server/scripts/docker-compose.dev.yml -f server/scripts/docker-compose.observability.yml up -d
# 중지:  docker compose -f server/scripts/docker-compose.dev.yml -f server/scripts/docker-compose.observability.yml down
#
# 반드시 overlay 로 실행(-f 두 개) — 그래야 dev 의 app-network·app·db 와 같은 프로젝트/네트워크를
# 공유해 서비스명(app:9091, db:5432)으로 스크레이프한다. dev-cd.yml 은 `up -d app` 만 하므로 간섭 없음.
# 설정 마운트(../observability/*)는 compose 파일 위치(server/scripts/) 기준 상대경로다.
services:
  # 메트릭 수집·저장 — app(:9091 actuator)·postgres-exporter·node·cadvisor 스크레이프(5s)
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: gromo-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"   # 로컬 확인용(선택) — 내부 스크레이프는 네트워크로 충분
    networks: [app-network]
    restart: unless-stopped

  # 대시보드·알람 UI — 한 화면: 트래픽 RED · 쿼리 부하 · 리소스 · 실시간 로그
  grafana:
    image: grafana/grafana:11.4.0
    container_name: gromo-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [prometheus, loki]
    networks: [app-network]
    restart: unless-stopped

  # 로그 저장 — promtail 이 밀어넣음
  loki:
    image: grafana/loki:3.3.2
    container_name: gromo-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ../observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks: [app-network]
    restart: unless-stopped

  # 로그 수집 — docker_sd 로 컨테이너 stdout tail → Loki (docker.sock 필요)
  promtail:
    image: grafana/promtail:3.3.2
    container_name: gromo-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ../observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on: [loki]
    networks: [app-network]
    restart: unless-stopped

  # 쿼리 부하 L2 — db(dev compose 정의)에 접속, pg_stat_* 노출. 접속정보는 dev .env 재사용
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    container_name: gromo-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
    # db(dev compose)의 healthcheck 를 기다려 최초 기동 시 스크레이프 공백 방지. overlay 전제(db 는 dev 파일 서비스).
    depends_on:
      db:
        condition: service_healthy
    networks: [app-network]
    restart: unless-stopped

  # 호스트 리소스 — CPU·메모리·디스크
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: gromo-node-exporter
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [app-network]
    restart: unless-stopped

  # 컨테이너별 리소스. 기본 포트 8080 = app 과 충돌 → 호스트 미공개(내부에서 Prometheus 만 접근)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: gromo-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks: [app-network]
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  loki_data:

# dev compose 의 app-network 와 overlay 시 병합됨(같은 프로젝트).
networks:
  app-network:
    driver: bridge
