# GROMO-546 — dev 관측 스택 (docker-compose.dev.yml 위에 얹는 overlay)
#
# 실행:  docker compose -f server/scripts/docker-compose.dev.yml -f server/scripts/docker-compose.observability.yml up -d
# 중지:  docker compose -f server/scripts/docker-compose.dev.yml -f server/scripts/docker-compose.observability.yml stop <관측 서비스…>
#        (`down` 은 dev.yml 의 앱·db·redis 까지 내린다 — 서비스 목록은 ops-monitor.dev.yml 의 OBS_SERVICES)
#
# 반드시 overlay 로 실행(-f 두 개) — 그래야 dev 의 app-network·app·db 와 같은 프로젝트/네트워크를
# 공유해 서비스명(app:9091, db:5432)으로 스크레이프한다. 배포 workflow 는 자기 서비스만 `up -d` 하므로 간섭 없음.
# 설정 마운트(../observability/*)는 compose 파일 위치(server/scripts/) 기준 상대경로다.

# 컨테이너 로그 보존(계정 정책 L09) — Docker json-file 은 «크기»로만 회전한다. 값의 근거는 README §로그 보존.
x-infra-logging: &infra-logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  # 메트릭 수집·저장 — app(:9091 actuator)·postgres-exporter·node·cadvisor 스크레이프(5s)
  prometheus:
    logging: *infra-logging
    image: prom/prometheus:v2.55.1
    container_name: gromo-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"   # 로컬 확인용(선택) — 내부 스크레이프는 네트워크로 충분
    networks: [app-network]
    restart: unless-stopped

  # 대시보드·알람 UI — 한 화면: 트래픽 RED · 쿼리 부하 · 리소스 · 실시간 로그
  grafana:
    logging: *infra-logging
    image: grafana/grafana:11.4.0
    container_name: gromo-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [prometheus, loki]
    networks: [app-network]
    restart: unless-stopped

  # 로그 저장 — fluent-bit 이 밀어넣음
  loki:
    logging: *infra-logging
    image: grafana/loki:3.3.2
    container_name: gromo-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ../observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks: [app-network]
    restart: unless-stopped

  # 로그 수집 — 컨테이너 로그 파일(json-file)을 tail → 허용 서비스만 Loki 로 (GROMO-2555). docker.sock 은 쓰지 않는다.
  # tail 위치 DB 와 디스크 버퍼는 fluent_bit_state 볼륨에 남아 재시작·재생성 뒤 이어 읽는다.
  # /var/lib/docker/containers 는 읽기 전용이지만 config.v2.json(컨테이너 환경변수 포함)도 보인다 —
  # 라벨 한 줄만 읽도록 logs.lua 가 짜여 있다. 허용 목록 밖 컨테이너와 자기 자신의 로그는 걸러진다.
  fluent-bit:
    logging: *infra-logging
    image: fluent/fluent-bit:4.2.8
    container_name: gromo-fluent-bit
    command: ["-c", "/fluent-bit/etc/fluent-bit.conf"]
    environment:
      FLB_COMPOSE_PROJECT: phone
      FLB_ENV: dev
      # GROMO-2556 — 선택 모듈. 아래 값은 모두 «기본 꺼짐/기본값»이다(필수 변수 없음). 변수를 안 줘도 2555 와 다른 점: canary(60초마다
      #   service=canary 1건, 모듈과 무관하게 켜짐)와 아래 /var/log/nginx 읽기 전용 마운트(호스트에 없으면 Docker 가 빈 디렉터리를 만든다).
      #   OBS_LOG_S3=on           원본 로그 S3 출력(modules/s3-on). dev 에는 S3 자격이 없으므로 dev 에서는 켜지 않는다(2554 실측·결정 대기).
      #                           켜려면 OBS_LOG_S3_BUCKET 과 호스트의 인스턴스 역할/자격 체인이 먼저 있어야 한다.
      #   OBS_LOG_NGINX_HOST=on   dev 호스트 Nginx 파일 tail(modules/nginx-host-on). 호스트 log_format 적용 절차는 ingestion-runbook.md.
      FLB_S3_BUCKET: ${OBS_LOG_S3_BUCKET:-}
      FLB_S3_REGION: ${OBS_LOG_S3_REGION:-ap-northeast-2}
      FLB_S3_TOTAL_FILE_SIZE: ${OBS_LOG_S3_TOTAL_FILE_SIZE:-10M}
      FLB_S3_UPLOAD_TIMEOUT: ${OBS_LOG_S3_UPLOAD_TIMEOUT:-5m}
      # 2554 dev 산정: peak 14,324 B/s x 1,800 s x 2 = 52 MB → 올림 64M. prod 값은 용량 확인 전 미정(약 2 GB 산정).
      FLB_S3_STORE_LIMIT: ${OBS_LOG_S3_STORE_LIMIT:-64M}
    volumes:
      - ../observability/fluent-bit:/fluent-bit/etc:ro
      # 선택 모듈 자리(디렉터리가 etc 안에 있어야 읽기 전용 마운트 위에 겹쳐 마운트된다). off 는 .conf 가 주석뿐이다.
      - ../observability/fluent-bit/modules/s3-${OBS_LOG_S3:-off}:/fluent-bit/etc/modules/s3:ro
      - ../observability/fluent-bit/modules/nginx-host-${OBS_LOG_NGINX_HOST:-off}:/fluent-bit/etc/modules/nginx-host:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # dev 호스트 Nginx 로그(www-data:adm 0640 — 이 컨테이너는 root 로 읽는다). 읽기만 하며, 모듈이 꺼져 있으면 읽지 않는다.
      - /var/log/nginx:/var/log/nginx:ro
      - fluent_bit_state:/var/lib/fluent-bit
    mem_limit: 256m
    depends_on: [loki]
    networks: [app-network]
    restart: unless-stopped

  # 쿼리 부하 L2 — db(dev compose 정의)에 접속, pg_stat_* 노출. 접속정보는 dev .env 재사용
  postgres-exporter:
    logging: *infra-logging
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    container_name: gromo-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yml
    volumes:
      - ../observability/postgres-exporter/queries.yml:/etc/postgres-exporter/queries.yml:ro
    # db(dev compose)의 healthcheck 를 기다려 최초 기동 시 스크레이프 공백 방지. overlay 전제(db 는 dev 파일 서비스).
    depends_on:
      db:
        condition: service_healthy
    networks: [app-network]
    restart: unless-stopped

  # Redis 운영 지표 — keyspace/eviction/client/memory. 애플리케이션 Redis를 읽기만 한다.
  redis-exporter:
    logging: *infra-logging
    image: oliver006/redis_exporter:v1.66.0
    container_name: gromo-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_USER: health
    labels:
      com.datadoghq.tags.env: dev
      com.datadoghq.tags.service: gromo-redis-dev
      com.datadoghq.ad.checks: >-
        {"openmetrics":{"init_config":{},"instances":[{"openmetrics_endpoint":"http://%%host%%:9121/metrics","namespace":"gromo_redis","metrics":[".*"],"health_service_check":true}]}}
    networks: [app-network]
    restart: unless-stopped

  kafka-exporter:
    logging: *infra-logging
    image: danielqsj/kafka-exporter:v1.8.0
    container_name: gromo-kafka-exporter
    command:
      - --kafka.server=kafka:9092
    labels:
      com.datadoghq.tags.env: dev
      com.datadoghq.tags.service: gromo-kafka-dev
      com.datadoghq.ad.checks: >-
        {"openmetrics":{"init_config":{},"instances":[{"openmetrics_endpoint":"http://%%host%%:9308/metrics","namespace":"gromo_kafka","metrics":[".*"],"health_service_check":true}]}}
    networks: [app-network]
    restart: unless-stopped

  # Kafka broker JMX — 실제 Produce/Fetch 요청률. kafka-exporter의 offset/lag 지표와 역할을 분리한다.
  # depends_on을 두지 않아 관측 스택 기동이 꺼진 Kafka를 의도치 않게 올리지 않는다.
  kafka-jmx-exporter:
    logging: *infra-logging
    image: bitnami/jmx-exporter@sha256:652a0b12db78af1d1206f41a6a47fbcd9724e46cda165ed759b6508c8952944c
    container_name: gromo-kafka-jmx-exporter
    command: ["9404", "/etc/jmx-exporter/kafka.yml"]
    volumes:
      - ../observability/jmx-exporter/kafka.yml:/etc/jmx-exporter/kafka.yml:ro
    labels:
      com.datadoghq.tags.env: dev
      com.datadoghq.tags.service: gromo-kafka-dev
      com.datadoghq.ad.checks: >-
        {"openmetrics":{"init_config":{},"instances":[{"openmetrics_endpoint":"http://%%host%%:9404/metrics","namespace":"gromo_kafka_jmx","metrics":[".*"],"health_service_check":true}]}}
    networks: [app-network]
    restart: unless-stopped

  # 호스트 리소스 — CPU·메모리·디스크
  node-exporter:
    logging: *infra-logging
    image: prom/node-exporter:v1.8.2
    container_name: gromo-node-exporter
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [app-network]
    restart: unless-stopped

  # 컨테이너별 리소스. 기본 포트 8080 = app 과 충돌 → 호스트 미공개(내부에서 Prometheus 만 접근)
  cadvisor:
    logging: *infra-logging
    image: ghcr.io/google/cadvisor:0.55.1
    container_name: gromo-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks: [app-network]
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  fluent_bit_state:

# dev compose 의 app-network 와 overlay 시 병합됨(같은 프로젝트).
networks:
  app-network:
    driver: bridge

  business-cache:
    internal: true
