# 프로젝트명 고정 — 파일이 server/scripts/로 이사한 뒤에도 기존 로컬 볼륨
# (phone_postgres_local_data)에 그대로 붙게 한다.
name: phone

services:
  db:
    image: postgres:16-alpine
    container_name: phone-db-local
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: tt_db
      POSTGRES_USER: jajo
      POSTGRES_PASSWORD: jajo
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jajo -d tt_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 채팅 서비스용 (GROMO-292). data-api 는 Redis 없이도 도므로 로컬에서 이 컨테이너를 안 띄워도
  # 기존 백엔드 개발에는 지장이 없다 — 채팅을 돌릴 때만 필요하다.
  redis:
    image: redis:7-alpine
    container_name: phone-redis-local
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_local_data:
