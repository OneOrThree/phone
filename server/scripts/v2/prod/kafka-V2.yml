name: catus-kafka-v2
x-infra-logging: &id001
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  kafka:
    logging: *id001
    image: apache/kafka:3.8.1
    labels:
      com.datadoghq.tags.env: prod
      com.datadoghq.tags.service: catus-kafka-prod-V2
      com.datadoghq.tags.version: 3.8.1
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${HOST_PRIVATE_IP}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_DEFAULT_REPLICATION_FACTOR: '1'
      KAFKA_MIN_INSYNC_REPLICAS: '1'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: '168'
      KAFKA_NUM_PARTITIONS: '3'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
      KAFKA_JMX_PORT: '9999'
      KAFKA_JMX_HOSTNAME: kafka
    expose:
    - '9092'
    - '9999'
    volumes:
    - /var/lib/catus-V2/kafka:/var/lib/kafka/data
    - ${KAFKA_HEALTHCHECK_FILE}:/opt/kafka/bin/kafka-api-healthcheck.sh:ro
    networks:
    - app-network
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - bash
      - /opt/kafka/bin/kafka-api-healthcheck.sh
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    mem_limit: 1g
    ports:
    - ${HOST_PRIVATE_IP}:9092:9092
networks:
  app-network:
    driver: bridge
