# 기존 환경 compose와 함께 사용하는 신규 위성 서비스. env 파일은 서비스별 writer로 생성한다.
# 이 파일을 추가하는 것만으로 기존 API 라우팅이나 발송 gate를 열지 않는다.
name: phone

# 컨테이너 로그 보존(계정 정책 L09) — Docker json-file 은 «크기»로만 회전한다. 값의 근거는 README §로그 보존.
x-app-logging: &app-logging
  driver: json-file
  options: {max-size: "50m", max-file: "4"}
x-infra-logging: &infra-logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  business-api:
    logging: *app-logging
    image: ${BUSINESS_API_IMAGE:?Business 이미지 digest 필요}
    env_file:
      - ${BUSINESS_API_ENV_FILE:?Business 전용 env 파일 필요}
    environment:
      SERVER_PORT: "8080"
      DD_AGENT_HOST: datadog-agent
      DD_ENV: ${DEPLOY_ENV:-dev}
      DD_SERVICE: business-api
      DD_VERSION: ${IMAGE_REVISION:-unknown}
      DD_TRACE_SAMPLE_RATE: ${DD_TRACE_SAMPLE_RATE:-1.0}
      DD_LOGS_INJECTION: "true"
      OBS_SERVICE: business-api
      OBS_ENV: ${DEPLOY_ENV:-dev}
      OBS_VERSION: ${IMAGE_REVISION:-unknown}
      DD_TRACE_128_BIT_TRACEID_LOGGING_ENABLED: "true"
      DD_RUNTIME_METRICS_ENABLED: "true"
      DD_PROFILING_ENABLED: "true"
      # 프로파일러 .so 추출·로드와 JFR 임시 파일 자리. 기본값 /tmp 는 noexec 라 .so 로드가 실패한다(GROMO-2574).
      DD_PROFILING_TEMPDIR: /ddprof
      DD_DATA_STREAMS_ENABLED: "true"
      DD_TRACE_ANALYTICS_ENABLED: "true"
      DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED: "true"
      DD_GIT_REPOSITORY_URL: github.com/OneOrThree/phone
      DD_GIT_COMMIT_SHA: ${IMAGE_REVISION:-unknown}
      BUSINESS_REDIS_HOST: redis
      BUSINESS_REDIS_USERNAME: business
    expose: ["8080"]
    networks: [app-network, business-cache]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    read_only: true
    # /tmp 는 외부 PDF 임시 파일 자리라 Docker 기본값(noexec)을 유지한다. 실행 권한은 프로파일러 전용
    # /ddprof 에만 준다 — 쓰기·실행이 함께 되는 자리가 하나 생기는 보안 절충이다(GROMO-2574 문서).
    # 앱 uid/gid 10001(server/business-api/Dockerfile 45행 useradd, 50행 USER)만 접근하게 좁혔다.
    # 되돌릴 때는 DD_PROFILING_TEMPDIR 와 이 tmpfs 의 /ddprof 두 줄을 함께 되돌린다(환경변수만 남으면 읽기 전용 루트라 쓰기가 실패한다).
    tmpfs: ['/tmp:size=64m,mode=1777', '/ddprof:size=16m,mode=0700,uid=10001,gid=10001,exec']
    volumes: [business-logs:/app/logs]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: ${APP_HEALTH_RETRIES:-30}
      start_period: ${APP_HEALTH_START_PERIOD:-30s}
    labels:
      com.datadoghq.tags.env: ${DEPLOY_ENV:-dev}
      com.datadoghq.tags.service: business-api
      com.datadoghq.tags.version: ${IMAGE_REVISION:-unknown}
      com.datadoghq.ad.logs: >-
        [{"source":"java","service":"business-api"}]
      com.datadoghq.ad.checks: >-
        {"openmetrics":{"init_config":{},"instances":[{"openmetrics_endpoint":"http://%%host%%:9091/actuator/prometheus","namespace":"gromo_business","metrics":[".*"],"health_service_check":true,"send_distribution_buckets":true,"collect_counters_with_distributions":true}]}}

  notification:
    logging: *app-logging
    image: ${NOTIFICATION_IMAGE:?Notification 이미지 digest 필요}
    env_file:
      - ${NOTIFICATION_ENV_FILE:?Notification 전용 env 파일 필요}
    environment:
      SERVER_PORT: "8082"
      DD_AGENT_HOST: datadog-agent
      DD_ENV: ${DEPLOY_ENV:-dev}
      DD_SERVICE: notification
      DD_VERSION: ${IMAGE_REVISION:-unknown}
      DD_TRACE_SAMPLE_RATE: ${DD_TRACE_SAMPLE_RATE:-1.0}
      DD_LOGS_INJECTION: "true"
      OBS_SERVICE: notification
      OBS_ENV: ${DEPLOY_ENV:-dev}
      OBS_VERSION: ${IMAGE_REVISION:-unknown}
      DD_TRACE_128_BIT_TRACEID_LOGGING_ENABLED: "true"
      DD_RUNTIME_METRICS_ENABLED: "true"
      DD_PROFILING_ENABLED: "true"
      DD_DATA_STREAMS_ENABLED: "true"
      DD_TRACE_ANALYTICS_ENABLED: "true"
      DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED: "true"
      DD_GIT_REPOSITORY_URL: github.com/OneOrThree/phone
      DD_GIT_COMMIT_SHA: ${IMAGE_REVISION:-unknown}
    expose: ["8082"]
    networks: [app-network]
    restart: unless-stopped
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: ${APP_HEALTH_RETRIES:-30}
      start_period: ${APP_HEALTH_START_PERIOD:-30s}
    labels:
      com.datadoghq.tags.env: ${DEPLOY_ENV:-dev}
      com.datadoghq.tags.service: notification
      com.datadoghq.tags.version: ${IMAGE_REVISION:-unknown}
      com.datadoghq.ad.logs: >-
        [{"source":"java","service":"notification"}]
      com.datadoghq.ad.checks: >-
        {"openmetrics":{"init_config":{},"instances":[{"openmetrics_endpoint":"http://%%host%%:9091/actuator/prometheus","namespace":"gromo_notification","metrics":[".*"],"health_service_check":true,"send_distribution_buckets":true,"collect_counters_with_distributions":true}]}}

networks:
  business-cache:
    internal: true
  app-network:
    driver: bridge

volumes:
  business-logs:
