# 기존 환경 compose와 함께 사용하는 신규 위성 서비스. env 파일은 서비스별 writer로 생성한다.
# 이 파일을 추가하는 것만으로 기존 API 라우팅이나 발송 gate를 열지 않는다.
name: phone

# 컨테이너 로그 보존(계정 정책 L09) — Docker json-file 은 «크기»로만 회전한다. 값의 근거는 README §로그 보존.
x-app-logging: &app-logging
  driver: json-file
  options: {max-size: "50m", max-file: "4"}
x-infra-logging: &infra-logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  business-redis:
    logging: *infra-logging
    image: redis:7-alpine
    command: [redis-server, --aclfile, /etc/redis/business.acl, --maxmemory, 128mb, --maxmemory-policy, allkeys-lru, --save, "", --appendonly, "no"]
    volumes:
      - ${BUSINESS_REDIS_ACL_FILE:?Business Redis ACL 파일 필요}:/etc/redis/business.acl:ro
    networks: [business-cache]
    mem_limit: 192m
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, --user, health, --pass, "", --no-auth-warning, ping]
      interval: 3s
      timeout: 2s
      retries: 10

  business-api:
    logging: *app-logging
    image: ${BUSINESS_API_IMAGE:?Business 이미지 digest 필요}
    env_file:
      - ${BUSINESS_API_ENV_FILE:?Business 전용 env 파일 필요}
    environment:
      SERVER_PORT: "8080"
      DD_AGENT_HOST: datadog-agent
      DD_ENV: ${DEPLOY_ENV:-dev}
      DD_SERVICE: gromo-business-${DEPLOY_ENV:-dev}
      DD_VERSION: ${IMAGE_REVISION:-unknown}
      DD_TRACE_SAMPLE_RATE: ${DD_TRACE_SAMPLE_RATE:-0.2}
      DD_LOGS_INJECTION: "true"
      DD_RUNTIME_METRICS_ENABLED: "true"
      BUSINESS_REDIS_HOST: business-redis
      BUSINESS_REDIS_USERNAME: business
    expose: ["8080"]
    networks: [app-network, business-cache]
    depends_on:
      business-redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
    volumes: [business-logs:/app/logs]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    labels:
      com.datadoghq.tags.env: ${DEPLOY_ENV:-dev}
      com.datadoghq.tags.service: gromo-business-${DEPLOY_ENV:-dev}
      com.datadoghq.tags.version: ${IMAGE_REVISION:-unknown}
      com.datadoghq.ad.checks: >-
        {"openmetrics":{"init_config":{},"instances":[{"openmetrics_endpoint":"http://%%host%%:9091/actuator/prometheus","namespace":"gromo_business","metrics":["http_server_requests_seconds.*","jvm_memory_used_bytes","jvm_gc_pause_seconds.*","process_cpu_usage","system_cpu_usage"]}]}}

  notification:
    logging: *app-logging
    image: ${NOTIFICATION_IMAGE:?Notification 이미지 digest 필요}
    env_file:
      - ${NOTIFICATION_ENV_FILE:?Notification 전용 env 파일 필요}
    environment:
      SERVER_PORT: "8082"
      DD_AGENT_HOST: datadog-agent
      DD_ENV: ${DEPLOY_ENV:-dev}
      DD_SERVICE: gromo-notification-${DEPLOY_ENV:-dev}
      DD_VERSION: ${IMAGE_REVISION:-unknown}
      DD_TRACE_SAMPLE_RATE: ${DD_TRACE_SAMPLE_RATE:-0.2}
      DD_LOGS_INJECTION: "true"
      DD_RUNTIME_METRICS_ENABLED: "true"
    expose: ["8082"]
    networks: [app-network]
    restart: unless-stopped
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    labels:
      com.datadoghq.tags.env: ${DEPLOY_ENV:-dev}
      com.datadoghq.tags.service: gromo-notification-${DEPLOY_ENV:-dev}
      com.datadoghq.tags.version: ${IMAGE_REVISION:-unknown}
      com.datadoghq.ad.checks: >-
        {"openmetrics":{"init_config":{},"instances":[{"openmetrics_endpoint":"http://%%host%%:9091/actuator/prometheus","namespace":"gromo_notification","metrics":["http_server_requests_seconds.*","jvm_memory_used_bytes","jvm_gc_pause_seconds.*","process_cpu_usage","system_cpu_usage"]}]}}

networks:
  business-cache:
    internal: true
  app-network:
    driver: bridge

volumes:
  business-logs:
