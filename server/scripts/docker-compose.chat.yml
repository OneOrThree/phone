# 채팅 서비스 오버레이 (GROMO-292).
#
# 왜 dev/prod 파일에 직접 넣지 않았나 — 그 파일들은 «지금 도는 구성»이고, 여기 chat 서비스를 넣는
# 순간 배포가 아직 GAR 에 없는 이미지를 받으러 가서 실패한다. 채팅 이미지가 올라간 뒤에
# 이 오버레이를 함께 읽어 띄우고, 안정되면 dev 파일로 접는다.
#
#   docker compose -f docker-compose.dev.yml -f docker-compose.chat.yml up -d
#
# ⚠️ 이 오버레이는 redis 를 정의하지 않는다 — docker-compose.dev.yml 이 이미 정의한다.
#    단독으로 쓰면 depends_on 이 없는 서비스를 가리켜 파싱이 깨진다.

name: phone

services:
  chat:
    image: ${CHAT_IMAGE:-asia-northeast3-docker.pkg.dev/oneorthree2/ci-cache/chat:latest}
    container_name: phone-chat
    ports:
      # 8081 — data-api(8080)와 같은 호스트에 뜨므로 겹치지 않게 잡았다.
      # 관리 포트 9091 은 절대 여기 올리지 않는다(포트 격리가 /actuator/* 를 사설로 유지하는 유일한 수단).
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # 채팅은 자기 데이터베이스를 갖는다 — 같은 인스턴스 안의 별도 database(A10 의 알림 서버와 같은 모양).
      # 이 database 는 미리 만들어져 있어야 한다(Flyway 는 스키마를 만들지 database 를 만들지 않는다).
      CHAT_DB_URL: jdbc:postgresql://db:5432/${CHAT_POSTGRES_DB:-gromo_chat}
      CHAT_DB_USERNAME: ${POSTGRES_USER}
      CHAT_DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      # Data API 와 «같은 값»이어야 한다. 채팅은 이 키로 서명을 검증만 한다 — 발급하지 않는다.
      JWT_SECRET: ${JWT_SECRET}
      # 멤버십 조회 상류. 컨테이너 이름으로 부른다(호스트 포트를 거치지 않는다).
      DATA_API_BASE_URL: http://app:8080
      # 네이티브 앱은 Origin 을 보내지 않으므로 비워 둔다 — 웹 클라이언트가 생기면 그 도메인만 넣는다.
      CHAT_WS_ALLOWED_ORIGINS: ${CHAT_WS_ALLOWED_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      # 관리 포트는 컨테이너 안에서만 보인다 — 헬스체크는 컨테이너 안에서 돌므로 닿는다.
      test: ["CMD-SHELL", "curl -fsS http://localhost:9091/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  app-network:
    driver: bridge
