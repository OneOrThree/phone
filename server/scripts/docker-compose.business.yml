# 기존 Business 단독 배포 진입점. 위성 배포와 같은 env/ACL 계약을 사용한다.
name: phone
# 컨테이너 로그 보존(계정 정책 L09) — Docker json-file 은 «크기»로만 회전한다. 값의 근거는 README §로그 보존.
x-app-logging: &app-logging
  driver: json-file
  options: {max-size: "50m", max-file: "4"}
x-infra-logging: &infra-logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  business-api:
    logging: *app-logging
    image: ${BUSINESS_API_IMAGE:?Business 이미지 digest 필요}
    env_file:
    - ${BUSINESS_API_ENV_FILE:?Business 전용 env 파일 필요}
    environment:
      SERVER_PORT: '8080'
      DD_SERVICE: business-api
      OBS_SERVICE: business-api
      OBS_ENV: ${DEPLOY_ENV:-dev}
      OBS_VERSION: ${IMAGE_REVISION:-unknown}
      BUSINESS_REDIS_HOST: redis
      BUSINESS_REDIS_USERNAME: business
    expose:
    - '8080'
    networks:
    - app-network
    - business-cache
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    read_only: true
    tmpfs:
    - /tmp:size=64m,mode=1777
    volumes:
    - business-logs:/app/logs
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - http://localhost:8080/health
      interval: 10s
      timeout: 5s
      retries: ${APP_HEALTH_RETRIES:-30}
      start_period: ${APP_HEALTH_START_PERIOD:-30s}
networks:
  business-cache:
    internal: true
  app-network:
    driver: bridge
volumes:
  business-logs: null
