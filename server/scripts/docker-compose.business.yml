# dev overlay: docker compose -f docker-compose.dev.yml -f docker-compose.business.yml up -d business-api
# 기존 data-api 배포와 독립적으로 활성화하며 관리 포트는 publish하지 않는다.
name: phone
services:
  business-redis:
    image: redis:7-alpine
    command: [redis-server, --maxmemory, 128mb, --maxmemory-policy, allkeys-lru, --save, "", --appendonly, "no"]
    networks: [app-network]
    mem_limit: 192m
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 2s
      retries: 10
  business-api:
    image: ${BUSINESS_IMAGE:-asia-northeast3-docker.pkg.dev/oneorthree2/ci-cache/business-api:latest}
    ports: ['8082:8082']
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET을 설정하세요}
      GOOGLE_DRIVE_API_KEY: ${GOOGLE_DRIVE_API_KEY:-}
      BUSINESS_REDIS_HOST: business-redis
    networks: [app-network]
    depends_on:
      business-redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
    volumes: [business-logs:/app/logs]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: [CMD, curl, -fsS, 'http://localhost:9091/actuator/health/readiness']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
volumes:
  business-logs:
