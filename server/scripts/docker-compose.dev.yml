# dev 서버(gromo-dev-app)에서 도는 구성 — 앱 + postgres.
#
# app 이미지는 여기서 빌드하지 않는다. 빌드는 CI 러너(gromo-dev-build)가 하고
# GAR(data-api 저장소, GROMO-2224)로 올린 것을 data-api-cd.dev.yml의 deploy job이 받아 띄운다(GROMO-953).
# APP_IMAGE는 dev-env.sh 가 dev.env 에 씀 — data-api 가 내려가 있어도 자리표시 값을 넣어 오버레이 파싱 안 깨짐.
# 기본값 없음: 비면 옛 ci-cache :latest(또는 VM 캐시)로 조용히 뜨던 것을 실패로 바꿈.

# 프로젝트명 고정 — 파일이 server/scripts/로 이사한 뒤에도 기존 볼륨·네트워크
# (phone_* 프리픽스, dev 서버의 DB 데이터 포함)에 그대로 붙게 한다.
name: phone

# 컨테이너 로그 보존(계정 정책 L09) — Docker json-file 은 «크기»로만 회전한다. 값의 근거는 README §로그 보존.
x-app-logging: &app-logging
  driver: json-file
  options: {max-size: "50m", max-file: "4"}
x-infra-logging: &infra-logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  data-api:
    logging: *app-logging
    image: ${APP_IMAGE:?Data 이미지 digest 필요 — dev-env.sh 로 만든 env 를 --env-file 로 넘길 것}
    container_name: phone-data-api
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      API_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      API_DB_USERNAME: ${POSTGRES_USER}
      API_DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
      # FCM 발송 (GROMO-528) — dev 프로파일 = FCM 구현 활성, 시크릿 미등록 시 fail-fast 기동 실패
      FCM_PROJECT_ID: ${FCM_PROJECT_ID}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON}
      # 집중 프레즌스 (GROMO-292) — 채팅 서버가 「집중 중엔 채팅 불가」를 판정하는 근거를 여기에 쓴다.
      # 기본 false: Redis·채팅이 실제로 뜬 뒤에 .env 에서 켠다. 안 뜬 상태에서 켜면 집중 시작·종료마다
      # 연결 타임아웃을 문다. 쓰기는 best-effort 라 켜도 Redis 장애가 집중을 막지는 않는다.
      FOCUS_PRESENCE_ENABLED: ${FOCUS_PRESENCE_ENABLED:-false}
      # Live Activity APNs 전용 키. 비어 있으면 로컬 표시만 사용하고 원격 전송은 대기한다.
      FOCUS_LIVE_ACTIVITY_APNS_TEAM_ID: ${FOCUS_LIVE_ACTIVITY_APNS_TEAM_ID:-}
      FOCUS_LIVE_ACTIVITY_APNS_KEY_ID: ${FOCUS_LIVE_ACTIVITY_APNS_KEY_ID:-}
      FOCUS_LIVE_ACTIVITY_APNS_KEY_BASE64: ${FOCUS_LIVE_ACTIVITY_APNS_KEY_BASE64:-}
      REDIS_HOST: redis
      REDIS_USERNAME: data
      REDIS_PASSWORD: ${REDIS_DATA_PASSWORD:?Data Redis 비밀번호 필요}
    depends_on:
      db:
        condition: service_healthy
      # ⚠️ redis 는 «일부러» 여기 없다. data-api 에서 Redis 는 부가 의존성이고 프레즌스 쓰기는 전부
      #    best-effort 라, 기동을 redis 에 묶으면 부가 의존성 하나가 코어 API 의 배포를 막게 된다
      #    (그건 management.health.redis.enabled=false 로 헬스체크를 끈 판단과 정면으로 어긋난다).
      #    redis 가 늦게 뜨면 그동안의 리스 쓰기만 실패하고 로그에 warn 이 남는다.
      #    반대로 chat 은 redis 에 묶는다(docker-compose.realtime.yml) — 그쪽은 하드 의존성이다.
    networks:
      app-network:
        aliases: [app]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s

  db:
    logging: *infra-logging
    image: postgres:16.14-alpine
    container_name: phone-db
    # 통합 서비스 태그 (GROMO-1489). Datadog 오버레이가 아니라 **여기**에 둔다 —
    # 오버레이에만 두면 datadog 을 켤 때 라벨 추가로, 끌 때 라벨 제거로 compose 가 db 를 매번
    # 재생성해 PostgreSQL 연결이 끊긴다(codex 리뷰). 라벨은 Agent 가 없을 땐 아무 효과도 없으므로
    # 항상 붙여 두는 편이 안전하다.
    labels:
      com.datadoghq.tags.env: "dev"
      com.datadoghq.tags.service: "gromo-db-dev"
      com.datadoghq.tags.version: "16.14-alpine"
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Business·Data·Realtime 공유 Redis. ACL 변경은 전환 절차로 적용하고 일반 CD에서 재생성하지 않는다.
  redis:
    logging: *infra-logging
    image: redis:7.4.11-alpine
    container_name: phone-redis
    command: [redis-server, --aclfile, /etc/redis/shared.acl, --maxmemory, 384mb, --maxmemory-policy, noeviction, --appendonly, "yes", --appendfsync, everysec]
    mem_limit: 576m
    environment:
      ACL_REVISION: ${SHARED_REDIS_ACL_SHA:-not-bootstrapped}
    labels:
      com.datadoghq.tags.env: "dev"
      com.datadoghq.tags.service: "gromo-redis-dev"
      com.datadoghq.tags.version: "7.4.11-alpine"
      com.datadoghq.ad.checks: >-
        {"redisdb":{"instances":[{"host":"%%host%%","port":6379,"username":"health","password":"","tags":["env:dev","service:gromo-redis-dev","redis_instance:shared"]}]}}
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "--user", "health", "--pass", "", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis_dev_data:/data
      - ${SHARED_REDIS_ACL_FILE:-/var/lib/gromo/runtime/shared-redis.acl}:/etc/redis/shared.acl:ro

volumes:
  postgres_dev_data:
  # 프레즌스·캐시는 사본이라 유실돼도 재구축된다. 그래도 볼륨을 두는 이유는 재시작마다 전원의
  # 멤버십 캐시가 비어 상류(Data API)로 몰리는 걸 피하기 위해서다.
  redis_dev_data:

networks:
  app-network:
    driver: bridge
