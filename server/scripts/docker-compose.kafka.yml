# Kafka 단일 노드 오버레이 (A12 · GROMO-1659·1660 공통 기반).
#
# 왜 dev/prod 파일에 직접 넣지 않았나 — docker-compose.chat.yml 과 같은 이유다. 그 파일들은
# «지금 도는 구성»이고, 브로커가 실제로 안정되기 전에 넣으면 기존 배포가 새 의존성 때문에 흔들린다.
# 브로커를 띄워 검증한 뒤 dev 파일로 접는다.
#
#   docker compose -f docker-compose.dev.yml -f docker-compose.kafka.yml up -d
#
# ⚠️ 이 오버레이는 app 을 «재정의하지 않는다». outbox relay 는 기본이 꺼짐이라
#    (outbox.relay.enabled=false) 브로커만 띄운다고 발행이 시작되지 않는다 — 켜는 것은 별도 단계다.
#    그 순서가 의도다: 브로커 기동·토픽 생성을 먼저 확인하고, 그다음에 relay 를 켠다.
#
# ⚠️ 외부에 노출하지 않는다. ports 매핑이 없는 것은 실수가 아니다 — 브로커는 compose 네트워크
#    안에서만 보이고, Vercel(링크 서버)은 Kafka 에 붙지 않는다(계약 §2).

name: phone

services:
  kafka:
    # KRaft 모드(ZooKeeper 없음). apache/kafka 공식 이미지는 3.7 부터 KRaft 단독 기동을 지원한다.
    # 태그를 못 박는다 — «움직이는 태그»면 재시작 한 번에 브로커 버전이 바뀌고, 로그 포맷·기본값
    # 변경이 그대로 운영 사고가 된다.
    image: apache/kafka:3.8.1
    container_name: phone-kafka
    environment:
      # ── KRaft 단일 노드 ────────────────────────────────────────────────
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # 프로듀서·컨슈머가 «다시 접속할 주소». 컨테이너 이름이라 compose 네트워크 밖에서는 못 푼다 —
      # 이게 곧 외부 미노출의 두 번째 잠금이다(포트 매핑 없음이 첫 번째).
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # ── 내부 토픽 복제 계수 = 1 ────────────────────────────────────────
      # 기본값은 3 이다. 노드가 하나인데 3 을 요구하면 __consumer_offsets 생성이 실패하고
      # «컨슈머 그룹 자체가 불가»가 된다 — 알림 서버가 붙는 순간 조용히 안 도는 형태로 드러난다.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"

      # ── 보존·파티션 ───────────────────────────────────────────────────
      # 7일(A12). 리플레이에 기대지 않는 설계라(A20) 더 길게 잡을 이유가 없고, 디스크가 20GB 라
      # 더 짧게 잡으면 장애 복구 창이 좁아진다.
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_NUM_PARTITIONS: "3"
      # 토픽 자동 생성을 끈다. notification-events 와 .DLT 는 «각 3파티션»이 계약인데,
      # 자동 생성은 오타 난 토픽 이름까지 조용히 만들어 낸다 — 그 순간 발행은 성공하고 소비만 없다.
      # 두 토픽은 Data API 의 NewTopic 빈(OutboxRelayConfig)이 만든다.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      # ── 메모리 ────────────────────────────────────────────────────────
      # 512 MB(A12). t4g.large(8 GB)에 app·nginx·datadog 과 함께 올라간다 — 나머지는 페이지 캐시가
      # 쓴다(Kafka 는 힙보다 페이지 캐시로 도는 편이 정상이다).
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes:
      # 볼륨이 «필수»다. 없으면 재시작 한 번에 미소비 이벤트가 통째로 사라진다 —
      # outbox 가 커밋 이후 구간을 막아 주지만, 이미 발행된 뒤 소비 전 유실은 outbox 도 못 살린다.
      - kafka-data:/var/lib/kafka/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      # 브로커가 «API 를 받는가»를 본다. 포트 열림만 보면 기동 중인 브로커를 정상으로 오판한다.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

volumes:
  kafka-data:

networks:
  app-network:
    driver: bridge
