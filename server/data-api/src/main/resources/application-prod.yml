spring:
  datasource:
    url: ${API_DB_URL}
    username: ${API_DB_USERNAME}
    password: ${API_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # 스키마 변경은 Flyway 마이그레이션으로만 반영. 엔티티↔DB 드리프트 시 기동 거부해 조기 탐지 (GROMO-670).
      # ⚠️ prod 가 그간 update 로 운영돼 실 DB↔엔티티 드리프트 가능 — dev/staging 에서 validate 기동을 먼저
      #   검증하고, 드리프트 발견 시 V2 보정 마이그레이션으로 해소한 뒤 prod 배포할 것.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  # Flyway 형상관리 (GROMO-670). baseline-on-migrate 로 기존 RDS 는 V1 마킹만(무중단), V2+ 자동 적용.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 3600
  refresh-expiration: 2592000
  # 게스트 전용 refresh 수명(GROMO-1509) — 소셜은 만료돼도 재로그인으로 같은 계정에 돌아오지만
  # 게스트는 돌아갈 곳이 없어 만료가 곧 계정 소실이다. 사실상 '이 기간 안 켜면 계정 삭제'.
  guest-refresh-expiration: 7776000   # 90일

apple:
  jwks-url: https://appleid.apple.com/auth/keys
  client-id: ${APPLE_CLIENT_ID}

kakao:
  api-base-url: https://kapi.kakao.com

google:
  jwks-url: https://www.googleapis.com/oauth2/v3/certs
  client-id: ${GOOGLE_CLIENT_ID}

line:
  api-base-url: https://api.line.me

instagram:
  api-base-url: https://graph.instagram.com

facebook:
  jwks-url: https://www.facebook.com/.well-known/oauth/openid/jwks/
  client-id: ${FACEBOOK_CLIENT_ID:990121817063522}

decorator:
  datasource:
    p6spy:
      enable-logging: false

# 관측 (GROMO-1489) — dev(application-dev.yml)와 같은 배선. 그전까지 prod 엔 이 블록이 없어
# /actuator/prometheus 가 아예 안 열렸고, 그래서 RED·HikariCP·JVM 커스텀 메트릭이 prod 에만 없었다.
# 공개 8080 이 아닌 내부 전용 관리 포트(9091)로 격리 — compose 에서 9091 을 호스트에 노출하지 않으므로
# app-network 안의 datadog-agent 만 접근한다(nginx 도 8080 만 프록시). JwtFilter 는 /api/* 만 필터하니
# /actuator/* 는 무인증 — 포트 격리가 유일한 방어선이다. 9091 을 절대 ports 에 올리지 말 것.
management:
  health:
    redis:
      # Redis 는 이 서비스의 «부가» 의존성이다. 켜 두면 Redis 장애가 곧 컨테이너 unhealthy 가 되어
      # 멀쩡한 배포를 실패시킨다 — 정작 이 서비스의 Redis 쓰기는 실패해도 무해한데.
      enabled: false
  server:
    port: 9091
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: gromo-back   # dev 와 같은 값 — 환경 구분은 Agent 가 붙이는 env 태그(dev/prod)가 한다
    distribution:
      percentiles-histogram:
        http.server.requests: true    # p95/p99(histogram_quantile) 용 버킷

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.web: WARN

# 활동 시각(last_active_at) 갱신 스로틀 창 (GROMO-903) — 같은 유저에게 write 를 허용하는 최소 간격.
# 짧을수록 last_active_at 이 정확해지고 write 가 늘어난다. 이 값만큼 실제 마지막 활동보다 과거일 수 있어
# 미접속 복귀 푸시의 "정확히 N일째" 판정이 하루 당겨질 수 있다(자정 직후 창 안에 그날 첫 활동을 한 유저).
app:
  user-activity:
    touch-interval: 2h

# 그룹 초대 링크 (deferred deep link). ip-salt 는 Secrets Manager(gromo/prod/env)에서 주입한다 —
# salt 가 바뀌면 그 시점 이전 클릭은 매치되지 않으므로 값 교체는 배포와 함께 신중히.
link:
  base-url: ${LINK_BASE_URL:https://link.oneorthree.world}
  match-window-hours: ${LINK_MATCH_WINDOW_HOURS:3}
  ip-salt: ${LINK_IP_SALT}
  # X-Real-IP '만' 신뢰한다. 인프라 레포의 nginx.conf 는 set_real_ip_from 으로 Cloudflare 대역을
  # 나열하고 real_ip_header CF-Connecting-IP 를 걸어, TCP 피어가 CF 대역일 때만 그 헤더를 믿어
  # $remote_addr 을 복원한 뒤 proxy_set_header X-Real-IP $remote_addr 로 넘긴다. 그래서
  #   - CF 경유: X-Real-IP = 진짜 클라이언트 IP
  #   - 오리진 직접 접속: realip 이 무시 → X-Real-IP = 접속자의 진짜 IP
  # 이고, 클라이언트가 X-Real-IP 를 보내도 nginx 가 덮어써서 위조가 안 된다.
  # 반대로 CF-Connecting-IP·X-Forwarded-For 는 nginx 가 덮어쓰지 않고 통과시키므로(XFF 는 뒤에
  # 이어붙일 뿐 첫 토큰이 호출자 값) 오리진에 직접 붙으면 레이트리밋 키를 마음대로 고를 수 있다.
  trusted-ip-headers: ${LINK_TRUSTED_IP_HEADERS:X-Real-IP}
  store-ios-url: ${LINK_STORE_IOS_URL:https://apps.apple.com/kr/app/gromo-grow-motivation/id6774498679}

# GA4 Measurement Protocol 서버 이벤트 (초대 링크 퍼널, 스펙 §6-2) — prod 만 실전송.
# dev/local 은 이 블록을 두지 않아 ga4.enabled 미설정 → no-op 구현이 뜬다(분석 노이즈·시크릿 노출 방지).
# 시크릿 4종은 Secrets Manager(gromo/prod/env)에서 env 로 주입(위 LINK_IP_SALT 와 같은 저장소 —
# oneorthree/phone 은 dev 배포용이다). 미주입이어도 기동은 막지 않고 기동 시 WARN 1회만 남긴다 —
# 분석 배선 누락이 서비스 기동을 세우면 안 되기 때문(FCM 의 fail-fast 와 대비).
ga4:
  enabled: true
  firebase-app-id: ${GA4_FIREBASE_APP_ID:}
  app-api-secret: ${GA4_APP_API_SECRET:}
  web-measurement-id: ${GA4_WEB_MEASUREMENT_ID:}
  web-api-secret: ${GA4_WEB_API_SECRET:}

# ── 집중 프레즌스 (GROMO-292) ────────────────────────────────────────────────
# 채팅 서버가 「집중 중엔 채팅 불가」를 판정하는 근거를 공유 Redis 에 놓는다(presence:focus:*).
# 이 서비스는 «쓰기 주인»이고 쓰기는 전부 best-effort 다 — Redis 가 흔들려도 집중은 계속 돌아간다.
#
# 기본값이 false 인 것은 의도다: Redis·채팅이 실제로 뜬 뒤에 환경변수로 켠다. 안 뜬 상태에서 켜면
# 집중 시작·종료마다 연결 타임아웃을 무는다.
focus:
  presence:
    enabled: ${FOCUS_PRESENCE_ENABLED:false}

spring.data.redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  username: ${REDIS_USERNAME:}
  password: ${REDIS_PASSWORD:}
  # timeout 은 «명령 응답» 대기만 제한한다 — 연결 수립은 connect-timeout 이 따로 막는다.
  # 이걸 비워 두면 Lettuce 기본값(10초)이라, Redis 주소가 패킷을 드롭하는 장애에서 요청 스레드가
  # 10초를 통째로 기다린다. 프레즌스는 AFTER_COMMIT 에서 «동기»로 도는데, 그 시점엔 집중 시작·종료가
  # 이미 커밋돼 있다 — 즉 부가 기능의 연결 지연이 핵심 기능의 응답을 10초 늦추고 클라 재시도를 부른다.
  # best-effort 라면 «빨리» 실패해야 한다.
  connect-timeout: 500ms
  timeout: 2s
