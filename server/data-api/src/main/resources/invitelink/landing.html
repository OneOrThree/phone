<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{pageTitle}}</title>

<!--
  초대 랜딩 (WS-5). 치환 변수는 9개다 — 아래 설명에서는 치환을 피하려고
  중괄호를 뺀 이름으로 적는다(본문에는 계약 표기 그대로 들어간다):
    groupName    그룹명
    inviterName  초대자 닉네임. 모르면 빈 문자열 (GROMO-1085)
    hasInviter   "true" 면 초대자 줄을 띄운다. 그 외에는 감춘다
    pageTitle    title·og:title 한 줄. 초대자 유무로 문장이 갈려 서버가 완성해 넘긴다
    schemeUrl    gromo://join?g=…&s=…
    storeUrl     App Store 링크. 미설정이면 빈 문자열
    storeState   "ready" | "unset". unset 이면 스토어 버튼 대신 검색 안내를 띄운다 (GROMO-1086)
    ogImageUrl   OG 이미지 절대 URL (link.base-url 기반 — 환경별 자기 도메인)
    expired      "true" 면 만료 변형, 그 외("false"/빈 값)는 정상
  치환 변수를 바꾸면 LandingRenderer 를 반드시 함께 고칠 것 — 안 채워진 자리는 빈 문자열이 된다.

  ⚠ 이스케이프 요구사항 — 값 모두 **속성(attribute) 안전** 이스케이프가 필요하다.
  groupName·inviterName(둘 다 사용자 입력)은 pageTitle 을 거쳐 og:title/title 의 content="…" 안에,
  schemeUrl·storeUrl 은 href="…" 안에 들어간다.
  텍스트 전용 이스케이프(&lt; &gt; &amp; 만)로는 " 하나에 속성이 닫히고 임의 속성이 주입된다.
  파싱 시점 주입은 이 템플릿에서 되돌릴 수 없다 — 서버에서 막아야 한다.
  (ogImageUrl·storeUrl 은 서버 설정값이라 사용자 입력이 아니다.)
  (템플릿은 방어 가능한 범위만 담당한다: 점프 전 스킴 화이트리스트, 스토어 링크 http(s) 검사.)

  외부 CDN·빌드 도구 없음. CSS·JS 는 전부 인라인 — 카톡 인앱브라우저에서 왕복을 최소로 끝내는 게
  이 페이지의 유일한 성능 목표다. 외부 요청 금지 원칙은 그대로다(GROMO-1109 에서도 폐기하지 않았다).
  달라진 건 예산뿐 — 서버 정적 파일이 두 장이다. 둘 다 자기 도메인(link.base-url)에서 나간다:
    /link/hero-study-v1.jpg  본문 히어로. 사람이 받아가는 유일한 추가 왕복이라 60KB 를 상한으로 둔다
    /link/og-invite-v2.png   OG 썸네일. 스크레이퍼만 받아가고 사람의 본문 렌더에는 쓰이지 않는다
  히어로를 교체할 때 60KB 상한을 넘기지 말 것. 넘기려면 왕복 예산부터 다시 합의해야 한다.
  og-invite-v1.png 은 지우지 않는다 — 이미 뿌려진 링크의 카톡 썸네일 캐시가 그 URL 을 가리킨다.
-->

<meta property="og:type" content="website">
<meta property="og:site_name" content="gromo">
<meta property="og:title" content="{{pageTitle}}">
<!-- 미리보기 설명과 본문 리드(.lede)는 일부러 다른 문장이다 (GROMO-1108).
     여기는 누를지 말지를 가르는 후킹 한 줄, 본문은 들어오면 뭘 하는지의 설명 한 줄이다.
     같은 문장을 두 번 읽히게 만들지 않는다 — 둘을 통일하려거든 역할부터 다시 정할 것. -->
<meta property="og:description" content="혼자 하면 작심삼일, 같이 하면 기록이 남아요.">
<meta property="og:image" content="{{ogImageUrl}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="gromo — 같이 공부하는 별사탕들">
<meta name="twitter:card" content="summary_large_image">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light only">

<style>
  /* 다크모드 무시(정적 페이지) — 인앱브라우저의 강제 반전을 막는다.
     값은 전부 앱 디자인 토큰(app/src/constants/theme.ts)과 같은 것을 쓴다 — 랜딩은 앱을 처음 보는
     화면이라 여기서 본 색이 앱을 열었을 때 그대로 이어져야 한다 (GROMO-1085). */
  :root {
    color-scheme: light only;
    --indigo: #5E6AD2;       /* T.accent */
    --indigo-deep: #4A53B8;  /* T.accentDeep */
    --indigo-tint: #EEF0FB;  /* T.accentBg */
    --ink: #1C1E22;          /* T.ink */
    --ink-sub: #667085;      /* T.inkSub */
    --ink-muted: #9AA0A8;    /* T.inkMuted */
    --line: #EAEBEE;         /* T.border */
    --track: #F1F2F6;        /* T.track */
    --paper: #FFFFFF;        /* T.paper */
    --page: #F4F5F8;         /* T.bg — 앱 바깥 배경과 같은 쿨 뉴트럴 */
  }

  * { box-sizing: border-box; }

  html { height: 100%; }

  body {
    margin: 0;
    /* 시스템 폰트만 사용 — 웹폰트 요청 0회 */
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Pretendard", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink);
    /* 인디고 그라데이션을 걷어내고 앱 배경색으로 통일한다 (GROMO-1085).
       배경이 밝아진 만큼 푸터 글씨는 흰색을 못 쓴다 — .foot 참고. */
    background: var(--page);
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
  }

  /* justify-content: center 대신 auto 마진으로 세로 가운데를 잡는다.
     가로 모드·큰 글자·긴 그룹명으로 카드가 뷰포트보다 커지면 center 는 초과분을 위아래로
     나눠 카드 윗부분을 화면 밖으로 밀어내고, 그 영역은 스크롤로도 못 닿는다.
     auto 마진은 남는 공간이 없으면 0 으로 풀려서 위에서부터 정상 스크롤된다. */
  .shell { width: 100%; max-width: 420px; margin: auto 0; }

  /* ── 카드 ─────────────────────────────────────────────── */
  /* 흰 카드가 흰 배경 위에 뜨면 경계가 사라진다 — 진한 그림자 대신 앱 카드와 같은 얇은 선 +
     옅은 그림자로 띄운다. 배경이 어두울 때 쓰던 0 18px 48px/.28 은 밝은 배경에선 때가 낀 것처럼 보인다. */
  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 36px 24px 24px;
    box-shadow: 0 10px 28px rgba(28, 33, 64, .07);
    text-align: center;
  }

  /* ── 히어로 (GROMO-1109) ────────────────────────────────
     카드 맨 위, eyebrow 칩 위에 둔다. 칩→초대자→그룹명은 "어떤 초대인가"를 잇는 한 덩어리라
     그 사이를 이미지로 끊으면 문장이 갈라진다 — 덩어리째 아래로 밀어내는 자리가 유일하게 안전하다.
     세로 예산: 히어로가 통째로 늘어나면 작은 화면에서 CTA 가 접힌 화면 밖으로 밀린다.
     기본 240px 로 억제하고, 세로가 짧은 기기에서는 한 단계 더 줄인다. */
  .hero {
    display: block;
    width: 100%;
    max-width: 240px;
    height: auto;
    /* 카드 상단 패딩(36px)이 이미 넉넉하다 — 이미지 자체 여백이 없어 조금 당겨야 칩과 리듬이 맞는다 */
    margin: -6px auto 2px;
  }
  /* 세로 700px 이하 = iPhone SE 급·가로 모드. CTA 를 첫 화면에 남기는 쪽이 브랜드 인상보다 우선한다 */
  @media (max-height: 700px) {
    .hero { max-width: 168px; }
  }

  /* 시그니처: 그룹방 문패. 초대는 "방"으로 들어오라는 말이라 이름을 가장 크게 둔다. */
  .eyebrow {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    /* 한글에 라틴 스몰캡스식 넓은 자간을 주면 글자가 풀어져 보인다 — 최소만 */
    letter-spacing: .02em;
    /* --indigo 는 이 틴트 위에서 4.1:1 로 12px 기준 미달 — 한 단계 진하게 */
    color: var(--indigo-deep);
    background: var(--indigo-tint);
    border-radius: 999px;
    padding: 8px 14px;
  }

  /* 초대자 줄 — 그룹명 위에 얹는다. "누가 불렀는가"가 먼저 읽히되, 가장 큰 글자는 여전히
     방 이름이어야 한다(초대는 사람이 아니라 방으로 들어오라는 말이다). */
  .inviter {
    margin: 18px 0 0;
    font-size: 15px;
    line-height: 1.5;
    font-weight: 700;
    color: var(--ink-sub);
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  .inviter .name { color: var(--indigo-deep); }
  /* 초대자를 모를 때(탈퇴·닉네임 미설정)는 줄째로 접는다 — "님이 초대했어요"만 남으면 안 된다 */
  body:not([data-inviter="true"]) .inviter { display: none; }
  /* 초대자 줄이 있으면 그룹명과의 간격을 좁혀 한 덩어리로 읽히게 한다 */
  body[data-inviter="true"] .group-name { margin-top: 6px; }

  .group-name {
    margin: 18px 0 0;
    font-size: 30px;
    line-height: 1.28;
    font-weight: 800;
    letter-spacing: -.02em;
    /* 한글은 기본이 음절 단위 줄바꿈이라 "4시간"이 "4시/간"으로 쪼개진다 — 어절 단위로 묶는다.
       overflow-wrap 은 띄어쓰기 없는 초장문 그룹명용 탈출구로만 남긴다. */
    word-break: keep-all;
    overflow-wrap: anywhere;
  }

  .group-name .bracket { color: var(--ink-muted); font-weight: 600; }

  .lede {
    margin: 12px 0 0;
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink-sub);
    word-break: keep-all;
  }

  /* ── 주간 집중 막대 ─────────────────────────────────────
     페이지와 미리보기를 잇는 역할은 별사탕 히어로가 가져갔다(OG v2 에는 막대가 없다).
     막대는 리드 문구와 CTA 사이의 구분 장식으로만 남긴다. */
  /* 데이터 차트로 오독되면 "이 그룹의 기록"으로 보인다 — 기준선을 빼고 높이를 줄여
     구분 장식으로만 읽히게 하고, 주 CTA 가 엄지 영역에서 밀려나지 않게 한다 */
  .bars {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 7px;
    height: 26px;
    margin: 22px 0 2px;
  }
  .bars i {
    display: block;
    width: 8px;
    border-radius: 999px;
    background: #DDE0F3;
    transform-origin: bottom;
  }
  .bars i:nth-child(1) { height: 30%; }
  .bars i:nth-child(2) { height: 58%; }
  .bars i:nth-child(3) { height: 40%; }
  .bars i:nth-child(4) { height: 78%; }
  .bars i:nth-child(5) { height: 48%; }
  .bars i:nth-child(6) { height: 100%; background: var(--indigo); }
  .bars i:nth-child(7) { height: 62%; }

  /* ── CTA ─────────────────────────────────────────────── */
  /* gap 이 좁으면 같은 크기 버튼 2개가 세그먼티드 컨트롤처럼 붙어 보인다 */
  .actions { margin-top: 22px; display: grid; gap: 14px; }

  .btn {
    display: block;
    width: 100%;
    padding: 17px 16px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
    text-align: center;
    letter-spacing: -.01em;
    transition: transform .12s ease, background-color .18s ease, color .18s ease,
                border-color .18s ease;
    -webkit-tap-highlight-color: transparent;
  }
  /* 1.5% 축소는 휴대폰에서 지각되지 않는다 — 눌린 게 보이는 값으로 */
  .btn:active { transform: scale(.97); }
  .btn:focus-visible { outline: 3px solid var(--indigo-deep); outline-offset: 3px; }
  /* 인디고로 채워진 버튼 위에서는 같은 인디고 링이 안 보인다 — 흰 링 + 바깥 인디고 링 */
  .btn-primary:focus-visible,
  body[data-state="noapp"] #cta-store:focus-visible,
  body[data-expired="true"] #cta-store:focus-visible {
    outline-color: #fff;
    outline-offset: -5px;
    box-shadow: 0 0 0 3px var(--indigo-deep);
  }

  .btn-primary { background: var(--indigo); color: #fff; box-shadow: 0 6px 16px rgba(94, 106, 210, .34); }
  .btn-ghost   { background: #fff; color: var(--ink-sub); border: 1px solid var(--line); box-shadow: none; }

  /* ── 스토어 URL 미설정 (GROMO-1086) ──────────────────────
     ${ENV:기본값} 구조는 값을 빼먹어도 조용히 깨진 링크를 서빙한다 — 실제로 플레이스홀더 App ID 가
     그대로 나가 "현재 국가나 지역에서 사용할 수 없는 앱"을 띄웠다. 서버가 미설정을 감지하면
     storeState=unset 로 내려오고, 여기서 버튼을 숨긴다.
     ⚠ 버튼만 숨기면 만료 변형은 액션이 0개인 막다른 화면이 된다 — 대체 안내를 반드시 함께 띄운다. */
  .store-note {
    display: none;
    margin: 0;
    padding: 14px 16px;
    border-radius: 14px;
    background: var(--indigo-tint);
    color: var(--ink-sub);
    font-size: 14px;
    line-height: 1.6;
    word-break: keep-all;
  }
  .store-note b { color: var(--indigo-deep); font-weight: 700; }
  body[data-store="unset"] #cta-store { display: none; }
  body[data-store="unset"] .store-note { display: block; }

  .status {
    margin: 14px 0 0;
    min-height: 18px;
    font-size: 13px;
    line-height: 1.5;
    /* 폴백 안내를 싣는 줄이라 --ink-muted(흰 배경 대비 2.6:1) 로는 부족 — AA 통과하는 톤으로 */
    color: var(--ink-sub);
  }

  /* 배경이 밝아지면서 흰 글씨는 더 못 쓴다(#F4F5F8 위에서 1.1:1).
     --ink-sub 는 #F4F5F8 위에서 4.56:1 로 12px 기준 AA(4.5:1)를 넘긴다 — --ink-muted 는 2.4:1 로 미달. */
  .foot {
    margin: 18px 0 0;
    text-align: center;
    font-size: 12px;
    color: var(--ink-sub);
  }

  /* ── 상태 1: 스킴 점프 시도 중 ───────────────────────────── */
  body[data-state="opening"] .status::after {
    content: "";
    display: inline-block;
    width: 5px; height: 5px;
    margin-left: 6px;
    border-radius: 50%;
    background: var(--indigo);
    animation: pulse 1s ease-in-out infinite;
    vertical-align: middle;
  }
  @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

  /* ── 상태 2: 1.5s 내 이탈 없음 = 앱 미설치 판정 → 스토어 CTA 승격 ── */
  body[data-state="noapp"] #cta-store { background: var(--indigo); color: #fff;
                                        border-color: transparent;
                                        box-shadow: 0 6px 16px rgba(94, 106, 210, .34); }
  body[data-state="noapp"] #cta-open  { background: #fff; color: var(--ink-sub);
                                        border: 1px solid var(--line); box-shadow: none; }
  /* 버튼 순서는 바꾸지 않는다. 로드 1.5초 뒤 = 사용자가 위 버튼을 읽고 누르려는 순간이라
     그때 자리를 바꾸면 오터치가 난다. CSS order 는 시각 순서만 바꿔 DOM·탭 순서와도
     어긋난다(WCAG 1.3.2). 채움(fill) 전환만으로 승격을 알린다. */

  /* ── 만료 변형 ──────────────────────────────────────────
     JS 없이 CSS 만으로 확정된다(JS 차단 환경 대비). CSS 자체가 벗겨지면 양쪽 카피가 함께
     보이므로, 만료 문구가 먼저 읽히도록 마크업 순서를 잡았다(본문 주석 참고).
     그룹명은 숨긴다 — 존재하지 않는 slug 도 만료 랜딩으로 오기 때문에(스펙 §4-2)
     이름이 빈 「」 로 렌더될 수 있다. 대신 eyebrow 를 남겨 카드 골격을 유지한다.
     초대자 줄도 같은 규칙을 따른다(GROMO-1085) — 없는 slug 는 초대자도 특정할 수 없고,
     "만료된 초대예요" 옆에 사람 이름만 남으면 누가 왜 부른 화면인지가 어긋난다.
     (서버도 만료 렌더에서 hasInviter=false 를 넣지만, CSS 만으로도 확정되도록 둘 다 건다.) */
  body[data-expired="true"] .group-name,
  body[data-expired="true"] .inviter,
  body[data-expired="true"] .bars { display: none; }
  /* :not() 으로 명시 — 같은 특이도 규칙이 순서에 의존해 서로를 덮는 걸 피한다 */
  body[data-expired="true"] .lede:not(.expired-lede) { display: none; }
  body[data-expired="true"] .expired-lede { display: block; }
  /* status 는 자리를 비워두되 접어버리진 않는다 — 카드 아래 여백이 다른 상태와 같아야
     "덜 그려진 화면"으로 읽히지 않는다 */
  body[data-expired="true"] .status { visibility: hidden; }
  body[data-expired="true"] .eyebrow { color: var(--ink-sub); background: var(--track); }
  body[data-expired="true"] .eyebrow-live { display: none; }
  body[data-expired="true"] .eyebrow-expired { display: inline; }
  body[data-expired="true"] .expired-title { display: block; }
  .eyebrow-expired { display: none; }
  .expired-title {
    display: none;
    /* eyebrow 를 남겨 두므로 .group-name 과 같은 리듬을 쓴다 */
    margin: 18px 0 0;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -.02em;
    word-break: keep-all;
  }
  body[data-expired="true"] #cta-open { display: none; }
  body[data-expired="true"] #cta-store { background: var(--indigo); color: #fff;
                                         border-color: transparent;
                                         box-shadow: 0 6px 16px rgba(94, 106, 210, .34); }
  .expired-lede { display: none; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>

<body data-expired="{{expired}}" data-state="idle" data-inviter="{{hasInviter}}" data-store="{{storeState}}">
  <main class="shell">
    <div class="card">
      <!-- 각 쌍은 "만료 카피가 먼저" 순서다. CSS 가 벗겨지는 환경(리더 모드 등)에서는 양쪽이
           함께 보이는데, 그때 만료 안내가 정상 초대 문구보다 먼저 읽혀야 한다.
           CSS 선택자는 소스 순서에 의존하지 않으므로 일반 브라우저 렌더에는 영향이 없다. -->
      <!-- 히어로는 만료 변형에서도 남긴다 — 만료까지 온 사람도 설치 후보이고, 카드에서
           그룹명·초대자·막대가 전부 빠지는 자리라 이미지까지 빼면 안내문만 남은 빈 화면이 된다.
           width/height 는 원본 픽셀 그대로 둔다(CSS 가 폭을 줄여도 브라우저는 이 비율로 자리를 먼저
           잡는다) — 안 적으면 이미지가 늦게 그려질 때 아래 문구가 통째로 밀리는 레이아웃 시프트가 난다.
           경로는 루트 상대다. 랜딩과 같은 오리진에서 서빙되므로 도메인을 박을 이유가 없고,
           박으면 dev 링크가 미배포 prod 이미지를 가리킨다(ogImageUrl 이 절대 URL 인 건 스크레이퍼가
           상대 경로를 못 풀기 때문이지, 본문 이미지에는 해당하지 않는다). -->
      <img class="hero" src="/link/hero-study-v1.jpg" width="640" height="507" decoding="async"
           fetchpriority="high" alt="원탁에 둘러앉아 함께 공부하는 별사탕 셋">

      <span class="eyebrow"><span class="eyebrow-expired">만료된 초대</span><span class="eyebrow-live">그룹 초대</span></span>

      <h1 class="expired-title">만료된 초대예요</h1>
      <p class="inviter"><span class="name">{{inviterName}}</span>님이 초대했어요</p>
      <h1 class="group-name">
        <span class="bracket">「</span>{{groupName}}<span class="bracket">」</span>
      </h1>

      <p class="lede expired-lede">이 초대 링크는 더 이상 쓸 수 없어요.<br>친구에게 새 링크를 받아 주세요.</p>
      <p class="lede">함께 집중한 시간을 기록하고, 이번 주 순위를 겨뤄요.</p>

      <div class="bars" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>

      <div class="actions">
        <a class="btn btn-primary" id="cta-open" href="{{schemeUrl}}">앱에서 열기</a>
        <a class="btn btn-ghost" id="cta-store" href="{{storeUrl}}">App Store에서 받기</a>
        <!-- 스토어 링크가 미설정일 때 버튼 자리를 대신한다. 링크를 못 주더라도 다음에 할 일은 남긴다. -->
        <p class="store-note">지금은 App Store 링크를 열 수 없어요.<br>App Store에서 <b>gromo</b>를 검색해 설치해 주세요.</p>
      </div>

      <!-- JS 가 막힌 환경에서도 빈 띠로 남지 않도록 기본 문구를 넣어 둔다(스크립트가 덮어씀) -->
      <p class="status" id="status" role="status" aria-live="polite">앱이 설치돼 있으면 ‘앱에서 열기’로 바로 들어가요.</p>
    </div>

    <p class="foot">gromo · 함께 공부하는 시간 기록</p>
  </main>

<script>
(function () {
  var body = document.body;
  var store = document.getElementById('cta-store');
  var open = document.getElementById('cta-open');
  var status = document.getElementById('status');

  var STORE_FALLBACK = 'gromo가 설치돼 있지 않은 것 같아요. 설치한 뒤 이 링크를 다시 눌러 주세요.';
  var UNKNOWN_STATE = '이 초대 링크의 상태를 확인할 수 없어요. 친구에게 새 링크를 받아 주세요.';

  // 링크를 죽인다. 사용자가 직접 누르면 앵커가 그대로 실행되므로,
  // 검증에 실패한 CTA 는 href 자체를 떼어낸다.
  // (파싱 시점 속성 주입은 서버 이스케이프의 몫 — 여기서 되돌릴 수 없다. WS-1 계약)
  function disable(el) {
    el.removeAttribute('href');
    el.setAttribute('aria-disabled', 'true');
  }

  // 스토어 링크가 http(s) 가 아니면(미치환·주입) 눌렀을 때 엉뚱한 곳으로 간다.
  if (!/^https?:\/\//i.test(store.getAttribute('href') || '')) disable(store);

  // 커스텀 스킴만 허용 — javascript:/data: 나 미치환 토큰이 탭으로 실행되지 않게 한다.
  var scheme = open.getAttribute('href') || '';
  var schemeOk = /^gromo:\/\/[^\s"']+$/.test(scheme);
  if (!schemeOk) disable(open);

  // 계약값은 "true"/"false". 빈 문자열도 "만료 아님"으로 받아 준다(컨트롤러가 false 를
  // 빈 값으로 흘릴 수 있어서). 그 밖의 값(미치환 토큰 등)은 판단 불가다.
  // 판단 불가일 때 CSS 는 정상 초대처럼 렌더하므로, JS 가 앱 열기 CTA 를 직접 막는다 —
  // 이미 만료됐을 수 있는 초대로 앱을 여는 것보다 스토어만 남기는 쪽이 안전하다.
  var expiredFlag = body.dataset.expired;
  var live = expiredFlag === 'false' || expiredFlag === '';

  if (!live) {
    disable(open);
    // 만료(true)는 CSS 가 이미 화면을 바꿔 놨다 — 안내는 판단 불가일 때만 덧붙인다.
    if (expiredFlag !== 'true') status.textContent = UNKNOWN_STATE;
    return;
  }
  if (!schemeOk) return;

  var timer = 0;
  // 감지 주기가 없는 상태 = 정착(true)으로 시작한다. 첫 '앱에서 열기' 탭이 arm() 으로 주기를 연다.
  var settled = true;
  var appOpened = false;
  var tapSource = '';

  function settle() {
    if (settled) return false;
    settled = true;
    clearTimeout(timer);
    document.removeEventListener('visibilitychange', onVisibility);
    window.removeEventListener('pagehide', onLeave);
    return true;
  }

  // 화면이 넘어갔다 = 앱이 열렸다.
  // 단 "어느 CTA 로 나갔는가" 를 구분해야 한다. 자동 점프가 막히는 브라우저에서 사용자가
  // 직접 '앱에서 열기' 를 눌러 앱이 뜬 경우도 성공인데, 이걸 스토어 이탈과 같이 취급하면
  // 대기 중인 타이머·bfcache 복원이 "미설치" 를 덮어씌운다.
  function onLeave() {
    // 스토어로 나감: 앱이 열린 게 아니므로 성공으로 정리하지 않는다.
    // 타이머만 멈춰서, 스토어에 있는 동안 화면이 몰래 noapp 으로 바뀌는 걸 막는다.
    // 다만 'opening' 인 채로 두면 안 된다 — 네이티브 App Store 로 완전히 전환됐다가
    // 앱 스위처로 돌아오는 경로는 bfcache pageshow 가 안 떠서 갱신 기회가 없고,
    // "여는 중" 펄스가 사실과 다르게 계속 돌아간다. 중립 상태로 접어 둔다.
    // (이미 noapp 이면 그대로 — 스토어 CTA 승격을 되돌릴 이유가 없다.)
    if (tapSource === 'store') {
      settle();
      if (body.dataset.state === 'opening') {
        body.dataset.state = 'idle';
        status.textContent = '';
      }
      return;
    }
    if (!settle()) return;
    appOpened = true;
    body.dataset.state = 'idle';
    status.textContent = '';
  }

  // visibilitychange 는 복귀 시에도 발화하므로 hidden 으로 바뀔 때만 이탈로 친다.
  function onVisibility() {
    if (document.visibilityState === 'hidden') onLeave();
  }

  // 이탈 감지를 건다. onTimeout 은 1.5s 안에 아무 일도 안 일어났을 때의 처리.
  function arm(onTimeout) {
    settled = false;
    document.addEventListener('visibilitychange', onVisibility);
    window.addEventListener('pagehide', onLeave);
    timer = setTimeout(function () {
      if (!settle()) return;
      onTimeout();
    }, 1500);
  }

  store.addEventListener('click', function () { tapSource = 'store'; });

  // 점프는 사용자 탭에서만 시작한다 (GROMO-1069). 로드 즉시 자동 점프하면 어느 그룹의
  // 초대인지 확인할 틈 없이 화면이 넘어간다 — 그룹명을 읽고 직접 누르는 게 이 페이지의 역할이다.
  open.addEventListener('click', function () {
    tapSource = 'open';
    // 감지 주기가 도는 중의 재탭은 무시 — 이미 걸린 주기가 결과를 판정한다.
    if (!settled) return;
    body.dataset.state = 'opening';
    status.textContent = 'gromo 앱을 여는 중';
    // 스킴 점프 자체는 앵커 href 가 수행한다. iOS 는 앱이 없으면 조용히 실패하고 그 실패는
    // 비동기라 여기서 잡히지 않는다 — 1.5s 안에 이탈이 없으면 미설치로 판정하고
    // 스토어 CTA 를 승격한다. noapp 이후의 재탭도 같은 주기로 다시 판정한다.
    arm(function () {
      body.dataset.state = 'noapp';
      status.textContent = STORE_FALLBACK;
    });
  });

  // 스토어에 다녀와 뒤로가기로 돌아오면(bfcache 복원) 앱은 결국 안 열린 것이다 — 폴백을 다시 세운다.
  // 단 앱이 실제로 열렸다가 돌아온 경우는 제외한다. 그때 "설치돼 있지 않은 것 같아요" 는 거짓이다.
  window.addEventListener('pageshow', function (e) {
    if (!e.persisted || appOpened) return;
    tapSource = '';
    settle();
    body.dataset.state = 'noapp';
    status.textContent = STORE_FALLBACK;
  });
})();
</script>
</body>
</html>
