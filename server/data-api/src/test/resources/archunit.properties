# ArchUnit 설정 — DomainLayerRulesTest 의 FreezingArchRule(타 도메인 repository 직접 의존, GROMO-2198).
#
# store 경로는 gradle test 의 작업 디렉터리(= server/data-api 모듈 루트) 기준이다. store 는 커밋한다.
freeze.store.default.path=archunit_store

# 커밋하는 상태는 둘 다 false — store 가 없거나 규칙 설명이 바뀌면 «조용히 새로 동결»하지 않고 실패한다.
# store 를 만들거나 줄일 때(위반을 고쳤을 때 포함)만 사람이 일부러 true 로 한 번 돌려 파일을 갱신·커밋하고 되돌린다.
freeze.store.default.allowStoreCreation=false
freeze.store.default.allowStoreUpdate=false
