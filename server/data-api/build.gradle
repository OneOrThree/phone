plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'

	//API 문서화
	id "org.springdoc.openapi-gradle-plugin" version "1.9.0"

	// CI: 코드 스타일 + 정적 분석 + 커버리지 + 보안 스캔
	id 'checkstyle'
	id 'com.github.spotbugs' version '6.0.18'
	id 'jacoco'
	id 'org.owasp.dependencycheck' version '10.0.4'
}

group = 'com.oneorthree'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// API 문서화 (Swagger UI - /swagger-ui/index.html 에서 확인)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'

	// JPA / Hibernate (ORM, 엔티티 ↔ DB 매핑)
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// DB 쿼리 실행 시간 측정
	implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.9.0'

	// 관측 (GROMO-546) — Actuator 헬스·메트릭 엔드포인트 + micrometer Prometheus 레지스트리(/actuator/prometheus)
	// HTTP 트래픽(http.server.requests)·HikariCP 풀 등 자동 계측. dev 는 내부 관리 포트(9091)로 격리 노출
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'

	// Spring Web (REST API 기본, 내장 Tomcat 포함)
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// Spring MVC (REST 컨트롤러, DispatcherServlet)
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	// WebSocket + STOMP (실시간 장착 브로드캐스트)
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	// BCrypt 비밀번호 해시 (spring-boot-starter-security 없이 crypto만)
	implementation 'org.springframework.security:spring-security-crypto'

	// JJWT (JWT 발급/검증)
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// PostgreSQL JDBC 드라이버 (런타임에만 필요)
	runtimeOnly 'org.postgresql:postgresql'

	// Flyway (GROMO-670) — Spring Boot 4.0 은 오토컨피그를 기술별 모듈로 분리해서, flyway-core 만으로는
	// Flyway 오토컨피그가 안 붙는다. spring-boot-flyway(오토컨피그) + flyway-core(엔진) + PostgreSQL 지원
	// 모듈(Flyway 10+ 부터 DB별 분리, 없으면 PostgreSQL 미인식)까지 3개가 필요하다.
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'

	// Redis (GROMO-292) — 집중 프레즌스 리스(presence:focus:*)를 채팅 서버가 읽는다.
	// 이 서비스에서 Redis 는 «부가»다: 쓰기는 전부 best-effort 라 Redis 가 죽어도 집중은 그대로 돌아간다.
	// 그래서 헬스 인디케이터도 끈다(management.health.redis.enabled=false) — 켜 두면 부가 의존성의
	// 장애가 컨테이너를 unhealthy 로 만들어 배포를 실패시킨다.
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// UUID v7 생성 (시간 정렬, B-tree 인덱스 지역성 최적화)
	implementation 'com.fasterxml.uuid:java-uuid-generator:5.1.0'

	// ShedLock (GROMO-1283) — 챌린지·정산·알림 크론의 멀티 인스턴스 중복 실행 차단.
	// 저장소는 기존 PostgreSQL(shedlock 테이블, V45) — jdbc-template provider 표준 구성.
	implementation 'net.javacrumbs.shedlock:shedlock-spring:5.16.0'
	implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:5.16.0'

	// BIZEVENT 구조화 JSON 로그 인코더 (GROMO-384)
	implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

	// FCM HTTP v1 서비스 계정 OAuth2 토큰 발급 (firebase-admin 미도입 — 스펙 근거 참조)
   implementation 'com.google.auth:google-auth-library-oauth2-http:1.48.0'  // 구현 시점 최신 재확인 (OWASP CVSS9 게이트)

	// Lombok (boilerplate 제거 - @Getter, @Builder, @RequiredArgsConstructor 등)
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// 테스트
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'	//Testcontainers
	testImplementation 'org.testcontainers:junit-jupiter:1.20.1'
	testImplementation 'org.testcontainers:postgresql:1.20.1'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

	// 아키텍처 규칙 검증 (GROMO-1724) — 도메인 레이어 역행·순환을 빌드 실패로 잡는다.
	// core 만 쓴다: DomainLayerRulesTest 는 @AnalyzeClasses/@ArchTest 확장 없이
	// 평범한 @Test + ClassFileImporter 로 쓰여 있어 archunit-junit5 러너가 필요 없다.
	testImplementation 'com.tngtech.archunit:archunit:1.3.0'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

openApi {
	apiDocsUrl.set("http://localhost:8080/v0/api-docs")      // 앱 구동 후 호출할 URL
	outputDir.set(file("$buildDir/docs/api/"))               // 생성된 spec 저장 위치
	outputFileName.set("openapi.json")
	// 앱 구동 대기 시간. 30초로는 CI 러너에서 부족해 2026-08-10 이후 모든 브랜치가 실패했다
	// (GROMO-1515). 실패 런 로그 기준 21초에 겨우 DataSource 를 열고 Hibernate SessionFactory
	// 구축 중에 창이 닫혔다 — 앱이 죽은 게 아니라 아직 부팅 중이었다.
	// 러너 스펙업(4 vCPU/8 GB) 후 재측정해도 30초로는 부족하다 — 한 VM 에 러너 프로세스가
	// 3개라 경합이 평시 상태다. 단독 실행 16.065초 vs 러너 3개 경합 40.008초(실측).
	// 개발 머신은 3.5초. 경합 폭을 감당하도록 여유를 크게 잡는다.
	// ⚠️ 대가: 앱이 진짜로 못 뜨면 실패 판정이 그만큼 늦어진다. 다만 그 경우에도 job 로그에
	//    앱 스택트레이스가 남아 원인은 바로 보인다(GROMO-1260 스키마 불일치를 그렇게 찾았다).
	waitTimeInSeconds.set(180)
	customBootRun {
		jvmArgs = ["-Dspringdoc.api-docs.path=/v0/api-docs"]  // ← fork된 JVM에 직접 주입
	}
}

// javadoc 경고 출력 상한. 기본값 100 은 "출력만" 자르므로, 실제 부채가 1833건일 때도
// 화면엔 100건만 보인다 — 남은 양을 알 수 없어 줄었는지 늘었는지 판단이 불가능하다 (GROMO-1654).
tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xmaxwarns', '10000')
}

tasks.named('test') {
	useJUnitPlatform()

	// ── 테스트 포크 병렬도 (GROMO-1795) ───────────────────────────────────────
	// 「켠 게」 아니라 「열어둔」 것이다. 기본값 1 = 지금까지와 «완전히» 동일한 단일 포크
	// 순차 실행이다. 값을 주지 않으면 이 블록이 없던 때와 동작이 1 도 다르지 않다.
	//
	//   ./gradlew test -PtestMaxParallelForks=4    (또는 TEST_MAX_PARALLEL_FORKS=4)
	//
	// ── 왜 기본이 1 인가 — 지금 올리면 «전체 처리량이 되레 준다» ──────────────
	// self-hosted 러너 `gromo-dev-build` 는 e2-custom-4-8192(4 vCPU / 8 GB) VM «한 대»를
	// 러너 프로세스 3개(gromo-dev-build-1/2/3)가 공유한다
	// (docs/architecture/system-architecture.md §1, be-test.yml 의 services.ports 주석,
	//  그리고 위 openApi.waitTimeInSeconds 주석의 경합 실측 16.0초 → 40.0초).
	// 잡 하나의 실효 몫은 **1.33 vCPU / 2.7 GB** 다. 여기서 포크를 늘리면
	//   - CPU: 실효 1.33 코어를 포크 N 개가 다시 나눠 갖는다. 나눌 코어가 없어 벽시계는
	//     거의 안 줄고, 컨텍스트 스위칭 비용만 는다.
	//   - 메모리: maxHeapSize 는 포크«당»이라 N 배로 곱해진다. 1757 스택이 넣은 1g 기준
	//     4 포크면 힙만 4 GB — 실효 몫 2.7 GB 를 이미 넘는다.
	//   - 컨테이너: 포크마다 TestPostgres 가 «따로» 뜨고, *MigrationTest 21 개도 클래스마다
	//     제 컨테이너를 띄운다. 도커 메모리도 같은 배수로 먹는다.
	// 결국 내 잡 하나도 안 빨라지면서 같은 VM 의 다른 러너 2개를 굶긴다 — 큐 전체가 느려진다.
	//
	// ※ `doc/ci-speed-analysis-2026-09-12.md` 는 여기에 `JAVA_TOOL_OPTIONS:
	//    -XX:MaxRAMPercentage=60` 도 걸려 있다고 적었지만, .github/workflows/ 전수에 그런
	//    설정은 «없다»(be-test.yml 은 GRADLE_OPTS 로 데몬만 끈다). 찾지 말 것.
	//    실제 구속조건은 위의 vCPU 몫과 포크당 힙이다.
	//
	// ── 언제 올릴 수 있나 — GitHub-hosted 이전(티켓 1793) «뒤» ────────────────
	// GitHub-hosted 러너는 잡마다 전용 VM 이라 굶길 옆 러너가 없다. 그 이전이 끝나기 전에는
	// 이 값을 올려도 이득이 없다.
	//
	// ── 올릴 땐 «2 부터» — 실측상 4 가 2 보다 느리다 ──────────────────────────
	// 로컬 실측(2026-09-12, macOS · Docker VM 8 vCPU / 8 GB · 2152 테스트 · 211 스위트,
	// 셋 다 통과):
	//
	//   포크 | 벽시계  | JUnit time 합계 | 합계/벽시계 | 기본 대비
	//   ----|--------|---------------|-----------|--------
	//    1  | 190.3초 |     161.9초    |   0.85    |  1.00배   ← 합계 ≥ 벽시계 = 순차
	//    2  | 138.7초 |     235.9초    |   1.70    |  1.37배
	//    4  | 143.3초 |     422.7초    |   2.95    |  1.33배   ← 2 보다 «느리다»
	//
	// 포크를 2 → 4 로 늘리면 동시성은 1.70 → 2.95 로 늘지만, 경합 탓에 스위트 «하나하나»가
	// 느려져(합계 235.9 → 422.7초) 벽시계는 오히려 뒤집힌다. 즉 이 스위트의 이득은 포크 수가
	// 아니라 «실제로 남는 코어 수»가 정한다 — 8 코어에서도 최적이 2 였다. 실효 1.33 vCPU 인
	// self-hosted 에서 이득이 0 이라는 위 판단의 실측 근거가 이것이다.
	//
	// ⚠️ 올릴 때 같이 볼 것: maxHeapSize(포크당) × 포크 수 + 포크당 컨테이너가 러너 메모리에
	//    들어가는지. 위 4 포크 실측에서 Postgres 컨테이너가 동시에 최대 39 개(약 1.5 GB) 떴다
	//    — *MigrationTest 는 클래스마다 컨테이너를 띄우고 JVM 이 끝날 때까지 안 닫기 때문이다.
	//    포크를 올리기 전에 러너의 도커 메모리부터 확인할 것.
	//
	// ── 병렬화를 막는 것은 없다 (GROMO-1795 에서 코드로 확인) ─────────────────
	//  - TestPostgres.INSTANCE 는 JVM 당 static 이라 포크마다 «별개» 컨테이너가 랜덤 호스트
	//    포트로 뜬다. 포크끼리 같은 DB 를 밟지 않는다.
	//  - 실행시간의 44% 를 먹는 *MigrationTest 21 개는 이미 클래스별 전용 컨테이너를 직접 띄운다.
	//  - 고정 포트·withReuse·JUnit 스레드 병렬 설정(@Execution·@ResourceLock)은 테스트 소스에
	//    하나도 없다.
	//  - @SpringBootTest 7 개 전부가 TestPostgres 로 datasource 를 덮어쓴다(또는 @Disabled).
	//    ⚠️ 여기가 유일하게 «깨질 수 있는» 자리다: be-test.yml 은 잡마다 `services: postgres`
	//    를 띄워 SPRING_DATASOURCE_URL 로 주입한다. 그 DB 는 잡 하나에 «한 개»뿐이라 포크들이
	//    공유한다. 지금은 그 DB 를 실제로 쓰는 테스트가 하나도 없어 무해하지만, 앞으로
	//    @DynamicPropertySource 없이 ci 프로파일 DB 를 그대로 쓰는 테스트를 추가하면
	//    ddl-auto=create-drop 탓에 포크들이 서로의 스키마를 지운다. 그런 테스트를 들일 거면
	//    이 값을 올리기 전에 포크별 DB 분리부터 해야 한다.
	def forksRaw = (project.findProperty('testMaxParallelForks')
			?: System.getenv('TEST_MAX_PARALLEL_FORKS')
			?: '1').toString().trim()
	if (!forksRaw.isInteger() || forksRaw.toInteger() < 1) {
		throw new GradleException(
				"testMaxParallelForks 는 1 이상의 정수여야 한다 (받은 값: '${forksRaw}')")
	}
	maxParallelForks = forksRaw.toInteger()
	if (maxParallelForks > 1) {
		logger.lifecycle("[GROMO-1795] test maxParallelForks=${maxParallelForks} " +
				"— 포크마다 Testcontainers 컨테이너가 따로 뜬다(메모리·디스크 배수 주의)")
	}

	// 테스트 완료 후 JaCoCo 리포트 자동 생성
	finalizedBy jacocoTestReport
}

// ── Checkstyle ────────────────────────────────────────────────────────────
checkstyle {
	toolVersion = '10.21.4'
	configFile = file("config/checkstyle/checkstyle.xml")
	// 기존 코드에 위반이 많을 경우 아래를 true로 바꿔 경고로만 처리 후 점진적으로 수정
	ignoreFailures = false
}

checkstyleTest.enabled = false

// ── SpotBugs ─────────────────────────────────────────────────────────────
spotbugs {
	toolVersion = '4.8.6'
	effort = 'max'
	// HIGH 이상만 빌드 실패 (MEDIUM은 리포트에는 포함되지만 빌드는 통과)
	reportLevel = 'high'
	excludeFilter = file("config/spotbugs/exclude.xml")
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
	reports {
		xml.required = true   // pr-report 파싱용
		html.required = true  // 로컬 열람용
	}
}

spotbugsTest.enabled = false

// ── JaCoCo ───────────────────────────────────────────────────────────────
jacoco {
	toolVersion = '0.8.12'
}

jacocoTestReport {
	reports {
		xml.required = true   // CI에서 커버리지 파싱용
		html.required = true  // 로컬 열람용
	}
}

// ── OWASP Dependency Check ───────────────────────────────────────────────
dependencyCheck {
	// JSON 포맷: pr-report 파싱용. HTML은 로컬 열람용으로 동시 생성
	formats = ['JSON', 'HTML']
	// CVSS 9.0+(Critical)만 빌드 실패. HIGH/MEDIUM은 pr-report에서 경고로 표시
	failBuildOnCVSS = 9
	// NVD DB 저장 경로: CI에서 actions/cache로 ~/.gradle/dependency-check-data 캐시
	data {
		directory = "${System.getProperty('user.home')}/.gradle/dependency-check-data"
	}
	nvd {
		// NVD API 키 있으면 속도 향상 (없어도 동작)
		// apiKey = System.getenv('NVD_API_KEY') ?: ''
	}
}
