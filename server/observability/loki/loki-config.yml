# GROMO-546 — Loki 단일 바이너리(filesystem) 최소 설정. dev 로그 보관 7일.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# GROMO-1942 — retention_period 는 compactor 의 retention_enabled 가 켜져야 실제로 지운다.
# 없으면 7일이 지나도 청크가 남는다(탈퇴자 user_id 포함 APP 로그). 기간 정본: docs/prd/fishcat/account/policy.md L06.
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  retention_period: 168h            # 7일
  reject_old_samples: false
  allow_structured_metadata: true

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
