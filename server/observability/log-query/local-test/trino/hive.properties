# 로컬 전용. Athena 의 Glue 카탈로그·S3 대신 파일 메타스토어와 로컬 파일시스템을 쓴다(local:///x = 컨테이너 /data/x).
connector.name=hive
hive.metastore=file
hive.metastore.catalog.dir=local:///metastore
fs.native-local.enabled=true
local.location=/data
# partition projection 은 Trino 에 없다 — run.sh 가 객체 디렉터리마다 파티션을 명시 등록한다.
hive.allow-register-partition-procedure=true
