# GROMO-546 — Grafana 대시보드 파일 프로바이더 (JSON as code)
apiVersion: 1
providers:
  - name: gromo
    orgId: 1
    folder: gromo
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
