# Data DB 전용. 미전달 부분 인덱스만 읽으며 payload·사용자 ID는 지표에 넣지 않는다.
gromo_outbox:
  query: |
    WITH pending AS (
      SELECT target, count(*) AS pending,
             count(*) FILTER (WHERE attempt_count > 1) AS retried,
             COALESCE(EXTRACT(EPOCH FROM now() - min(created_at)), 0) AS oldest_seconds
      FROM event_outbox_deliveries WHERE delivered_at IS NULL GROUP BY target
    )
    SELECT t.target, COALESCE(p.pending,0) AS pending, COALESCE(p.retried,0) AS retried,
           COALESCE(p.oldest_seconds,0) AS oldest_seconds
    FROM (VALUES ('KAFKA'),('REALTIME'),('NOTI'),('LINK'),('SCORE')) t(target)
    LEFT JOIN pending p ON p.target=t.target
  metrics:
    - target: {usage: LABEL, description: 전달 대상}
    - pending: {usage: GAUGE, description: 아직 전달되지 않은 사건 수}
    - retried: {usage: GAUGE, description: 두 번 이상 시도한 미전달 사건 수}
    - oldest_seconds: {usage: GAUGE, description: 가장 오래된 미전달 사건의 나이}
gromo_db_activity:
  query: |
    SELECT datname, state, COALESCE(wait_event_type,'none') AS wait_type, count(*) AS connections,
           COALESCE(max(EXTRACT(EPOCH FROM now()-xact_start)),0) AS oldest_transaction_seconds
    FROM pg_stat_activity WHERE datname IS NOT NULL GROUP BY datname,state,wait_event_type
  metrics:
    - datname: {usage: LABEL, description: DB 이름}
    - state: {usage: LABEL, description: 연결 상태}
    - wait_type: {usage: LABEL, description: 대기 유형}
    - connections: {usage: GAUGE, description: 상태별 연결 수}
    - oldest_transaction_seconds: {usage: GAUGE, description: 가장 오래된 열린 트랜잭션의 나이}
