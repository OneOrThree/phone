# GROMO-2555 — 컨테이너 stdout(Docker json-file) → 허용 서비스만 골라 → dev Loki.
# 흐름: tail → lua(select_container: 서비스 식별·허용 목록) → parser(app_json) → lua(finalize: 라벨 값 정규화·마스킹) → loki
# 이 파일과 logs.lua·parsers.conf 는 컨테이너의 /fluent-bit/etc 에 읽기 전용으로 마운트된다.

[SERVICE]
    Flush                     1
    Grace                     10
    Log_Level                 info
    Parsers_File              parsers.conf
    # 내부 상태·재시도 지표(포트는 호스트에 공개하지 않는다)
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    # 디스크 버퍼 — named volume(fluent_bit_state). 컨테이너를 지웠다 만들어도 남는다.
    storage.path              /var/lib/fluent-bit/storage
    storage.sync              normal
    storage.checksum          off
    storage.backlog.mem_limit 32M
    storage.max_chunks_up     64
    storage.metrics           On

[INPUT]
    Name                      tail
    Path                      /var/lib/docker/containers/*/*-json.log
    Tag                       docker
    Path_Key                  filepath
    # Docker 가 16 KiB 로 쪼갠 줄(partial)을 한 줄로 합친다.
    multiline.parser          docker
    # 읽은 위치. 재시작 뒤 이어 읽는다. WAL 로 비정상 종료에도 덜 깨진다.
    DB                        /var/lib/fluent-bit/tail.db
    DB.sync                   normal
    DB.journal_mode           WAL
    storage.type              filesystem
    storage.pause_on_chunks_overlimit On
    # 기본 32k 를 넘는 줄이 나오면 tail 이 그 파일을 멈춘다. 예외 스택 JSON 이 크므로 늘리고, 넘으면 건너뛴다.
    Buffer_Chunk_Size         64k
    Buffer_Max_Size           1M
    Skip_Long_Lines           On
    Refresh_Interval          5
    Rotate_Wait               10

[FILTER]
    Name                      lua
    Match                     docker
    script                    logs.lua
    call                      select_container

[FILTER]
    Name                      parser
    Match                     docker
    Key_Name                  log
    Parser                    app_json
    Reserve_Data              On
    # 성공/실패 판정은 finalize 가 한다 — 원문이 필요하다.
    Preserve_Key              On

[FILTER]
    Name                      lua
    Match                     docker
    script                    logs.lua
    call                      finalize

[OUTPUT]
    Name                      loki
    Match                     docker
    Host                      loki
    Port                      3100
    # Loki 라벨은 이 셋뿐. 값은 finalize 가 고정 집합으로 정규화해 두었다. ID 류는 JSON 필드로 남긴다.
    label_keys                $env,$service,$log_kind
    line_format               json
    # 4xx(형식 오류 등)는 재시도하지 않고 버려지고, 연결 실패·5xx·429 는 한도 없이 재시도한다.
    Retry_Limit               no_limits
    storage.total_limit_size  128M
