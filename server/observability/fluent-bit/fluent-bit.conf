# GROMO-2555 — 컨테이너 stdout(Docker json-file) → 허용 서비스만 골라 → dev Loki.
# 흐름: tail → lua(select_container: 서비스 식별·허용 목록) → parser(app_json) → lua(finalize: 라벨 값 정규화·마스킹) → loki
# 이 파일과 logs.lua·parsers.conf 는 컨테이너의 /fluent-bit/etc 에 읽기 전용으로 마운트된다.

[SERVICE]
    Flush                     1
    Grace                     10
    Log_Level                 info
    Parsers_File              parsers.conf
    # 내부 상태·재시도 지표(포트는 호스트에 공개하지 않는다)
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    # 디스크 버퍼 — named volume(fluent_bit_state). 컨테이너를 지웠다 만들어도 남는다.
    storage.path              /var/lib/fluent-bit/storage
    storage.sync              normal
    storage.checksum          off
    storage.backlog.mem_limit 32M
    storage.max_chunks_up     64
    storage.metrics           On

[INPUT]
    Name                      tail
    Path                      /var/lib/docker/containers/*/*-json.log
    Tag                       docker
    Path_Key                  filepath
    # Docker 가 16 KiB 로 쪼갠 줄(partial)을 한 줄로 합친다.
    multiline.parser          docker
    # DB 에 위치가 있는 파일은 그 offset 부터, DB 에 없는 새 파일은 처음부터 읽는다. 수집기가 멈춘 동안 앱 컨테이너가
    # 재생성되어도 새 파일의 시작·오류 로그를 건너뛰지 않기 위함이다. 대가: 첫 기동(DB 없음)에는 기존 *-json.log
    # (앱 컨테이너당 현재 파일 최대 50 MB)를 전부 다시 읽는다 — Loki reject_old_samples: false 라 수용한다.
    # 회전된 파일(*-json.log.1 등)은 Path 패턴 밖이라 읽지 않는다.
    Read_From_Head            On
    # 읽은 위치. 재시작 뒤 이어 읽는다. WAL 로 비정상 종료에도 덜 깨진다.
    DB                        /var/lib/fluent-bit/tail.db
    DB.sync                   normal
    DB.journal_mode           WAL
    storage.type              filesystem
    storage.pause_on_chunks_overlimit On
    # 기본 32k 를 넘는 줄이 나오면 tail 이 그 파일을 멈춘다. 예외 스택 JSON 이 크므로 늘리고, 넘으면 건너뛴다.
    Buffer_Chunk_Size         64k
    Buffer_Max_Size           1M
    Skip_Long_Lines           On
    Refresh_Interval          5
    Rotate_Wait               10

[FILTER]
    Name                      lua
    Match                     docker
    script                    logs.lua
    call                      select_container

[FILTER]
    Name                      parser
    Match                     docker
    Key_Name                  log
    Parser                    app_json
    Reserve_Data              On
    # 성공/실패 판정은 finalize 가 한다 — 원문이 필요하다.
    Preserve_Key              On

[FILTER]
    Name                      lua
    Match                     docker
    script                    logs.lua
    call                      finalize

# ---- GROMO-2556 --------------------------------------------------------------------------
# 선택 모듈. overlay 가 /fluent-bit/etc/modules/<이름> 에 «켜짐|꺼짐» 디렉터리를 마운트한다(OBS_LOG_NGINX_HOST, OBS_LOG_S3; 기본 꺼짐).
# 마운트가 없거나 .conf 가 없으면 아무것도 추가되지 않는다. 순서가 중요하다: Nginx 호스트 입력의 finalize 뒤에 S3 복제 필터가 와야 한다.
@INCLUDE /fluent-bit/etc/modules/nginx-host/*.conf

# 합성 canary — 60초마다 고유 log_id 레코드 1건을 만들어 같은 경로(Loki, 켜져 있으면 S3)로 흘린다. 개인정보 없음.
# 도착 확인은 Loki 조회와 S3 객체 조회를 각각 따로 한다(local-test/s3/canary.py, 운영은 ingestion-runbook.md).
[INPUT]
    Name                      dummy
    Tag                       canary
    Dummy                     {"canary":true}
    Interval_Sec              60
    Rate                      1
    Samples                   -1
    storage.type              filesystem

[FILTER]
    Name                      lua
    Match                     canary
    script                    logs.lua
    call                      canary

@INCLUDE /fluent-bit/etc/modules/s3/*.conf

[OUTPUT]
    Name                      loki
    Match_Regex               ^(docker|nginx_host|canary)$
    Host                      loki
    Port                      3100
    # Loki 라벨은 이 셋뿐. 값은 finalize 가 고정 집합으로 정규화해 두었다. ID 류는 JSON 필드로 남긴다.
    label_keys                $env,$service,$log_kind
    line_format               json
    # Loki 수용창(max_chunk_age/2) 밖의 오래된 줄도 4xx 로 거절된다 — 첫 기동 재읽기에서 생길 수 있다. 시각을 바꿔 감추지 않으며
    # S3 원본(2556)이 보관 경로다. 거절 수는 Fluent Bit dropped_records 와 Loki loki_discarded_samples_total 로 본다.
    # 4xx(형식 오류 등)는 재시도하지 않고 버려지고, 연결 실패·5xx·429 는 한도 없이 재시도한다.
    Retry_Limit               no_limits
    storage.total_limit_size  128M
