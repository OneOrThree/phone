# GROMO-2556 — 원본 로그 S3 보관 출력. 켜는 법: overlay 환경변수 OBS_LOG_S3=on (기본 off, README/runbook 참고).
# 앱 레코드(allowlist 서비스 + nginx + canary)를 태그 s3.<env>.<service> 로 «복제»해(keep=true) S3 출력만 받게 한다.
#   - 원본 레코드는 그대로 Loki 로 간다. 복제본은 자기 청크·자기 재시도·자기 디스크 한도를 가진다(두 출력의 독립).
#   - env/service 는 레코드 본문에도 남는다(Loki 출력은 label_keys 로 본문에서 빼지만 S3 복제본은 별도 레코드다).
# 객체 키: system_log/v2/env=<env>/service=<service>/date=YYYY-MM-DD/hour=HH/<UUID>.json.gz
#   날짜·시간 = 한 객체의 «첫 레코드» event time(UTC) — 정확한 발생/수집 시간 파티션이 아니다(README §5).
#   객체 이름은 <컨테이너 HOSTNAME>-<$UUID(무작위 8자)> — 재생성된 수집기끼리도 겹치지 않게 HOSTNAME 을 앞에 붙인다.
#   event time = Docker json-file 이 줄에 찍은 시각(앱 timestamp 와 밀리초~초 차이), 수집기가 늦게 읽어도 바뀌지 않는다.

[FILTER]
    Name                      rewrite_tag
    Match_Regex               ^(docker|nginx_host|canary)$
    # service 는 allowlist 정규식으로 제한, env 는 finalize 가 dev|staging|prod|unknown 으로 정규화해 두었다.
    Rule                      $service ^(data-api|business-api|notification|realtime|nginx|canary)$ s3.$env.$service true
    Emitter_Name              s3_emitter
    Emitter_Storage.type      filesystem
    Emitter_Mem_Buf_Limit     16M

[OUTPUT]
    Name                      s3
    Match                     s3.*
    # 버킷·리전·크기는 환경변수(기본값은 overlay 가 채운다). endpoint 줄은 일부러 없다 — AWS 기본 엔드포인트와 자격 체인
    # (인스턴스 역할)을 쓴다. 로컬 MinIO 하네스는 이 파일 사본에 endpoint 한 줄을 넣어 쓴다(local-test/s3/run-s3.sh).
    bucket                    ${FLB_S3_BUCKET}
    region                    ${FLB_S3_REGION}
    s3_key_format             /system_log/v2/env=$TAG[1]/service=$TAG[2]/date=%Y-%m-%d/hour=%H/${HOSTNAME}-$UUID.json.gz
    s3_key_format_tag_delimiters .
    compression               gzip
    content_type              application/x-ndjson
    # 본문은 레코드 그대로(JSONL). Fluent Bit 이 붙이는 date 키는 쓰지 않는다 — 시각은 레코드의 timestamp/observed_at.
    json_date_key             false
    total_file_size           ${FLB_S3_TOTAL_FILE_SIZE}
    upload_timeout            ${FLB_S3_UPLOAD_TIMEOUT}
    # 이 플러그인 전용 로컬 버퍼(재시작에도 남도록 fluent_bit_state 볼륨 안). 한도 도달 시 새 데이터를 버린다.
    store_dir                 /var/lib/fluent-bit/s3
    store_dir_limit_size      ${FLB_S3_STORE_LIMIT}
    use_put_object            false
    # 4.2.8 out_s3 는 retry_limit < 0(= no_limits)을 MAX_UPLOAD_ERRORS(5)로 바꾼다(s3.c:620-621, s3.h:51). 로컬 버퍼 파일의 업로드가
    # 5번 실패하면 «will not retry» 로 버려져 하네스(upload_timeout 20s)의 50~90초 S3 정지에서 원본이 유실됐다(ingestion-runbook.md §7). 양수를 주면 그 값을 쓴다.
    # 재시도 간격이 2*n 초씩 늘어(s3.c:1903-1925) N 번이면 대략 N*(N-1)초 — 60 이면 약 1시간(계산값, 실측은 5분 정지까지).
    Retry_Limit               60
    # 엔진 쪽 상한. 같은 Retry_Limit 이 엔진 flush 재시도 한도이기도 하다. store_dir 이 차면 flush 가 FLB_RETRY 를 돌려주고
    # (s3.c:3912-3915, s3_store.c:136-140) 에미터 청크(fluent_bit_state 의 storage/)가 재시도 60회(엔진 backoff 상한 2000초라 수 시간)
    # 동안 남아 상한 없이 쌓인다. 이 값은 S3 로 가는 엔진 청크만 묶는다(Loki 출력의 128M 와 독립) — 넘으면 가장 오래된 청크부터 버린다
    # (S3 쪽 dropped_records). 4.2.8 이 시작 때 «store_dir_limit_size 를 쓰라» 경고를 한 줄 찍지만(s3.c:637-640) 엔진은 이 값을 적용한다.
    storage.total_limit_size  64M
