# GROMO-2556 — dev 호스트 Nginx(systemd, 컨테이너 아님) 파일 입력. 켜는 법: overlay 환경변수 OBS_LOG_NGINX_HOST=on.
# Docker 입력과 DB·cursor 를 분리한다(nginx-tail.db). 파일 이름이 고정이라 logrotate(rename + create)는 inode 추적으로 따라가고,
# delaycompress 덕에 .1 이 압축되기 전에 끝까지 읽는다(Rotate_Wait 가 이 지연을 덮는다). 압축된 .gz 는 읽지 않는다(경로가 정확한 두 파일뿐).
# 읽기 권한: 호스트 /var/log/nginx 는 www-data:adm 0640 — 이 컨테이너는 root 로 실행되어 읽는다.
# 호스트 Nginx 에 JSON log_format 을 넣기 전에는 access.json.log 가 없다(error.log 만 수집). 적용 절차는 ingestion-runbook.md.

[INPUT]
    Name                      tail
    Path                      /var/log/nginx/access.json.log,/var/log/nginx/error.log
    Tag                       nginx_host
    Path_Key                  filepath
    DB                        /var/lib/fluent-bit/nginx-tail.db
    DB.sync                   normal
    DB.journal_mode           WAL
    # DB 에 있는 파일은 저장된 offset 부터, 새 파일(회전 후 새 파일 포함)은 처음부터 읽는다.
    Read_From_Head            On
    storage.type              filesystem
    storage.pause_on_chunks_overlimit On
    Buffer_Chunk_Size         64k
    Buffer_Max_Size           1M
    Skip_Long_Lines           On
    Refresh_Interval          5
    Rotate_Wait               10

[FILTER]
    Name                      lua
    Match                     nginx_host
    script                    logs.lua
    call                      nginx_host_select

[FILTER]
    Name                      parser
    Match                     nginx_host
    Key_Name                  log
    Parser                    app_json
    Reserve_Data              On
    Preserve_Key              On

[FILTER]
    Name                      lua
    Match                     nginx_host
    script                    logs.lua
    call                      finalize
