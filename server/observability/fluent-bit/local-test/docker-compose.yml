# GROMO-2555 로컬 수집기 하네스 — Loki(dev 와 같은 3.3.2·같은 설정)와 Fluent Bit(같은 설정 디렉터리)을 띄우고
# 로그 생성기를 compose 서비스 data-api 로 흉내 낸다. 실행은 run.sh 가 한다.
name: obs2562-collector

services:
  loki:
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ../../loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    ports: ["127.0.0.1:13100:3100"]

  fluent-bit:
    image: fluent/fluent-bit:4.2.8
    command: ["-c", "/fluent-bit/etc/fluent-bit.conf"]
    environment:
      FLB_COMPOSE_PROJECT: obs2562-collector
      FLB_ENV: dev
    volumes:
      - ..:/fluent-bit/etc:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - fluent_bit_state:/var/lib/fluent-bit
    ports: ["127.0.0.1:12020:2020"]
    depends_on: [loki]

  # 허용 목록 서비스 이름(data-api)으로 떠야 수집기를 통과한다. 실행은 `compose run -d` 로 run.sh 가 한다.
  data-api:
    image: python:3.12-alpine
    profiles: [gen]
    volumes: ["./gen.py:/gen.py:ro"]
    entrypoint: ["python", "-u", "/gen.py"]

volumes:
  fluent_bit_state:
