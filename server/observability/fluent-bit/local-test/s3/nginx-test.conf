# 하네스 전용 server 블록. log_format 은 server/scripts/nginx-log-format.conf.example 을 conf.d/00-log-format.conf 로 마운트해 그대로 쓴다.
client_max_body_size 1k;
server {
    listen 80;
    add_header X-Edge-Id $request_id always;   # 구동기가 «기대 edge_request_id» 를 알 수 있게 한다(하네스 전용)
    include /etc/nginx/harness-access.conf;
    location /ok        { return 200 "ok\n"; }
    location /api/      { proxy_pass http://127.0.0.1:9; }          # 연결 거부 → 502 + error 로그(upstream URL·query 포함)
    location /up/       { proxy_pass http://127.0.0.1:81/; }        # upstream 이 X-Request-Id 를 돌려줌
    location /upload    { return 200 "up\n"; }                      # 본문 1k 초과 → 413
}
server {
    listen 81;
    location / { add_header X-Request-Id "up-$request_id" always; return 200 "up\n"; }
}
