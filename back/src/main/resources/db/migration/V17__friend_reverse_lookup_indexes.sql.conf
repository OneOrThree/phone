# GROMO-801 — CREATE INDEX CONCURRENTLY 는 트랜잭션 블록 안에서 실행할 수 없다.
# Flyway 는 기본적으로 마이그레이션 하나를 한 트랜잭션으로 감싸므로, 이 스크립트만 트랜잭션 없이 돌린다.
# (스크립트 설정 파일 규칙: <마이그레이션 파일명>.conf, Flyway 11.x)
#
# 트랜잭션이 없다는 건 실패 시 부분 적용이 남는다는 뜻이다 — 그래서 스크립트가 DROP ... IF EXISTS 로
# 자기 정리를 하도록 짰다. 인덱스 생성만 들어 있어 부분 적용이 데이터 정합성을 깨지는 않는다.
executeInTransaction=false
