spring:
  datasource:
    url: ${API_DB_URL}
    username: ${API_DB_USERNAME}
    password: ${API_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # 스키마 변경은 Flyway 마이그레이션으로만 반영. 엔티티↔DB 드리프트 시 기동 거부해 조기 탐지 (GROMO-670).
      # ⚠️ prod 가 그간 update 로 운영돼 실 DB↔엔티티 드리프트 가능 — dev/staging 에서 validate 기동을 먼저
      #   검증하고, 드리프트 발견 시 V2 보정 마이그레이션으로 해소한 뒤 prod 배포할 것.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  # Flyway 형상관리 (GROMO-670). baseline-on-migrate 로 기존 RDS 는 V1 마킹만(무중단), V2+ 자동 적용.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 3600
  refresh-expiration: 2592000

apple:
  jwks-url: https://appleid.apple.com/auth/keys
  client-id: ${APPLE_CLIENT_ID}

kakao:
  api-base-url: https://kapi.kakao.com

google:
  jwks-url: https://www.googleapis.com/oauth2/v3/certs
  client-id: ${GOOGLE_CLIENT_ID}

line:
  api-base-url: https://api.line.me

instagram:
  api-base-url: https://graph.instagram.com

facebook:
  jwks-url: https://www.facebook.com/.well-known/oauth/openid/jwks/
  client-id: ${FACEBOOK_CLIENT_ID:990121817063522}

decorator:
  datasource:
    p6spy:
      enable-logging: false

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.web: WARN

# 활동 시각(last_active_at) 갱신 스로틀 창 (GROMO-903) — 같은 유저에게 write 를 허용하는 최소 간격.
# 짧을수록 last_active_at 이 정확해지고 write 가 늘어난다. 이 값만큼 실제 마지막 활동보다 과거일 수 있어
# 미접속 복귀 푸시의 "정확히 N일째" 판정이 하루 당겨질 수 있다(자정 직후 창 안에 그날 첫 활동을 한 유저).
app:
  user-activity:
    touch-interval: 2h

# 그룹 초대 링크 (deferred deep link). ip-salt 는 Secrets Manager(gromo/prod/env)에서 주입한다 —
# salt 가 바뀌면 그 시점 이전 클릭은 매치되지 않으므로 값 교체는 배포와 함께 신중히.
link:
  base-url: ${LINK_BASE_URL:https://link.oneorthree.world}
  match-window-hours: ${LINK_MATCH_WINDOW_HOURS:3}
  ip-salt: ${LINK_IP_SALT}
  store-ios-url: ${LINK_STORE_IOS_URL:https://apps.apple.com/kr/app/id0000000000}

# GA4 Measurement Protocol 서버 이벤트 (초대 링크 퍼널, 스펙 §6-2) — prod 만 실전송.
# dev/local 은 이 블록을 두지 않아 ga4.enabled 미설정 → no-op 구현이 뜬다(분석 노이즈·시크릿 노출 방지).
# 시크릿 4종은 Secrets Manager(gromo/prod/env)에서 env 로 주입(위 LINK_IP_SALT 와 같은 저장소 —
# oneorthree/phone 은 dev 배포용이다). 미주입이어도 기동은 막지 않고 기동 시 WARN 1회만 남긴다 —
# 분석 배선 누락이 서비스 기동을 세우면 안 되기 때문(FCM 의 fail-fast 와 대비).
ga4:
  enabled: true
  firebase-app-id: ${GA4_FIREBASE_APP_ID:}
  app-api-secret: ${GA4_APP_API_SECRET:}
  web-measurement-id: ${GA4_WEB_MEASUREMENT_ID:}
  web-api-secret: ${GA4_WEB_API_SECRET:}
