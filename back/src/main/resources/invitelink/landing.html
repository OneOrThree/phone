<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:title" content="gromo 그룹 「{{groupName}}」에 초대받았어요">
<title>gromo 초대</title>
<style>
  /* 상태는 body 의 data-expired 하나가 소유한다 — 만료면 초대 문구와 '앱에서 열기'가 사라지고
     만료 카피만 남는다(스토어 버튼은 두 상태 모두 유지 — 유입을 설치 기회로 회수한다). */
  body[data-expired="true"] .invite,
  body[data-expired="true"] #open { display: none; }
  body[data-expired="false"] .expired { display: none; }

  body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; line-height: 1.5; }
  /* 카톡 인앱브라우저(주 경로)의 좁은 뷰포트 기준 — 두 버튼이 붙어 오탭되지 않게 세로로 쌓고
     터치 타깃 최소 44px 를 준다. */
  a { display: flex; align-items: center; justify-content: center;
      min-height: 44px; margin-top: 12px; padding: 0 16px; }
</style>
</head>
<body data-expired="{{expired}}">
<!-- 스텁 템플릿 — WS-5 가 같은 경로를 프로덕션 품질(OG 이미지·카피·스타일)로 교체한다.
     치환 변수는 이 4개뿐이다(계약 §4-4): {{groupName}} {{schemeUrl}} {{storeUrl}} {{expired}} -->
<p class="invite">「{{groupName}}」 그룹 초대</p>
<p class="expired">만료된 초대예요</p>
<a id="open" href="{{schemeUrl}}">앱에서 열기</a>
<a id="store" href="{{storeUrl}}">App Store에서 받기</a>
<script>
  // 설치돼 있으면 스킴이 앱을 연다. 미설치면 iOS 에서 조용히 실패하므로 스토어 버튼이 남는다.
  // 판정을 body 속성에서 읽는 이유: 특정 태그를 querySelector 로 집으면 템플릿에 문단이 하나만
  // 늘어도 조용히 어긋나, 만료된 초대에서 스킴 점프를 시도하게 된다.
  if (document.body.dataset.expired !== 'true') {
    location.href = document.getElementById('open').href;
  }
</script>
</body>
</html>
