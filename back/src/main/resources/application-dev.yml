spring:
  datasource:
    url: ${API_DB_URL}
    username: ${API_DB_USERNAME}
    password: ${API_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # 스키마 변경은 마이그레이션으로만 반영. 엔티티↔DB 드리프트 시 기동 거부해 조기 탐지 (GROMO-577)
      # ※ live 배포(cd.yml → docker-compose.dev.yml)가 dev 프로파일로 동작하므로 사실상 운영 DB를 검증한다.
      ddl-auto: validate
  # Flyway 형상관리 (GROMO-670). 기존 dev DB 는 스키마가 이미 있으므로 첫 기동 때 baseline-on-migrate 가
  # flyway_schema_history 에 V1 을 '적용됨'으로 마킹만 하고 실행은 건너뜀(무중단). 이후 V2+ 부터 배포 시 자동 적용.
  # baseline-version: 1 → V1(=현재 스키마)은 기존 DB 에서 재실행 안 됨. 빈 DB 는 V1 부터 전부 실행.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 3600
  refresh-expiration: 2592000

apple:
  jwks-url: https://appleid.apple.com/auth/keys
  client-id: ${APPLE_CLIENT_ID}

kakao:
  api-base-url: https://kapi.kakao.com

google:
  jwks-url: https://www.googleapis.com/oauth2/v3/certs
  client-id: ${GOOGLE_CLIENT_ID}

line:
  api-base-url: https://api.line.me

instagram:
  api-base-url: https://graph.instagram.com

facebook:
  jwks-url: https://www.facebook.com/.well-known/oauth/openid/jwks/
  client-id: ${FACEBOOK_CLIENT_ID:990121817063522}

decorator:
  datasource:
    p6spy:
      enable-logging: false

# 관측 (GROMO-588) — base application.yml 은 gitignored(로컬 전용)이라, 배포 이미지에 반영되려면
# 관측 설정을 추적 파일인 이 dev 프로파일에 둔다. prometheus 는 공개 8080 이 아닌 내부 전용 관리 포트(9091)로
# 격리 → docker-compose 에서 9091 호스트 미공개, app-network 안 Prometheus 만 app:9091 스크레이프.
# JwtFilter 는 /api/* 만 필터하므로 /actuator/* 는 무인증 — 포트 격리로 공개 노출을 막는다.
management:
  server:
    port: 9091
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: gromo-back
    distribution:
      percentiles-histogram:
        http.server.requests: true    # Grafana p95/p99(histogram_quantile) 용 버킷 생성

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.web.servlet.DispatcherServlet: WARN
    org.springframework.web.filter: WARN
