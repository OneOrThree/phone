# 프로덕션용 docker-compose
# 실행 전 서버에 .env.prod 파일 생성 필요 (아래 .env.prod.example 참고)
# 실행: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

x-app-common: &app-common
  image: ${ECR_REPO}:${IMAGE_TAG}
  restart: unless-stopped
  mem_limit: 1.5g
  memswap_limit: 1.5g # = mem_limit → 컨테이너 swap 0 (JVM 스왑 차단)
  environment:
    SPRING_PROFILES_ACTIVE: prod
    JAVA_TOOL_OPTIONS: "-Xms1g -Xmx1g -XX:+AlwaysPreTouch -XX:+UseSerialGC"
    DB_URL: "jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}"
    DB_USERNAME: ${DB_USERNAME}
    DB_PASSWORD: ${DB_PASSWORD}
    JWT_SECRET: ${JWT_SECRET}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
  networks:
    - app-network

services:
  # 앱은 /app/logs/app.log(시스템 로그) + user-activity.log를 쓴다.
  # 인스턴스별 호스트 폴더로 마운트 → CloudWatch Agent가 app.log만 스트림 분리해 수집.
  app-1:
    <<: *app-common
    container_name: gromo-app-1
    volumes:
      - /var/log/springboot/app-1:/app/logs

  app-2:
    <<: *app-common
    container_name: gromo-app-2
    volumes:
      - /var/log/springboot/app-2:/app/logs

  nginx:
    # 마이너 버전 고정 (stable 브랜치) — 앱 이미지처럼 배포 재현성 보장
    image: nginx:1.28-alpine
    container_name: gromo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro # S3에서 주입된 인증서 (fullchain/privkey)
    depends_on:
      - app-1
      - app-2
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
