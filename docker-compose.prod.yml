# 프로덕션 compose (GROMO-541·596) — nginx(80/443, TLS 종단) → spring 단일 체인 + datadog-agent.
#
# 실행은 SSM 배포 문서(gromo-prod-deploy, Infra 레포)가 수행:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# .env.prod 규약:
#   - Secrets Manager(gromo/prod/env)의 '모든' 키를 KEY=VALUE로 변환해 배포 순간에만 생성,
#     up 직후 삭제된다(컨테이너는 up 시점에 env를 이미 물려받음).
#   - 개별 키를 나열하지 않으므로 SM에서 키를 지우면 다음 배포부터 자동으로 빠진다.
#   - 따라서 SM 키 이름은 스프링이 읽는 env 이름(application-prod.yml의 ${...})과 정확히 일치해야
#     한다: API_DB_URL·API_DB_USERNAME·API_DB_PASSWORD·JWT_SECRET·GOOGLE_CLIENT_ID·APPLE_CLIENT_ID·DD_API_KEY 등.

services:
  app:
    image: ${ECR_REPO}:${IMAGE_TAG}
    container_name: gromo-app
    restart: unless-stopped
    # 모든 env는 SM(gromo/prod/env) → .env.prod 전체 주입 — 여기 키 나열 금지.
    # SPRING_PROFILES_ACTIVE·JAVA_TOOL_OPTIONS도 SM에서 관리한다.
    env_file:
      - .env.prod
    # Datadog APM — 내장 dd-java-agent 로드(트레이싱). egd 기본값 유지 + -javaagent 추가.
    environment:
      JAVA_OPTS: "-Djava.security.egd=file:/dev/./urandom -javaagent:/opt/datadog/dd-java-agent.jar"
      DD_AGENT_HOST: datadog-agent
      DD_ENV: prod
      DD_SERVICE: gromo-back-prod    # APM 서비스명 — dev(gromo-back)과 이름 분리
      DD_VERSION: ${IMAGE_TAG}
      DD_TRACE_SAMPLE_RATE: "0.2"    # 20% 샘플
      DD_RUNTIME_METRICS_ENABLED: "true"                          # JVM 런타임 메트릭(힙·GC) — 대시보드 JVM 위젯용
      DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED: "true"   # DB 등 inferred 서비스 안 쪼갬 — APM 깔끔
      DD_GIT_REPOSITORY_URL: "github.com/OneOrThree/phone"        # 트레이스↔소스코드 연결
      DD_GIT_COMMIT_SHA: ${IMAGE_TAG}                             # 배포 SHA = 소스 커밋
    volumes:
      # 앱 로그(/app/logs: app.log·user-activity.log)를 호스트에 바인딩 — 컨테이너 재생성에도 보존,
      # 라이브 확인은 SSM 세션에서 tail, 유저 로그 S3 적재 파이프라인(590·790)도 이 경로를 본다.
      - /var/log/springboot:/app/logs
    # datadog-agent 에 depends_on 을 걸지 않는다 — APM 은 부가 기능이라 agent 가 못 떠도 app 은 정상 기동해야
    # 한다(트레이서는 agent 미연결 시 트레이스만 드롭). agent 는 배포가 이미 함께 올린다.
    networks: [app-network]

  nginx:
    # 마이너 버전 고정 (stable 브랜치) — 앱 이미지처럼 배포 재현성 보장
    image: nginx:1.28-alpine
    container_name: gromo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443" # TLS 종단 — Cloudflare Origin Cert(789), certs/ 마운트
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro # S3 아티팩트에서 주입된 Origin Cert (cert/key)
    depends_on:
      - app
    networks: [app-network]

  # 관측 일원화(Datadog, 792) — 컨테이너 메트릭 + 컨테이너 stdout 로그 수집(과금 수용 결정 2026-07-18).
  # 앱 시스템 로그는 logback CONSOLE(stdout) 경유로 수집되고, user-activity 로그는 파일 전용이라
  # Datadog에 안 감(분석 자산 — S3 파이프라인 590·790 담당). 파일 바인딩은 보존·SSM 조사용.
  # 이미지는 multi-arch라 t4g(arm64)에서 그대로 동작. APM은 비용 문제로 미사용(792 제외 결정).
  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    container_name: gromo-datadog-agent
    restart: unless-stopped
    mem_limit: 512m
    environment:
      # 값은 --env-file(.env.prod ← SM gromo/prod/env)에서 치환 — 원천은 SM 하나.
      # 빈/미설정이면 즉시 실패(fail-fast) — 키 없이 up이 green 처리되어 무텔레메트리로 남는 것 방지.
      DD_API_KEY: ${DD_API_KEY:?DD_API_KEY 미설정 — SM(gromo/prod/env)에 등록 필요}
      DD_SITE: ${DD_SITE:-us5.datadoghq.com}
      DD_ENV: prod
      DD_HOSTNAME: gromo-prod
      DD_TAGS: "env:prod service:gromo-back"
      # 로그 수집 — 컨테이너 stdout tail
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"   # app 컨테이너에서 오는 트레이스 수신
      DD_CONTAINER_EXCLUDE: "name:gromo-datadog-agent"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro # 로그 tail
      - datadog_agent_run:/opt/datadog-agent/run:rw # 로그 오프셋(재시작 시 재수집 방지)
    networks: [app-network]

volumes:
  datadog_agent_run:

networks:
  app-network:
    driver: bridge
