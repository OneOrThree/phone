# Datadog Agent OpenMetrics 체크 — 앱의 기존 Micrometer /actuator/prometheus 를 스크레이프.
# 서비스명(app)은 app-network 에서 해석됨. app 컨테이너를 건드리지 않고 Agent 만으로 브리지.
# 비용: 커스텀 메트릭은 timeseries 당 과금 → .* 대신 대시보드가 쓰는 메트릭만 큐레이트.
instances:
  - openmetrics_endpoint: http://app:9091/actuator/prometheus
    namespace: gromo
    # dev 저부하 전제. 히스토그램 버킷(http_server_requests_seconds_bucket)은 uri×status×le 로 늘어날 수 있음 — 필요 시 축소.
    metrics:
      - http_server_requests_seconds.*      # RED — 요청 수/지연/에러, p95/p99 버킷
      - hikaricp_connections.*              # DB 커넥션 풀
      - jvm_memory_used_bytes
      - jvm_memory_max_bytes
      - jvm_gc_pause_seconds.*
      - jvm_threads_live_threads
      - process_cpu_usage
      - system_cpu_usage
      - logback_events_total                # 로그 레벨별 카운트
