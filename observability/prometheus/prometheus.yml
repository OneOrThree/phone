# GROMO-546 dev 관측 — Prometheus 스크레이프 설정
# dev 실시간성 위해 5초 그레인. app 은 내부 관리 포트 9091(GROMO-588)로 스크레이프.
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

scrape_configs:
  # Spring Boot (micrometer) — 트래픽 RED + HikariCP(쿼리 부하 L1)
  - job_name: gromo-back
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['app:9091']

  # PostgreSQL (쿼리 부하 L2) — tps·캐시히트·커넥션·락
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  # 호스트 리소스 — CPU·메모리·디스크
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  # 컨테이너 리소스 (per-container CPU·mem)
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  # Prometheus 자체
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
