# 대시보드 프로바이더 2개 — ① 레포 dev 대시보드 재사용(서버/DB/시스템 층) ② 부하테스트 전용(k6 클라 층)
apiVersion: 1

providers:
  - name: repo-dashboards
    folder: gromo (dev 재사용)
    type: file
    options:
      path: /var/lib/grafana/dashboards/repo

  - name: loadtest-dashboards
    folder: loadtest
    type: file
    options:
      path: /var/lib/grafana/dashboards/loadtest
