upstream chat_servers {
    server realtime:8081;
    server realtime-2:8081;
}
server {
    listen 80;
    location /internal { return 404; }
    location /actuator { return 404; }
    # 채팅은 두 인스턴스에 분산해 Redis fan-out을 실제로 거친다.
    location = /ws/chat {
        proxy_pass http://chat_servers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    # 이동 상태는 현재 단일 JVM 전제. 무작위 분산은 공유 상태를 만들지 않는다.
    location = /ws/realtime {
        proxy_pass http://realtime:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location /api/v1/chat/ { proxy_pass http://chat_servers; proxy_set_header Host $host; }
    location / { proxy_pass http://business-api:8080; }
}
