# 조사 전용. Outbox/Kafka/Redis 공유가 기본이며 자격은 로컬 전용.
name: gromo-loadtest-survey
services:
  db:
    restart: 'no'
    logging: &id001
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: loadtest-local-only
      POSTGRES_USER: loadtest
      POSTGRES_DB: gromo
    command:
    - postgres
    - -c
    - shared_preload_libraries=pg_stat_statements
    - -c
    - max_connections=150
    volumes:
    - db:/var/lib/postgresql/data
    - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U loadtest -d gromo
      interval: 2s
      timeout: 2s
      retries: 30
    mem_limit: 768m
  redis:
    restart: 'no'
    logging: *id001
    image: redis:7-alpine
    command:
    - redis-server
    - --maxmemory
    - 128mb
    - --maxmemory-policy
    - allkeys-lru
    - --save
    - ''
    - --appendonly
    - 'no'
    mem_limit: 192m
  business-redis:
    restart: 'no'
    logging: *id001
    image: redis:7-alpine
    command:
    - redis-server
    - --maxmemory
    - 128mb
    - --maxmemory-policy
    - allkeys-lru
    - --save
    - ''
    - --appendonly
    - 'no'
    mem_limit: 192m
  data-api:
    restart: 'no'
    logging: *id001
    build:
      context: ../../../server/data-api
    image: loadtest-survey/data-api:local
    environment:
      JWT_SECRET: loadtest-local-contract-key-32-bytes
      JAVA_OPTS: -Djava.security.egd=file:/dev/./urandom -Xms128m -Xmx512m
      DD_TRACE_ENABLED: 'false'
      SPRING_PROFILES_ACTIVE: loadtest,satellites,realtime-authorization
      API_DB_URL: jdbc:postgresql://db:5432/gromo
      API_DB_USERNAME: loadtest
      API_DB_PASSWORD: loadtest-local-only
      SPRING_DATA_REDIS_HOST: redis
      SVC_TOKEN_BIZ_TO_DATA: local-biz-data
      SVC_TOKEN_NOTI_TO_DATA: local-noti-data
      SVC_TOKEN_CONSOLE_TO_NOTI: member-1:local-console-noti
      SVC_TOKEN_REALTIME_TO_DATA: local-realtime-data
      SVC_TOKEN_DATA_TO_LINK: local-data-link
      SVC_TOKEN_DATA_TO_NOTI: local-data-noti
      SVC_TOKEN_DATA_TO_REALTIME: local-data-realtime
      LINK_CAPABILITY_KEY: local-link-capability-key-at-least-32
      LINK_BASE_URL: http://localhost:1
      NOTIFICATION_BASE_URL: http://notification:8082
      REALTIME_BASE_URL: http://realtime:8081
      REALTIME_MEMBERSHIP_AUTHORIZATION_ENABLED: 'true'
      OUTBOX_RELAY_ENABLED: 'true'
      OUTBOX_RELAY_BATCH_SIZE: '100'
      OUTBOX_RELAY_LEASE_DURATION: 30s
      OUTBOX_RELAY_POLL_INTERVAL: 500ms
      OUTBOX_RELAY_INITIAL_BACKOFF: 1s
      OUTBOX_RELAY_MAX_BACKOFF: 30s
      OUTBOX_RELAY_WARNING_ATTEMPTS: '5'
      NOTIFICATION_DISPATCH_MODE: OUTBOX
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OUTBOX_RELAY_REALTIME_KAFKA_ENABLED: 'true'
    mem_limit: 1g
    cpus: 2
    ports:
    - 127.0.0.1:18081:8080
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8080/health
      interval: 5s
      timeout: 3s
      retries: 40
  business-api:
    restart: 'no'
    logging: *id001
    build:
      context: ../../../server/business-api
    image: loadtest-survey/business-api:local
    environment:
      JWT_SECRET: loadtest-local-contract-key-32-bytes
      JAVA_OPTS: -Djava.security.egd=file:/dev/./urandom -Xms128m -Xmx512m
      DD_TRACE_ENABLED: 'false'
      SPRING_PROFILES_ACTIVE: dev
      BUSINESS_REDIS_HOST: business-redis
      LOGIN_ATTEMPT_DIGEST_SECRET: local-login-digest-key-not-jwt
      LINK_IP_SALT: local-ip-salt
      DATA_API_BASE_URL: http://data-api:8080
      NOTIFICATION_BASE_URL: http://notification:8082
      REALTIME_BASE_URL: http://realtime:8081
      LINK_BASE_URL: http://localhost:1
      SVC_TOKEN_BIZ_TO_DATA: local-biz-data
      SVC_TOKEN_BIZ_TO_NOTI: local-biz-noti
      SVC_TOKEN_BIZ_TO_REALTIME: local-biz-realtime
      SVC_TOKEN_BIZ_TO_LINK: local-biz-link
      BUSINESS_CURSOR_KEY_V1: Y2ktY3Vyc29yLXNpZ25pbmcta2V5LTAxMjM0NTY3ODlhYg==
    mem_limit: 1g
    cpus: 2
    ports:
    - 127.0.0.1:18082:8080
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8080/health
      interval: 5s
      timeout: 3s
      retries: 40
  realtime:
    restart: 'no'
    logging: *id001
    build:
      context: ../../../server/realtime
    image: loadtest-survey/realtime:local
    environment:
      JWT_SECRET: loadtest-local-contract-key-32-bytes
      JAVA_OPTS: -Djava.security.egd=file:/dev/./urandom -Xms128m -Xmx512m
      DD_TRACE_ENABLED: 'false'
      SPRING_PROFILES_ACTIVE: dev
      CHAT_DB_URL: jdbc:postgresql://db:5432/gromo_chat
      CHAT_DB_USERNAME: loadtest
      CHAT_DB_PASSWORD: loadtest-local-only
      REDIS_HOST: redis
      DATA_API_BASE_URL: http://data-api:8080
      REALTIME_AUTHORIZATION_DATA_URL: http://data-api:8080
      REALTIME_AUTHORIZATION_CLIENT_ENABLED: 'true'
      SVC_TOKEN_REALTIME_TO_DATA: local-realtime-data
      SVC_TOKEN_BIZ_TO_REALTIME: local-biz-realtime
      SVC_TOKEN_DATA_TO_REALTIME: local-data-realtime
      CHAT_WS_ALLOWED_ORIGINS: http://localhost:18088
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REALTIME_EVENTS_KAFKA_ENABLED: 'true'
      REALTIME_BLOCKS_FILTER_ENABLED: 'true'
    mem_limit: 1g
    cpus: 2
    ports:
    - 127.0.0.1:18083:8081
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:9091/actuator/health/readiness
      interval: 5s
      timeout: 3s
      retries: 40
  notification:
    restart: 'no'
    logging: *id001
    build:
      context: ../../../server/notification
    image: loadtest-survey/notification:local
    environment:
      JAVA_OPTS: -Djava.security.egd=file:/dev/./urandom -Xms128m -Xmx512m
      DD_TRACE_ENABLED: 'false'
      SPRING_PROFILES_ACTIVE: dev
      NOTI_DB_URL: jdbc:postgresql://db:5432/notification
      NOTI_DB_USERNAME: loadtest
      NOTI_DB_PASSWORD: loadtest-local-only
      DATA_API_BASE_URL: http://data-api:8080
      SVC_TOKEN_BIZ_TO_NOTI: local-biz-noti
      SVC_TOKEN_DATA_TO_NOTI: local-data-noti
      SVC_TOKEN_NOTI_TO_DATA: local-noti-data
      SVC_TOKEN_CONSOLE_TO_NOTI: member-1:local-console-noti
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NOTIFICATION_SCHEDULING_ENABLED: 'true'
      NOTIFICATION_KAFKA_ENABLED: 'true'
      FCM_PROJECT_ID: loadtest-local-only
      FCM_SERVICE_ACCOUNT_JSON: eyJ0eXBlIjogImF1dGhvcml6ZWRfdXNlciIsICJjbGllbnRfaWQiOiAibG9hZHRlc3QtbG9jYWwtb25seSIsICJjbGllbnRfc2VjcmV0IjogImxvYWR0ZXN0LWxvY2FsLW9ubHkiLCAicmVmcmVzaF90b2tlbiI6ICJsb2FkdGVzdC1sb2NhbC1vbmx5In0=
    mem_limit: 1g
    cpus: 2
    ports:
    - 127.0.0.1:18084:8082
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8082/health
      interval: 5s
      timeout: 3s
      retries: 40
  nginx:
    restart: 'no'
    logging: *id001
    image: nginx:1.28-alpine
    volumes:
    - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
    - 127.0.0.1:18088:80
    depends_on:
      business-api:
        condition: service_healthy
      realtime:
        condition: service_healthy
      realtime-2:
        condition: service_healthy
  prometheus:
    restart: 'no'
    logging: *id001
    image: prom/prometheus:v2.55.1
    volumes:
    - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
    - 127.0.0.1:19094:9090
  grafana:
    restart: 'no'
    logging: *id001
    image: grafana/grafana:11.4.0
    volumes:
    - ../../../server/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    - ../../../server/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
    - 127.0.0.1:13002:3000
  postgres-exporter:
    restart: 'no'
    logging: *id001
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: postgresql://loadtest:loadtest-local-only@db:5432/gromo?sslmode=disable
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yml
    volumes:
    - ../../../server/observability/postgres-exporter/queries.yml:/etc/postgres-exporter/queries.yml:ro
  redis-exporter:
    restart: 'no'
    logging: *id001
    image: oliver006/redis_exporter:v1.66.0
    environment:
      REDIS_ADDR: redis://redis:6379
  business-redis-exporter:
    restart: 'no'
    logging: *id001
    image: oliver006/redis_exporter:v1.66.0
    environment:
      REDIS_ADDR: redis://business-redis:6379
  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
    - --path.rootfs=/host
    pid: host
    volumes:
    - /:/host:ro
  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    command:
    - --containerd=/rootfs/run/containerd/containerd.sock
    privileged: true
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - /sys:/sys:ro
    - /var/lib/docker:/var/lib/docker:ro
  kafka:
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: apache/kafka:3.8.1
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_DEFAULT_REPLICATION_FACTOR: '1'
      KAFKA_MIN_INSYNC_REPLICAS: '1'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: '168'
      KAFKA_NUM_PARTITIONS: '3'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
      KAFKA_JMX_PORT: '9999'
      KAFKA_JMX_HOSTNAME: kafka
    expose:
    - '9092'
    - '9999'
    volumes:
    - kafka:/var/lib/kafka/data
    - ../../../server/scripts/kafka-api-healthcheck.sh:/opt/kafka/bin/kafka-api-healthcheck.sh:ro
    healthcheck:
      test:
      - CMD
      - bash
      - /opt/kafka/bin/kafka-api-healthcheck.sh
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    restart: 'no'
    mem_limit: 768m
    cpus: 1
  realtime-2:
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'
    build:
      context: ../../../server/realtime
    image: loadtest-survey/realtime:local
    environment:
      JWT_SECRET: loadtest-local-contract-key-32-bytes
      JAVA_OPTS: -Djava.security.egd=file:/dev/./urandom -Xms128m -Xmx512m
      DD_TRACE_ENABLED: 'false'
      SPRING_PROFILES_ACTIVE: dev
      CHAT_DB_URL: jdbc:postgresql://db:5432/gromo_chat
      CHAT_DB_USERNAME: loadtest
      CHAT_DB_PASSWORD: loadtest-local-only
      REDIS_HOST: redis
      DATA_API_BASE_URL: http://data-api:8080
      REALTIME_AUTHORIZATION_DATA_URL: http://data-api:8080
      REALTIME_AUTHORIZATION_CLIENT_ENABLED: 'true'
      SVC_TOKEN_REALTIME_TO_DATA: local-realtime-data
      SVC_TOKEN_BIZ_TO_REALTIME: local-biz-realtime
      SVC_TOKEN_DATA_TO_REALTIME: local-data-realtime
      CHAT_WS_ALLOWED_ORIGINS: http://localhost:18088
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REALTIME_EVENTS_KAFKA_ENABLED: 'true'
      REALTIME_BLOCKS_FILTER_ENABLED: 'true'
    mem_limit: 1g
    cpus: 2
    ports:
    - 127.0.0.1:18085:8081
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:9091/actuator/health/readiness
      interval: 5s
      timeout: 3s
      retries: 40
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    command:
    - --kafka.server=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: 'no'
  kafka-jmx-exporter:
    image: bitnami/jmx-exporter@sha256:652a0b12db78af1d1206f41a6a47fbcd9724e46cda165ed759b6508c8952944c
    command:
    - '9404'
    - /etc/jmx-exporter/kafka.yml
    volumes:
    - ../../../server/observability/jmx-exporter/kafka.yml:/etc/jmx-exporter/kafka.yml:ro
    restart: 'no'
volumes:
  db: null
  kafka: {}
